<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f1117"/>
<title>The Easy Cook</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
button,a,[role="button"]{outline:none;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{height:100%;font-family:-apple-system,'Segoe UI','SF Pro Text','Helvetica Neue',Arial,sans-serif;background:#0f1117;color:#f0ede8;-webkit-text-size-adjust:100%;overflow:hidden;}
#root{height:100%;overflow:hidden;}
[style*="overflow-y:auto"],[style*="overflowY:auto"],[style*="overflow-y: auto"]{-webkit-overflow-scrolling:touch;}
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --accent:#f97316;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;
  --text:#f0ede8;--text1:#f0ede8;--text2:#9ca3af;--text3:#6b7280;
  --sora:-apple-system,'Segoe UI Rounded','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;--sans:-apple-system,'Segoe UI','SF Pro Text','Helvetica Neue',Arial,sans-serif;
  --radius:14px;--radius-sm:9px;
}
input,select,textarea{
  font-family:var(--sans);background:var(--surface2);border:1px solid var(--border2);
  color:var(--text);border-radius:var(--radius-sm);padding:11px 14px;font-size:16px;
  width:100%;outline:none;transition:border-color .2s;box-sizing:border-box;
}
@media(min-width:769px){
  input,select,textarea{font-size:14px;}
}
input:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--text3)}
select option{background:#1e2333}
button{cursor:pointer;font-family:var(--sans);transition:all .15s;border:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pinShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes ecSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes ecPulse{0%,100%{opacity:1}50%{opacity:.3}}
/* Bottom-sheet grab handle — hidden by default (desktop); shown only on phones */
.ec-sheet-handle{display:none;}
.slide-up{animation:slideUp .28s ease both}
.fade-in{animation:fadeIn .2s ease both}
.ec-card-clickable{transition:border-color .15s ease, transform .15s ease}
.ec-card-clickable:hover{border-color:var(--border2)!important;transform:translateY(-1px)}
.ec-hover-accent:hover{border-color:var(--accent)!important}
/* Scrollable tab strips: hide the horizontal scrollbar (pills scroll on mobile, sit inline on desktop) */
.ec-tabs{scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;}
.ec-tabs::-webkit-scrollbar{display:none;}

/* ── DESKTOP LAYOUT (≥769px) ─────────────────────────────────────────── */
@media(min-width:769px){
  html,body{overflow:hidden;}
  #root{height:100%;overflow:hidden;}

  /* Full-width shell — no mobile 430px cap */
  .app-shell{
    position:static!important;
    transform:none!important;
    max-width:100%!important;
    display:grid!important;
    grid-template-columns:220px 1fr!important;
    grid-template-rows:auto 56px 1fr!important;
    height:100vh!important;
    overflow:hidden!important;
  }

  /* Top bar spans both columns */
  .app-topbar{
    grid-column:1/-1!important;
    grid-row:2/3!important;
    position:relative!important;
    top:auto!important;
    z-index:50;
  }

  /* Sidebar — left column row 3 */
  .app-sidebar{
    grid-column:1/2!important;
    grid-row:3/4!important;
    display:flex!important;
    flex-direction:column!important;
    background:var(--surface)!important;
    border-right:1px solid var(--border2)!important;
    padding:12px 10px!important;
    overflow-y:auto!important;
    -webkit-overflow-scrolling:touch!important;
  }

  /* Main content — right column row 3 */
  .app-content{
    grid-column:2/3!important;
    grid-row:3/4!important;
    overflow-y:auto!important;
    -webkit-overflow-scrolling:touch!important;
    padding:20px 28px 32px!important;
  }

  /* Hide mobile bottom nav */
  .app-bottomnav{display:none!important;}

  /* Toast: bottom-right on desktop */
  .app-toast{
    bottom:24px!important;
    right:24px!important;
    left:auto!important;
    transform:none!important;
  }

  /* Tables: show extra columns via utility class */
  .dt-col-desktop{display:flex!important;}
  /* For grid-based rows, override to block so grid handles it */
  div[style*="gridTemplateColumns"] .dt-col-desktop{display:block!important;}

  /* Two-column master-detail panels */
  .desktop-two-col{
    display:grid!important;
    grid-template-columns:340px 1fr!important;
    gap:20px!important;
    align-items:start!important;
    height:calc(100vh - 56px - 52px - 34px)!important;
  }
  .desktop-two-col .list-pane{
    overflow-y:auto!important;
    height:100%!important;
    padding-right:4px!important;
  }
  .desktop-two-col .detail-pane{
    overflow-y:auto!important;
    height:100%!important;
  }

  /* Login screen: centered card on desktop */
  .pin-login-inner{
    width:480px!important;
    max-width:90vw!important;
    background:var(--surface)!important;
    border:1px solid var(--border2)!important;
    border-radius:20px!important;
    padding:40px 48px!important;
    box-shadow:0 24px 64px rgba(0,0,0,0.4)!important;
  }
}
@media(max-width:768px){
  .app-sidebar{display:none!important;}
  .desktop-two-col{display:block!important;}
  .dt-col-desktop{display:none!important;}
  .pin-login-inner{width:100%;max-width:400px;}

  /* ── Mobile readability & tap-target layer (desktop unaffected: these
        classes have NO rules ≥769px, so they're inert on wide screens) ── */
  /* Comfortable tap target for compact inline action buttons */
  .ec-tap{min-height:40px!important;display:inline-flex!important;align-items:center;justify-content:center;}
  /* Readability floor: lift the smallest informational text so it's legible
     on a phone. Applied opt-in to secondary lines that were 9–10px. */
  .ec-legible{font-size:12px!important;line-height:1.45;}
  .ec-legible-sm{font-size:11px!important;}
  /* Global type floor: any inline 9px/10px text (React serializes fontSize
     as "font-size: Npx") is lifted to 11px on phones only. Verified inert on
     desktop and free of false matches (11px/100px unaffected). */
  [style*="font-size: 9px"],
  [style*="font-size: 10px"]{font-size:11px!important;}
  /* Dashboard hero KPIs: the 2×2 mobile layout has room, so make the headline
     numbers bigger. Desktop keeps the inline 14px (this rule is phone-only). */
  .kpi-hero-val{font-size:20px!important;}

  /* ── Bottom-sheet modals (phones only) ──────────────────────────────────
     Centered dialogs are cramped on a phone. On mobile, opt-in modals slide
     up from the bottom edge, full-width with a rounded top and a grab handle.
     Desktop keeps the centered card (these rules don't exist ≥769px). */
  .ec-modal-overlay{align-items:flex-end!important;padding:0!important;}
  .ec-modal-sheet{
    max-width:100%!important;width:100%!important;
    border-radius:20px 20px 0 0!important;max-height:92vh!important;
    animation:ecSheetUp .28s cubic-bezier(.2,.8,.2,1) both!important;
    padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))!important;
  }
  .ec-sheet-handle{display:block!important;width:38px;height:4px;border-radius:2px;
    background:var(--border2);margin:0 auto 12px;flex-shrink:0;}
}
@media(min-width:769px){
  /* Hide mobile-only topbar buttons — sidebar handles them */
  .mobile-user-chip{display:none!important;}
  .mobile-logout-btn{display:none!important;}
  /* Sticky save bars: stick to content pane bottom, not viewport */
  .app-content .sticky-save-bar{position:sticky!important;bottom:0!important;}

  /* Reports: two-column layout on wide screens */
  .reports-two-col{
    display:grid!important;
    grid-template-columns:1fr 1fr!important;
    gap:16px!important;
    align-items:start!important;
  }
  .reports-two-col .reports-col-full{
    grid-column:1/-1!important;
  }

  /* MenuEng: matrix + detail side by side */
  .menueng-two-col{
    display:grid!important;
    grid-template-columns:1fr 400px!important;
    gap:20px!important;
    align-items:start!important;
  }

  /* KPI grids: 4-up on desktop instead of 2x2 */
  .kpi-grid-desktop{
    grid-template-columns:repeat(4,1fr)!important;
  }

  /* Card content max width cap */
  .card-max-desktop{
    max-width:680px!important;
  }

  /* Modals: taller on desktop to show more content */
  .modal-inner{
    max-width:600px!important;
    max-height:88vh!important;
  }
}
</style>
</head>
<body>
<!-- Fallback shown immediately; hidden by JS once React mounts successfully -->
<div id="fallback" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0f1117;color:#f0ede8;font-family:-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;z-index:99999;">
  <div style="font-size:48px;margin-bottom:20px">👨‍🍳</div>
  <div style="font-size:22px;font-weight:700;margin-bottom:8px">The Easy Cook</div>
  <div id="fallback-msg" style="font-size:14px;color:#9ca3af;margin-bottom:32px;line-height:1.6">Cargando...</div>
  <div id="safari-instructions" style="display:none;background:#1e2333;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:20px 24px;max-width:320px;width:100%">
    <div style="font-size:13px;font-weight:600;color:#f97316;margin-bottom:12px">&#9888;&#65039; Abre en Safari para continuar</div>
    <div style="font-size:13px;color:#9ca3af;line-height:1.8">
      1. Toca el bot&#243;n <strong style="color:#f0ede8">Compartir &#x2191;</strong> abajo a la derecha<br>
      2. Selecciona <strong style="color:#f0ede8">&ldquo;Abrir en Safari&rdquo;</strong><br>
      3. La app cargar&#225; correctamente
    </div>
  </div>
  <div id="error-detail" style="display:none;margin-top:16px;font-size:11px;color:#6b7280;max-width:320px;word-break:break-all"></div>
</div>
<div id="root"></div>
<script>
var _fbTimer=setTimeout(function(){
  var msg=document.getElementById("fallback-msg");
  var inst=document.getElementById("safari-instructions");
  if(msg)msg.style.display="none";
  if(inst)inst.style.display="block";
},2000);
window.__appReady=function(){
  clearTimeout(_fbTimer);
  var fb=document.getElementById("fallback");
  if(fb)fb.style.display="none";
};
</script>

<!-- Supabase cloud backend (loaded from CDN). If this fails to load (offline),
     window.supabase stays undefined and the app runs in pure-local mode. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

'use strict';
// ─── VERSION ──────────────────────────────────────────────────────────────────
const APP_VERSION = "4.14.9";
const APP_BUILD   = "Sprint 20 — Agosto 2026";
const CHANGELOG = [
  {v:"4.14.9", date:"Ago 2026", notes:"Ahora sabes si estás conectado: arriba a la derecha hay un indicador — punto verde cuando todo está guardado en la nube, 'Sincronizando…' mientras sube, y 'Sin conexión' si se cae el internet (tus cambios se siguen guardando en el equipo). Apenas vuelve la conexión, la app se reconecta sola, sube lo pendiente y baja lo que otros cambiaron mientras tanto — sin que tengas que hacer nada."},
  {v:"4.14.8", date:"Ago 2026", notes:"Mejora técnica de confiabilidad: la app ahora es autónoma — trae todo lo que necesita para funcionar dentro del mismo archivo, en vez de pedir piezas a servidores externos al abrir. Esto la hace más rápida y estable, y prepara el terreno para poder instalarla como app en el celular más adelante."},
  {v:"4.14.7", date:"Ago 2026", notes:"Ventanas de edición más cómodas en el celular: al agregar o editar (ingredientes, recetas, facturación) el formulario ahora sube desde abajo ocupando todo el ancho, con una barrita para indicar que se desliza — más fácil de alcanzar con el pulgar. Los números del tablero se alinean mejor y el margen se pinta en rojo si es negativo. En pantalla grande las ventanas siguen centradas como antes."},
  {v:"4.14.6", date:"Ago 2026", notes:"Tablero principal más claro en el celular: las cifras de hoy (Ventas, % Costo, Margen, Pedidos) ahora se muestran en una cuadrícula 2×2 con números grandes y fáciles de leer de un vistazo. En pantalla grande se mantiene la fila de 4 como antes."},
  {v:"4.14.5", date:"Ago 2026", notes:"Lectura más cómoda en el celular: el texto más pequeño (9–10px) ahora se muestra un poco más grande para que se lea mejor, y los botones de acción (Merma, Editar, etc.) tienen un área de toque más amplia para no fallar el dedo. En pantalla grande todo queda exactamente igual que antes."},
  {v:"4.14.4", date:"Ago 2026", notes:"Navegación más cómoda en el celular: la barra inferior ahora muestra los accesos del día a día (Inicio, Ventas, Stock, Recetas) y agrupa el resto en un botón 'Más', en vez de apretar 9 iconos diminutos. Las pestañas dentro de las secciones ya no se encogen: se deslizan de lado cuando no entran. En pantalla grande todo se ve igual que antes."},
  {v:"4.14.3", date:"Ago 2026", notes:"Ajustes del panel del proveedor (interno): ahora se pueden gestionar los administradores del panel (agregar por correo / quitar, sin poder quitarse uno mismo) desde una pestaña 'Ajustes', y hay un registro de las acciones del panel (quién pausó, cobró, generó códigos, etc.)."},
  {v:"4.14.2", date:"Ago 2026", notes:"Monitoreo de actividad de clientes (panel del proveedor, interno): cada restaurante muestra hace cuánto tuvo actividad (verde/amarillo/rojo según los días inactivo), y hay un contador de restaurantes inactivos, para detectar a tiempo cuentas que se están enfriando. Solo usa fechas de actividad, sin acceder a los datos del cliente."},
  {v:"4.14.1", date:"Ago 2026", notes:"Mejoras en los códigos de activación (panel del proveedor, interno): los códigos pueden tener vencimiento (7/14/30 días o sin vencimiento), se pueden anular los que no se han usado, y la lista muestra el estado (disponible/usado/vencido/anulado) y a qué restaurante se aplicó cada código usado."},
  {v:"4.14.0", date:"Ago 2026", notes:"Facturación en el panel de administración del proveedor (interno): por cada restaurante se registra plan, precio mensual, estado (prueba/activo/vencido/cancelado), próxima fecha de pago y notas de contacto; botón 'Pagó' que adelanta el vencimiento 30 días, aviso en rojo de cuentas vencidas y un resumen de activos, vencidos e ingreso mensual. No afecta el uso normal de la app ni el acceso a los datos de los clientes."},
  {v:"4.13.7", date:"Ago 2026", notes:"Detalle del registro de actividad: saltar el asistente de primeros pasos ya no genera una entrada de 'Cambió la configuración' (era ruido interno). Los cambios reales de configuración se siguen registrando normalmente."},
  {v:"4.13.6", date:"Ago 2026", notes:"Registro de actividad completo y en Equipo. Antes casi nada quedaba registrado; ahora la app anota sola quién hizo qué en todo el sistema — insumos, recetas, precios, pedidos (abrir/cerrar/anular/descuentos), compras, mermas, equipo y configuración — con nombre y hora, y se sincroniza entre dispositivos. Lo encuentras en la pestaña 'Equipo' → 'Actividad', con filtro por persona. Así el dueño ve la actividad de todas las cuentas en un solo lugar."},
  {v:"4.13.5", date:"Ago 2026", notes:"Más seguridad para trabajar entre varios dispositivos a la vez: cuando alguien borra algo (un pedido, una receta, etc.), ese borrado ya no puede 'revivir' aunque otro equipo tuviera todavía el dato en pantalla. Sumado a que ya se combinan los cambios por registro, ahora varios cajeros pueden agregar, editar y borrar al mismo tiempo sin pisarse ni duplicar."},
  {v:"4.13.4", date:"Ago 2026", notes:"Recuperación de contraseña. Si el dueño olvida su contraseña, ahora puede tocar '¿Olvidaste tu contraseña?' en el inicio de sesión, recibir un enlace por correo y elegir una nueva. (Los perfiles del equipo siguen entrando con su PIN de siempre)."},
  {v:"4.13.3", date:"Ago 2026", notes:"Panel de administración del proveedor (interno): permite generar códigos de activación y activar/pausar cuentas de clientes, sin ningún acceso a los datos de los restaurantes. No afecta el uso normal de la app."},
  {v:"4.13.2", date:"Ago 2026", notes:"Mejoras internas de la cuenta en la nube: la app recuerda tu restaurante para abrir más rápido y seguir funcionando sin internet, y se añadió el manejo de cuentas pausadas (si una cuenta se desactiva, muestra un aviso claro y tus datos quedan guardados)."},
  {v:"4.13.1", date:"Ago 2026", notes:"Aviso para el cajero cuando un plato se agota. Si otro dispositivo marca un plato como agotado (o se llega a su límite del día al vender), al cajero le aparece un aviso al instante para que deje de venderlo. Es solo para el perfil de Cajero y solo para 'agotado' — el resto de avisos siguen siendo solo para el dueño."},
  {v:"4.13.0", date:"Ago 2026", notes:"Avisos en vivo para el dueño. Cuando otro dispositivo del equipo hace un cambio importante, al dueño le aparece un aviso corto al instante: se cambió una receta o su precio, se borró un pedido o una receta, un plato se marcó como agotado (por el chef o automáticamente al llegar a su límite del día), o se conectó un equipo nuevo. Las ventas normales NO generan avisos (serían demasiados) — el 'Rendimiento de hoy' del Inicio ya se actualiza solo en tiempo real. Los avisos son solo para el dueño, nunca por sus propias acciones, y se pueden apagar en Configuración → Nube y equipo."},
  {v:"4.12.0", date:"Ago 2026", notes:"Dos mejoras grandes de la nube. (1) Seguridad al crear cuentas: ahora se necesita un 'código de activación' que solo nosotros entregamos, así nadie con el link puede crear una cuenta sin autorización. (2) Trabajo en equipo en vivo: varios dispositivos del mismo restaurante pueden agregar y editar al mismo tiempo, se ven los cambios de los demás en segundos, y el sistema combina los cambios en vez de que uno pise al otro — cada quien guarda solo la sección que tocó, y si dos tocan lo mismo a la vez, se juntan por registro (sin perder ventas ni duplicar). Sigue funcionando sin internet y sincroniza al reconectar."},
  {v:"4.11.0", date:"Ago 2026", notes:"¡La app ahora vive en la nube! El dueño entra con su correo y contraseña, y sus datos se guardan y sincronizan solos entre dispositivos (con respaldo local para seguir trabajando aunque se caiga el internet). Para el equipo: en vez de compartir tu correo, generas un 'código del equipo' desde Configuración → Nube y equipo; cada empleado lo ingresa una vez en su celular y listo — sin correos ni contraseñas. Adentro, siguen los PIN por persona de siempre. Si pierdes un equipo o cambia tu personal, puedes bloquear un dispositivo, desconectarlos todos o generar un código nuevo. También hay un botón para subir a la nube los datos que ya tenías en este dispositivo."},
  {v:"4.10.0", date:"Jul 2026", notes:"Preparada para cartas grandes. Ahora los selectores largos (plato en Ventas, ingrediente en Recetas/Sub-recetas/Compras, sub-receta en Produccion, insumo en Menu) son buscables: escribes y filtras, con lista desplazable en vez de un desplegable interminable. Recetas, Sub-recetas e Inventario tienen buscador por nombre (sin importar tildes) y cargan por tandas con 'Ver mas', asi la pantalla abre rapido aunque tengas cientos de platos o insumos. Por dentro, los calculos de costo dejaron de recorrer todo el catalogo en cada linea: un informe mensual de un restaurante con 300 platos y 7200 ventas pasa de ~2 s de calculo a milisegundos. Ademas se corrigio el costo de alimentos del Inicio, que no estaba sumando las sub-recetas."},
  {v:"4.9.2", date:"Jul 2026", notes:"Dos secciones más en el 'Informe completo': un gráfico de barras con la tendencia de ventas de los últimos 6 meses (con el promedio marcado y una tabla de apoyo con ventas netas, pedidos y costo % de cada mes), y 'Formas de pago' — cuánto entró por Yape, efectivo y tarjeta en el mes, con el % de cada uno y la diferencia contra lo registrado en la app. Ambas salen también en el PDF."},
  {v:"4.9.1", date:"Jul 2026", notes:"El 'Informe completo' ahora trae más análisis: comparación con el mes anterior (ventas netas, costo de alimentos %, margen, pedidos y ticket — con flechas de mejora/caída), ventas por día de la semana (con el mejor día del mes) y ventas por categoría. Además Reportes queda más ordenado: se unieron 'P&L Mensual' y 'Resumen Mensual' dentro del Informe completo, dejando 3 pestañas claras — Informe completo, Semanal y Costos."},
  {v:"4.9.0", date:"Jul 2026", notes:"Nuevo 'Informe completo' en Reportes: un informe mensual de gestión en un solo documento — portada (restaurante, RUC, fecha), resumen ejecutivo, estado de resultados (P&L), ventas por semana, platos más vendidos, compras, mermas y descuentos. El botón 'Descargar PDF' lo guarda como un PDF completo listo para enviar (a tu contador, por ejemplo), no una captura de lo que se ve en pantalla."},
  {v:"4.8.3", date:"Jul 2026", notes:"Fechas en formato peruano (día/mes/año) en toda la app — descuentos, ventas por día, compras, mermas, producción e historial. Además, el filtro de la lista de Descuentos ahora es un selector completo: atajos (Hoy, Ayer, Últimos 7 días, Este mes, Todos) y un rango Desde/Hasta con calendario."},
  {v:"4.8.2", date:"Jul 2026", notes:"Descuentos más rápidos para el cajero: en el 'Ajuste' de un pedido, botones de un toque para 5/10/15/20% (calcula el monto solo) y motivos rápidos (Cliente frecuente, Cortesía, Promoción, Reclamo). Nueva pestaña 'Descuentos' en Ventas & Caja con la lista de todos los descuentos dados — mesa, monto, %, motivo, quién lo aplicó y si el pedido está abierto o cerrado — con total y filtro Hoy/Mes/Todos."},
  {v:"4.8.1", date:"Jul 2026", notes:"El botón de disponibilidad de cada receta (Disponible / 🚫 Agotado / Quedan N) ahora es tan visible como el botón Editar."},
  {v:"4.8.0", date:"Jul 2026", notes:"Control de cocina para agotar platos (86): desde Recetas, el chef puede marcar un plato como 'Agotado' o ponerle un 'límite de hoy' (N porciones que se descuentan al vender y se bloquea al llegar a 0; se reinicia cada día). En Ventas, el cajero lo ve claramente ('Agotado (cocina)' o 'quedan N') y puede forzarlo igual (candado suave), pero sabe que la cocina dijo que no hay más."},
  {v:"4.7.7", date:"Jul 2026", notes:"'Pegar lista' ahora entiende también el mensaje bonito de la lista de compra: ignora el encabezado, la fecha, el total y las líneas decorativas, y quita las viñetas. Puedes pegar el mensaje completo tal cual y solo quedan los productos."},
  {v:"4.7.6", date:"Jul 2026", notes:"La lista de compra que se envía por WhatsApp o se copia ahora se ve más ordenada: encabezado con el nombre del restaurante y la fecha escrita en palabras, productos con viñetas y total al pie. Dentro de la app verás una vista previa exacta del mensaje antes de enviarlo."},
  {v:"4.7.5", date:"Jul 2026", notes:"Nueva función en Compras: 'Armar lista de compra'. Arma tu lista (empieza con lo que está bajo mínimo, con cantidad sugerida), edítala libremente y envíasela por WhatsApp o cópiala a quien hace las compras. Cuando llegue el pedido, 'Registrar al llegar' la pasa a 'Pegar lista' para sumarla al stock con los precios."},
  {v:"4.7.4", date:"Jul 2026", notes:"Las alertas del Inicio ahora respetan los permisos de cada usuario: el dueño ve todas, y cada otro perfil (chef, cajero, jefe de salón, visor) ve solo las alertas que puede atender según su rol — por ejemplo, el cajero solo ve las diferencias de caja."},
  {v:"4.7.3", date:"Jul 2026", notes:"'Pegar lista de compra' ahora muestra el formato esperado (Ingrediente · Cantidad + unidad · Precio por unidad) y, si tu lista es larga, la revisión previa se puede desplazar sin tapar el botón de confirmar."},
  {v:"4.7.2", date:"Jul 2026", notes:"Nueva función en Compras: 'Pegar lista de compra'. Escribe o pega tu lista tal cual (ej. 'Pollo 5kg 12.50, Tomate 3kg 4') y la app la entiende sola, la muestra para que la revises y la agrega al stock de una sola vez. Los insumos que aún no tienes se crean automáticamente."},

const SB_URL  = "https://bgwtyiabiwqolktewfeg.supabase.co";

// ── useChartWidth ─────────────────────────────────────────────────────────────
// Returns a [ref, width] pair. Attach ref to a container div.
// Width updates live via ResizeObserver so charts always fill their container.
function useChartWidth(fallback=370){
  const ref=useRef(null);
  const [width,setWidth]=useState(fallback);
  useLayoutEffect(()=>{
    if(!ref.current)return;
    const el=ref.current;
    // Initial measurement
    setWidth(el.getBoundingClientRect().width||fallback);
    if(!window.ResizeObserver)return;
    const ro=new ResizeObserver(entries=>{
      const w=entries[0]?.contentRect?.width;
      if(w&&w>0)setWidth(w);
    });
    ro.observe(el);
    return()=>ro.disconnect();
  },[]);
  return [ref,width];
}

// ─── CLOUD SYNC HELPERS ────────────────────────────────────────────────────────
// The app's `data` object maps 1:1 to the `collections` table: one row per
// top-level key { restaurant_id, name, data, updated_at }. Sync is PER-COLLECTION
// so devices only overwrite the exact section they changed, with realtime + a
// merge-on-conflict so several devices can edit at once without losing work.
const COLLECTION_KEYS = Object.keys(INIT);

// Fetch every collection for a restaurant. Returns { data:{key:value}|null,
// versions:{key:updated_at} }. data is null when the restaurant has no rows yet
// (brand-new / never uploaded). Throws on a network/RLS error so the caller can
// fall back to the local cache.
async function cloudFetchAll(rid){
  const {data,error} = await sb.from("collections").select("name,data,updated_at").eq("restaurant_id",rid);
  if(error) throw error;
  const versions={};
  if(!data || !data.length) return {data:null, versions};
  const out={};
  for(const row of data){ out[row.name]=row.data; versions[row.name]=row.updated_at; }
  return {data:out, versions};
}

// Merge two versions of ONE collection (local `a`, server `b`) when they
// conflicted. Strategy by shape:
//   • arrays of {id} objects → union by id, LOCAL wins on the same id
//     (covers the common "two devices each added a different sale" case).
//   • arrays of primitives (category lists) → union of distinct values.
//   • objects (settings) → shallow merge, local wins per key.
//   • anything else → local.
// KNOWN TRADEOFF: union-by-id can resurrect a record deleted on one device while
// another still had it. Deletes are rare in a kitchen; true delete-safety needs
// per-record rows (a later step). See supabase/05_realtime_sync.sql.
function mergeCollection(a,b){
  if(Array.isArray(a)&&Array.isArray(b)){
    const all=a.concat(b);
    const allHaveId=all.length>0 && all.every(x=>x&&typeof x==="object"&&x.id!=null);
    if(allHaveId){
      const map=new Map();
      for(const x of b) map.set(x.id,x);
      for(const x of a) map.set(x.id,x);   // local overrides on same id
      return Array.from(map.values());
    }
    const anyObject=all.some(x=>x&&typeof x==="object");
    if(!anyObject){                         // primitive lists (categories)
      const seen=new Set(b.map(String)); const out=b.slice();
      for(const x of a){ if(!seen.has(String(x))){ seen.add(String(x)); out.push(x); } }
      return out;
    }
    return a;                               // object list without ids → keep local
  }
  if(a&&b&&typeof a==="object"&&typeof b==="object"&&!Array.isArray(a)&&!Array.isArray(b)){
    return {...b,...a};                      // settings-like object, local wins
  }
  return a!==undefined?a:b;
}

// ── Delete tombstones ───────────────────────────────────────────────────────
// Union-merge is safe for concurrent ADDS but would resurrect a record DELETED
// on one device while another still had it. Tombstones fix that: deletions are
// recorded in a synced `_tombstones` doc ({collection:{id:whenISO}}) and a merged
// collection always drops any id that is tombstoned → a delete can't be undone.
const TOMB="_tombstones";
const idArr=v=>Array.isArray(v)&&v.every(x=>x&&typeof x==="object"&&x.id!=null);
// ids present in `a` but not in `b` (both arrays of {id})
const idsRemoved=(a,b)=>{const nb=new Set((b||[]).map(x=>x&&x.id));return (a||[]).filter(x=>x&&x.id!=null&&!nb.has(x.id)).map(x=>x.id);};
// deep-union two tombstone docs (accumulate deletions)
function mergeTombstones(a,b){const out={};const ks=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);for(const k of ks)out[k]={...(b&&b[k]||{}),...(a&&a[k]||{})};return out;}
const mergeAny=(name,a,b)=>name===TOMB?mergeTombstones(a,b):mergeCollection(a,b);
// drop tombstoned ids from one collection array
function withoutTombstoned(name,arr,tombs){if(!idArr(arr))return arr;const t=tombs&&tombs[name];if(!t)return arr;return arr.filter(x=>!(x.id in t));}
// filter every id'd collection against the tombstones (mutates+returns data)
function reconcileAll(data){const t=data[TOMB];if(!t)return data;for(const k of Object.keys(data))if(k!==TOMB)data[k]=withoutTombstoned(k,data[k],t);return data;}
// drop tombstones older than `days` to bound growth (deletes have long propagated)
function pruneTombstones(data,days){const t=data[TOMB]||{};const cutoff=Date.now()-(days||30)*86400000;const out={};for(const k of Object.keys(t)){const ids={};for(const id of Object.keys(t[k])){const ts=Date.parse(t[k][id]);if(isNaN(ts)||ts>=cutoff)ids[id]=t[k][id];}if(Object.keys(ids).length)out[k]=ids;}return out;}

// Small trailing debounce so a burst of edits coalesces into one cloud write.
function debounce(fn,ms){
  let t=null;
  return function(...args){
    if(t)clearTimeout(t);
    t=setTimeout(()=>{t=null;fn(...args);},ms);
  };
}

// Rather than hand-instrument every screen (fragile — it was never done), we diff
// what changed on each save and record a human-readable audit entry. One place,
// complete coverage, attributed to the current PIN user. Runs inside setData,
// wrapped in try/catch so a logging bug can never block a save.
const AUDIT={
  products:{module:"inventory",label:"insumo",name:x=>x.name},

  productionLog:{module:"recipes",label:"producción",name:x=>x.name||x.subRecipeName||"producción",noEdit:true},
  orders:{module:"sales",label:"pedido",name:x=>x.code||("Mesa "+(x.tableNum||"")),addVerb:"Abrió",delVerb:"Anuló",
    edit:(o,n)=>(o.status!=="closed"&&n.status==="closed")?"Cerró":(o.status==="closed"&&n.status!=="closed")?"Reabrió":((o.priceAdj||0)!==(n.priceAdj||0))?((n.priceAdj||0)<0?"Aplicó descuento a":"Ajustó"):null},

const _safeName=(cfg,x)=>{try{return cfg.name(x)||"";}catch(e){return "";}};
function activityEntry(user,action,target,module){
  return {id:"AL"+uid(),userId:user.id,userName:user.name,action,target:target||"",module,ts:new Date().toISOString().slice(0,19)};
}
// Diff prev→next across audited collections; returns new activity entries.
function auditDiff(prev,next,user){
  const out=[];
  for(const coll of Object.keys(AUDIT)){
    if(next[coll]===prev[coll])continue;
    const cfg=AUDIT[coll],a=prev[coll]||[],b=next[coll]||[];
    if(!Array.isArray(a)||!Array.isArray(b))continue;
    const am=new Map(),bm=new Map();
    for(const x of a)if(x&&x.id!=null)am.set(x.id,x);
    for(const x of b)if(x&&x.id!=null)bm.set(x.id,x);
    for(const [id,x] of bm)if(!am.has(id))out.push(activityEntry(user,(cfg.addVerb||"Agregó")+" "+cfg.label,_safeName(cfg,x),cfg.module));
    for(const [id,x] of am)if(!bm.has(id))out.push(activityEntry(user,(cfg.delVerb||"Eliminó")+" "+cfg.label,_safeName(cfg,x),cfg.module));
    if(!cfg.noEdit)for(const [id,x] of bm){const o=am.get(id);if(o&&o!==x){const v=cfg.edit?cfg.edit(o,x):"Editó";if(v)out.push(activityEntry(user,v+" "+cfg.label,_safeName(cfg,x),cfg.module));}}
  }
  if(prev.settings!==next.settings){try{
    // Ignore internal/programmatic flags (e.g. the onboarding-done flag) so they
    // don't log a spurious "changed settings" — only real config edits count.
    const strip=s=>{const o={...(s||{})};delete o.onboarded;return o;};
    if(JSON.stringify(strip(prev.settings))!==JSON.stringify(strip(next.settings)))out.push(activityEntry(user,"Cambió la configuración","","settings"));
  }catch(e){}}
  return out;
}

// ─── IGV HELPERS ─────────────────────────────────────────────────────────────
// All prices in the system are stored as the final price the customer pays.
// If igvMode="incluido" (default), that price already contains IGV.
// If igvMode="excluido", IGV must be added on top when closing an order.
const IGV_RATE = 0.18;

// ─── FIRST-RUN / ONBOARDING HELPERS ────────────────────────────────────────
// The app ships with seeded demo users so a fresh install is usable out of
// the box. We detect "first run" by checking whether the owner account still
// has its untouched demo credentials — no separate flag needed, and it stops
// nagging the instant the owner customizes their name/PIN.
const DEMO_SEED_USERS = {
  U001:{name:"Carlos (Dueño)",pin:"1234"},
  U002:{name:"María Chef",pin:"2222"},
  U003:{name:"Juan Cajero",pin:"3333"},
  U004:{name:"Pedro Visor",pin:"4444"},
};
function isFirstRun(data){
  const owner=(data.users||[]).find(u=>u.role==="owner");
  const seed=owner&&DEMO_SEED_USERS[owner.id];
  return !!(owner&&seed&&owner.name===seed.name&&owner.pin===seed.pin);
}

function getSettings(data){
  const def={igvMode:"incluido",serviceCharge:false,serviceChargePct:10,foodCostTarget:30,restaurantName:"",ruc:""};
  return{...def,...(data.settings||{})};
}

// Returns IGV amount from a gross (customer-facing) price
function igvFromGross(gross, igvMode){
  if(igvMode==="ninguno") return 0;
  if(igvMode==="incluido") return gross - gross/1.18;   // extract from gross
  if(igvMode==="excluido") return gross * IGV_RATE;      // add on top
  return 0;
}

// Returns the tax-exclusive base from a gross price
function netBase(gross, igvMode){
  if(igvMode==="ninguno") return gross;
  if(igvMode==="incluido") return gross/1.18;
  if(igvMode==="excluido") return gross;
  return gross;
}

// Returns the total the customer actually pays (gross + optional service charge)
function orderGrossTotal(baseTotal, settings){
  const s=settings||{igvMode:"incluido",serviceCharge:false,serviceChargePct:10};
  const servicePct=(s.serviceCharge?(s.serviceChargePct||10):0)/100;
  const serviceAmt = s.igvMode==="excluido"
    ? (baseTotal*(1+IGV_RATE))*servicePct
    : baseTotal*servicePct;
  const igvAmt = igvFromGross(
    s.igvMode==="excluido" ? baseTotal*(1+IGV_RATE) : baseTotal,
    s.igvMode==="excluido" ? "incluido" : s.igvMode
  );
  if(s.igvMode==="excluido"){
    const gross=baseTotal*(1+IGV_RATE);
    return{net:baseTotal, igv:igvAmt, service:serviceAmt, total:gross+serviceAmt};
  }
  return{net:baseTotal/1.18, igv:igvAmt, service:serviceAmt, total:baseTotal+serviceAmt};
}

// Returns warn threshold (target + 3pp) and critical (target + 5pp) as decimals
function getFCTWarn(data){ return getFCT(data)+0.03; }
function getFCTCrit(data){ return getFCT(data)+0.05; }

function usableUnitCost(p){
  if(!p)return 0;
  const yld=(p.yieldPct||100)/100;
  return yld>0?(p.avgCost||0)/yld:(p.avgCost||0);
}
// Sub-recipe: cost per unit of yield (e.g. S/ per gram or per litre)
function subRecipeCostPerUnit(srId,products,subBom){
  const lines=subBom.filter(b=>b.subRecipeId===srId);
  if(!lines.length)return 0;
  const batchCost=lines.reduce((s,b)=>{
    const p=products.find(p=>p.id===b.productId);
    return s+usableUnitCost(p)*b.qty;
  },0);
  return batchCost; // caller divides by batchYield
}
// ── Lookup indexes ───────────────────────────────────────────────────────────
// Cartas grandes (cientos de platos e insumos) hacían que cada cálculo de costo
// recorriera todo el catálogo. Estos índices se reconstruyen solo cuando el
// arreglo de origen cambia de identidad (setData siempre crea arreglos nuevos),
// así que el resultado es idéntico al de antes pero sin los escaneos repetidos.
function _idxBy(arr,key,cacheHolder){
  if(cacheHolder.src!==arr){
    cacheHolder.src=arr;
    cacheHolder.map=new Map();
    (arr||[]).forEach(x=>cacheHolder.map.set(x[key],x));
  }
  return cacheHolder.map;
}
function _groupBy(arr,key,cacheHolder){
  if(cacheHolder.src!==arr){
    cacheHolder.src=arr;
    cacheHolder.map=new Map();
    (arr||[]).forEach(x=>{const g=cacheHolder.map.get(x[key]);if(g)g.push(x);else cacheHolder.map.set(x[key],[x]);});
  }
  return cacheHolder.map;
}
const _prodIdx={src:undefined,map:new Map()};
const _srIdx={src:undefined,map:new Map()};
const _recIdx={src:undefined,map:new Map()};
const _bomIdx={src:undefined,map:new Map()};
const _sbomIdx={src:undefined,map:new Map()};
const prodById=(products,id)=>_idxBy(products,"id",_prodIdx).get(id);
const srById=(subRecipes,id)=>_idxBy(subRecipes,"id",_srIdx).get(id);
const recipeById=(recipes,id)=>_idxBy(recipes,"id",_recIdx).get(id);
const bomOf=(bom,recipeId)=>_groupBy(bom,"recipeId",_bomIdx).get(recipeId)||[];
const subBomOf=(subBom,srId)=>_groupBy(subBom,"subRecipeId",_sbomIdx).get(srId)||[];
const _olIdx={src:undefined,map:new Map()};
const linesOf=(orderLines,orderId)=>_groupBy(orderLines,"orderId",_olIdx).get(orderId)||[];
// Líneas de un subconjunto de pedidos, sin recorrer los pedidos por cada línea.
function linesOfOrders(orderLines,ordersSubset){
  const ids=new Set((ordersSubset||[]).map(o=>o.id));
  return (orderLines||[]).filter(l=>ids.has(l.orderId));
}

const _sbCostCache={products:undefined,subBom:undefined,map:new Map()};
function subRecipeBatchCost(srId,products,subBom){
  if(_sbCostCache.products!==products||_sbCostCache.subBom!==subBom){
    _sbCostCache.products=products;_sbCostCache.subBom=subBom;_sbCostCache.map=new Map();
  }
  if(_sbCostCache.map.has(srId))return _sbCostCache.map.get(srId);
  const v=subBomOf(subBom,srId)
    .reduce((s,b)=>s+usableUnitCost(prodById(products,b.productId))*b.qty,0);
  _sbCostCache.map.set(srId,v);
  return v;
}
function subRecipeUnitCost(sr,products,subBom){
  if(!sr||!sr.batchYield)return 0;
  return subRecipeBatchCost(sr.id,products,subBom)/(sr.batchYield||1);
}

// BOM line cost — handles both product and subrecipe types
function bomLineCost(b,products,subBom,subRecipes){
  if(b.type==="subrecipe"){
    const sr=srById(subRecipes,b.subRecipeId);
    return sr?subRecipeUnitCost(sr,products,subBom)*b.qty:0;
  }
  return usableUnitCost(prodById(products,b.productId))*b.qty;
}

const _fcCache={products:undefined,bom:undefined,subBom:undefined,subRecipes:undefined,map:new Map()};
function recipeFoodCost(recipeId,products,bom,subBom,subRecipes){
  const c=_fcCache;
  if(c.products!==products||c.bom!==bom||c.subBom!==subBom||c.subRecipes!==subRecipes){
    c.products=products;c.bom=bom;c.subBom=subBom;c.subRecipes=subRecipes;c.map=new Map();
  }
  if(c.map.has(recipeId))return c.map.get(recipeId);
  const v=bomOf(bom,recipeId)
    .reduce((s,b)=>s+bomLineCost(b,products,subBom,subRecipes),0);
  c.map.set(recipeId,v);
  return v;
}
function canMakeRecipe(recipeId,qty=1,products,bom,subBom,subRecipes){
  const lines=bomOf(bom,recipeId);
  if(!lines.length)return true;
  return lines.every(b=>{
    if(b.type==="subrecipe"){
      // sub-recipe: check each of its ingredients
      const sbLines=subBomOf(subBom,b.subRecipeId);
      const sr=srById(subRecipes,b.subRecipeId);
      if(!sr||!sr.batchYield)return true;
      const batchesNeeded=b.qty/sr.batchYield;
      return sbLines.every(sb=>{const p=prodById(products,sb.productId);return p&&p.stock>=sb.qty*batchesNeeded*qty;});
    }
    const p=prodById(products,b.productId);
    return p&&p.stock>=b.qty*qty;
  });
}
function getMissingIngredients(recipeId,qty=1,products,bom,subBom,subRecipes){
  return bom.filter(b=>b.recipeId===recipeId).reduce((acc,b)=>{
    if(b.type==="subrecipe"){
      const sr=(subRecipes||[]).find(s=>s.id===b.subRecipeId);
      if(!sr||!sr.batchYield)return acc;
      const batchesNeeded=b.qty/sr.batchYield;
      (subBom||[]).filter(sb=>sb.subRecipeId===b.subRecipeId).forEach(sb=>{
        const p=products.find(p=>p.id===sb.productId);
        const need=sb.qty*batchesNeeded*qty,have=p?.stock??0;
        if(have<need)acc.push({productId:sb.productId,name:p?.name||sb.productId,need,have,unit:sb.unit,via:sr.name});
      });
      return acc;
    }
    const p=products.find(p=>p.id===b.productId);
    const need=b.qty*qty,have=p?.stock??0;
    if(have<need)acc.push({productId:b.productId,name:p?.name||b.productId,need,have,unit:b.unit});
    return acc;
  },[]);
}

function Card({children,style,onClick,className}){

// Shared segmented tab strip. Each tab is [id,label] or {id,label}.
// fill=true → tabs split the width evenly (segmented control, e.g. AuthScreen).
// fill=false (default) → content-sized pills that scroll horizontally when they
// overflow (good for many sub-tabs on a narrow phone; inline on desktop).
function Tabs({tabs,active,onChange,fill,style}){
  return h('div',{className:"ec-tabs",style:{display:"flex",gap:6,overflowX:fill?"visible":"auto",
      background:"var(--surface)",padding:4,borderRadius:"var(--radius)",...style}},
    (tabs||[]).map(t=>{
      const id=Array.isArray(t)?t[0]:t.id, lbl=Array.isArray(t)?t[1]:t.label, on=active===id;
      return h('button',{key:id,onClick:()=>onChange(id),style:{
        flex:fill?"1 1 0":"0 0 auto", padding:"9px 16px", borderRadius:"var(--radius-sm)",
        fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"var(--sora)", border:"none",
        whiteSpace:"nowrap", transition:"background .15s,color .15s",
        background:on?"var(--accent)":"var(--surface2)", color:on?"#fff":"var(--text2)"}}, lbl);
    })
  );
}

function Btn({children,onClick,variant="primary",style,disabled,size="md"}){
  const pad=size==="sm"?"7px 14px":size==="lg"?"14px 28px":"10px 20px";
  const fs=size==="sm"?13:size==="lg"?16:14;
  const variants={
    primary:{background:"var(--accent)",color:"#fff"},
    secondary:{background:"var(--surface2)",color:"var(--text)",border:"1px solid var(--border2)"},
    ghost:{background:"transparent",color:"var(--text2)",border:"1px solid var(--border)"},
    danger:{background:"rgba(239,68,68,0.15)",color:"var(--red)",border:"1px solid rgba(239,68,68,0.3)"},
    success:{background:"rgba(34,197,94,0.15)",color:"var(--green)",border:"1px solid rgba(34,197,94,0.3)"},
  };
  return h('button',{
    disabled,onClick,className:"ec-tap",
    style:{border:"none",borderRadius:"var(--radius-sm)",fontWeight:500,fontFamily:"var(--sans)",
      display:"inline-flex",alignItems:"center",justifyContent:"center",gap:6,
      padding:pad,fontSize:fs,opacity:disabled?0.45:1,...variants[variant],...style}
  },children);
}

function Modal({open,onClose,title,children}){
  const ref=useCallback(n=>{if(n)n.scrollTop=0;},[open]);
  // Render into document.body to escape any stacking context / backdrop-filter ancestor
  const [portal]=useState(()=>{
    const el=document.createElement('div');
    document.body.appendChild(el);
    return el;
  });
  useEffect(()=>()=>{ try{document.body.removeChild(portal);}catch(e){} },[]);

  if(!open)return null;
  return ReactDOM.createPortal(
    h('div',{className:"fade-in ec-modal-overlay",onClick:onClose,style:{
      position:"fixed",top:0,left:0,right:0,bottom:0,
      background:"rgba(0,0,0,0.7)",backdropFilter:"blur(4px)",
      zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",
      padding:"16px",overflow:"hidden"}},
      h('div',{ref,className:"slide-up modal-inner ec-modal-sheet",onClick:e=>e.stopPropagation(),style:{
        background:"var(--surface)",borderRadius:20,border:"1px solid var(--border2)",
        width:"100%",maxWidth:440,maxHeight:"calc(100vh - 32px)",overflowY:"auto",
        padding:"1.5rem",flexShrink:0}},
        h('div',{className:"ec-sheet-handle"}),
        h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
          h('h3',{style:{fontFamily:"var(--sora)",fontSize:16,fontWeight:600}},title),
          h('button',{onClick:onClose,style:{background:"var(--surface2)",border:"1px solid var(--border2)",
            color:"var(--text2)",borderRadius:8,width:32,height:32,fontSize:16,
            cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},"✕")
        ),
        children
      )
    ),
    portal
  );
}

// Selector buscable con lista desplazable. Reemplaza a los <select> largos:
// con cartas grandes (cientos de platos o insumos) un desplegable nativo es
// imposible de usar en tablet. Aquí se escribe para filtrar y la lista tiene
// scroll propio, así que da igual si hay 20 opciones o 2000.
function PickerField({value,onChange,options,placeholder,searchPlaceholder,emptyText,maxShown}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState("");
  const boxRef=useRef(null);
  const inputRef=useRef(null);
  const MAX=maxShown||60;
  const sel=options.find(o=>o.value===value);
  const nq=ecNorm(q);
  const filtered=nq?options.filter(o=>ecNorm(o.label).includes(nq)||ecNorm(o.sub).includes(nq)):options;
  const shown=filtered.slice(0,MAX);
  useEffect(()=>{
    if(!open)return;
    const onDoc=e=>{if(boxRef.current&&!boxRef.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",onDoc);
    if(inputRef.current)inputRef.current.focus();
    return()=>document.removeEventListener("mousedown",onDoc);
  },[open]);
  const pick=v=>{onChange(v);setOpen(false);setQ("");};
  return h('div',{ref:boxRef,style:{position:"relative"}},
    h('button',{type:"button",onClick:()=>setOpen(o=>!o),style:{
        width:"100%",textAlign:"left",background:"var(--surface)",border:"1px solid var(--border2)",
        borderRadius:"var(--radius-sm)",padding:"10px 12px",fontSize:14,fontFamily:"var(--sans)",
        color:sel?"var(--text)":"var(--text3)",cursor:"pointer",display:"flex",
        alignItems:"center",justifyContent:"space-between",gap:8}},
      h('span',{style:{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},sel?sel.label:(placeholder||"Seleccionar...")),
      h('span',{style:{color:"var(--text3)",fontSize:11,flexShrink:0}},open?"▲":"▼")),
    open&&h('div',{style:{
        position:"absolute",zIndex:60,top:"calc(100% + 4px)",left:0,right:0,
        background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:"var(--radius-sm)",
        boxShadow:"0 8px 24px rgba(0,0,0,0.28)",overflow:"hidden"}},
      h('div',{style:{padding:8,borderBottom:"1px solid var(--border)"}},
        h('input',{ref:inputRef,value:q,onChange:e=>setQ(e.target.value),
          onKeyDown:e=>{if(e.key==="Enter"){e.preventDefault();if(shown.length)pick(shown[0].value);}
                        else if(e.key==="Escape"){e.preventDefault();setOpen(false);}},
          placeholder:searchPlaceholder||"Buscar...",style:{width:"100%",fontSize:14}})),
      h('div',{style:{maxHeight:250,overflowY:"auto"}},
        shown.length===0
          ?h('div',{style:{padding:"14px 12px",fontSize:12,color:"var(--text3)",fontStyle:"italic"}},emptyText||"Sin resultados")
          :shown.map(o=>h('button',{key:o.value,type:"button",onClick:()=>pick(o.value),style:{
              width:"100%",textAlign:"left",background:o.value===value?"rgba(249,115,22,0.12)":"transparent",
              border:"none",borderBottom:"1px solid var(--border)",padding:"9px 12px",cursor:"pointer",
              fontFamily:"var(--sans)",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}},
            h('span',{style:{minWidth:0}},
              h('span',{style:{display:"block",fontSize:13,color:"var(--text)",fontWeight:o.value===value?600:400,
                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},o.label),
              o.sub&&h('span',{style:{display:"block",fontSize:11,color:"var(--text3)",marginTop:1,
                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},o.sub)),
            o.tag&&h('span',{style:{fontSize:10,fontWeight:700,color:o.tagColor||"var(--text3)",flexShrink:0,whiteSpace:"nowrap"}},o.tag)))),
      filtered.length>shown.length&&h('div',{style:{padding:"7px 12px",fontSize:11,color:"var(--text3)",
        borderTop:"1px solid var(--border)",background:"var(--surface)"}},
        "Mostrando "+shown.length+" de "+filtered.length+" — escribe para filtrar")
    )
  );
}

          onKeyDown:e=>e.key==="Enter"&&doAdd(),
          placeholder:"ej. Nueva categoría...",style:{flex:1}}),
        h(Btn,{onClick:doAdd,disabled:!newName.trim()||categories.includes(newName.trim())},"Agregar")
      ),
      newName.trim()&&categories.includes(newName.trim())&&
        h('div',{style:{fontSize:11,color:"var(--red)",marginTop:4}},"Ya existe esta categoría")
    ),
    h('div',{style:{height:"0.5px",background:"var(--border)",marginBottom:14}}),
    h('div',{style:{fontSize:12,color:"var(--text2)",fontWeight:500,marginBottom:8}},
      `Categorías (${categories.length})`),
    h('div',{style:{display:"flex",flexDirection:"column",gap:6,maxHeight:220,overflowY:"auto",paddingRight:2}},
      categories.map(cat=>{
        const count=(items||[]).filter(x=>x.category===cat).length;
        const isEd=editing?.original===cat;
        return h('div',{key:cat,style:{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",
          background:"var(--surface2)",borderRadius:"var(--radius-sm)",border:"1px solid var(--border)"}},
          isEd
            ? h(Fragment,null,
                h('input',{value:editing.name,autoFocus:true,
                  onChange:e=>setEditing({...editing,name:e.target.value}),
                  onKeyDown:e=>{if(e.key==="Enter")doSave();if(e.key==="Escape")setEditing(null);},
                  style:{flex:1,padding:"5px 10px",fontSize:13}}),
                h(Btn,{size:"sm",onClick:doSave},"✓"),
                h(Btn,{size:"sm",variant:"ghost",onClick:()=>setEditing(null)},"✕")
              )
            : h(Fragment,null,
                h('span',{style:{flex:1,fontSize:13,fontWeight:500}},cat),
                h('span',{style:{fontSize:11,color:"var(--text3)",marginRight:4}},
                  `${count} ${itemLabel}${count!==1?"s":""}`),
                h('button',{onClick:()=>setEditing({original:cat,name:cat}),style:{
                  background:"none",border:"1px solid var(--border2)",borderRadius:6,
                  padding:"3px 9px",fontSize:11,color:"var(--text2)",cursor:"pointer"}},"Editar"),
                h('button',{onClick:()=>onDelete(cat),disabled:count>0,style:{
                  background:count>0?"transparent":"rgba(239,68,68,0.1)",
                  border:"1px solid",borderColor:count>0?"var(--border)":"rgba(239,68,68,0.3)",
                  borderRadius:6,padding:"3px 9px",fontSize:11,
                  color:count>0?"var(--text3)":"var(--red)",
                  cursor:count>0?"not-allowed":"pointer",opacity:count>0?0.45:1}},
                  "Eliminar")
              )
        );
      })
    ),
    h('div',{style:{marginTop:16}},
      h(Btn,{variant:"ghost",onClick:()=>{onClose();setEditing(null);setNewName("");},style:{width:"100%"}},"Cerrar")
    )
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
// ─── ALERT CENTER ─────────────────────────────────────────────────────────────
function AlertCenter({
  critical,lowStock,needsRecount,unavailable,pricingAlerts,
  pendingPurchases,todayWastage,todayWastageCost2,
  cashMatchStatus,cashGap,
  products,bom,subBom,subRecipes,
  igvMode,fct,setPage,role,
  missingBizFields,demoStaffLeft,noRecipes,noProducts
}){
  const [collapsed,setCollapsed]=useState(true);

  // Build unified alert list
  const alerts=[];

  // 🚨 Critical stock (red)
  if(critical.length>0) alerts.push({
    id:"crit",severity:"critical",icon:"🚨",
    title:"Stock crítico",
    body:critical.map(p=>{
      const deficit=p.minStock-p.stock;
      const buy=Math.max(p.minStock*2-p.stock,p.minStock);
      return `${p.name} — ${fmtNum(p.stock)}/${fmtNum(p.minStock)} ${p.unit} (faltan ${fmtNum(deficit)}) · compra ≈${fmtNum(buy)} ${p.unit}`;
    }),
    actions:[{label:"Ver Stock →",page:"inventory"},{label:"Comprar →",page:"abastecimiento"}]
  });

  // ⚠ Low stock (yellow)
  if(lowStock.length>0) alerts.push({
    id:"low",severity:"warning",icon:"⚠️",
    title:`${lowStock.length} ingrediente${lowStock.length!==1?"s":""} con stock bajo`,
    body:lowStock.map(p=>{
      const buy=Math.max(p.minStock*2-p.stock,p.minStock);
      return `${p.name} — ${fmtNum(p.stock)} ${p.unit} (mín ${fmtNum(p.minStock)}) · compra ≈${fmtNum(buy)} ${p.unit}`;
    }),
    actions:[{label:"Ver Stock →",page:"inventory"}]
  });

  // 🔢 Needs recount — theoretical stock was overridden in Ventas at some point
  if(needsRecount&&needsRecount.length>0) alerts.push({
    id:"recount",severity:"warning",icon:"🔢",
    title:`${needsRecount.length} insumo${needsRecount.length!==1?"s":""} con posible desfase — recuéntalo${needsRecount.length!==1?"s":""}`,
    body:needsRecount.map(p=>`${p.name} — sistema dice ${fmtNum(p.stock)} ${p.unit}${p.stock<0?" (negativo)":""}`),
    actions:[{label:"Contar stock →",page:"inventory"}]
  });

  // 🚫 Unavailable dishes (red)
  if(unavailable.length>0) alerts.push({
    id:"unavail",severity:"critical",icon:"🚫",
    title:`${unavailable.length} plato${unavailable.length!==1?"s":""} sin stock para preparar`,
    body:unavailable.map(r=>{
      const miss=getMissingIngredients(r.id,1,products,bom,subBom,subRecipes);
      return r.name+" — sin: "+miss.map(m=>m.name).join(", ");
    }),
    actions:[{label:"Ver Recetas →",page:"recipes"},{label:"Ver Stock →",page:"inventory"}]
  });

  // 💸 Pricing alerts (yellow)
  if(pricingAlerts.length>0) alerts.push({
    id:"price",severity:"warning",icon:"💸",
    title:`${pricingAlerts.length} plato${pricingAlerts.length!==1?"s":""} con costo sobre objetivo`,
    body:pricingAlerts.map(r=>{
      const sugTxt=r.suggestedGross?" · sugerido "+fmtCost(r.suggestedGross):"";
      return `${r.name} — ${fmtPct(r.costPct)} costo · actual ${fmtCost(r.price)}${sugTxt}`;
    }),
    actions:[{label:"Ver Recetas →",page:"recipes"},{label:"Ver Menú →",page:"menueng"}]
  });

  // 🛒 Pending purchases (info)
  if(pendingPurchases.length>0) alerts.push({
    id:"pend",severity:"info",icon:"🛒",
    title:`${pendingPurchases.length} compra${pendingPurchases.length!==1?"s":""} pendiente${pendingPurchases.length!==1?"s":""} de confirmar`,
    body:pendingPurchases.map(p=>{
      const prod=products.find(x=>x.id===p.productId);
      return `${prod?prod.name:"Producto"} — ${fmtNum(p.qty)} ${prod?prod.unit:""} · ${fmtCost(p.totalCost)} (${p.date})`;
    }),
    actions:[{label:"Ver Compras →",page:"abastecimiento"}]
  });

  // 🗑 Wastage today (info if any)
  if(todayWastage.length>0) alerts.push({
    id:"waste",severity:"info",icon:"🗑",
    title:`${todayWastage.length} merma${todayWastage.length!==1?"s":""} registrada${todayWastage.length!==1?"s":""} hoy · S/ ${todayWastageCost2.toFixed(2)} perdido`,
    body:todayWastage.map(w=>`${w.productName} — ${fmtNum(w.qty)} ${w.unit} · ${w.reason}`),
    actions:[{label:"Ver Mermas →",page:"inventory"}]
  });

  // ❌ Cash gap (red) — only if recon done and gap found
  if(cashMatchStatus==="gap") alerts.push({
    id:"cash",severity:"critical",icon:"❌",
    title:"Diferencia en caja — requiere atención",
    body:[`Diferencia de ${cashGap>0?"+":""}${fmtCost(cashGap)} vs lo registrado en Easy Cook`],
    actions:[{label:"Revisar Caja →",page:"payrecon"}]
  });

  // 🧭 Setup checklist (info) — missing info / unused features from onboarding
  if(noProducts) alerts.push({
    id:"setup-products",severity:"info",icon:"🧭",
    title:"Aún no registras insumos",
    body:["El inventario está vacío — sin insumos no puedes crear recetas ni vender."],
    actions:[{label:"Ir a Stock →",page:"inventory"}]
  });
  if(!noProducts&&noRecipes) alerts.push({
    id:"setup-recipes",severity:"info",icon:"🧭",
    title:"Aún no registras recetas",
    body:["Tu carta está vacía — crea tus platos para poder registrar ventas."],
    actions:[{label:"Ir a Recetas →",page:"recipes"}]
  });
  if(missingBizFields&&missingBizFields.length>0) alerts.push({
    id:"setup-biz",severity:"info",icon:"🧭",
    title:"Faltan datos de tu negocio",
    body:[`Sin completar: ${missingBizFields.join(", ")} — aparecen en reportes y comprobantes.`],
    actions:[{label:"Ir a Configuración →",page:"settings"}]
  });
  if(demoStaffLeft&&demoStaffLeft.length>0) alerts.push({
    id:"setup-team",severity:"info",icon:"🧭",
    title:`${demoStaffLeft.length} cuenta${demoStaffLeft.length!==1?"s":""} de demostración sin usar`,
    body:demoStaffLeft.map(u=>`${u.name} — PIN de demo sin cambiar`),
    actions:[{label:"Ir a Equipo →",page:"users"}]
  });

  // Role-based visibility: the owner sees every alert; other roles only see
  // alerts they have permission to act on (based on the alert's primary action).
  if(role&&role!=="owner"){
    const PAGE_PERM={inventory:"editInventory",abastecimiento:"editPurchases",recipes:"editRecipes",menueng:"editRecipes",payrecon:"editSales",salesrecon:"editSales",reports:"viewReports",settings:"manageSettings",users:"manageUsers"};
    for(let i=alerts.length-1;i>=0;i--){
      const pg=alerts[i].actions&&alerts[i].actions[0]&&alerts[i].actions[0].page;
      const perm=PAGE_PERM[pg];
      if(!(perm&&can(role,perm))) alerts.splice(i,1);
    }
  }

  const totalCount=alerts.length;
  if(totalCount===0) return h('div',{style:{
    background:"rgba(34,197,94,0.07)",border:"1px solid rgba(34,197,94,0.2)",
    borderRadius:"var(--radius)",padding:"10px 14px",marginBottom:12,
    display:"flex",alignItems:"center",gap:10}},
    h('span',{style:{fontSize:18}},"✅"),
    h('div',{style:{fontSize:13,fontWeight:600,color:"var(--green)"}},"Todo en orden — sin alertas activas")
  );

  const critCount=alerts.filter(a=>a.severity==="critical").length;
  const warnCount=alerts.filter(a=>a.severity==="warning").length;

  return h('div',{style:{marginBottom:16}},
    // ── Header bar (always visible) ────────────────────────────────────────
    h('div',{
      onClick:()=>setCollapsed(c=>!c),
      style:{
        display:"flex",alignItems:"center",gap:10,
        background:critCount>0?"rgba(239,68,68,0.1)":"rgba(234,179,8,0.08)",
        border:`1px solid ${critCount>0?"rgba(239,68,68,0.35)":"rgba(234,179,8,0.3)"}`,
        borderRadius:collapsed?"var(--radius)":"var(--radius) var(--radius) 0 0",
        padding:"11px 14px",cursor:"pointer",transition:"border-radius 0.2s"
      }
    },
      h('span',{style:{fontSize:18}},critCount>0?"🚨":"⚠️"),
      h('div',{style:{flex:1}},
        h('div',{style:{
          fontSize:13,fontWeight:700,
          color:critCount>0?"var(--red)":"var(--yellow)"
        }},
          `${totalCount} alerta${totalCount!==1?"s":""} activa${totalCount!==1?"s":""}`+
          (critCount>0?` · ${critCount} crítica${critCount!==1?"s":""}`:"")+
          (warnCount>0?` · ${warnCount} advertencia${warnCount!==1?"s":""}`:"")),
        h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:1}},
          collapsed?"Toca para ver detalles":"Toca para colapsar")
      ),
      // Severity pills
      h('div',{style:{display:"flex",gap:5,alignItems:"center"}},
        critCount>0&&h('span',{style:{
          fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,
          background:"rgba(239,68,68,0.2)",color:"var(--red)"}},critCount+" 🔴"),
        warnCount>0&&h('span',{style:{
          fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,
          background:"rgba(234,179,8,0.2)",color:"var(--yellow)"}},warnCount+" 🟡"),
        (totalCount-critCount-warnCount)>0&&h('span',{style:{
          fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,
          background:"rgba(59,130,246,0.15)",color:"var(--blue)"}},(totalCount-critCount-warnCount)+" 🔵")
      ),
      h('span',{style:{color:"var(--text3)",fontSize:14,marginLeft:4}},collapsed?"▼":"▲")
    ),

    // ── Alert rows (collapsible) ───────────────────────────────────────────
    !collapsed&&h('div',{style:{
      border:`1px solid ${critCount>0?"rgba(239,68,68,0.25)":"rgba(234,179,8,0.2)"}`,
      borderTop:"none",borderRadius:"0 0 var(--radius) var(--radius)",
      overflow:"hidden"
    }},
      alerts.map((alert,ai)=>{
        const bgMap={critical:"rgba(239,68,68,0.06)",warning:"rgba(234,179,8,0.05)",info:"rgba(59,130,246,0.05)"};
        const colMap={critical:"var(--red)",warning:"var(--yellow)",info:"var(--blue)"};
        const borderMap={critical:"rgba(239,68,68,0.15)",warning:"rgba(234,179,8,0.12)",info:"rgba(59,130,246,0.12)"};
        const col=colMap[alert.severity];
        return h('div',{key:alert.id,style:{
          background:bgMap[alert.severity],
          borderBottom:ai<alerts.length-1?`1px solid ${borderMap[alert.severity]}`:"none",
          padding:"10px 14px"
        }},
          // Row header: icon + title + action buttons
          h('div',{style:{display:"flex",alignItems:"flex-start",gap:8,marginBottom:alert.body.length>0?6:0}},
            h('span',{style:{fontSize:16,marginTop:1}},alert.icon),
            h('div',{style:{flex:1}},
              h('div',{style:{fontSize:12,fontWeight:700,color:col}},alert.title)
            ),
            // Action buttons
            h('div',{style:{display:"flex",gap:5,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}},
              alert.actions.map(act=>h('button',{
                key:act.page,
                onClick:e=>{e.stopPropagation();setPage(act.page);},
                style:{
                  padding:"4px 9px",borderRadius:6,fontSize:10,fontWeight:700,
                  cursor:"pointer",border:`1px solid ${col}33`,
                  background:`${col}18`,color:col,whiteSpace:"nowrap"
                }
              },act.label))
            )
          ),
          // Detail rows
          alert.body.length>0&&h('div',{style:{
            display:"flex",flexDirection:"column",gap:3,
            paddingLeft:24
          }},
            alert.body.map((line,li)=>h('div',{key:li,style:{
              fontSize:11,color:"var(--text2)",
              padding:"3px 8px",borderRadius:4,
              background:"rgba(0,0,0,0.15)",
              borderLeft:`2px solid ${col}55`
            }},line))
          )
        );
      })
    )
  );
}


function TodayChecklist({critical,lowStock,needsRecount,pendingPurchases,pricingAlerts,products,setPage}){
  const [collapsed,setCollapsed]=useState(true);
  const tasks=[];
  critical.forEach(p=>{
    const buy=Math.max(p.minStock*2-p.stock,p.minStock);
    tasks.push({key:"crit-"+p.id,prio:1,icon:"🔴",
      text:`Compra ≈${fmtNum(buy)} ${p.unit} de ${p.name}`,
      sub:"Stock crítico — se te está acabando",
      action:{label:"Comprar →",page:"abastecimiento"}});
  });
  pendingPurchases.forEach(p=>{
    const prod=products.find(x=>x.id===p.productId);
    tasks.push({key:"pend-"+(p.id||(p.productId+"-"+p.date)),prio:2,icon:"🛒",
      text:`Confirma la compra de ${prod?prod.name:"un insumo"}`,
      sub:`${fmtNum(p.qty)} ${prod?prod.unit:""} · ${fmtCost(p.totalCost)}`,
      action:{label:"Ver Compras →",page:"abastecimiento"}});
  });
  needsRecount.forEach(p=>{
    tasks.push({key:"rec-"+p.id,prio:3,icon:"🔢",
      text:`Cuenta el stock real de ${p.name}`,
      sub:"El sistema y la cocina pueden estar desfasados",
      action:{label:"Contar →",page:"inventory"}});

  pricingAlerts.forEach(r=>{
    tasks.push({key:"price-"+r.id,prio:4,icon:"💸",

      action:{label:"Ver Recetas →",page:"recipes"}});

  lowStock.forEach(p=>{

    tasks.push({key:"low-"+p.id,prio:5,icon:"⚠️",
      text:`Compra ≈${fmtNum(buy)} ${p.unit} de ${p.name} esta semana`,

      action:{label:"Comprar →",page:"abastecimiento"}});

  tasks.sort((a,b)=>a.prio-b.prio);
  const MAX=6;
  const shown=tasks.slice(0,MAX);
  const extra=tasks.length-shown.length;

    background:"var(--surface)",border:"1px solid var(--border2)",
    borderRadius:"var(--radius)",overflow:"hidden",marginBottom:16
  }},
    h('div',{onClick:()=>setCollapsed(c=>!c),style:{display:"flex",alignItems:"center",gap:8,padding:"12px 14px",
      background:"var(--surface2)",borderBottom:collapsed?"none":"1px solid var(--border)",cursor:"pointer"}},
      h('span',{style:{fontSize:16}},"✅"),

        h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:1}},collapsed?"Toca para ver tus tareas":"Toca para colapsar")
      ),
      tasks.length>0
        ?h('span',{style:{fontSize:11,fontWeight:700,color:"var(--accent)",
          background:"rgba(249,115,22,0.12)",borderRadius:20,padding:"2px 9px"}},
          tasks.length+" tarea"+(tasks.length!==1?"s":""))
        :h('span',{style:{fontSize:11,fontWeight:700,color:"var(--green)",
          background:"rgba(34,197,94,0.12)",borderRadius:20,padding:"2px 9px"}},"Al día"),
      h('span',{style:{color:"var(--text3)",fontSize:14,marginLeft:2}},collapsed?"▼":"▲")
    ),
    !collapsed&&(tasks.length===0
      ?h('div',{style:{padding:"16px 14px",display:"flex",alignItems:"center",gap:10}},

          h('span',{style:{fontSize:15,flexShrink:0}},t.icon),
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{style:{fontSize:13,fontWeight:600,color:"var(--text)"}},t.text),
            t.sub&&h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:1}},t.sub)),
          h('button',{onClick:()=>setPage(t.action.page),style:{
            padding:"5px 10px",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer",
            border:"1px solid var(--accent)",background:"rgba(249,115,22,0.12)",
            color:"var(--accent)",whiteSpace:"nowrap",flexShrink:0}},t.action.label)
        )),
        extra>0&&h('div',{style:{padding:"8px 14px",fontSize:11,color:"var(--text3)",textAlign:"center"}},
          "y "+extra+" tarea"+(extra!==1?"s":"")+" más — revisa el detalle abajo")
      ))
  );
}


function Dashboard({data,setPage,currentUser}){
  const {products,recipes,bom,orders=[],orderLines=[],purchases=[],subBom=[],subRecipes=[],paymentRecons=[],wastageLog=[]}=data;
  const today_date=today();
  const closedToday=orders.filter(o=>o.date===today_date&&o.status==="closed");
  const todayRevenue=closedToday.reduce((s,o)=>s+linesOf(orderLines,o.id)
    .reduce((s2,l)=>{const r=recipeById(recipes,l.recipeId);return s2+(r?r.price*l.qty:0);},0),0);
  const todayFoodCost=closedToday.reduce((s,o)=>s+linesOf(orderLines,o.id)
    .reduce((s2,l)=>s2+recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty,0),0);
  const todayPurchaseCost=purchases.filter(p=>p.date===today_date).reduce((s,p)=>s+(p.totalCost||0),0);
  const totalCostToday=todayFoodCost+todayPurchaseCost;
  const _dashSettings=getSettings(data);
  const todayNetRevenue=closedToday.reduce((s,o)=>{
    // Use snapshotted subtotal if available, else derive from gross
    if(o.subtotal!==undefined)return s+o.subtotal;
    const gross=linesOf(orderLines,o.id)
      .reduce((s2,l)=>{const r=recipeById(recipes,l.recipeId);return s2+(r?r.price*l.qty:0);},0)+(o.priceAdj||0);
    return s+netBase(gross,_dashSettings.igvMode);
  },0);
  const costPct=todayNetRevenue>0?todayFoodCost/todayNetRevenue:0;
  const totalPortions=closedToday.reduce((s,o)=>s+linesOf(orderLines,o.id).reduce((s2,l)=>s2+l.qty,0),0);
  const totalPaxToday=closedToday.reduce((s,o)=>s+(o.pax||0),0);
  const avgTicketPerPaxToday=totalPaxToday>0?todayRevenue/totalPaxToday:0;
  const critical=products.filter(p=>p.stock<p.minStock*0.4);
  const lowStock=products.filter(p=>p.stock>=p.minStock*0.4&&p.stock<p.minStock);
  const needsRecount=products.filter(p=>p.needsRecount);
  const pendingPurchases=purchases.filter(p=>p.status==="Pendiente");
  const todayWastage=(wastageLog||[]).filter(w=>w.date===today_date);
  const todayWastageCost2=todayWastage.reduce((s,w)=>s+(w.lostValue||0),0);
  const dishSales={};
  closedToday.forEach(o=>linesOf(orderLines,o.id).forEach(l=>{dishSales[l.recipeId]=(dishSales[l.recipeId]||0)+l.qty;}));
  // Per-recipe: cost % on net base
  const topDishes=recipes.map(r=>{
    const fc=recipeFoodCost(r.id,products,bom,subBom,subRecipes);
    const netP=netBase(r.price,_dashSettings.igvMode);
    const costPct=netP>0?fc/netP:0;
    const _fct=getFCT(data);
    const suggestedGross=fc>0?((_dashSettings.igvMode==="incluido"?Math.ceil((fc/_fct)*1.18*2)/2:Math.ceil((fc/_fct)*2)/2)):null;
    return{...r,sold:dishSales[r.id]||0,netP,margin:netP-fc,costPct,suggestedGross};
  }).sort((a,b)=>b.sold-a.sold).slice(0,3);
  // Pricing alerts — all recipes above (target+5pp) food cost (net)
  const pricingAlerts=recipes.map(r=>{
    const fc=recipeFoodCost(r.id,products,bom,subBom,subRecipes);
    const netP=netBase(r.price,_dashSettings.igvMode);
    const costPct=netP>0?fc/netP:0;
    const _fct2=getFCT(data);
    const suggestedGross=fc>0?((_dashSettings.igvMode==="incluido"?Math.ceil((fc/_fct2)*1.18*2)/2:Math.ceil((fc/_fct2)*2)/2)):null;
    return{...r,fc,netP,costPct,suggestedGross};
  }).filter(r=>r.fc>0&&r.costPct>getFCTCrit(data)).sort((a,b)=>b.costPct-a.costPct);
  const unavailable=recipes.filter(r=>!canMakeRecipe(r.id,1,products,bom,subBom,subRecipes));

  // ── Onboarding / setup checklist (owner only) ─────────────────────────────
  const isOwnerView=currentUser?.role==="owner";
  const missingBizFields=isOwnerView?(()=>{
    const miss=[];
    if(!_dashSettings.restaurantName)miss.push("Nombre del restaurante");
    if(!_dashSettings.ruc)miss.push("RUC");
    return miss;
  })():[];
  const demoStaffLeft=isOwnerView?(data.users||[]).filter(u=>{
    if(u.id==="U001")return false; // owner is handled by the mandatory FirstRunSetup flow
    const seed=DEMO_SEED_USERS[u.id];
    return !!(seed&&u.name===seed.name&&u.pin===seed.pin);
  }):[];
  const noProducts=isOwnerView&&(data.products||[]).length===0;
  const noRecipes=isOwnerView&&!noProducts&&(data.recipes||[]).length===0;

  // ── Cierre del día data ────────────────────────────────────────────────────
  const todayRecon=paymentRecons.find(pr=>pr.date===today_date);
  const todayWastageCost=(wastageLog||[]).filter(w=>w.date===today_date).reduce((s,w)=>s+(w.lostValue||0),0);
  const todayGrossMargin=todayNetRevenue-todayFoodCost;
  const todayGrossMarginPct=todayNetRevenue>0?todayGrossMargin/todayNetRevenue:0;
  const todayIgv=todayNetRevenue>0?todayRevenue-todayNetRevenue:0;
  const cashMatchStatus=!todayRecon?"pending"
    :Math.abs(todayRecon.yape+todayRecon.cash+todayRecon.card-todayRecon.easyTotal)<0.01?"ok"
    :"gap";
  const cashGap=todayRecon?(todayRecon.yape+todayRecon.cash+todayRecon.card-todayRecon.easyTotal):null;
  const showCierre=closedToday.length>0;

  // ── Derived UI data ────────────────────────────────────────────────────────
  const today_label=(()=>{const n=new Date();return n.toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});})();
  const greeting=(()=>{const h=new Date().getHours();return h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches";})();
  const roleInfo=ROLES[currentUser?.role]||ROLES.chef;
  const fct=getFCT(data);
  const hasDataToday=closedToday.length>0;
  const foodCostColor=costPct>getFCTCrit(data)?"var(--red)":costPct>fct?"var(--yellow)":"var(--green)";

  return h('div',{className:"slide-up",style:{paddingBottom:80}},

    // ── GREETING ──────────────────────────────────────────────────────────────
    h('div',{style:{marginBottom:16}},
      h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:2,textTransform:"capitalize"}},today_label),
      h('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},
        h('h1',{style:{fontFamily:"var(--sora)",fontSize:20,fontWeight:700,lineHeight:1.2}},
          greeting+", ",h('span',{style:{color:"var(--accent)"}},(currentUser?.name||"Chef").split(" ")[0])," ",roleInfo.icon
        ),
        // Quick date chip
        !hasDataToday&&h('div',{style:{
          background:"rgba(249,115,22,0.1)",border:"1px solid rgba(249,115,22,0.25)",
          borderRadius:20,padding:"4px 12px",fontSize:11,fontWeight:600,color:"var(--accent)"
        }},"Sin ventas hoy")
      )
    ),

    // ── ¿QUÉ HAGO HOY? (checklist accionable) ─────────────────────────────────
    h(TodayChecklist,{
      critical,lowStock,needsRecount,pendingPurchases,pricingAlerts,
      products,setPage
    }),

    // ── ALERT CENTER ──────────────────────────────────────────────────────────
    h(AlertCenter,{
      critical,lowStock,needsRecount,unavailable,pricingAlerts,
      pendingPurchases,todayWastage,todayWastageCost2,
      cashMatchStatus,cashGap,
      products,bom,subBom,subRecipes,
      igvMode:_dashSettings.igvMode,
      fct:getFCT(data),
      setPage,
      role:currentUser?.role,
      missingBizFields,demoStaffLeft,noRecipes,noProducts,
    }),

    // ── TODAY'S PERFORMANCE CARD ───────────────────────────────────────────────
    h('div',{style:{
      background:"var(--surface)",border:"1px solid var(--border2)",
      borderRadius:"var(--radius)",overflow:"hidden",marginBottom:16
    }},
      // Header row
      h('div',{style:{
        display:"flex",alignItems:"center",justifyContent:"space-between",
        padding:"12px 14px",background:"var(--surface2)",borderBottom:"1px solid var(--border)"
      }},
        h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700}},"Rendimiento de hoy"),
        hasDataToday
          ?h('div',{style:{display:"flex",alignItems:"center",gap:6}},
              h('span',{style:{fontSize:11,color:"var(--text3)"}},closedToday.length+" pedidos · "+totalPortions+" porciones"),
              h('div',{style:{width:8,height:8,borderRadius:"50%",background:"var(--green)"}})
            )
          :h('span',{style:{fontSize:11,color:"var(--text3)"}},
              h('span',{style:{fontSize:14,marginRight:4}},"💤"),"Sin pedidos cerrados aún"
            )
      ),

      // Main KPI row — 4 metrics. Mobile: 2×2 (roomy, bigger numbers).
      // Desktop: 4-up via .kpi-grid-desktop. Dividers come from the 1px grid
      // gap over a border-colored track, so both layouts get clean separators
      // with no per-cell border logic.
      h('div',{className:"kpi-grid-desktop",style:{display:"grid",gridTemplateColumns:"1fr 1fr",background:"var(--border)",gap:1}},
        [
          {
            label:"Ventas",
            value:fmtCost(todayRevenue),
            sub:_dashSettings.igvMode!=="ninguno"?"(bruto)":null,
            color:"var(--accent)",
            onClick:()=>setPage("salesrecon")
          },
          {
            label:"% Costo",
            value:hasDataToday?fmtPct(costPct):"—",
            sub:"obj <"+Math.round(fct*100)+"%",
            color:hasDataToday?foodCostColor:"var(--text3)",
            onClick:()=>setPage("recipes")
          },
          {
            label:"Margen",
            value:fmtCost(todayRevenue-todayFoodCost),
            sub:hasDataToday?fmtPct(1-costPct)+" mg":null,
            color:(todayRevenue-todayFoodCost)>=0?"var(--green)":"var(--red)",
            onClick:()=>setPage("reports")
          },
          {
            label:"Pedidos",
            value:String(closedToday.length),
            sub:totalPortions+" porc."+(totalPaxToday>0?" · "+totalPaxToday+"p":""),
            color:"var(--text)",
            onClick:()=>setPage("salesrecon")

        ].map((k,i)=>h('div',{key:k.label,

            padding:"13px 8px",textAlign:"center",cursor:"pointer",
            background:"var(--surface)",
            transition:"background .15s"
