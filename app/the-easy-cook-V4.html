      border:"1px dashed var(--accent)",background:"rgba(249,115,22,0.08)",
      color:"var(--accent)",fontFamily:"var(--sans)",fontSize:13,fontWeight:700
    }},"🧾 Armar lista de compra"),

    h('button',{onClick:openPaste,style:{
      width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,
      padding:"11px",marginBottom:12,borderRadius:"var(--radius)",cursor:"pointer",
      border:"1px dashed var(--accent)",background:"rgba(249,115,22,0.08)",
      color:"var(--accent)",fontFamily:"var(--sans)",fontSize:13,fontWeight:700
    }},"📋 Pegar lista de compra"),

    // Status filter tabs + date filter
    h('div',{style:{display:"flex",gap:6,marginBottom:8,overflowX:"auto",paddingBottom:2,alignItems:"center"}},
      ["all","Pendiente","Recibido","Cancelado"].map(s=>h('button',{key:s,onClick:()=>setFilter(s),style:{
        padding:"5px 13px",borderRadius:20,border:"1px solid",whiteSpace:"nowrap",
        fontFamily:"var(--sans)",fontSize:12,fontWeight:500,cursor:"pointer",
        borderColor:filter===s?"var(--accent)":"var(--border2)",
        background:filter===s?"rgba(249,115,22,0.15)":"transparent",
        color:filter===s?"var(--accent)":"var(--text2)"}},
        s==="all"?`Todas (${statusCounts.all})`:`${s} (${statusCounts[s]})`
      )),
      // Date filter toggle button
      h('button',{onClick:()=>setShowDateFilter(v=>!v),style:{
        marginLeft:"auto",flexShrink:0,padding:"5px 11px",borderRadius:20,border:"1px solid",
        fontFamily:"var(--sans)",fontSize:12,fontWeight:500,cursor:"pointer",whiteSpace:"nowrap",
        borderColor:activeDateFilter?"var(--accent)":"var(--border2)",
        background:activeDateFilter?"rgba(249,115,22,0.15)":"transparent",
        color:activeDateFilter?"var(--accent)":"var(--text2)"

// ─── SALES ────────────────────────────────────────────────────────────────────
// ─── DISH AVAILABILITY — kitchen "86" (sold out) + daily portion limit ───────
// soldOut is a manual kitchen flag. dailyLimit (+ limitDate) is a per-day cap
// that counts down as portions are ordered and resets when the day changes.
const _soldToday={orders:undefined,orderLines:undefined,day:undefined,map:new Map()};
function dishSoldToday(recipeId, orders, orderLines){
  const t=today(),c=_soldToday;
  if(c.orders!==orders||c.orderLines!==orderLines||c.day!==t){
    c.orders=orders;c.orderLines=orderLines;c.day=t;c.map=new Map();
    const ids=new Set((orders||[]).filter(o=>o.date===t).map(o=>o.id));
    (orderLines||[]).forEach(l=>{if(ids.has(l.orderId))c.map.set(l.recipeId,(c.map.get(l.recipeId)||0)+(+l.qty||0));});
  }
  return c.map.get(recipeId)||0;
}
function dishAvailability(r, orders, orderLines){
  const soldOut=!!(r&&r.soldOut);
  const limited=!!(r&&typeof r.dailyLimit==="number"&&r.limitDate===today());
  const sold=limited?dishSoldToday(r.id,orders,orderLines):0;
  const remaining=limited?Math.max(0,r.dailyLimit-sold):null;
  const blocked=soldOut||(limited&&remaining<=0);
  return {soldOut,limited,limit:limited?r.dailyLimit:null,sold,remaining,blocked};
}

function Sales({data,setData,toast,currentUser,notify=()=>{}}){
  const {orders=[],orderLines=[],recipes,products,bom,subBom=[],subRecipes=[]}=data;
  const [view,setView]=useState("list");
  const [selectedOrder,setSelectedOrder]=useState(null);
  const [newOrderModal,setNewOrderModal]=useState(false);
  const [addDishModal,setAddDishModal]=useState(false);
  const [editLineModal,setEditLineModal]=useState(false);
  const [newOrderForm,setNewOrderForm]=useState({});
  const [addDishForm,setAddDishForm]=useState({});
  const [editLineForm,setEditLineForm]=useState({});
  const [adjModal,setAdjModal]=useState(false);
  const [adjForm,setAdjForm]=useState({});
  const [filterDay,setFilterDay]=useState("all");
  const [filterMonth,setFilterMonth]=useState("all");
  const [filterYear,setFilterYear]=useState("all");
  const recipeCategories=data.recipeCategories||[];

  const orderLinesTotal=oid=>linesOf(orderLines,oid).reduce((s,l)=>{const r=recipeById(recipes,l.recipeId);return s+(r?r.price*l.qty:0);},0);
  const orderTotal=oid=>{const base=orderLinesTotal(oid);const ord=orders.find(o=>o.id===oid);return base+(ord?.priceAdj||0);};
  const orderCost=oid=>linesOf(orderLines,oid).reduce((s,l)=>s+recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty,0);
  const nextCode=()=>{const nums=orders.map(o=>parseInt(o.code.replace("#",""))||0);const max=nums.length?Math.max(...nums):0;return`#${String(max+1).padStart(3,"0")}`;};
  const dayGroups=()=>{
    const fil=orders.filter(o=>{const[y,m,d]=o.date.split("-");if(filterYear!=="all"&&y!==filterYear)return false;if(filterMonth!=="all"&&m!==filterMonth)return false;if(filterDay!=="all"&&d!==filterDay)return false;return true;});
    const sorted=[...fil].sort((a,b)=>b.date.localeCompare(a.date)||b.code.localeCompare(a.code));
    const groups={};sorted.forEach(o=>{if(!groups[o.date])groups[o.date]=[];groups[o.date].push(o);});return groups;
  };
  const allYears=[...new Set(orders.map(o=>o.date.split("-")[0]))].sort((a,b)=>b.localeCompare(a));
  const allMonths=[...new Set(orders.map(o=>o.date.split("-")[1]))].sort();
  const allDays=[...new Set(orders.map(o=>o.date.split("-")[2]))].sort();
  const MONTHS=["","Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

  const createOrder=()=>{
    if(!newOrderForm.tableNum)return;
    const o={id:"ORD"+uid(),code:nextCode(),tableNum:+newOrderForm.tableNum,pax:+newOrderForm.pax||0,date:newOrderForm.date||today(),waiter:newOrderForm.waiter||"",status:"open"};
    setData(d=>({...d,orders:[...d.orders,o]}));setNewOrderModal(false);setSelectedOrder(o);setView("detail");
    toast(`Pedido ${o.code} creado — Mesa ${o.tableNum}`,"success");
  };
  const [paxModal,setPaxModal]=useState(false);
  const [paxForm,setPaxForm]=useState({});
  const savePax=(ord)=>{
    const pax=Math.max(0,+paxForm.pax||0);
    setData(d=>({...d,orders:d.orders.map(o=>o.id===ord.id?{...o,pax}:o)}));
    setSelectedOrder(prev=>({...prev,pax}));
    setPaxModal(false);
    toast("Número de personas actualizado","success");
  };
  const [confirmNoStockModal,setConfirmNoStockModal]=useState(false);
  const doAddDishLine=(wasOverride=false)=>{
    const line={id:"OL"+uid(),orderId:selectedOrder.id,recipeId:addDishForm.recipeId,qty:+addDishForm.qty,note:addDishForm.note||""};
    // Detect an AUTOMATIC sold-out: this line pushes the dish to its daily limit.
    const rec=data.recipes.find(r=>r.id===addDishForm.recipeId);
    let crossedLimit=false;
    if(rec&&typeof rec.dailyLimit==="number"&&rec.limitDate===today()){
      const before=dishAvailability(rec,data.orders,data.orderLines);
      const after=dishAvailability(rec,data.orders,[...data.orderLines,line]);
      crossedLimit=before.remaining>0&&after.remaining<=0;
    }
    setData(d=>{
      let prods=d.products;
      if(wasOverride){
        // Flag the specific ingredients that were short so they surface in
        // the Alert Center as "needs recount" — the theoretical stock said
        // no, but someone confirmed it anyway, so real vs. system stock may
        // have drifted apart.
        const miss=getMissingIngredients(addDishForm.recipeId,+addDishForm.qty,d.products,d.bom,d.subBom,d.subRecipes);
        const missIds=new Set(miss.map(m=>m.productId));
        prods=d.products.map(p=>missIds.has(p.id)?{...p,needsRecount:true}:p);
      }
      return{...d,products:prods,orderLines:[...d.orderLines,line]};
    });
    setAddDishModal(false);setConfirmNoStockModal(false);setAddDishForm({});
    toast(wasOverride?"Plato agregado · insumos marcados para recontar":"Plato agregado","success");
    if(crossedLimit&&rec) notify("out_of_stock",`se agotó el límite de hoy de "${rec.name}"`);
  };
  const addDish=()=>{
    if(!addDishForm.recipeId||!addDishForm.qty)return;
    const _r=recipes.find(x=>x.id===addDishForm.recipeId);
    const _av=dishAvailability(_r,orders,orderLines);
    const _noStock=!canMakeRecipe(addDishForm.recipeId,+addDishForm.qty,products,bom,subBom,subRecipes);
    if(_av.blocked||_noStock){ setConfirmNoStockModal(true); return; }
    doAddDishLine(false);
  };
  const saveEditLine=()=>{
    if(!editLineForm.qty||+editLineForm.qty<1)return;
    setData(d=>({...d,orderLines:d.orderLines.map(l=>l.id===editLineForm.id?{...l,qty:+editLineForm.qty,note:editLineForm.note||""}:l)}));
    setEditLineModal(false);toast("Línea actualizada","success");
  };
  const deleteLine=lid=>{setData(d=>({...d,orderLines:d.orderLines.filter(l=>l.id!==lid)}));toast("Plato eliminado","info");};
  const closeOrder=ord=>{
    setData(d=>{
      let prods=[...d.products];
      let subs=[...(d.subRecipes||[])];
      d.orderLines.filter(l=>l.orderId===ord.id).forEach(line=>{
        const bomLines=d.bom.filter(b=>b.recipeId===line.recipeId);
        bomLines.forEach(b=>{
          if(b.type==="subrecipe"&&b.subRecipeId){
            // Deduct the full amount needed from the sub-recipe's own stock.
            // Allowed to go negative — that's the signal that real stock and
            // theoretical stock have drifted apart (see needsRecount below).
            const needed=b.qty*line.qty;
            subs=subs.map(s=>s.id===b.subRecipeId?{...s,stock:(s.stock||0)-needed}:s);
          } else if(b.productId){
            prods=prods.map(p=>p.id===b.productId?{...p,stock:(p.stock||0)-b.qty*line.qty}:p);
          }
        });
      });
      const settings=getSettings(d);
      const baseTotal=d.orderLines.filter(l=>l.orderId===ord.id)
        .reduce((s,l)=>{const r=(d.recipes||[]).find(r=>r.id===l.recipeId);return s+(r?r.price*l.qty:0);},0)
        +(ord.priceAdj||0);
      const breakdown=orderGrossTotal(baseTotal,settings);
      const closedOrder={...ord,status:"closed",
        subtotal:breakdown.net,
        igvAmount:breakdown.igv,
        serviceAmount:breakdown.service,
        total:breakdown.total,
        igvMode:settings.igvMode,
        serviceCharge:settings.serviceCharge,
        serviceChargePct:settings.serviceChargePct||10,
      };
      return{...d,products:prods,subRecipes:subs,orders:d.orders.map(o=>o.id===ord.id?closedOrder:o)};
    });
    setSelectedOrder({...ord,status:"closed"});toast(`Pedido ${ord.code} cerrado · Stock descontado`,"success");
  };
  const reopenOrder=ord=>{
    setData(d=>{
      let prods=[...d.products];
      let subs=[...(d.subRecipes||[])];
      d.orderLines.filter(l=>l.orderId===ord.id).forEach(line=>{
        const bomLines=d.bom.filter(b=>b.recipeId===line.recipeId);
        bomLines.forEach(b=>{
          if(b.type==="subrecipe"&&b.subRecipeId){
            subs=subs.map(s=>s.id===b.subRecipeId?{...s,stock:(s.stock||0)+b.qty*line.qty}:s);
          } else if(b.productId){
            prods=prods.map(p=>p.id===b.productId?{...p,stock:p.stock+b.qty*line.qty}:p);
          }
        });
      });
      return{...d,products:prods,subRecipes:subs,orders:d.orders.map(o=>o.id===ord.id?{...o,status:"open"}:o)};
    });
    setSelectedOrder({...ord,status:"open"});toast(`Pedido ${ord.code} reabierto`,"info");
  };
  const deleteOrder=ord=>{
    if(ord.status==="closed")reopenOrder(ord);
    setData(d=>({...d,orders:d.orders.filter(o=>o.id!==ord.id),orderLines:d.orderLines.filter(l=>l.orderId!==ord.id)}));
    setView("list");toast(`Pedido ${ord.code} eliminado`,"info");
    notify("delete",`anuló el pedido ${ord.code}`);
  };
  const saveAdj=(ord)=>{
    const amount=+adjForm.amount||0;
    const type=adjForm.type||"discount";
    const finalAdj=type==="discount"?-Math.abs(amount):Math.abs(amount);
    const patch={priceAdj:finalAdj,adjNote:adjForm.note||"",adjType:type,
      adjPct:(type==="discount"&&adjForm.pct)?adjForm.pct:null,adjBy:currentUser?.name||"",adjAt:today()};
    setData(d=>({...d,orders:d.orders.map(o=>o.id===ord.id?{...o,...patch}:o)}));
    setSelectedOrder(prev=>({...prev,...patch}));
    setAdjModal(false);
    toast(`Ajuste de ${type==="discount"?"descuento":"cargo"} aplicado: ${fmtCost(Math.abs(amount))}`,"success");
  };
  const removeAdj=(ord)=>{
    setData(d=>({...d,orders:d.orders.map(o=>o.id===ord.id?{...o,priceAdj:0,adjNote:"",adjType:""}:o)}));
    setSelectedOrder(prev=>({...prev,priceAdj:0,adjNote:"",adjType:""}));
    toast("Ajuste eliminado","info");
  };

  if(view==="detail"&&selectedOrder){
    const ord=orders.find(o=>o.id===selectedOrder.id)||selectedOrder;
    const lines=linesOf(orderLines,ord.id);
    const isOpen=ord.status==="open";
    const linesBase=orderLinesTotal(ord.id);
    const baseTotal=linesBase+(ord.priceAdj||0);
    const settings=getSettings(data);
    const taxBreakdown=(!isOpen&&ord.igvAmount!==undefined)
      ?{net:ord.subtotal,igv:ord.igvAmount,service:ord.serviceAmount||0,total:ord.total||baseTotal}
      :orderGrossTotal(baseTotal,settings);
    const total=taxBreakdown.total;
    const cost=orderCost(ord.id);const cp=total>0?cost/total:0;
    return h('div',{className:"slide-up"},
      h('button',{onClick:()=>setView("list"),style:{background:"none",border:"none",color:"var(--text2)",fontSize:14,display:"flex",alignItems:"center",gap:6,marginBottom:16,padding:0}},"‹ Todos los pedidos"),
      h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}},
        h('div',null,
          h('div',{style:{display:"flex",alignItems:"center",gap:8,marginBottom:4}},
            h('h2',{style:{fontFamily:"var(--sora)",fontSize:22,fontWeight:700}},`Pedido ${ord.code}`),
            h(Badge,{color:isOpen?"yellow":"green"},isOpen?"Abierto":"Cerrado")
          ),
          h('div',{style:{fontSize:13,color:"var(--text2)",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}},
            `Mesa ${ord.tableNum} · ${fmtDate(ord.date)}${ord.waiter?" · "+ord.waiter:""} · `,
            h('span',null,`${ord.pax||0} persona${ord.pax===1?"":"s"}`),

          )

// ─── PRODUCCION TAB ──────────────────────────────────────────────────────────
function ProduccionTab({data,setData,toast}){
  const {products,subRecipes=[],subBom=[],productionLog=[]}=data;
  const [form,setForm]=useState({subRecipeId:"",actualYield:"",date:today(),note:""});
  const [saved,setSaved]=useState(false);

  const sr=subRecipes.find(s=>s.id===form.subRecipeId);
  const yieldQty=+form.actualYield||0;
  // Scale factor: how much of "one batch" this actual yield represents.
  // This lets the user enter what they really got (which varies batch to
  // batch) instead of forcing them to do the math themselves.
  const scale=sr&&sr.batchYield>0?yieldQty/sr.batchYield:0;

  // Ingredient consumption preview — scaled proportionally to the real yield
  const consumption=sr?subBom.filter(b=>b.subRecipeId===sr.id).map(b=>{
    const p=products.find(p=>p.id===b.productId);
    const needed=b.qty*scale;
    const available=p?.stock||0;
    const ok=available>=needed;
    return{p,b,needed,available,ok};
  }):[];
  const canProduce=sr&&yieldQty>0&&consumption.every(c=>c.ok);

  const register=()=>{
    if(!sr||yieldQty<=0){toast("Selecciona una sub-receta e ingresa cuánto produjiste","error");return;}
    if(!canProduce){toast("Stock insuficiente para producir","error");return;}
    const ingredientsUsed=consumption.map(c=>({productId:c.p.id,qty:c.needed,unit:c.b.unit}));
    const batchesEquiv=Math.round(scale*100)/100;
    setData(d=>{
      // Deduct ingredients from product stock
      const updatedProducts=d.products.map(p=>{
        const used=ingredientsUsed.find(i=>i.productId===p.id);
        return used?{...p,stock:Math.max(0,p.stock-used.qty)}:p;
      });
      // Add the real yield to subrecipe stock (exactly what was produced)
      const updatedSubRecipes=d.subRecipes.map(s=>
        s.id===sr.id?{...s,stock:(s.stock||0)+yieldQty}:s
      );
      const entry={id:"PL"+uid(),date:form.date||today(),subRecipeId:sr.id,subRecipeName:sr.name,
        batches:batchesEquiv,yieldQty,yieldUnit:sr.yieldUnit,ingredientsUsed,note:form.note||""};
      return{...d,products:updatedProducts,subRecipes:updatedSubRecipes,
        productionLog:[...d.productionLog,entry]};
    });
    toast(`✓ Producción de ${sr.name} registrada — +${yieldQty} ${sr.yieldUnit}`);
    setSaved(true);
    setForm({subRecipeId:"",actualYield:"",date:today(),note:""});
    setTimeout(()=>setSaved(false),3000);
  };

  return h('div',{className:"slide-up"},
    // Explainer
    h('div',{style:{background:"rgba(168,85,247,0.08)",border:"1px solid rgba(168,85,247,0.2)",borderRadius:"var(--radius-sm)",padding:"10px 12px",marginBottom:14,fontSize:12,color:"var(--text2)"}},
      "👨‍🍳 Registra la producción diaria de sub-recetas. Ingresa cuánto rendimiento obtuviste realmente — nosotros calculamos hacia atrás cuánto se consumió de cada ingrediente, aunque el rendimiento no haya sido exacto."
    ),

    // Form card
    h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px",marginBottom:14}},
      h('div',{style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:600,marginBottom:12}},"Nueva producción"),
      h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}},
        h(FormRow,{label:"Fecha"},
          h('input',{type:"date",value:form.date,onChange:e=>setForm({...form,date:e.target.value})})
        ),
        h(FormRow,{label:"Sub-receta"},
          h(PickerField,{
            value:form.subRecipeId||"",onChange:v=>setForm({...form,subRecipeId:v,actualYield:""}),
            searchPlaceholder:"Buscar sub-receta...",emptyText:"Ninguna sub-receta con ese nombre",
            options:subRecipes.map(s=>({value:s.id,label:s.name,sub:s.yieldUnit?("rinde "+s.batchYield+" "+s.yieldUnit):""}))})
          
        )
      ),
      sr&&h('div',{style:{background:"rgba(168,85,247,0.08)",border:"1px solid rgba(168,85,247,0.2)",borderRadius:"var(--radius-sm)",padding:"8px 12px",marginBottom:10,fontSize:12}},
        h('span',{style:{color:"var(--text2)"}},"Rinde "),
        h('strong',null,sr.batchYield+" "+sr.yieldUnit),
        h('span',{style:{color:"var(--text2)"}}," por batch (teórico) · Stock actual: "),
        h('strong',{style:{color:"var(--accent)"}},(sr.stock||0).toFixed(2)+" "+sr.yieldUnit)
      ),
      h(FormRow,{label:`¿Cuánto rendimiento obtuviste?${sr?" ("+sr.yieldUnit+")":""}`},
        h('input',{type:"number",min:"0",step:"0.05",value:form.actualYield,
          onChange:e=>setForm({...form,actualYield:e.target.value}),placeholder:sr?"ej. "+sr.batchYield:"ej. 1.6"})
      ),
      sr&&yieldQty>0&&h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:-4,marginBottom:10}},
        "≈ "+scale.toFixed(2)+" batch"+(scale!==1?"es":"")+" según el rendimiento teórico de esta sub-receta"
      ),
      yieldQty>0&&sr&&h('div',{style:{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"10px 12px",marginBottom:10}},
        h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
          h('span',{style:{fontSize:12,fontWeight:600,color:"var(--text2)"}},"Ingredientes que se consumieron"),
          h('span',{style:{fontSize:13,fontWeight:700,color:canProduce?"var(--green)":"var(--red)"}},"→ "+yieldQty+" "+sr.yieldUnit)
        ),
        h('div',{style:{display:"flex",flexDirection:"column",gap:5}},
          consumption.map(c=>h('div',{key:c.p?.id,style:{
            display:"flex",justifyContent:"space-between",alignItems:"center",
            padding:"5px 8px",borderRadius:6,
            background:c.ok?"rgba(34,197,94,0.06)":"rgba(239,68,68,0.08)",
            border:`1px solid ${c.ok?"rgba(34,197,94,0.2)":"rgba(239,68,68,0.25)"}`
          }},
            h('span',{style:{fontSize:12,fontWeight:500}},c.p?.name||c.b.productId),
            h('div',{style:{textAlign:"right"}},
              h('div',{style:{fontSize:12,fontWeight:600,color:c.ok?"var(--text)":"var(--red)"}},c.needed.toFixed(2)+" "+c.b.unit),
              h('div',{style:{fontSize:10,color:c.ok?"var(--green)":"var(--red)"}},
                c.ok?"✓ disponible ("+c.available.toFixed(2)+")":"⚠ solo "+c.available.toFixed(2)+" disponible")
            )
          ))
        )
      ),
      h(FormRow,{label:"Nota (opcional)"},
        h('input',{value:form.note,onChange:e=>setForm({...form,note:e.target.value}),placeholder:"ej. batch de tarde, rindió menos de lo usual..."})
      ),
      h(Btn,{onClick:register,size:"lg",style:{width:"100%"},disabled:!canProduce},
        canProduce?`Registrar producción → +${yieldQty} ${sr?.yieldUnit||""}`:
        !sr?"Selecciona una sub-receta":yieldQty<=0?"Ingresa cuánto produjiste":"⚠ Stock insuficiente")
    ),

    // Sub-recipe stock overview
    h('div',{style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:600,marginBottom:10}},"Stock de sub-recetas"),
    h('div',{style:{display:"flex",flexDirection:"column",gap:8,marginBottom:20}},
      subRecipes.length===0
        ?h('div',{style:{fontSize:12,color:"var(--text3)",textAlign:"center",padding:"20px"}},"Sin sub-recetas creadas aún.")
        :subRecipes.map(s=>h('div',{key:s.id,style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h('div',null,
            h('div',{style:{fontSize:13,fontWeight:600}},s.name),
            h('div',{style:{fontSize:11,color:"var(--text3)"}},s.category+" · batch: "+s.batchYield+" "+s.yieldUnit)
          ),
          h('div',{style:{textAlign:"right"}},
            h('div',{style:{fontFamily:"var(--sora)",fontSize:16,fontWeight:700,color:(s.stock||0)>0?"var(--green)":"var(--text3)"}},(s.stock||0).toFixed(2)),
            h('div',{style:{fontSize:11,color:"var(--text3)"}},s.yieldUnit+" disponible")
          )
        ))
    ),

    // Production log
    productionLog.length>0&&h('div',null,
      h('div',{style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:600,marginBottom:10}},"Historial de producción"),
      h('div',{style:{display:"flex",flexDirection:"column",gap:6}},
        [...productionLog].reverse().slice(0,10).map(e=>h('div',{key:e.id,style:{
          background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"10px 14px"
        }},
          h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
            h('div',null,
              h('div',{style:{fontSize:13,fontWeight:600}},e.subRecipeName),
              h('div',{style:{fontSize:11,color:"var(--text3)"}},fmtDate(e.date)+" · ≈"+e.batches+" batch"+(e.batches!==1?"es":"")+(e.note?" · "+e.note:""))
            ),
            h(Badge,{color:"purple"},"+"+e.yieldQty+" "+e.yieldUnit)
          )
        ))
      )
    )
  );
}

// ─── COUNT HISTORIAL COMPONENT ───────────────────────────────────────────────
function CountHistorial({stockCounts,products,subRecipes=[],expandedCount,setExpandedCount,tolerancePct}){
  const findItem=(id,type)=>type==="subrecipes"?subRecipes.find(s=>s.id===id):products.find(p=>p.id===id);
  const getUnit=(id,type)=>{const it=findItem(id,type);return type==="subrecipes"?it?.yieldUnit:it?.unit;};
  if(!stockCounts.length) return h('div',{style:{textAlign:"center",padding:"40px 20px",color:"var(--text3)"}},
    h('div',{style:{fontSize:32,marginBottom:12}},"📋"),
    h('div',{style:{fontSize:14,fontWeight:600,marginBottom:6}},"Sin conteos guardados"),
    h('div',{style:{fontSize:12}},"Ve a Nuevo conteo para registrar tu primer conteo físico.")
  );
  const sorted=[...stockCounts].reverse();
  return h('div',{className:"slide-up"},
    h('div',{style:{fontSize:12,color:"var(--text3)",marginBottom:10,textAlign:"right"}},sorted.length+" conteo"+(sorted.length!==1?"s":"")+" guardado"+(sorted.length!==1?"s":"")),
    h('div',{style:{display:"flex",flexDirection:"column",gap:10}},
      sorted.map(sc=>{
        const isOpen=expandedCount===sc.id;
        const outOfTol=sc.entries.filter(e=>!e.withinTolerance&&Math.abs(e.openingStock-e.physicalQty)>0.001).length;
        const withinTol=sc.entries.filter(e=>e.withinTolerance||Math.abs(e.openingStock-e.physicalQty)<=0.001).length;
        const total=sc.entries.length;
        const pct=total>0?Math.round(withinTol/total*100):100;
        return h('div',{key:sc.id,style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)"}},
          // Summary row (always visible)
          h('div',{onClick:()=>setExpandedCount(isOpen?null:sc.id),style:{padding:"12px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:12}},
            h('div',{style:{width:40,height:40,borderRadius:10,background:outOfTol===0?"rgba(34,197,94,0.12)":outOfTol<=2?"rgba(249,115,22,0.12)":"rgba(239,68,68,0.12)",
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}},
              outOfTol===0?"✅":outOfTol<=2?"⚠️":"🔴"
            ),
            h('div',{style:{flex:1}},
              h('div',{style:{fontSize:14,fontWeight:600,marginBottom:2}},sc.date),
              h('div',{style:{display:"flex",gap:6,flexWrap:"wrap"}},
                h(Badge,{color:"gray"},total+" productos"),
                withinTol>0&&h(Badge,{color:"green"},withinTol+" ✓ en margen"),
                outOfTol>0&&h(Badge,{color:"red"},outOfTol+" fuera")
              )
            ),
            // Mini donut-style progress bar
            h('div',{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:2,marginRight:8}},
              h('div',{style:{fontSize:13,fontWeight:700,color:pct===100?"var(--green)":pct>=80?"var(--yellow)":"var(--red)"}},(pct)+"%"),
              h('div',{style:{fontSize:10,color:"var(--text3)"}},"en rango")
            ),
            h('span',{style:{color:"var(--text3)",fontSize:14,transform:isOpen?"rotate(90deg)":"none",display:"inline-block",transition:"transform .2s"}},"›")
          ),
          // Expanded detail
          isOpen&&h('div',{style:{borderTop:"1px solid var(--border)",padding:"10px 14px"}},
            // Header row
            h('div',{style:{display:"grid",gridTemplateColumns:"1fr 70px 70px 80px",gap:6,
              fontSize:10,fontWeight:600,color:"var(--text3)",paddingBottom:6,borderBottom:"1px solid var(--border)",marginBottom:4}},
              h('span',null,"INGREDIENTE"),h('span',{style:{textAlign:"right"}},"TEÓRICO"),h('span',{style:{textAlign:"right"}},"FÍSICO"),h('span',{style:{textAlign:"right"}},"VARIANZA")
            ),
            sc.entries.map(e=>{
              const p=findItem(e.productId,e.itemType);
              const varQty=e.openingStock-e.physicalQty;
              const varPct=e.openingStock>0?Math.abs(varQty)/e.openingStock*100:0;
              const isOk=e.withinTolerance||Math.abs(varQty)<=0.001;
              const isShort=varQty>0;
              const rowColor=isOk?"var(--text2)":isShort?"var(--red)":"var(--blue)";
              return h('div',{key:e.productId,style:{
                display:"grid",gridTemplateColumns:"1fr 70px 70px 80px",gap:6,
                padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.04)",
                fontSize:12
              }},
                h('div',null,
                  h('span',{style:{fontWeight:500}},p?p.name:e.productId),
                  e.itemType==="subrecipes"&&h(Badge,{color:"purple"},"sub-receta"),
                  isOk
                    ?h('span',{style:{marginLeft:5,fontSize:10,color:"var(--green)"}},Math.abs(varQty)<0.001?"✓":"≈")
                    :h('span',{style:{marginLeft:5,fontSize:10,color:rowColor}},(sc.tolerancePct||tolerancePct)+"%lím")
                ),
                h('span',{style:{textAlign:"right",color:"var(--text2)"}},e.openingStock.toFixed(2)),
                h('span',{style:{textAlign:"right",color:"var(--text2)"}},e.physicalQty.toFixed(2)),
                h('span',{style:{textAlign:"right",fontWeight:600,color:rowColor}},
                  Math.abs(varQty)<0.001?"—":(isShort?"−":"+")+Math.abs(varQty).toFixed(2)+" ("+varPct.toFixed(1)+"%)"
                )
              );
            })
          )
        );
      })
    )
  );
}

// ─── COUNT ANALYSIS COMPONENT ─────────────────────────────────────────────────
function CountAnalysis({productStats,drillProduct,setDrillProduct,tolerancePct,subRecipes=[]}){
  const [typeFilter,setTypeFilter]=useState("all"); // "all"|"ingredients"|"subrecipes"
  const filtered=typeFilter==="all"?productStats:typeFilter==="subrecipes"?productStats.filter(s=>s.p._isSub):productStats.filter(s=>!s.p._isSub);
  if(!productStats.length) return h('div',{style:{textAlign:"center",padding:"40px 20px",color:"var(--text3)"}},
    h('div',{style:{fontSize:32,marginBottom:12}},"📊"),
    h('div',{style:{fontSize:14,fontWeight:600,marginBottom:6}},"Sin datos de análisis"),
    h('div',{style:{fontSize:12}},"Guarda al menos un conteo para ver el análisis de ingredientes.")
  );

  // Drill-down: timeline for one product
  if(drillProduct){
    const s=productStats.find(s=>s.p.id===drillProduct);
    if(!s)return null;
    const maxPct=Math.max(...s.timeline.map(t=>t.varPct),s.timeline[0]?.tol||5,10);
    const [drillRef,W]=useChartWidth(320);
    const H=120,padL=30,padB=20,padT=10,padR=10;
    const innerW=W-padL-padR,innerH=H-padB-padT;
    const xScale=i=>padL+i*(innerW/(Math.max(s.timeline.length-1,1)));
    const yScale=v=>padT+innerH-(v/maxPct)*innerH;
    const tolY=yScale(s.timeline[0]?.tol||tolerancePct);
    const points=s.timeline.map((t,i)=>xScale(i)+","+yScale(t.varPct)).join(" ");
    return h('div',{className:"slide-up"},
      h('button',{onClick:()=>setDrillProduct(null),style:{background:"none",border:"none",color:"var(--accent)",fontSize:13,cursor:"pointer",padding:"0 0 12px",display:"flex",alignItems:"center",gap:5}},
        "‹ Volver al análisis"
      ),
      h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px"}},
        h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}},
          h('div',null,
            h('div',{style:{fontSize:15,fontWeight:700}},s.p.name),
            h('div',{style:{fontSize:11,color:"var(--text3)"}},s.p.category+" · "+s.p.unit)
          ),
          h(Badge,{color:s.freqPct>66?"red":s.freqPct>33?"yellow":"green"},
            Math.round(s.freqPct)+"% fuera")
        ),
        // SVG line chart
        h('div',{ref:drillRef,style:{marginTop:12,marginBottom:8,width:"100%"}},
          h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",display:"block"}},

              h('line',{key:v,x1:padL,y1:yScale(v),x2:W-padR,y2:yScale(v),stroke:"rgba(255,255,255,0.06)",strokeWidth:1})
            ),
            // Y axis labels
            [0,Math.round(maxPct/2),Math.round(maxPct)].map(v=>
              h('text',{key:v,x:padL-3,y:yScale(v)+4,textAnchor:"end",fontSize:8,fill:"var(--text3)"},v+"%")
            ),
            // Tolerance band fill
            h('rect',{x:padL,y:padT,width:innerW,height:yScale(0)-yScale(s.timeline[0]?.tol||tolerancePct),fill:"rgba(34,197,94,0.07)"}),
            // Tolerance line
            h('line',{x1:padL,y1:tolY,x2:W-padR,y2:tolY,stroke:"rgba(34,197,94,0.5)",strokeWidth:1,strokeDasharray:"4,3"}),
            h('text',{x:W-padR-2,y:tolY-3,textAnchor:"end",fontSize:8,fill:"rgba(34,197,94,0.8)"},(s.timeline[0]?.tol||tolerancePct)+"% lím."),
            // Line

              stroke:"var(--surface)",strokeWidth:2})),
            // X axis dates
            s.timeline.map((t,i)=>(i===0||i===s.timeline.length-1||s.timeline.length<=5)&&
              h('text',{key:i,x:xScale(i),y:H-4,textAnchor:"middle",fontSize:8,fill:"var(--text3)"},
                t.date.slice(5)))

        ),
        // Stats row
        h('div',{style:{display:"flex",gap:8,marginBottom:12}},
          [{label:"Conteos",val:s.total},{label:"Fuera de margen",val:s.outOfTol},{label:"Var. promedio",val:s.avgVarPct.toFixed(1)+"%"}]
            .map(x=>h('div',{key:x.label,style:{flex:1,background:"var(--surface2)",borderRadius:"var(--radius-sm)",padding:"8px",textAlign:"center",border:"1px solid var(--border)"}},

        h('div',{style:{background:"rgba(249,115,22,0.08)",border:"1px solid rgba(249,115,22,0.2)",borderRadius:"var(--radius-sm)",padding:"10px 12px",fontSize:12,color:"var(--text2)",lineHeight:1.6}},
          "💡 ",
          s.freqPct===0
            ?"Este ingrediente siempre está dentro del margen. Sin acción requerida."
            :s.freqPct<=33
              ?`Varianzas ocasionales (${s.outOfTol} de ${s.total} conteos). Monitorear pero no es crítico.`
              :s.freqPct<=66

        )

  // ── Main ranking view ───────────────────────────────────────────────────────

// ─── STOCK COUNT (legacy standalone - kept for data compat) ────────────────────
function StockCount({data,setData,toast}){
  const {products,purchases=[],orders=[],orderLines=[],bom=[],subBom=[],subRecipes=[],stockCounts=[]}=data;
  const [tab,setTab]=useState("ledger"); // ledger | count
  const [countDate,setCountDate]=useState(today());
  const [physicals,setPhysicals]=useState({});   // productId -> string
  const [saved,setSaved]=useState(false);
  const [search,setSearch]=useState("");

  // ── Theoretical ledger ─────────────────────────────────────────────────────
  // For each product: opening stock = product.stock (baseline set at seed/import)
  // + all received purchases
  // - all BOM consumption from closed orders
  function theoreticalStock(productId){
    const p=products.find(x=>x.id===productId);
    if(!p)return 0;
    const purchasedQty=purchases.filter(pu=>pu.productId===productId&&pu.status==="Recibido")
      .reduce((s,pu)=>s+(pu.qty||0),0);
    // Initial stock is the seed baseline; purchases were already added to p.stock in the Purchases module
    // So theoretical = p.stock (current live stock tracked by app) — this IS the theoretical value
    return p.stock;
  }

  // Ledger rows: opening + purchases - sales movements per product
  function ledgerRows(productId){
    const p=products.find(x=>x.id===productId);
    if(!p)return[];
    const rows=[];
    let running=0;
    // Seed opening
    const seedStock=p.stock
      +purchases.filter(pu=>pu.productId===productId&&pu.status==="Recibido").reduce((s,pu)=>s-(pu.qty||0),0)
      +orders.filter(o=>o.status==="closed").reduce((s,o)=>{
        const bomLine=bom.find(b=>b.recipeId&&orderLines.find(l=>l.orderId===o.id&&l.recipeId===b.recipeId)&&b.productId===productId);
        if(!bomLine)return s;
        const qty=linesOf(orderLines,o.id).reduce((ss,l)=>{const bl=bom.find(b=>b.recipeId===l.recipeId&&b.productId===productId);return ss+(bl?bl.qty*l.qty:0);},0);
        return s+qty;
      },0);
    running=seedStock;
    rows.push({type:"Apertura",label:"Stock inicial",qty:seedStock,running,date:""});
    // Purchases
    purchases.filter(pu=>pu.productId===productId&&pu.status==="Recibido")
      .sort((a,b)=>a.date.localeCompare(b.date))
      .forEach(pu=>{
        running+=pu.qty||0;
        rows.push({type:"Compra",label:`Compra ${pu.id}`,qty:+(pu.qty||0),running,date:pu.date,cost:pu.totalCost});
      });
    // Sales consumption
    orders.filter(o=>o.status==="closed").sort((a,b)=>a.date.localeCompare(b.date)).forEach(o=>{
      const consumed=linesOf(orderLines,o.id).reduce((s,l)=>{const bl=bom.find(b=>b.recipeId===l.recipeId&&b.productId===productId);return s+(bl?bl.qty*l.qty:0);},0);
      if(consumed>0){
        running-=consumed;
        rows.push({type:"Venta",label:`Pedido ${o.code}`,qty:-consumed,running,date:o.date});
      }
    });
    return rows;
  }

  const filteredProducts=products.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));

  // ── Physical count ──────────────────────────────────────────────────────────
  const handlePhysical=(pid,val)=>{setPhysicals(prev=>({...prev,[pid]:val}));setSaved(false);};
  const saveCount=()=>{
    const entries=products.map(p=>({
      productId:p.id,
      openingStock:p.stock,
      physicalQty:physicals[p.id]!==undefined&&physicals[p.id]!==""?+physicals[p.id]:null,
    })).filter(e=>e.physicalQty!==null);
    if(!entries.length){toast("Ingresa al menos un conteo físico","error");return;}
    const id="SC"+uid();
    setData(d=>({...d,stockCounts:[...d.stockCounts,{id,date:countDate,entries,note:""}]}));
    setSaved(true);
    toast("Conteo físico guardado ✓");
  };

  const tabStyle=(t)=>({
    padding:"8px 18px",borderRadius:"var(--radius-sm)",border:"none",
    fontFamily:"var(--sans)",fontSize:13,fontWeight:600,cursor:"pointer",
    background:tab===t?"var(--accent)":"var(--surface2)",
    color:tab===t?"#fff":"var(--text2)",transition:"all .15s"
  });

  return h('div',{className:"slide-up"},
    // Tab switcher
    h('div',{style:{display:"flex",gap:8,marginBottom:16}},
      h('button',{style:tabStyle("ledger"),onClick:()=>setTab("ledger")},"📒 Libro Teórico"),
      h('button',{style:tabStyle("count"),onClick:()=>setTab("count")},"📋 Conteo Físico")
    ),

    tab==="ledger"&&h('div',null,
      h('div',{style:{background:"rgba(59,130,246,0.08)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:"var(--radius-sm)",padding:"10px 12px",marginBottom:14,fontSize:12,color:"var(--text2)"}},
        "📊 El stock teórico = Stock apertura + Compras recibidas − Consumo de pedidos cerrados."
      ),
      h('input',{value:search,onChange:e=>setSearch(e.target.value),placeholder:"Buscar ingrediente...",style:{marginBottom:12}}),
      h('div',{style:{display:"flex",flexDirection:"column",gap:10}},
        filteredProducts.map(p=>{
          const theo=theoreticalStock(p.id);
          const rows=ledgerRows(p.id);
          return h(LedgerProductCard,{key:p.id,p,theo,rows,avgCost:p.avgCost});
        })
      )
    ),

    tab==="count"&&h('div',null,
      h('div',{style:{background:"rgba(249,115,22,0.08)",border:"1px solid rgba(249,115,22,0.2)",borderRadius:"var(--radius-sm)",padding:"10px 12px",marginBottom:14,fontSize:12,color:"var(--text2)"}},
        "🔍 Ingresa la cantidad física contada. La varianza = Teórico − Físico."
      ),
      h('div',{style:{display:"flex",gap:8,alignItems:"center",marginBottom:14}},
        h('label',{style:{fontSize:13,color:"var(--text2)",whiteSpace:"nowrap"}},"Fecha del conteo:"),
        h('input',{type:"date",value:countDate,onChange:e=>setCountDate(e.target.value),style:{flex:1}})
      ),
      h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
        products.map(p=>{
          const theo=theoreticalStock(p.id);
          const physVal=physicals[p.id];
          const physical=physVal!==""&&physVal!==undefined?+physVal:null;
          const varQty=physical!==null?theo-physical:null;
          const varVal=varQty!==null?varQty*p.avgCost:null;
          const isOver=varQty!==null&&varQty<0;
          const isShort=varQty!==null&&varQty>0;
          const varColor=isShort?"var(--red)":isOver?"var(--green)":"var(--text2)";
          return h('div',{key:p.id,style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"12px 14px"}},
            h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}},
              h('div',null,
                h('div',{style:{fontSize:14,fontWeight:600}},p.name),
                h('div',{style:{fontSize:11,color:"var(--text3)"}},`${p.category} · ${p.unit}`)
              ),
              h('div',{style:{textAlign:"right"}},
                h('div',{style:{fontSize:11,color:"var(--text2)"}},`Teórico: `+h('span',{style:{fontWeight:600,color:"var(--blue)"}},(+theo).toFixed(2)+" "+p.unit)),
              )
            ),
            h('div',{style:{display:"flex",gap:8,alignItems:"center"}},
              h('input',{
                type:"number",step:"0.001",min:"0",
                value:physicals[p.id]??'',
                onChange:e=>handlePhysical(p.id,e.target.value),
                placeholder:`Cantidad física (${p.unit})`,
                style:{flex:1}
              }),
              physical!==null&&h('div',{style:{textAlign:"right",minWidth:90}},
                h('div',{style:{fontSize:12,fontWeight:700,color:varColor}},
                  (varQty>=0?"-":"+")+" "+Math.abs(varQty).toFixed(2)+" "+p.unit
                ),
                h('div',{style:{fontSize:11,color:varColor}},
                  (varVal>=0?"−":"+")+fmtCost(Math.abs(varVal||0))
                )
              )
            ),
            physical!==null&&varQty!==null&&h('div',{style:{
              marginTop:8,padding:"5px 10px",borderRadius:"var(--radius-sm)",
              background:Math.abs(varQty)<0.001?"rgba(34,197,94,0.08)":isShort?"rgba(239,68,68,0.08)":"rgba(59,130,246,0.08)",
              border:`1px solid ${Math.abs(varQty)<0.001?"rgba(34,197,94,0.25)":isShort?"rgba(239,68,68,0.25)":"rgba(59,130,246,0.25)"}`,
              display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12
            }},
              h('span',{style:{color:Math.abs(varQty)<0.001?"var(--green)":varColor,fontWeight:500}},
                Math.abs(varQty)<0.001?"✓ Sin varianza":isShort?"⚠ Faltante":"ℹ Sobrante"
              ),
              h('span',{style:{color:varColor,fontWeight:600}},
                `${(varQty<0?"+":varQty>0?"-":"")}`+fmtCost(Math.abs(varVal||0))
              )
            )
          );
        })
      ),
      h('div',{style:{marginTop:16,display:"flex",gap:8}},
        h(Btn,{onClick:saveCount,size:"lg",style:{flex:1}},"💾 Guardar conteo del día"),
        saved&&h('div',{style:{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"var(--green)",fontWeight:600}},"✓ Guardado")
      ),
      stockCounts.length>0&&h('div',{style:{marginTop:20}},
        h('div',{style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:600,marginBottom:10}},"Historial de conteos"),
        h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
          [...stockCounts].reverse().map(sc=>
            h('div',{key:sc.id,style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
              h('div',null,
                h('div',{style:{fontSize:13,fontWeight:600}},sc.date),
                h('div',{style:{fontSize:11,color:"var(--text3)"}},`${sc.entries.length} productos contados`)
              ),
              h(Badge,{color:"blue"},`${sc.entries.filter(e=>Math.abs(e.openingStock-e.physicalQty)>0.001).length} varianzas`)
            )
          )
        )
      )
    )
  );
}

// ─── PAYMENT RECONCILIATION ───────────────────────────────────────────────────
function PaymentRecon({data,setData,toast}){
  const {orders=[],orderLines=[],recipes=[],paymentRecons=[]}=data;
  const [reconDate,setReconDate]=useState(today());
  const [form,setForm]=useState({yape:"",cash:"",card:""});
  const [note,setNote]=useState("");
  const [saved,setSaved]=useState(false);
  const [histOpen,setHistOpen]=useState(false);

  // Compute Easy Cook total for the selected date (closed orders)
  // Use snapshotted total (includes IGV + service) when available
  const dayOrders=orders.filter(o=>o.date===reconDate&&o.status==="closed");
  const _settings=getSettings(data);
  const easyTotal=dayOrders.reduce((s,o)=>{
    if(o.total!==undefined) return s+o.total;
    const base=linesOf(orderLines,o.id).reduce((ss,l)=>{const r=recipeById(recipes,l.recipeId);return ss+(r?r.price*l.qty:0);},0);
    return s+orderGrossTotal(base+(o.priceAdj||0),_settings).total;
  },0);
  const orderCount=dayOrders.length;

  const yape=+form.yape||0;
  const cash=+form.cash||0;
  const card=+form.card||0;
  const physicalTotal=yape+cash+card;
  const diff=physicalTotal-easyTotal;
  const diffColor=Math.abs(diff)<0.01?"var(--green)":diff>0?"var(--blue)":"var(--red)";
  const diffLabel=Math.abs(diff)<0.01?"✓ Cuadrado":diff>0?"+ Sobrante":"⚠ Faltante";

  const saveRecon=()=>{
    if(!form.yape&&!form.cash&&!form.card){toast("Ingresa al menos un medio de pago","error");return;}
    const id="PR"+uid();
    setData(d=>({...d,paymentRecons:[...d.paymentRecons,{id,date:reconDate,yape,cash,card,easyTotal,note,orderCount}]}));
    setSaved(true);
    toast("Cuadre de caja guardado ✓");
  };

  const payRow=(label,color,icon,value,pct)=>
    h('div',{style:{background:"var(--surface2)",borderRadius:"var(--radius-sm)",padding:"12px 14px",
      display:"flex",alignItems:"center",gap:12,border:"1px solid var(--border)"}},
      h('div',{style:{width:36,height:36,borderRadius:10,background:color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}},icon),
      h('div',{style:{flex:1}},
        h('div',{style:{fontSize:12,color:"var(--text2)",fontWeight:500}},label),
        h('div',{style:{fontSize:16,fontWeight:700,fontFamily:"var(--sora)",color}}),
      ),
      h('div',{style:{textAlign:"right"}},
        h('div',{style:{fontSize:16,fontWeight:700,color}},fmtCost(value)),
        h('div',{style:{fontSize:11,color:"var(--text3)"}},easyTotal>0?((value/easyTotal*100).toFixed(1)+"%"):"—")
      )
    );

  return h('div',{className:"slide-up"},
    // Date selector
    h('div',{style:{marginBottom:16}},
      h(DatePicker,{value:reconDate,onChange:v=>{setReconDate(v);setSaved(false);}})
    ),

    // Easy Cook total banner
    h('div',{style:{background:"rgba(249,115,22,0.1)",border:"1px solid rgba(249,115,22,0.3)",borderRadius:"var(--radius)",padding:"14px 18px",marginBottom:16}},

            h('div',{style:{fontSize:13,fontWeight:700,color:"var(--text2)"}},fmtCost(dayIgv))
          )
        );
      })()
    ),

    // Payment method inputs
    h('div',{style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:600,marginBottom:10}},"Ingresos por medio de pago"),
    h('div',{style:{display:"flex",flexDirection:"column",gap:8,marginBottom:16}},
      h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"12px 14px"}},
        h('div',{style:{display:"flex",alignItems:"center",gap:10,marginBottom:8}},
          h('span',{style:{fontSize:20}},"💜"),
          h('label',{style:{fontSize:13,fontWeight:600,color:"#c084fc"}},`Yape${yape>0?" — "+fmtCost(yape):""}`)
        ),
        h('input',{type:"number",min:"0",step:"0.01",value:form.yape,onChange:e=>{setForm({...form,yape:e.target.value});setSaved(false);},placeholder:"S/ 0.00"})
      ),

        h('div',{style:{display:"flex",alignItems:"center",gap:10,marginBottom:8}},
          h('span',{style:{fontSize:20}},"💵"),

        ),

      ),
      h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"12px 14px"}},
        h('div',{style:{display:"flex",alignItems:"center",gap:10,marginBottom:8}},
          h('span',{style:{fontSize:20}},"💳"),
          h('label',{style:{fontSize:13,fontWeight:600,color:"var(--blue)"}},`Tarjeta${card>0?" — "+fmtCost(card):""}`)
        ),
        h('input',{type:"number",min:"0",step:"0.01",value:form.card,onChange:e=>{setForm({...form,card:e.target.value});setSaved(false);},placeholder:"S/ 0.00"})
      )

    (yape>0||cash>0||card>0)&&h('div',{style:{background:"var(--surface)",border:"1px solid var(--border2)",borderRadius:"var(--radius)",padding:"14px 16px",marginBottom:16}},

      // Payment bars

          .filter(x=>x.val>0)

              h('span',null,x.label),h('span',null,fmtCost(x.val)+" ("+((x.val/physicalTotal*100).toFixed(0))+"%)")
            ),
            h('div',{style:{height:6,borderRadius:3,background:"var(--surface2)",overflow:"hidden"}},
              h('div',{style:{height:"100%",width:((x.val/physicalTotal*100).toFixed(1))+"%",background:x.color,borderRadius:3,transition:"width .4s"}})
            )
          ))
      ),
      h('div',{style:{height:"0.5px",background:"var(--border)",marginBottom:10}}),
      h('div',{style:{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6}},
        h('span',{style:{color:"var(--text2)"}},"Total físico cobrado"),
        h('span',{style:{fontWeight:700}},fmtCost(physicalTotal))
      ),
      h('div',{style:{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:10}},
        h('span',{style:{color:"var(--text2)"}},"Total Easy Cook"),
        h('span',{style:{fontWeight:700,color:"var(--accent)"}},fmtCost(easyTotal))
      ),
      h('div',{style:{
        display:"flex",justifyContent:"space-between",alignItems:"center",
        padding:"10px 14px",borderRadius:"var(--radius-sm)",
        background:Math.abs(diff)<0.01?"rgba(34,197,94,0.1)":diff>0?"rgba(59,130,246,0.1)":"rgba(239,68,68,0.1)",
        border:`1px solid ${Math.abs(diff)<0.01?"rgba(34,197,94,0.3)":diff>0?"rgba(59,130,246,0.3)":"rgba(239,68,68,0.3)"}`
      }},
        h('span',{style:{fontSize:13,fontWeight:600,color:diffColor}},diffLabel),
        h('span',{style:{fontFamily:"var(--sora)",fontSize:18,fontWeight:700,color:diffColor}},
          (diff===0?"":diff>0?"+":"")+fmtCost(diff))
      )
    ),

    h(FormRow,{label:"Nota (opcional)"},
      h('input',{value:note,onChange:e=>setNote(e.target.value),placeholder:"ej. S/ 5 en cambio pendiente..."})
    ),

    h('div',{style:{display:"flex",gap:8,marginTop:4}},
      h(Btn,{onClick:saveRecon,size:"lg",style:{flex:1},disabled:!form.yape&&!form.cash&&!form.card},"💾 Guardar cuadre"),
      saved&&h('div',{style:{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"var(--green)",fontWeight:600}},"✓ Guardado")
    ),

    // History
    paymentRecons.length>0&&h('div',{style:{marginTop:24}},
      h('button',{
        onClick:()=>setHistOpen(x=>!x),
        style:{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",background:"none",border:"none",
          color:"var(--text2)",fontSize:14,fontWeight:600,fontFamily:"var(--sora)",cursor:"pointer",marginBottom:8,padding:0}
      },
        "Historial de cuadres",
        h('span',{style:{fontSize:12,color:"var(--text3)"}},(histOpen?"▲":"▼")+" "+paymentRecons.length)
      ),
      histOpen&&h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
        [...paymentRecons].reverse().map(pr=>{
          const pd=pr.yape+pr.cash+pr.card;
          const pdiff=pd-pr.easyTotal;
          return h('div',{key:pr.id,style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"12px 14px"}},
            h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}},
              h('div',null,
                h('div',{style:{fontSize:13,fontWeight:600}},pr.date),
                h('div',{style:{fontSize:11,color:"var(--text3)"}},`${pr.orderCount||"?"} pedidos · Yape ${fmtCost(pr.yape)} · Ef. ${fmtCost(pr.cash)} · Tarj. ${fmtCost(pr.card)}`)
              ),
              h(Badge,{color:Math.abs(pdiff)<0.01?"green":pdiff>0?"blue":"red"},
                Math.abs(pdiff)<0.01?"Cuadrado":pdiff>0?"+"+fmtCost(pdiff):fmtCost(pdiff))
            ),
            h('div',{style:{display:"flex",justifyContent:"space-between",fontSize:12}},
              h('span',{style:{color:"var(--text2)"}},"Físico: "+fmtCost(pd)),
              h('span',{style:{color:"var(--accent)",fontWeight:600}},"EC: "+fmtCost(pr.easyTotal))
            ),
            pr.note&&h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:4}},pr.note)
          );
        })
      )
    )
  );
}


// ─── MENU ENGINEERING ─────────────────────────────────────────────────────────
function MenuEngineering({data}){
  const {products,recipes,bom,orders=[],orderLines=[],subBom=[],subRecipes=[]}=data;
  const [tab,setTab]=useState("matrix");
  const [simIngredient,setSimIngredient]=useState(products[0]?.id||"");
  const [simPct,setSimPct]=useState(10);
  const [costTarget,setCostTarget]=useState(()=>Math.round(getFCT(data)*100));
  const [selectedDish,setSelectedDish]=useState(null);

  const dishVolume={};
  orders.filter(o=>o.status==="closed").forEach(o=>{
    linesOf(orderLines,o.id).forEach(l=>{
      dishVolume[l.recipeId]=(dishVolume[l.recipeId]||0)+l.qty;
    });
  });

  const hasRealData=Object.keys(dishVolume).length>0;

  const _meSettings=getSettings(data);
  const dishData=recipes.map(r=>{
    const fc=recipeFoodCost(r.id,products,bom,subBom,subRecipes);
    const netPrice=netBase(r.price,_meSettings.igvMode); // tax-exclusive price
    const margin=netPrice-fc;   // margin on net (correct base)
    const grossMargin=r.price-fc; // for display alongside gross price
    const costPct=netPrice>0?fc/netPrice*100:0;  // real food cost %
    const costPctGross=r.price>0?fc/r.price*100:0; // legacy gross % (for reference)
    const volume=dishVolume[r.id]||0;  // real units sold (0 hasta que haya ventas)
    return{...r,fc,netPrice,margin,grossMargin,costPct,costPctGross,volume};
  });

  const avgMargin=dishData.length>0?dishData.reduce((s,d)=>s+d.margin,0)/dishData.length:0;
  const avgVolume=dishData.length>0?dishData.reduce((s,d)=>s+d.volume,0)/dishData.length:0;

  function quadrant(d){
    const hiM=d.margin>=avgMargin, hiV=d.volume>=avgVolume;
    if(hiM&&hiV)return"star";
    if(hiM&&!hiV)return"puzzle";
    if(!hiM&&hiV)return"plowhorse";
    return"dog";
  }
  const QMeta={
    star:{label:"⭐ Estrellas",color:"#f97316",bg:"rgba(249,115,22,0.15)",border:"rgba(249,115,22,0.4)",tip:"Alto margen + alto volumen. Proteger y promover."},
    puzzle:{label:"🧩 Enigmas",color:"#3b82f6",bg:"rgba(59,130,246,0.12)",border:"rgba(59,130,246,0.35)",tip:"Alto margen pero baja venta. Reposicionar en carta."},
    plowhorse:{label:"🐂 Bueyes",color:"#eab308",bg:"rgba(234,179,8,0.12)",border:"rgba(234,179,8,0.35)",tip:"Mucho volumen pero margen bajo. Revisar costo o precio."},
    dog:{label:"🐶 Perros",color:"#ef4444",bg:"rgba(239,68,68,0.12)",border:"rgba(239,68,68,0.35)",tip:"Bajo margen y baja venta. Evaluar si mantener en carta."},
  };

  const dishWithQ=dishData.map(d=>({...d,q:quadrant(d)}));

  function QuadrantGrid({dishWithQ,QMeta}){
    const [open,setOpen]=useState({star:true,puzzle:true,plowhorse:true,dog:true});
    const SHOW=3; // rows visible before "show more"
    const [expanded,setExpanded]=useState({});
    return h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}},
      Object.entries(QMeta).map(([k,qm])=>{
        const group=dishWithQ.filter(d=>d.q===k);
        const isOpen=open[k];
        const isExp=expanded[k];
        const visible=isExp?group:group.slice(0,SHOW);
        const hasMore=group.length>SHOW;
        return h('div',{key:k,style:{background:qm.bg,border:`1px solid ${qm.border}`,borderRadius:"var(--radius)",padding:"12px 14px",minWidth:0}},
          // Header row — tappable to collapse
          h('button',{
            onClick:()=>setOpen(s=>({...s,[k]:!s[k]})),
            style:{display:"flex",justifyContent:"space-between",alignItems:"center",
              width:"100%",background:"none",border:"none",cursor:"pointer",padding:0,marginBottom:isOpen?8:0}},
            h('div',{style:{display:"flex",alignItems:"center",gap:6}},
              h('span',{style:{fontSize:12,fontWeight:700,color:qm.color}},qm.label),
              group.length>0&&h('span',{style:{fontSize:10,fontWeight:700,color:qm.color,
                background:"rgba(0,0,0,0.2)",borderRadius:10,padding:"1px 6px"}},group.length)
            ),
            h('span',{style:{fontSize:10,color:qm.color,opacity:0.7}},isOpen?"▲":"▼")
          ),
          isOpen&&(
            group.length===0
              ?h('div',{style:{fontSize:11,color:"var(--text3)"}},"Ningún plato")
              :h('div',null,
                h('div',{style:{display:"flex",flexDirection:"column",gap:3,
                  maxHeight:isExp?"none":"none", // height handled by slice
                }},
                  visible.map(d=>h('div',{key:d.id,style:{
                    display:"flex",justifyContent:"space-between",alignItems:"baseline",
                    fontSize:11,padding:"4px 6px",borderRadius:6,
                    background:"rgba(0,0,0,0.15)"}},
                    h('span',{style:{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"55%"}},d.name),
                    h('span',{style:{color:qm.color,fontWeight:600,flexShrink:0,marginLeft:4}},fmtCost(d.margin))
                  ))
                ),
                hasMore&&h('button',{
                  onClick:e=>{e.stopPropagation();setExpanded(s=>({...s,[k]:!s[k]}));},
                  style:{marginTop:5,width:"100%",background:"rgba(0,0,0,0.2)",border:"none",
                    borderRadius:6,padding:"4px 0",fontSize:10,fontWeight:600,
                    color:qm.color,cursor:"pointer"}},
                  isExp?"▲ Ver menos":"+"+(group.length-SHOW)+" más"
                )
              )
          )
        );
      })
    );
  }

  function MatrixChart(){
    const [containerRef,W]=useChartWidth(370);
    const H=Math.round(W*0.95); // keep roughly square
    const padL=52,padB=38,padT=30,padR=20;
    const innerW=W-padL-padR, innerH=H-padT-padB;
    const margins=dishData.map(d=>d.margin);
    const volumes=dishData.map(d=>d.volume);
    const minM=Math.min(...margins),maxM=Math.max(...margins);
    const minV=Math.min(...volumes),maxV=Math.max(...volumes);
    const padM=(maxM-minM)*0.22||3, padV=(maxV-minV)*0.22||6;
    const domM=[minM-padM,maxM+padM], domV=[minV-padV,maxV+padV];
    const xS=v=>padL+((v-domV[0])/(domV[1]-domV[0]))*innerW;
    const yS=v=>padT+innerH-((v-domM[0])/(domM[1]-domM[0]))*innerH;
    const midX=xS(avgVolume), midY=yS(avgMargin);
    const DOT_R=11;

    // Collision-aware label offset: push label up/down based on nearby dots
    function labelOffset(d,allDots){
      const cx=xS(d.volume),cy=yS(d.margin);
      const nearby=allDots.filter(o=>o.id!==d.id&&Math.abs(xS(o.volume)-cx)<DOT_R*2.5&&Math.abs(yS(o.margin)-cy)<DOT_R*2.5);
      // Default: label below dot; if something is close below, push above
      const belowBlocked=nearby.some(o=>yS(o.margin)>cy&&yS(o.margin)<cy+DOT_R*3);
      return belowBlocked?-DOT_R*1.8:DOT_R*1.8;
    }

    const qDefs=[
      {key:"puzzle",x:padL,y:padT,w:midX-padL,h:midY-padT,fill:"rgba(59,130,246,0.09)",stroke:"rgba(59,130,246,0.18)",lx:padL+(midX-padL)/2,ly:padT+(midY-padT)/2,emoji:"🧩",name:"ENIGMAS",color:"rgba(59,130,246,0.9)"},
      {key:"star",x:midX,y:padT,w:W-padR-midX,h:midY-padT,fill:"rgba(249,115,22,0.09)",stroke:"rgba(249,115,22,0.18)",lx:midX+(W-padR-midX)/2,ly:padT+(midY-padT)/2,emoji:"⭐",name:"ESTRELLAS",color:"rgba(249,115,22,1)"},
      {key:"dog",x:padL,y:midY,w:midX-padL,h:H-padB-midY,fill:"rgba(239,68,68,0.09)",stroke:"rgba(239,68,68,0.18)",lx:padL+(midX-padL)/2,ly:midY+(H-padB-midY)/2,emoji:"🐶",name:"PERROS",color:"rgba(239,68,68,0.9)"},
      {key:"plowhorse",x:midX,y:midY,w:W-padR-midX,h:H-padB-midY,fill:"rgba(234,179,8,0.09)",stroke:"rgba(234,179,8,0.18)",lx:midX+(W-padR-midX)/2,ly:midY+(H-padB-midY)/2,emoji:"🐂",name:"BUEYES",color:"rgba(234,179,8,1)"},
    ];

    return h('div',{ref:containerRef,style:{width:"100%",marginBottom:4}},
      h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",display:"block",fontFamily:"var(--sans)"}},

        // Quadrant fills with subtle border
        qDefs.map(q=>h('g',{key:q.key},
          h('rect',{x:q.x,y:q.y,width:q.w,height:q.h,fill:q.fill}),
          // Centered label background pill
          h('rect',{x:q.lx-38,y:q.ly-14,width:76,height:26,rx:13,fill:"rgba(0,0,0,0.35)"}),
          h('text',{x:q.lx,y:q.ly-2,textAnchor:"middle",fontSize:11,fill:q.color,fontWeight:700},q.emoji),
          h('text',{x:q.lx,y:q.ly+10,textAnchor:"middle",fontSize:8,fill:q.color,fontWeight:700,letterSpacing:"0.06em"},q.name)
        )),

        // Divider lines
        h('line',{x1:padL,y1:midY,x2:W-padR,y2:midY,stroke:"rgba(255,255,255,0.25)",strokeWidth:1.5,strokeDasharray:"6,4"}),
        h('line',{x1:midX,y1:padT,x2:midX,y2:H-padB,stroke:"rgba(255,255,255,0.25)",strokeWidth:1.5,strokeDasharray:"6,4"}),

        // Axis lines
        h('line',{x1:padL,y1:H-padB,x2:W-padR,y2:H-padB,stroke:"rgba(255,255,255,0.15)",strokeWidth:1}),
        h('line',{x1:padL,y1:padT,x2:padL,y2:H-padB,stroke:"rgba(255,255,255,0.15)",strokeWidth:1}),

        // Axis labels
        h('text',{x:padL+innerW/2,y:H-6,textAnchor:"middle",fontSize:9,fill:"var(--text3)"},"Volumen de ventas →"),
        h('text',{x:10,y:padT+innerH/2,textAnchor:"middle",fontSize:9,fill:"var(--text3)",transform:`rotate(-90,10,${padT+innerH/2})`},"Margen →"),

        // Y axis ticks
        [minM,avgMargin,maxM].map((v,i)=>h('text',{key:i,x:padL-3,y:yS(v)+3,textAnchor:"end",fontSize:8,fill:"var(--text3)"},"S/"+v.toFixed(0))),
        // X axis ticks
        [minV,avgVolume,maxV].map((v,i)=>h('text',{key:i,x:xS(v),y:H-padB+12,textAnchor:"middle",fontSize:8,fill:"var(--text3)"},Math.round(v))),

        // Dish dots — render selected last so it's always on top
        [...dishWithQ].sort((a,b)=>(selectedDish===a.id?1:-1)-(selectedDish===b.id?1:-1)).map(d=>{
          const cx=xS(d.volume),cy=yS(d.margin);
          const col=QMeta[d.q].color;
          const isSel=selectedDish===d.id;
          const r=isSel?DOT_R+3:DOT_R;
          const labelDy=labelOffset(d,dishWithQ);
          const shortName=d.name.length>8?d.name.slice(0,7)+"…":d.name;
          return h('g',{key:d.id,style:{cursor:"pointer"},onClick:()=>setSelectedDish(isSel?null:d.id)},
            // Selection glow ring
            isSel&&h('circle',{cx,cy,r:r+5,fill:"none",stroke:col,strokeWidth:2,opacity:0.4}),
            // Dot
            h('circle',{cx,cy,r,fill:col,opacity:isSel?1:0.88,stroke:"var(--surface)",strokeWidth:isSel?2.5:2}),
            // Label outside dot (collision-aware)
            h('text',{x:cx,y:cy+labelDy,textAnchor:"middle",fontSize:9,fill:"#fff",fontWeight:700,pointerEvents:"none",
              style:{textShadow:"0 1px 3px rgba(0,0,0,0.9)"}},shortName)
          );
        })
      )
    );
  }

  function priceSim(){
    const ing=products.find(p=>p.id===simIngredient);
    if(!ing)return[];
    const multiplier=1+(simPct/100);
    return recipes.map(r=>{
      const lines=bom.filter(b=>b.recipeId===r.id&&b.productId===simIngredient);
      if(!lines.length)return null;
      const baseCost=recipeFoodCost(r.id,products,bom,subBom,subRecipes);
      const ingUsageQty=lines.reduce((s,b)=>s+b.qty,0);
      const ingCostBefore=usableUnitCost(ing)*ingUsageQty;
      const ingCostAfter=usableUnitCost({...ing,avgCost:ing.avgCost*multiplier})*ingUsageQty;
      const newCost=baseCost-ingCostBefore+ingCostAfter;
      const _netP=netBase(r.price,_meSettings.igvMode);
      const newCostPct=_netP>0?(newCost/_netP)*100:0;
      const oldCostPct=_netP>0?(baseCost/_netP)*100:0;
      const breaches=newCostPct>costTarget;
      return{...r,baseCost,newCost,oldCostPct,newCostPct,ingCostDelta:ingCostAfter-ingCostBefore,breaches,netPrice:_netP};
    }).filter(Boolean);
  }

  const simResults=priceSim();
  const breachCount=simResults.filter(r=>r.breaches).length;
  const affectedCount=simResults.length;

  const tabStyle=t=>({
    flex:1,padding:"9px 0",borderRadius:"var(--radius-sm)",border:"none",
    fontFamily:"var(--sora)",fontSize:13,fontWeight:600,cursor:"pointer",
    background:tab===t?"var(--accent)":"var(--surface2)",
    color:tab===t?"#fff":"var(--text2)",transition:"all .15s"
  });

  return h('div',{className:"slide-up",style:{paddingBottom:16}},

    h('div',{style:{display:"flex",gap:8,marginBottom:18}},
      h('button',{style:tabStyle("matrix"),onClick:()=>setTab("matrix")},"📊 Matriz de Menú"),

// ─── DISCOUNTS LIST — every discount given, for cashier speed + owner oversight ─
function DiscountsTab({data}){
  const {orders=[]}=data;
  const t=today();
  const isoOf=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const yest=(()=>{const d=new Date();d.setDate(d.getDate()-1);return isoOf(d);})();
  const wk=(()=>{const d=new Date();d.setDate(d.getDate()-6);return isoOf(d);})();
  const monthStart=t.slice(0,7)+"-01";
  const [dateFrom,setDateFrom]=useState(t);
  const [dateTo,setDateTo]=useState(t);
  const presets=[{label:"Hoy",from:t,to:t},{label:"Ayer",from:yest,to:yest},{label:"Últimos 7 días",from:wk,to:t},{label:"Este mes",from:monthStart,to:t},{label:"Todos",from:"",to:""}];
  const all=orders.filter(o=>(o.priceAdj||0)<0);
  const disc=all.filter(o=>{const d=o.date||"";if(dateFrom&&d<dateFrom)return false;if(dateTo&&d>dateTo)return false;return true;})
    .sort((a,b)=>((b.date||"")+(b.code||"")).localeCompare((a.date||"")+(a.code||"")));
  const total=disc.reduce((s,o)=>s+Math.abs(o.priceAdj||0),0);
  const rangeLabel=(!dateFrom&&!dateTo)?"Todos los descuentos":(dateFrom&&dateTo&&dateFrom===dateTo)?fmtDate(dateFrom):(dateFrom?fmtDate(dateFrom):"inicio")+" → "+(dateTo?fmtDate(dateTo):"hoy");
  return h('div',null,
    h('div',{style:{display:"flex",gap:6,marginBottom:10,overflowX:"auto",paddingBottom:2}},
      presets.map(p=>{const active=dateFrom===p.from&&dateTo===p.to;return h('button',{key:p.label,onClick:()=>{setDateFrom(p.from);setDateTo(p.to);},style:{
        padding:"5px 13px",borderRadius:20,border:"1px solid",cursor:"pointer",fontFamily:"var(--sans)",fontSize:12,fontWeight:500,whiteSpace:"nowrap",
        borderColor:active?"var(--accent)":"var(--border2)",background:active?"rgba(249,115,22,0.15)":"transparent",color:active?"var(--accent)":"var(--text2)"}},p.label);})
    ),
    h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}},
      h('div',null,h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:4}},"Desde"),h(DatePicker,{value:dateFrom,onChange:v=>{setDateFrom(v);if(dateTo&&v>dateTo)setDateTo(v);}})),
      h('div',null,h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:4}},"Hasta"),h(DatePicker,{value:dateTo,onChange:v=>{setDateTo(v);if(dateFrom&&v<dateFrom)setDateFrom(v);}}))
    ),
    h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--surface)",border:"1px solid var(--border2)",borderRadius:"var(--radius)",padding:"12px 14px",marginBottom:14}},
      h('div',{style:{minWidth:0}},
        h('div',{style:{fontSize:12,color:"var(--text2)"}},disc.length+" descuento"+(disc.length!==1?"s":"")),
        h('div',{style:{fontSize:10,color:"var(--text3)",marginTop:1}},rangeLabel)),
      h('div',{style:{fontFamily:"var(--sora)",fontSize:18,fontWeight:800,color:"var(--green)"}},"− "+fmtCost(total))
    ),
    disc.length===0
      ?h(EmptyState,{icon:"🏷",title:"Sin descuentos",sub:"Los descuentos que apliques en los pedidos aparecerán aquí."})
      :h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
        disc.map(o=>h('div',{key:o.id,style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"11px 14px"}},
          h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}},

          ),

        ))
      )
  );

// ── date helpers ────────────────────────────────────────────────────────────
function weekBounds(offsetWeeks=0){
  const now=new Date();
  const dow=now.getDay()||7; // Mon=1…Sun=7
  // Use local date components to avoid UTC midnight shift (important for Lima UTC-5)
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+1+offsetWeeks*7);
  const sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);
  const fmt=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  return{start:fmt(mon),end:fmt(sun)};
}
function monthBounds(offsetMonths=0){
  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth()+offsetMonths;
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const fmt=d=>d.toISOString().slice(0,10);
  return{start:fmt(first),end:fmt(last)};
}
function inRange(date,start,end){return date>=start&&date<=end;}
function MONTH_LABEL(offsetMonths=0){
  const now=new Date();
  return new Date(now.getFullYear(),now.getMonth()+offsetMonths,1)
    .toLocaleDateString("es-PE",{month:"long",year:"numeric"});
}

function MiniBarChart({bars,height=56,color="var(--accent)",labelColor="var(--text3)"}){
  if(!bars||!bars.length)return null;
  const [containerRef,W]=useChartWidth(390);
  const max=Math.max(...bars.map(b=>b.v),1);
  const H=height,padB=18,innerH=H-padB;
  const bw=Math.max(4,Math.floor((W-8)/bars.length)-4);
  return h('div',{ref:containerRef,style:{width:"100%"}},
    h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",display:"block",overflow:"visible"}},
      bars.map((b,i)=>{
        const bh=Math.max(2,b.v/max*innerH);
        const x=4+i*(bw+4);
        const y=innerH-bh;
        return h('g',{key:i},
          h('rect',{x,y,width:bw,height:bh,rx:3,fill:color,opacity:0.85}),
          h('text',{x:x+bw/2,y:H-2,textAnchor:"middle",fontSize:9,fill:labelColor,fontFamily:"var(--sans)"},b.label)
        );
      })
    )
  );
}

// ── SVG line chart helper ────────────────────────────────────────────────────
function LineChart({series,height=100,yLabel="S/"}){
  // series: [{label, color, points:[{x:label,v:number}]}]
  if(!series||!series.length)return null;
  const [containerRef,W]=useChartWidth(390);
  const allVals=series.flatMap(s=>s.points.map(p=>p.v));
  const minV=Math.min(...allVals)*0.96;
  const maxV=Math.max(...allVals)*1.04;
  const xLabels=series[0].points.map(p=>p.x);
  const H=height,padL=44,padB=20,padT=8,padR=10;
  const innerW=W-padL-padR,innerH=H-padB-padT;
  const xS=(i)=>padL+i/(xLabels.length-1||1)*innerW;
  const yS=(v)=>padT+innerH-(v-minV)/(maxV-minV||1)*innerH;
  // Grid lines
  const gridVals=[minV,(minV+maxV)/2,maxV];
  return h('div',{ref:containerRef,style:{width:"100%"}},
    h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",display:"block",overflow:"visible"}},
      // grid
      gridVals.map((gv,i)=>h('g',{key:i},
        h('line',{x1:padL,x2:W-padR,y1:yS(gv),y2:yS(gv),stroke:"rgba(255,255,255,0.07)",strokeWidth:1}),
        h('text',{x:padL-4,y:yS(gv)+3,textAnchor:"end",fontSize:8,fill:"var(--text3)",fontFamily:"var(--sans)"},
          gv>=1000?(gv/1000).toFixed(1)+"k":gv.toFixed(0))
      )),
      // series
      series.map(s=>{
        const pts=s.points;
        if(pts.length<2)return null;
        const d=pts.map((p,i)=>`${i===0?"M":"L"}${xS(i).toFixed(1)},${yS(p.v).toFixed(1)}`).join(" ");
        const areaD=`${d} L${xS(pts.length-1).toFixed(1)},${(padT+innerH).toFixed(1)} L${xS(0).toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
        return h('g',{key:s.label},
          h('path',{d:areaD,fill:s.color,opacity:0.08}),
          h('path',{d,fill:"none",stroke:s.color,strokeWidth:2,strokeLinejoin:"round",strokeLinecap:"round"}),
          pts.map((p,i)=>h('circle',{key:i,cx:xS(i),cy:yS(p.v),r:3,fill:s.color}))
        );
      }),
      // x labels
      xLabels.map((l,i)=>h('text',{key:i,x:xS(i),y:H-3,textAnchor:"middle",fontSize:8.5,fill:"var(--text3)",fontFamily:"var(--sans)"},l))
    )
  );
}

// ── Print stylesheet injector ────────────────────────────────────────────────

@media print{
