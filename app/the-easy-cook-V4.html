  // ── Wastage ──
  const mWaste=(wastageLog||[]).filter(w=>inRange(w.date,start,end));
  const wasteCost=mWaste.reduce((s,w)=>s+(w.lostValue||0),0);
  const wasteByReason={};
  mWaste.forEach(w=>{wasteByReason[w.reason]=(wasteByReason[w.reason]||0)+(w.lostValue||0);});
  const netContribution=grossMargin-wasteCost;
  const netPct=netRevenue>0?netContribution/netRevenue*100:0;
  // ── Discounts ──
  const mDisc=mOrders.filter(o=>(o.priceAdj||0)<0);
  const discTotal=mDisc.reduce((s,o)=>s+Math.abs(o.priceAdj||0),0);
  // ── Top dishes ──
  const dishAgg={};
  mLines.forEach(l=>{const r=recipeById(recipes,l.recipeId);if(!r)return;const fc=recipeFoodCost(r.id,products,bom,subBom,subRecipes);const net=netBase(r.price,S.igvMode);if(!dishAgg[r.id])dishAgg[r.id]={name:r.name,units:0,revenue:0,margin:0,fc,net};dishAgg[r.id].units+=l.qty;dishAgg[r.id].revenue+=r.price*l.qty;dishAgg[r.id].margin+=(net-fc)*l.qty;});
  const topDishes=Object.values(dishAgg).sort((a,b)=>b.units-a.units);
  // ── Weekly breakdown ──
  const weeks=[];
  let cur=new Date(start);
  while(cur.toISOString().slice(0,10)<=end){
    const wStart=cur.toISOString().slice(0,10);
    const wEnd=new Date(Math.min(cur.getTime()+6*86400000,new Date(end).getTime())).toISOString().slice(0,10);
    const wOrders=mOrders.filter(o=>inRange(o.date,wStart,wEnd));
    const wLines=linesOfOrders(mLines,wOrders);
    const wRev=wLines.reduce((s,l)=>{const r=recipeById(recipes,l.recipeId);return s+(r?r.price*l.qty:0);},0);
    const wFC=wLines.reduce((s,l)=>s+recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty,0);
    weeks.push({label:"Sem "+(weeks.length+1),from:wStart,to:wEnd,rev:wRev,fc:wFC,orders:wOrders.length});
    cur=new Date(cur.getTime()+7*86400000);
  }
  // ── Comparison vs previous month ──
  const prevY=selMonth===1?selYear-1:selYear, prevM=selMonth===1?12:selMonth-1;
  const prevLabel=MONTHS_ES[prevM-1]+" "+prevY;
  function calcMonthKPIs(y,m){
    const st=`${y}-${pad(m)}-01`;const ld=new Date(y,m,0).getDate();const en=`${y}-${pad(m)}-${pad(ld)}`;
    const os=orders.filter(o=>o.status==="closed"&&inRange(o.date,st,en));
    const ls=linesOfOrders(orderLines,os);
    const rev=ls.reduce((s,l)=>{const r=recipeById(recipes,l.recipeId);return s+(r?r.price*l.qty:0);},0);
    const fc=ls.reduce((s,l)=>s+recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty,0);
    const ig=S.igvMode==="incluido"?rev-rev/1.18:S.igvMode==="excluido"?rev*IGV_RATE:0;const nr=rev-ig;
    return {nr,fcPct:nr>0?fc/nr*100:0,gm:nr-fc,orders:os.length,ticket:os.length>0?rev/os.length:0};
  }
  const prev=calcMonthKPIs(prevY,prevM);
  // ── 6-month sales trend ──
  const trend6=[];
  for(let i=5;i>=0;i--){
    let ty=selYear,tm=selMonth-i;while(tm<1){tm+=12;ty--;}
    const k=calcMonthKPIs(ty,tm);
    trend6.push({label:MONTHS_ES[tm-1].slice(0,3),year:ty,cur:i===0,nr:k.nr,fcPct:k.fcPct,orders:k.orders});
  }
  const trendMax=Math.max(1,...trend6.map(t=>t.nr));
  const trendActive=trend6.filter(t=>t.nr>0);
  const trendAvg=trendActive.length?trendActive.reduce((s,t)=>s+t.nr,0)/trendActive.length:0;
  // ── Sales by day of week ──
  const DOW=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const dowRev=[0,0,0,0,0,0,0],dowCount=[0,0,0,0,0,0,0];
  mOrders.forEach(o=>{const di=new Date(o.date+"T12:00:00").getDay();const oRev=linesOf(mLines,o.id).reduce((s,l)=>{const r=recipeById(recipes,l.recipeId);return s+(r?r.price*l.qty:0);},0);dowRev[di]+=oRev;dowCount[di]++;});
  const dowData=[1,2,3,4,5,6,0].map(di=>({dia:DOW[di],rev:dowRev[di],count:dowCount[di],pct:revenue>0?dowRev[di]/revenue*100:0}));
  const bestDow=dowData.reduce((b,d)=>d.rev>b.rev?d:b,{rev:-1,dia:"—"});
  // ── Sales by category ──
  const catAgg={};
  mLines.forEach(l=>{const r=recipeById(recipes,l.recipeId);if(!r)return;const cat=r.category||"Sin categoría";const fc=recipeFoodCost(r.id,products,bom,subBom,subRecipes);const net=netBase(r.price,S.igvMode);if(!catAgg[cat])catAgg[cat]={rev:0,margin:0,units:0};catAgg[cat].rev+=r.price*l.qty;catAgg[cat].margin+=(net-fc)*l.qty;catAgg[cat].units+=l.qty;});
  const catRows=Object.entries(catAgg).sort((a,b)=>b[1].rev-a[1].rev);
  // ── Payment methods (from Cuadre de Caja) ──
  const mRecons=(paymentRecons||[]).filter(pr=>inRange(pr.date,start,end));
  const payYape=mRecons.reduce((s,p)=>s+(+p.yape||0),0);
  const payCash=mRecons.reduce((s,p)=>s+(+p.cash||0),0);
  const payCard=mRecons.reduce((s,p)=>s+(+p.card||0),0);
  const payTotal=payYape+payCash+payCard;
  const payEasy=mRecons.reduce((s,p)=>s+(+p.easyTotal||0),0);
  const payDiff=payTotal-payEasy;
  const payRows=[["Yape",payYape],["Efectivo",payCash],["Tarjeta",payCard]];

  // ── render helpers ──
  const section=(title,...kids)=>h('div',{className:"print-section",style:{marginBottom:18}},
    h('div',{style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:700,marginBottom:8,color:"var(--text)"}},title),...kids);
  const kpi=(label,val)=>h('div',{style:{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 10px"}},
    h('div',{style:{fontSize:15,fontWeight:700,fontFamily:"var(--sora)"}},val),
    h('div',{style:{fontSize:10,color:"var(--text3)",marginTop:2}},label));
  const plRow=(label,amount,pct,bold)=>h('div',{style:{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid var(--border)",fontWeight:bold?700:400,fontSize:13}},
    h('span',null,label),h('span',null,fmtCost(amount)+(pct!=null?"  ·  "+pct.toFixed(1)+"%":"")));
  const gridCols=n=>`2fr repeat(${n-1},1fr)`;
  const table=(headers,rows)=>h('div',{style:{border:"1px solid var(--border)",borderRadius:8,overflow:"hidden"}},
    h('div',{style:{display:"grid",gridTemplateColumns:gridCols(headers.length),gap:4,padding:"6px 10px",background:"var(--surface2)",fontSize:10,fontWeight:700,color:"var(--text3)"}},
      headers.map((hd,i)=>h('span',{key:i,style:{textAlign:i===0?"left":"right"}},hd))),
    rows.map((r,ri)=>h('div',{key:ri,style:{display:"grid",gridTemplateColumns:gridCols(headers.length),gap:4,padding:"5px 10px",borderTop:"1px solid var(--border)",fontSize:11}},
      r.map((c,ci)=>h('span',{key:ci,style:{textAlign:ci===0?"left":"right",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},c)))));
  const empty=txt=>h('div',{style:{fontSize:12,color:"var(--text3)",fontStyle:"italic",padding:"8px 0"}},txt);
  const variation=(cur,prv,higher)=>{if(!prv)return{txt:"—",col:"var(--text3)"};const dd=(cur-prv)/prv*100;const good=higher?dd>=0:dd<=0;const arrow=Math.abs(dd)<0.5?"→":(dd>0?"▲":"▼");return{txt:arrow+" "+(dd>0?"+":"")+dd.toFixed(0)+"%",col:Math.abs(dd)<0.5?"var(--text3)":(good?"var(--green)":"var(--red)")};};
  const compareTable=rows=>h('div',{style:{border:"1px solid var(--border)",borderRadius:8,overflow:"hidden"}},
    h('div',{style:{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:4,padding:"6px 10px",background:"var(--surface2)",fontSize:10,fontWeight:700,color:"var(--text3)"}},
      ["Métrica","Este mes","Mes ant.","Variación"].map((hd,i)=>h('span',{key:i,style:{textAlign:i===0?"left":"right"}},hd))),
    rows.map((r,ri)=>{const v=variation(r.cur,r.prev,r.higher);return h('div',{key:ri,style:{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:4,padding:"5px 10px",borderTop:"1px solid var(--border)",fontSize:11}},
      h('span',null,r.label),h('span',{style:{textAlign:"right",fontWeight:600}},r.fmt(r.cur)),h('span',{style:{textAlign:"right",color:"var(--text3)"}},r.fmt(r.prev)),h('span',{style:{textAlign:"right",fontWeight:700,color:v.col}},v.txt));}));
  const barChart=(rows,max,avg)=>{
    const W=620,H=180,padT=24,padB=36,padX=10;
    const usable=H-padT-padB,bw=(W-padX*2)/rows.length;
    const avgY=max>0?padT+usable-avg/max*usable:padT+usable;
    return h('div',{style:{border:"1px solid var(--border)",borderRadius:8,padding:"8px 6px 2px",background:"var(--surface2)"}},
      h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",height:"auto",display:"block"}},
        h('line',{x1:padX,y1:padT+usable,x2:W-padX,y2:padT+usable,stroke:"var(--border2)",strokeWidth:1}),
        avg>0&&h('line',{x1:padX,y1:avgY,x2:W-padX,y2:avgY,stroke:"var(--text3)",strokeWidth:1,strokeDasharray:"4 4",opacity:0.6}),
        rows.map((r,i)=>{
          const bh=max>0?Math.max(2,r.nr/max*usable):2;
          const x=padX+i*bw+bw*0.22,w=bw*0.56,y=padT+usable-bh;
          return h(Fragment,{key:i},
            h('rect',{x,y,width:w,height:bh,rx:3,fill:"var(--accent)",opacity:r.cur?1:0.38}),
            r.nr>0&&h('text',{x:x+w/2,y:y-6,textAnchor:"middle",fontSize:11,fontWeight:r.cur?700:500,fill:"var(--text2)"},"S/ "+Math.round(r.nr)),
            h('text',{x:x+w/2,y:H-19,textAnchor:"middle",fontSize:12,fontWeight:r.cur?700:400,fill:"var(--text2)"},r.label),
            h('text',{x:x+w/2,y:H-6,textAnchor:"middle",fontSize:10,fill:"var(--text3)"},String(r.year)));
        })));
  };
  const navBtn={background:"var(--surface)",border:"1px solid var(--border2)",borderRadius:8,width:32,height:32,cursor:"pointer",color:"var(--text2)",fontSize:16};

  return h('div',{className:"slide-up"},
    h('div',{className:"no-print",style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,background:"var(--surface2)",borderRadius:"var(--radius-sm)",padding:"8px 12px"}},
      h('button',{onClick:prevMonth,style:navBtn},"‹"),
      h('div',{style:{fontWeight:700,fontFamily:"var(--sora)",textTransform:"capitalize"}},mLabel),
      h('button',{onClick:nextMonth,disabled:isCurrentMonth,style:{...navBtn,opacity:isCurrentMonth?0.4:1}},"›")
    ),
    h('div',{className:"no-print",style:{fontSize:12,color:"var(--text3)",marginBottom:16,textAlign:"center"}},
      "Este es el informe completo del mes. Usa 🖨 Descargar PDF (arriba) para guardarlo o enviarlo."),

    h('div',{className:"report-doc"},
      // Cover header
      h('div',{className:"print-section",style:{borderBottom:"2px solid var(--accent)",paddingBottom:14,marginBottom:20}},
        h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}},
          h('div',{style:{minWidth:0}},
            h('div',{style:{fontFamily:"var(--sora)",fontSize:22,fontWeight:800}},S.restaurantName||"Mi Restaurante"),
            S.ruc&&h('div',{style:{fontSize:12,color:"var(--text2)"}},"RUC: "+S.ruc)),
          h('div',{style:{textAlign:"right",flexShrink:0}},
            h('div',{style:{fontSize:12,color:"var(--text3)"}},"The Easy Cook"),
            h('div',{style:{fontSize:11,color:"var(--text3)"}},"Generado el "+fmtDate(today())))
        ),
        h('div',{style:{fontFamily:"var(--sora)",fontSize:16,fontWeight:700,marginTop:10,color:"var(--accent)",textTransform:"capitalize"}},"Informe de gestión — "+mLabel)
      ),
      mOrders.length===0
        ?section("Resumen ejecutivo",empty("No hay ventas cerradas en "+mLabel+". Cierra pedidos para ver el informe."))
        :h(Fragment,null,
          section("Resumen ejecutivo",
            h('div',{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}},
              kpi("Ventas (bruto)",fmtCost(revenue)),
              kpi("Ventas netas (sin IGV)",fmtCost(netRevenue)),
              kpi("IGV",fmtCost(igv)),
              kpi("Costo de alimentos",fmtCost(foodCost)+" · "+foodCostPct.toFixed(1)+"%"),
              kpi("Margen bruto",fmtCost(grossMargin)+" · "+grossMarginPct.toFixed(1)+"%"),
              kpi("Mermas",fmtCost(wasteCost)),
              kpi("Margen neto",fmtCost(netContribution)+" · "+netPct.toFixed(1)+"%"),
              kpi("Pedidos",String(mOrders.length)),
              kpi("Porciones vendidas",fmtNum(portions)),
              kpi("Personas atendidas",String(totalPax)),
              kpi("Ticket por persona",fmtCost(ticketPax)),
              kpi("Ticket por pedido",fmtCost(ticketOrder))
            )
          ),
          section("Estado de resultados",
            plRow("Ventas netas (sin IGV)",netRevenue,null,true),
            plRow("(−) Costo de alimentos",-foodCost,foodCostPct),
            plRow("Margen bruto",grossMargin,grossMarginPct,true),
            plRow("(−) Mermas",-wasteCost,netRevenue>0?wasteCost/netRevenue*100:0),
            plRow("Margen neto (contribución)",netContribution,netPct,true)
          ),
          section("Comparación vs "+prevLabel,
            compareTable([
              {label:"Ventas netas",cur:netRevenue,prev:prev.nr,fmt:fmtCost,higher:true},
              {label:"Costo de alimentos %",cur:foodCostPct,prev:prev.fcPct,fmt:v=>v.toFixed(1)+"%",higher:false},
              {label:"Margen bruto",cur:grossMargin,prev:prev.gm,fmt:fmtCost,higher:true},
              {label:"Pedidos",cur:mOrders.length,prev:prev.orders,fmt:v=>String(Math.round(v)),higher:true},
              {label:"Ticket por pedido",cur:ticketOrder,prev:prev.ticket,fmt:fmtCost,higher:true}
            ])
          ),
          section("Tendencia de ventas — últimos 6 meses"+(trendAvg>0?" (promedio "+fmtCost(trendAvg)+")":""),
            barChart(trend6,trendMax,trendAvg),
            h('div',{style:{marginTop:8}},
              table(["Mes","Ventas netas","Pedidos","Costo %"],
                trend6.map(t=>[t.label+" "+t.year,fmtCost(t.nr),String(t.orders),(t.nr>0?t.fcPct.toFixed(1)+"%":"—")])))
          ),
          section("Ventas por semana",
            table(["Semana","Rango","Pedidos","Ingresos","Costo %"],
              weeks.map(w=>[w.label,fmtDate(w.from)+" – "+fmtDate(w.to),String(w.orders),fmtCost(w.rev),(w.rev>0?(w.fc/netBase(w.rev,S.igvMode)*100).toFixed(1)+"%":"—")]))
          ),
          section("Ventas por día de la semana"+(bestDow.rev>0?" — mejor: "+bestDow.dia:""),
            table(["Día","Pedidos","Ingresos","% ventas"],
              dowData.map(d=>[d.dia,String(d.count),fmtCost(d.rev),d.pct.toFixed(0)+"%"]))
          ),
          section("Platos más vendidos",
            topDishes.length===0?empty("Sin ventas en el período"):
            table(["Plato","Unid.","Ingresos","Margen","Costo %"],
              topDishes.slice(0,15).map(d=>[d.name,fmtNum(d.units),fmtCost(d.revenue),fmtCost(d.margin),(d.net>0?(d.fc/d.net*100).toFixed(1)+"%":"—")]))
          ),
          section("Ventas por categoría",
            catRows.length===0?empty("Sin ventas"):
            table(["Categoría","Unid.","Ingresos","% ventas","Margen"],
              catRows.map(([c,v])=>[c,fmtNum(v.units),fmtCost(v.rev),(revenue>0?v.rev/revenue*100:0).toFixed(0)+"%",fmtCost(v.margin)]))
          ),
          section("Formas de pago"+(mRecons.length>0?" — "+mRecons.length+(mRecons.length===1?" día cuadrado":" días cuadrados"):""),
            mRecons.length===0?empty("No hay cuadres de caja registrados en este mes"):
            h(Fragment,null,
              table(["Forma de pago","Total","% del total"],
                payRows.map(r=>[r[0],fmtCost(r[1]),(payTotal>0?(r[1]/payTotal*100).toFixed(0)+"%":"—")])
                  .concat([["Total cobrado",fmtCost(payTotal),"100%"]])),
              h('div',{style:{marginTop:8,fontSize:11,color:Math.abs(payDiff)<1?"var(--text3)":"var(--yellow)"}},
                "Ventas registradas en la app esos días: "+fmtCost(payEasy)+"  ·  Diferencia: "+(payDiff>0?"+":"")+fmtCost(payDiff))
            )
          ),
          section("Compras del mes — "+fmtCost(purchaseCost),
            Object.keys(purchByCat).length===0?empty("Sin compras registradas"):
            table(["Categoría","Total"],Object.entries(purchByCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>[c,fmtCost(v)]))
          ),
          section("Mermas del mes — "+fmtCost(wasteCost),
            Object.keys(wasteByReason).length===0?empty("Sin mermas registradas ✓"):
            table(["Motivo","Total"],Object.entries(wasteByReason).sort((a,b)=>b[1]-a[1]).map(([r,v])=>[r,fmtCost(v)]))
          ),
          section("Descuentos del mes",
            h('div',{style:{fontSize:13,color:"var(--text2)"}},mDisc.length+" descuento"+(mDisc.length!==1?"s":"")+" · Total otorgado: "+fmtCost(discTotal))
          )
        ),
      h('div',{style:{marginTop:16,paddingTop:10,borderTop:"1px solid var(--border)",fontSize:10,color:"var(--text3)",textAlign:"center"}},
        "Informe generado por The Easy Cook · "+fmtDate(today()))
    )
  );
}

}

// ─── PIN LOGIN SCREEN ─────────────────────────────────────────────────────────
function PinLogin({users, onLogin, firstRun}){
  const [selectedUser,setSelectedUser]=useState(null);
  const [pin,setPin]=useState("");
  const [error,setError]=useState(false);
  const [shake,setShake]=useState(false);

  const activeUsers=(users||[]).filter(u=>u.active!==false);

  const handleDigit=(d)=>{
    if(pin.length>=4)return;
    const next=pin+d;
    setPin(next);
    setError(false);
    if(next.length===4){
      setTimeout(()=>{
        if(selectedUser&&next===selectedUser.pin){
          onLogin(selectedUser);
        } else {
          setShake(true);setError(true);
          setTimeout(()=>{setPin("");setShake(false);},600);
        }
      },100);
    }
  };
  const handleBack=()=>{ setPin(pin.slice(0,-1)); setError(false); };

  const KEYS=["1","2","3","4","5","6","7","8","9","⌫","0","✓"];

  return h('div',{style:{
    position:"fixed",top:0,right:0,bottom:0,left:0,background:"var(--bg)",zIndex:200,
    display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
    padding:"24px 20px"
  }},
    // Header
    h('div',{className:"pin-login-inner",style:{display:"flex",flexDirection:"column",alignItems:"center"}},
    h('div',{style:{marginBottom:32,textAlign:"center"}},
      h('div',{style:{width:52,height:52,borderRadius:16,background:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 12px"}},"👨‍🍳"),
      h('div',{style:{fontFamily:"var(--sora)",fontSize:22,fontWeight:700}},"The Easy Cook"),
      h('div',{style:{fontSize:13,color:"var(--text2)",marginTop:4}},"Selecciona tu perfil para continuar"),
      firstRun&&h('div',{style:{
        marginTop:14,fontSize:11,color:"var(--accent)",background:"rgba(249,115,22,0.1)",
        border:"1px solid rgba(249,115,22,0.25)",borderRadius:"var(--radius-sm)",
        padding:"8px 12px",lineHeight:1.5,maxWidth:300
      }},"¿Primera vez? Elige \"Carlos (Dueño)\" e ingresa el PIN de demostración 1234 — luego te pediremos crear tu propia cuenta.")
    ),

    // User selection
    !selectedUser
      ? h('div',{style:{width:"100%",maxWidth:340}},
          h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}},
            activeUsers.map(u=>{
              const role=ROLES[u.role]||ROLES.viewer;
              return h('button',{key:u.id,onClick:()=>{setSelectedUser(u);setPin("");setError(false);},className:"ec-hover-accent",style:{
                background:"var(--surface)",border:"1px solid var(--border2)",borderRadius:"var(--radius)",
                padding:"18px 14px",textAlign:"center",cursor:"pointer",transition:"all .15s"
              }},
                h('div',{style:{fontSize:28,marginBottom:6}},u.avatar||role.icon),
                h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:600,marginBottom:4}},u.name),
                h('div',{style:{display:"inline-flex",alignItems:"center",gap:4,
                  background:role.bg,borderRadius:20,padding:"2px 9px"}},
                  h('span',{style:{fontSize:10,fontWeight:600,color:role.color}},role.label)
                )
              );
            })
          )
        )
      : h('div',{style:{width:"100%",maxWidth:300,textAlign:"center"}},
          // Selected user + back
          h('div',{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:20}},
            h('button',{onClick:()=>{setSelectedUser(null);setPin("");setError(false);},style:{
              background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:8,
              padding:"6px 10px",fontSize:12,color:"var(--text2)",cursor:"pointer"}},"← Volver"),
            h('div',{style:{display:"flex",alignItems:"center",gap:8,flex:1,justifyContent:"center"}},
              h('span',{style:{fontSize:22}},selectedUser.avatar||(ROLES[selectedUser.role]||ROLES.viewer).icon),
              h('div',null,
                h('div',{style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:600}},selectedUser.name),
                h('div',{style:{fontSize:11,color:"var(--text2)"}},(ROLES[selectedUser.role]||ROLES.viewer).label)
              )
            )
          ),
          // PIN dots
          h('div',{style:{
            display:"flex",justifyContent:"center",gap:12,marginBottom:24,
            animation:shake?"pinShake .4s ease":"none"
          }},
            [0,1,2,3].map(i=>h('div',{key:i,style:{
              width:14,height:14,borderRadius:"50%",
              background: pin.length>i ? (error?"var(--red)":"var(--accent)") : "var(--surface2)",
              border:`2px solid ${pin.length>i?(error?"var(--red)":"var(--accent)"):"var(--border2)"}`,
              transition:"all .15s"
            }}))
          ),
          error&&h('div',{style:{fontSize:12,color:"var(--red)",marginBottom:12,fontWeight:500}},"PIN incorrecto, intenta de nuevo"),
          // Numpad
          h('div',{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}},
            KEYS.map((k,i)=>
              k==="✓" ? h('div',{key:k}) :
              h('button',{key:k,onClick:()=>k==="⌫"?handleBack():handleDigit(k),style:{
                background:k==="⌫"?"var(--surface2)":"var(--surface)",
                border:"1px solid var(--border2)",borderRadius:"var(--radius)",
                padding:"16px 0",fontSize:18,fontWeight:600,color:"var(--text)",
                cursor:"pointer",fontFamily:"var(--sora)",transition:"all .1s",
                ':active':{background:"var(--accent)",color:"#fff"}
              }},k)
            )
          )
        )
    ) // pin-login-inner
  );
}

// ─── PERMISSION GATE ──────────────────────────────────────────────────────────
function PermGate({perm, role, fallback, children}){
  if(can(role,perm)) return children;
  if(fallback===false) return null;
  return h('div',{style:{
    background:"rgba(156,163,175,0.08)",border:"1px solid rgba(156,163,175,0.15)",
    borderRadius:"var(--radius)",padding:"24px 20px",textAlign:"center",marginTop:8
  }},
    h('div',{style:{fontSize:28,marginBottom:8}},"🔒"),
    h('div',{style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:600,marginBottom:4}},"Acceso restringido"),
    h('div',{style:{fontSize:12,color:"var(--text2)"}},"Tu rol no tiene permiso para esta sección")
  );
}

// ─── ACTIVITY LOG PAGE ────────────────────────────────────────────────────────
function ActivityLog({data,setPage}){
  const log=(data.activityLog||[]).slice().sort((a,b)=>b.ts.localeCompare(a.ts));
  const users=data.users||[];
  const [filter,setFilter]=useState("all");

  const MODULE_ICONS={inventory:"📦",recipes:"🍽",menueng:"📊",abastecimiento:"🛒",
    sales:"🧾",reports:"📋",users:"👥",dashboard:"⊞",settings:"⚙️"};
  const fmtTs=ts=>{
    const d=new Date(ts+"Z");
    const now=new Date();
    const diff=(now-d)/1000;
    if(diff<60)return "ahora";
    if(diff<3600)return `hace ${Math.floor(diff/60)}m`;
    if(diff<86400)return `hace ${Math.floor(diff/3600)}h`;
    return ts.slice(0,10);
  };

  const filtered=filter==="all"?log:log.filter(e=>e.userId===filter);

  return h('div',{className:"slide-up"},
    // Filter by user
    h('div',{style:{display:"flex",gap:8,overflowX:"auto",paddingBottom:4,marginBottom:14}},
      h('button',{onClick:()=>setFilter("all"),style:{
        flexShrink:0,background:filter==="all"?"var(--accent)":"var(--surface2)",
        border:"1px solid",borderColor:filter==="all"?"var(--accent)":"var(--border2)",
        borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:600,
        color:filter==="all"?"#fff":"var(--text2)",cursor:"pointer"}},"Todos"),
      users.map(u=>{
        const role=ROLES[u.role]||ROLES.viewer;
        return h('button',{key:u.id,onClick:()=>setFilter(u.id),style:{
          flexShrink:0,background:filter===u.id?role.bg:"var(--surface2)",
          border:"1px solid",borderColor:filter===u.id?role.color:"var(--border2)",
          borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:600,
          color:filter===u.id?role.color:"var(--text2)",cursor:"pointer",display:"flex",alignItems:"center",gap:5
        }},h('span',null,u.avatar||role.icon)," ",u.name.split(" ")[0])
      })
    ),

    h('div',{style:{fontSize:12,color:"var(--text3)",marginBottom:10}},
      `${filtered.length} eventos registrados`),

    filtered.length===0
      ? h('div',{style:{textAlign:"center",padding:"40px 0",color:"var(--text3)"}},
          h('div',{style:{fontSize:36,marginBottom:8}},"📋"),
          h('div',null,"Sin actividad registrada"))
      : h('div',{style:{display:"flex",flexDirection:"column",gap:0}},
          filtered.map((e,i)=>{
            const u=users.find(x=>x.id===e.userId);
            const role=u?ROLES[u.role]||ROLES.viewer:ROLES.viewer;
            const icon=MODULE_ICONS[e.module]||"🔧";
            const isLast=i===filtered.length-1;
            return h('div',{key:e.id,style:{display:"flex",gap:12,paddingBottom:isLast?0:4}},
              // Timeline
              h('div',{style:{display:"flex",flexDirection:"column",alignItems:"center",flexShrink:0}},
                h('div',{style:{
                  width:34,height:34,borderRadius:10,
                  background:role.bg,border:`2px solid ${role.color}`,
                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0
                }},u?.avatar||role.icon),
                !isLast&&h('div',{style:{width:2,flex:1,background:"var(--border)",margin:"4px 0",minHeight:12}})
              ),
              // Content
              h('div',{style:{flex:1,paddingBottom:12,borderBottom:isLast?"none":"1px solid var(--border)"}},
                h('div',{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}},
                  h('div',null,
                    h('div',{style:{fontSize:13,fontWeight:600}},
                      h('span',{style:{color:role.color}},e.userName)," · ",
                      h('span',{style:{fontWeight:400,color:"var(--text2)"}},e.action)
                    ),
                    h('div',{style:{display:"flex",alignItems:"center",gap:6,marginTop:3}},
                      h('span',{style:{fontSize:12}},icon),
                      h('span',{style:{fontSize:12,color:"var(--text2)"}},e.target)
                    )
                  ),
                  h('div',{style:{fontSize:11,color:"var(--text3)",flexShrink:0,marginTop:2}},fmtTs(e.ts))
                )
              )
            );
          })
        )
  );
}

// ─── SETTINGS PAGE ───────────────────────────────────────────────────────────
// ─── CLOUD SYNC + DEVICE MANAGEMENT (production only) ───────────────────────
// Rendered inside Settings. Shows connection status, a one-time "upload my data
// to the cloud" button, and — for the owner — the team code and device controls
// (rotate code, block one device, disconnect all devices).
function CloudSyncSection({data,setData,toast}){
  const cloud=useContext(CloudCtx);
  const [uploading,setUploading]=useState(false);
  const [code,setCode]=useState(cloud?cloud.teamCode:null);
  const [busy,setBusy]=useState(false);
  const [devices,setDevices]=useState(null);
  const [showCode,setShowCode]=useState(false);

  const loadDevices=useCallback(()=>{
    if(!cloud||!cloud.isOwner)return;
    cloud.listDevices().then(setDevices).catch(()=>setDevices([]));
  },[cloud]);

  useEffect(()=>{ if(cloud&&cloud.isOwner) loadDevices(); },[cloud,loadDevices]);

  if(!cloud) return null; // pure-local mode (no Supabase) → nothing to show

  const upload=async()=>{
    setUploading(true);
    try{ await cloud.uploadAll(data); toast("Datos subidos a la nube correctamente","success"); }
    catch(e){ toast("No se pudo subir: "+(e.message||"error"),"error"); }
    setUploading(false);
  };
  const rotate=async()=>{
    setBusy(true);
    try{ const c=await cloud.rotateCode(); setCode(c); toast("Nuevo código generado","success"); }
    catch(e){ toast("No se pudo cambiar el código: "+(e.message||"error"),"error"); }
    setBusy(false);
  };
  const block=async(userId)=>{
    setBusy(true);
    try{ await cloud.revokeDevice(userId); toast("Dispositivo bloqueado","success"); loadDevices(); }
    catch(e){ toast("No se pudo bloquear: "+(e.message||"error"),"error"); }
    setBusy(false);
  };
  const cutAll=async()=>{
    if(!window.confirm("¿Desconectar TODOS los dispositivos del equipo? Tendrás que compartir un código nuevo. Tu cuenta de dueño no se ve afectada."))return;
    setBusy(true);
    try{
      const n=await cloud.revokeAllDevices();
      const c=await cloud.rotateCode(); setCode(c);
      toast((n||0)+" dispositivo(s) desconectado(s). Código nuevo generado.","success");
      loadDevices();
    }catch(e){ toast("No se pudo desconectar: "+(e.message||"error"),"error"); }
    setBusy(false);
  };

  const activeDevices=(devices||[]).filter(d=>d.active);

  return h('div',{style:{marginTop:28,borderTop:"1px solid var(--border)",paddingTop:20}},
    h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700,marginBottom:4}},"Nube y equipo"),

    // Connection status
    h('div',{style:{
      display:"flex",alignItems:"center",gap:8,marginBottom:14,padding:"10px 12px",
      borderRadius:"var(--radius)",border:"1px solid var(--border)",background:"var(--surface)"
    }},
      h('div',{style:{width:8,height:8,borderRadius:"50%",flexShrink:0,
        background:cloud.online?"var(--green)":"var(--yellow)"}}),
      h('div',{style:{flex:1,minWidth:0}},
        h('div',{style:{fontSize:12,fontWeight:600}},
          cloud.online?"Conectado a la nube":"Sin conexión — se sincronizará al reconectar"),
        h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},
          (cloud.isOwner?"Dueño":"Dispositivo del equipo")+(cloud.email?" · "+cloud.email:""))
      )
    ),

    // One-time upload
    h('div',{style:{fontSize:12,color:"var(--text3)",marginBottom:8,lineHeight:1.5}},
      "Sube los datos que ya tienes en este dispositivo para respaldarlos en la nube. Después, todo se sincroniza solo."),
    h('button',{onClick:upload,disabled:uploading,style:{
      width:"100%",padding:"12px",borderRadius:"var(--radius)",fontSize:13,fontWeight:700,
      fontFamily:"var(--sora)",cursor:uploading?"default":"pointer",border:"1px solid var(--border2)",
      background:"var(--surface2)",color:"var(--text)",marginBottom:cloud.isOwner?20:8
    }},uploading?"Subiendo…":"☁ Subir mis datos actuales a la nube"),

    // Owner-only: change notifications toggle
    cloud.isOwner&&h('div',{style:{borderTop:"1px solid var(--border)",paddingTop:16,marginBottom:2}},
      h('div',{onClick:()=>setData(d=>({...d,settings:{...d.settings,notifyChanges:!(getSettings(d).notifyChanges!==false)}})),
        style:{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",gap:12}},
        h('div',{style:{flex:1}},
          h('div',{style:{fontFamily:"var(--sora)",fontSize:12,fontWeight:700,marginBottom:2}},"Avisarme de cambios del equipo"),
          h('div',{style:{fontSize:11,color:"var(--text3)",lineHeight:1.4}},
            "Un aviso corto cuando otro dispositivo cambia una receta o precio, borra algo, agota un plato, o se conecta un equipo nuevo.")),
        (()=>{const on=getSettings(data).notifyChanges!==false;return h('div',{style:{width:44,height:24,borderRadius:12,flexShrink:0,background:on?"var(--accent)":"var(--border2)",position:"relative",transition:"background .2s"}},
          h('div',{style:{position:"absolute",top:3,left:on?23:3,width:18,height:18,borderRadius:"50%",background:"#fff",boxShadow:"0 1px 4px rgba(0,0,0,0.3)",transition:"left .2s"}}));})()
      )
    ),

    // Owner-only: team code + devices
    cloud.isOwner&&h(Fragment,null,
      h('div',{style:{borderTop:"1px solid var(--border)",paddingTop:16,marginBottom:4}},
        h('div',{style:{fontFamily:"var(--sora)",fontSize:12,fontWeight:700,marginBottom:4}},
          "Código del equipo"),
        h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:10,lineHeight:1.5}},
          "Comparte este código para que un empleado use la app en su celular. No necesita correo ni contraseña. Si pierdes un equipo o cambias de personal, genera uno nuevo y el anterior deja de servir.")
      ),
      h('div',{style:{display:"flex",alignItems:"center",gap:10,marginBottom:10}},
        h('div',{style:{
          flex:1,fontFamily:"var(--sora)",fontSize:22,fontWeight:800,letterSpacing:"0.18em",
          textAlign:"center",padding:"12px",borderRadius:"var(--radius)",
          border:"1px dashed var(--border2)",background:"var(--surface)",userSelect:"all"
        }},code?(showCode?code:"••••••"):"—"),
        h('button',{onClick:()=>setShowCode(v=>!v),style:{
          padding:"10px 12px",borderRadius:"var(--radius-sm)",fontSize:12,fontWeight:600,cursor:"pointer",
          border:"1px solid var(--border2)",background:"var(--surface2)",color:"var(--text2)"
        }},showCode?"Ocultar":"Ver")
      ),
      h('div',{style:{display:"flex",gap:10,marginBottom:20}},
        h('button',{onClick:()=>{ if(code){ try{navigator.clipboard.writeText(code);toast("Código copiado","success");}catch(e){} } },
          disabled:!code||!showCode,style:{
          flex:1,padding:"10px",borderRadius:"var(--radius-sm)",fontSize:12,fontWeight:600,
          cursor:(code&&showCode)?"pointer":"default",border:"1px solid var(--border2)",
          background:"var(--surface2)",color:(code&&showCode)?"var(--text)":"var(--text3)"
        }},"Copiar código"),
        h('button',{onClick:rotate,disabled:busy,style:{
          flex:1,padding:"10px",borderRadius:"var(--radius-sm)",fontSize:12,fontWeight:600,
          cursor:busy?"default":"pointer",border:"1px solid var(--border2)",
          background:"var(--surface2)",color:"var(--text)"
        }},"Generar código nuevo")
      ),

      // Device list
      h('div',{style:{fontFamily:"var(--sora)",fontSize:12,fontWeight:700,marginBottom:8}},
        "Dispositivos conectados"+(activeDevices.length?" ("+activeDevices.length+")":"")),
      devices===null
        ? h('div',{style:{fontSize:12,color:"var(--text3)",padding:"8px 0"}},"Cargando…")
        : activeDevices.length===0
          ? h('div',{style:{fontSize:12,color:"var(--text3)",padding:"10px 12px",borderRadius:"var(--radius)",
              border:"1px solid var(--border)",background:"var(--surface)"}},
              "Aún no hay dispositivos del equipo conectados.")
          : h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
              activeDevices.map(d=>h('div',{key:d.user_id,style:{
                display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
                borderRadius:"var(--radius)",border:"1px solid var(--border)",background:"var(--surface)"
              }},
                h('div',{style:{fontSize:16}},"📱"),
                h('div',{style:{flex:1,minWidth:0}},
                  h('div',{style:{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},
                    d.device_label||"Dispositivo del equipo"),
                  h('div',{style:{fontSize:10,color:"var(--text3)",marginTop:1}},
                    "Última vez: "+(d.last_seen_at?fmtDate(d.last_seen_at):"—"))
                ),
                h('button',{onClick:()=>block(d.user_id),disabled:busy,style:{

              a.href=url;

              toast("Backup exportado correctamente","success");

              const reader=new FileReader();
              reader.onload=ev=>{
                try{
                  const parsed=JSON.parse(ev.target.result);
                  // Basic validation: must have products and purchases keys
                  if(!parsed.products||!Array.isArray(parsed.products))
                    throw new Error("Archivo inválido: falta la lista de productos");

                  const migrated=migrateData(parsed);
                  setData(migrated);
                  toast("Datos restaurados correctamente — "+parsed.products.length+" productos cargados","success");

              reader.readAsText(file);
              e.target.value=""; // reset so same file can be re-imported

          })
        )

const NAV=[
  {id:"dashboard",icon:"⊞",label:"Inicio"},
  {id:"inventory",icon:"📦",label:"Stock"},
  {id:"recipes",icon:"🍽",label:"Recetas"},
  {id:"abastecimiento",icon:"🛒",label:"Compras"},
  {id:"salesrecon",icon:"🧾",label:"Ventas"},
  {id:"reports",icon:"📋",label:"Reportes"},
  {id:"menueng",icon:"📊",label:"Menú"},
  {id:"users",icon:"👥",label:"Equipo"},
  {id:"settings",icon:"⚙️",label:"Config"},
];
// Which pages stay on the bar (daily-use); the rest fold into "Más".
const NAV_PRIMARY=["dashboard","salesrecon","inventory","recipes"];
function BottomNav({page,setPage,role}){
  const [moreOpen,setMoreOpen]=useState(false);
  const visibleNav=NAV.filter(n=>{
    if(n.ownerOnly&&role!=="owner")return false;
    if(n.id==="reports"&&!can(role,"viewReports"))return false;
    if(n.id==="users"&&!can(role,"manageUsers"))return false;
    if(n.id==="settings"&&!can(role,"manageSettings"))return false;
    if(n.id==="recipes"&&!can(role,"editRecipes")&&role!=="owner")return false;
    if(n.id==="menueng"&&role!=="owner"&&role!=="chef")return false;
    if(n.id==="abastecimiento"&&!can(role,"editPurchases")&&role!=="owner")return false;
    return true;
  });
  // ≤5 items → show them all; more → keep 4 daily-use tabs + a "Más" overflow.
  const overflow=visibleNav.length>5;
  const primary=overflow
    ? NAV_PRIMARY.map(id=>visibleNav.find(n=>n.id===id)).filter(Boolean).slice(0,4)
    : visibleNav;
  const more=overflow?visibleNav.filter(n=>!primary.includes(n)):[];
  const moreActive=more.some(n=>n.id===page);

  const navBtn=(n,onClick,on)=>h('button',{key:n.id,onClick,style:{
    display:"flex",flexDirection:"column",alignItems:"center",gap:2,flex:1,
    background:"none",border:"none",padding:"4px 2px",cursor:"pointer",
    color:on?"var(--accent)":"var(--text3)"}},
    h('span',{style:{fontSize:on?18:16}},n.icon),
    h('span',{style:{fontSize:9,fontWeight:on?600:400}},n.label),
    on&&h('div',{style:{width:4,height:4,borderRadius:"50%",background:"var(--accent)",marginTop:1}})
  );

  return h(Fragment,null,
    h('div',{className:"app-bottomnav",style:{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,
      background:"rgba(24,28,39,0.97)",backdropFilter:"blur(20px)",borderTop:"1px solid var(--border2)",
      display:"flex",padding:"8px 0 calc(8px + env(safe-area-inset-bottom, 0px))",zIndex:100}},
      primary.map(n=>navBtn(n,()=>setPage(n.id),page===n.id)),
      overflow&&navBtn({id:"__more",icon:"☰",label:"Más"},()=>setMoreOpen(true),moreActive)
    ),
    moreOpen&&h('div',{onClick:()=>setMoreOpen(false),style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:150,display:"flex",alignItems:"flex-end"}},
      h('div',{onClick:e=>e.stopPropagation(),style:{width:"100%",maxWidth:430,margin:"0 auto",background:"var(--surface)",
        borderTopLeftRadius:18,borderTopRightRadius:18,borderTop:"1px solid var(--border2)",
        padding:"10px 16px calc(20px + env(safe-area-inset-bottom, 0px))"}},
        h('div',{style:{width:38,height:4,borderRadius:2,background:"var(--border2)",margin:"2px auto 14px"}}),
        h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
          more.map(n=>{const on=page===n.id; return h('button',{key:n.id,onClick:()=>{setPage(n.id);setMoreOpen(false);},style:{
            display:"flex",alignItems:"center",gap:11,padding:"14px",borderRadius:"var(--radius)",cursor:"pointer",textAlign:"left",
            border:"1px solid "+(on?"var(--accent)":"var(--border)"),background:on?"rgba(249,115,22,0.10)":"var(--surface2)",
            color:on?"var(--accent)":"var(--text)"}},
            h('span',{style:{fontSize:20}},n.icon),
            h('span',{style:{fontSize:13,fontWeight:600,fontFamily:"var(--sora)"}},n.label)
          );})
        )
      )
    )
  );
}

const APP_KEY = "theeasycook_v3_data";

function migrateData(saved) {
  // Deep-merge saved data against INIT so new array/object keys
  // added in later versions are always present, even on old saved data.
  const out = {};
  for (const key of Object.keys(INIT)) {
    const initVal = INIT[key];
    const savedVal = saved[key];
    if (savedVal === undefined || savedVal === null) {
      // Key missing from saved data — use INIT default
      out[key] = Array.isArray(initVal) ? [] : (typeof initVal === 'object' ? {...initVal} : initVal);
    } else if (Array.isArray(initVal)) {
      // Arrays: keep saved data as-is (don't merge individual items)
      out[key] = savedVal;
    } else if (typeof initVal === 'object' && initVal !== null) {
      // Plain objects (e.g. settings): spread INIT defaults then overlay saved
      out[key] = {...initVal, ...savedVal};
    } else {
      out[key] = savedVal;
    }
  }
  return out;
}

function loadData() {
  try {
    const raw = localStorage.getItem(APP_KEY);
    if (raw) return migrateData(JSON.parse(raw));
  } catch(e) {}
  return INIT;
}

function App(){
  const cloud=useContext(CloudCtx);
  const [page,setPage]=useState("dashboard");
  // Seed from the cloud snapshot Root already fetched when signed in; otherwise
  // from the local cache (offline, or pure-local mode with no Supabase).
  const [data,setDataRaw]=useState(()=>{
    const base = cloud&&cloud.initialData ? migrateData(cloud.initialData) : loadData();
    if(cloud&&cloud.restaurantId){ base[TOMB]=pruneTombstones(base); reconcileAll(base); }
    return base;
  });
  const [toastMsg,setToastMsg]=useState(null);
  const [currentUser,setCurrentUser]=useState(null);
  // Live cloud connection status for the top-bar pill: synced | syncing | offline.
  const [syncStatus,setSyncStatus]=useState(cloud&&cloud.online===false?"offline":"synced");
  const toast=useCallback((msg,type="success")=>setToastMsg({msg,type}),[]);

  // ── Cloud sync engine ────────────────────────────────────────────────────
  // Per-collection, so a device only ever overwrites the exact section it
  // changed. Realtime keeps every device current; on a same-section clash the
  // server returns a conflict and we merge (union by record id) + retry, so
  // several people add/edit at once without losing work. Deletions are recorded
  // as tombstones so a merge can't resurrect them. dataRef is the single source
  // of truth for async sync; React state just mirrors it (avoids updater races).
  const dataRef=useRef(data);
  const versionsRef=useRef((cloud&&cloud.initialVersions)||{}); // {name: server updated_at}
  const dirtyRef=useRef(new Set());                             // collections with unsynced edits
  const syncingRef=useRef(false);
  const scheduleRef=useRef(null);                               // debounced flush
  const retryRef=useRef(null);                                  // offline backoff timer
  const resyncingRef=useRef(false);                             // guards overlapping reconnect resyncs
  const wasDisconnectedRef=useRef(false);                       // realtime dropped → resync on rejoin
  const resyncRef=useRef(null);                                 // latest resync() for event handlers
  const currentUserRef=useRef(currentUser);                     // latest PIN user (for logging + realtime)
  useEffect(()=>{ currentUserRef.current=currentUser; },[currentUser]);

  const commit=useCallback((next)=>{                            // ref + offline cache, then re-render
    dataRef.current=next;
    try{ localStorage.setItem(APP_KEY,JSON.stringify(next)); }catch(e){}
    setDataRaw(next);
  },[]);

  const scheduleSync=useCallback(()=>{ if(scheduleRef.current)scheduleRef.current(); },[]);

  // Fold a server copy of ONE collection into local state. On a conflict/our own
  // dirty edits we union (keep our changes); otherwise take the server copy —
  // then drop any tombstoned ids so deletes stick. TOMB rows union + reconcile all.
  const foldIn=useCallback((name, serverData, forceMerge)=>{
    const prev=dataRef.current;
    let next;
    if(name===TOMB){
      next={...prev,[TOMB]:mergeTombstones(prev[TOMB], serverData)};
      reconcileAll(next);
    }else{
      let v=(forceMerge||dirtyRef.current.has(name))?mergeCollection(prev[name],serverData):serverData;
      v=withoutTombstoned(name, v, prev[TOMB]);
      next={...prev,[name]:v};
    }
    commit(next);
  },[commit]);

  const flushSync=useCallback(async()=>{
    if(!cloud||!cloud.restaurantId||!cloud.saveCollection) return;
    if(syncingRef.current) return;
    syncingRef.current=true;
    if(dirtyRef.current.size>0) setSyncStatus("syncing");
    let networkError=false;
    try{
      while(dirtyRef.current.size>0){
        const name=dirtyRef.current.values().next().value;
        dirtyRef.current.delete(name);
        try{
          let res=await cloud.saveCollection(name, dataRef.current[name], versionsRef.current[name]);
          let tries=0;
          while(res&&res.status==="conflict"&&tries<6){
            tries++;
            foldIn(name, res.data, true);                        // merge server + keep our edits
            versionsRef.current[name]=res.version;
            res=await cloud.saveCollection(name, dataRef.current[name], versionsRef.current[name]);
          }
          if(res&&res.status==="ok"){ versionsRef.current[name]=res.version; }
          else if(res&&res.status==="conflict"){ versionsRef.current[name]=res.version; dirtyRef.current.add(name); }
        }catch(e){
          dirtyRef.current.add(name); networkError=true; break;   // offline/RLS → retry later
        }
      }
    }finally{
      syncingRef.current=false;
      if(networkError) setSyncStatus("offline");
      else if(dirtyRef.current.size===0) setSyncStatus("synced");
      if(dirtyRef.current.size>0){
        if(networkError){                                          // back off while offline
          if(!retryRef.current) retryRef.current=setTimeout(()=>{ retryRef.current=null; flushSync(); },5000);
        }else scheduleSync();
      }
    }
  },[cloud,foldIn,scheduleSync]);

  // Reconnect resync: pull the latest from the cloud (so we catch changes other
  // devices made while we were offline), keep our own unsynced edits (including
  // any that survived an offline reload — detected by diffing local vs server),
  // then push everything pending. Called on network/realtime reconnect.
  const resync=useCallback(async()=>{
    if(!cloud||!cloud.restaurantId||!cloud.fetchAll) return;
    if(resyncingRef.current) return;
    resyncingRef.current=true;
    setSyncStatus("syncing");
    try{
      const fetched=await cloud.fetchAll(cloud.restaurantId);      // {data, versions}
      const sdata=(fetched&&fetched.data)||{}, sver=(fetched&&fetched.versions)||{};
      for(const name of COLLECTION_KEYS){
        const serverVal=(name in sdata)?sdata[name]:INIT[name];
        // local-only edits not yet flagged dirty (survived an offline reload) → flag so we merge+push
        if(!dirtyRef.current.has(name)){
          try{ if(JSON.stringify(dataRef.current[name])!==JSON.stringify(serverVal)) dirtyRef.current.add(name); }catch(e){}
        }
        versionsRef.current[name]=sver[name];
        foldIn(name, serverVal, dirtyRef.current.has(name));       // dirty → union (keep local); else take server
      }
    }catch(e){ setSyncStatus("offline"); resyncingRef.current=false; return; }
    resyncingRef.current=false;
    flushSync();                                                    // push anything pending (updates the pill)
  },[cloud,foldIn,flushSync]);
  useEffect(()=>{ resyncRef.current=resync; },[resync]);

  // Connection watcher: the moment the browser regains/loses connectivity, react
  // instantly (instead of only when the 5s retry happens to succeed).
  useEffect(()=>{
    if(!cloud||!cloud.restaurantId) return;
    const goOnline=()=>{ if(resyncRef.current) resyncRef.current(); };
    const goOffline=()=>{ setSyncStatus("offline"); };
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    if(typeof navigator!=="undefined" && navigator.onLine===false) setSyncStatus("offline");
    return ()=>{ window.removeEventListener("online",goOnline); window.removeEventListener("offline",goOffline); };
  },[cloud]);

  useEffect(()=>{ scheduleRef.current=debounce(flushSync,1200); },[flushSync]);

  const setData=useCallback((updater)=>{
    const prev=dataRef.current;
    let next=typeof updater==="function"?updater(prev):updater;
    // Audit log — record what changed, attributed to the current PIN user.
    // Wrapped so a logging error can NEVER block the actual save.
    try{
      const u=currentUserRef.current;
      if(u){
        const entries=auditDiff(prev,next,u);
        if(entries.length) next={...next, activityLog:[...entries,...(next.activityLog||[])].slice(0,1000)};
      }
    }catch(e){}
    if(cloud&&cloud.restaurantId){
      // Record deletions as tombstones (and clear them on re-add) per collection.
      // activityLog is append-only — never tombstone it (capping would delete
      // others' entries via merge).
      let tomb=next[TOMB]||{}, tombChanged=false;
      for(const k of COLLECTION_KEYS){
        if(k===TOMB||k==="activityLog"||next[k]===prev[k]||!idArr(prev[k])) continue;
        const removed=idsRemoved(prev[k],next[k]), readded=idsRemoved(next[k],prev[k]);
        if(removed.length||readded.length){
          const t={...(tomb[k]||{})}, nowISO=new Date().toISOString();
          for(const id of removed) t[id]=nowISO;
          for(const id of readded) delete t[id];
          tomb={...tomb,[k]:t}; tombChanged=true;
        }
      }
      if(tombChanged){ next={...next,[TOMB]:tomb}; dirtyRef.current.add(TOMB); }
      for(const k of COLLECTION_KEYS) if(next[k]!==prev[k]) dirtyRef.current.add(k); // flag changed sections
    }
    commit(next);
    if(cloud&&cloud.restaurantId) scheduleSync();
  },[cloud,commit,scheduleSync]);

  // Realtime: fold in changes other devices make, live.
  useEffect(()=>{
    if(!cloud||!cloud.restaurantId||!cloud.sb) return;
    try{ if(cloud.accessToken&&cloud.sb.realtime&&cloud.sb.realtime.setAuth) cloud.sb.realtime.setAuth(cloud.accessToken); }catch(e){}
    const ch=cloud.sb.channel("collections-"+cloud.restaurantId)
      .on("postgres_changes",
        {event:"*",schema:"public",table:"collections",filter:"restaurant_id=eq."+cloud.restaurantId},
        (payload)=>{
          const row=payload.new; if(!row||!row.name) return;
          const ver=row.updated_at, known=versionsRef.current[row.name];
          if(known&&ver&&new Date(ver)<=new Date(known)) return;   // our own echo / already have it
          versionsRef.current[row.name]=ver;
          foldIn(row.name, row.data, false);
          if(dirtyRef.current.has(row.name)) scheduleSync();       // push our merged version back
        })
      // The realtime socket doubles as a live Supabase heartbeat: a dropped/errored
      // channel means we're cut off; a fresh SUBSCRIBED after a drop triggers a resync.
      .subscribe((status)=>{
        if(status==="SUBSCRIBED"){
          if(wasDisconnectedRef.current){ wasDisconnectedRef.current=false; if(resyncRef.current) resyncRef.current(); }
          else setSyncStatus(s=>s==="offline"?"synced":s);
        }else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
          wasDisconnectedRef.current=true; setSyncStatus("offline");
        }
      });
    return ()=>{ try{cloud.sb.removeChannel(ch);}catch(e){} };
  },[cloud,foldIn,scheduleSync]);

  // Activity logger
  const logActivity=useCallback((action,target,module)=>{
    if(!currentUser)return;
    const entry={id:"AL"+uid(),userId:currentUser.id,userName:currentUser.name,
      action,target,module,ts:new Date().toISOString().slice(0,19)};
    setData(d=>({...d,activityLog:[entry,...(d.activityLog||[])]}));
  },[currentUser,setData]);

  // Notify the OWNER of a notable change (fire-and-forget). Records an event
  // row that the owner's device toasts live; the owner's own actions are skipped
  // on their end, so this is safe to call from any device.
  const notify=useCallback((kind,message)=>{
    if(!cloud||!cloud.restaurantId||!cloud.logEvent) return;
    const who=(currentUser&&currentUser.name)?currentUser.name.split(" ")[0]:"Alguien";
    try{ Promise.resolve(cloud.logEvent(kind, who+": "+message, currentUser&&currentUser.name)).catch(()=>{}); }catch(e){}
  },[cloud,currentUser]);

  // Live change alerts:
  //  • OWNER device → every notable change (toggleable in Settings).
  //  • CASHIER (staff device) → out-of-stock only, so they stop selling a dish
  //    the moment the kitchen/limit marks it unavailable. (RLS only lets staff
  //    devices receive out_of_stock events; see 08_cashier_alerts.sql.)
  useEffect(()=>{
    if(!cloud||!cloud.restaurantId||!cloud.sb) return;
    const EMOJI={out_of_stock:"🚫",recipe_change:"✏️",price_change:"💲",delete:"🗑",device_join:"📱"};
    const TYPE={delete:"error",out_of_stock:"info",price_change:"info",recipe_change:"info",device_join:"info"};
    try{ if(cloud.accessToken&&cloud.sb.realtime&&cloud.sb.realtime.setAuth) cloud.sb.realtime.setAuth(cloud.accessToken); }catch(e){}
    const ch=cloud.sb.channel("events-"+cloud.restaurantId)
      .on("postgres_changes",
        {event:"INSERT",schema:"public",table:"events",filter:"restaurant_id=eq."+cloud.restaurantId},
        (payload)=>{
          const row=payload.new; if(!row) return;
          if(cloud.userId&&row.actor_user===cloud.userId) return;         // skip this device's own actions
          if(cloud.isOwner){
            if(getSettings(dataRef.current||{}).notifyChanges===false) return; // owner turned it off
            toast((EMOJI[row.kind]?EMOJI[row.kind]+" ":"")+row.message, TYPE[row.kind]||"info");
          }else if(row.kind==="out_of_stock"){
            const cu=currentUserRef.current;                              // cashier-only, on a staff device
            if(cu&&cu.role==="cashier") toast("🚫 "+row.message, "error");
          }
        })
      .subscribe();
    return ()=>{ try{cloud.sb.removeChannel(ch);}catch(e){} };
  },[cloud,toast]);

  const doLogout=()=>{
    setCurrentUser(null);
    setPage("dashboard");
  };

  // Brand-new install (no owner account yet) → create the owner first
  const ownerExists=(data.users||[]).some(u=>u.role==="owner");
  if(!ownerExists){
    return h(FirstRunSetup,{data,setData,setCurrentUser,toast});
  }

  // Show PIN login if no user is logged in
  if(!currentUser){
    return h(PinLogin,{users:data.users,onLogin:setCurrentUser,firstRun:isFirstRun(data)});
  }

  // Legacy: replace a demo owner account before use (won't trigger on a clean install)
  if(isFirstRun(data)&&currentUser.role==="owner"){
    return h(FirstRunSetup,{data,setData,setCurrentUser,toast});
  }

  // Guided first-time setup — one-time launcher for a brand-new owner
  if(currentUser.role==="owner"&&!data.settings?.onboarded){
    return h(SetupWizard,{data,ownerName:currentUser.name,
      onGo:pg=>{setData(d=>({...d,settings:{...d.settings,onboarded:true}}));if(pg)setPage(pg);}});
  }

  const role=currentUser.role;

  const pages={
    dashboard:h(Dashboard,{data,setPage,currentUser}),
    inventory: can(role,"editInventory")
      ? h(Inventory,{data,setData,toast,logActivity})
      : h(PermGate,{perm:"editInventory",role}),
    recipes: can(role,"editRecipes")
      ? h(Recipes,{data,setData,toast,logActivity,notify})
      : h(PermGate,{perm:"editRecipes",role}),
    menueng:h(MenuEngineering,{data,setData,toast}),
    abastecimiento: can(role,"editPurchases")
      ? h(Abastecimiento,{data,setData,toast,logActivity})
      : h(PermGate,{perm:"editPurchases",role}),
    sales:h(Sales,{data,setData,toast,currentUser,notify}),
    payrecon:h(PaymentRecon,{data,setData,toast}),
    salesrecon: can(role,"editSales")
      ? h(SalesRecon,{data,setData,toast,logActivity,currentUser})
      : h(PermGate,{perm:"editSales",role}),
    reports: can(role,"viewReports")
      ? h(Reports,{data})
      : h(PermGate,{perm:"viewReports",role}),
    users: can(role,"manageUsers")
      ? h(UsersPage,{data,setData,toast,currentUser})
      : h(PermGate,{perm:"manageUsers",role}),
    activitylog:h(ActivityLog,{data,setPage}),
    settings: can(role,"manageSettings")
      ? h(SettingsPage,{data,setData,toast})
      : h(PermGate,{perm:"manageSettings",role}),
  };

  const roleInfo=ROLES[role]||ROLES.viewer;

  return h(Fragment,null,
    h('div',{className:"app-shell",style:{position:"fixed",top:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,height:"100%",background:"var(--bg)",display:"flex",flexDirection:"column",overflowX:"hidden"}},
      // Top bar
      h('div',{className:"app-topbar",style:{position:"sticky",top:0,zIndex:50,background:"rgba(15,17,23,0.9)",backdropFilter:"blur(20px)",
        borderBottom:"1px solid var(--border)",padding:"12px 20px 10px",
        display:"flex",alignItems:"center",justifyContent:"space-between"}},
        PAGE_TITLES[page]
          ?h('h1',{style:{fontFamily:"var(--sora)",fontSize:18,fontWeight:700}},PAGE_TITLES[page])
          :h('div',{style:{display:"flex",alignItems:"center",gap:8}},
            h('div',{style:{width:28,height:28,borderRadius:8,background:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}},"👨‍🍳"),
            h('span',{style:{fontFamily:"var(--sora)",fontSize:17,fontWeight:700}},"The Easy Cook")
          ),
        h('div',{style:{display:"flex",gap:8,alignItems:"center"}},

          // Cloud sync status pill (cloud mode only). Green dot alone when all is
          // well; expands with a label when syncing or offline so staff can tell.
          cloud&&cloud.restaurantId&&(()=>{
            const S={
              synced:{c:"var(--green)",t:"",tip:"Sincronizado con la nube"},
              syncing:{c:"var(--blue)",t:"Sincronizando…",tip:"Guardando en la nube…"},
              offline:{c:"var(--yellow)",t:"Sin conexión",tip:"Sin conexión — tus cambios se guardan aquí y se sincronizarán al reconectar"}
            }[syncStatus]||{c:"var(--green)",t:"",tip:""};
            return h('div',{title:S.tip,style:{display:"flex",alignItems:"center",gap:5,
              padding:S.t?"3px 10px":"4px",borderRadius:20,
              background:S.t?"var(--surface2)":"transparent",border:S.t?"1px solid var(--border2)":"none"}},
              h('div',{style:{width:8,height:8,borderRadius:"50%",background:S.c,flexShrink:0,
                animation:syncStatus==="syncing"?"ecPulse 1s ease-in-out infinite":"none"}}),
              S.t&&h('span',{style:{fontSize:11,fontWeight:600,color:"var(--text2)",whiteSpace:"nowrap"}},S.t)
            );
          })(),

          // Current user chip — hide on desktop (shown in sidebar)
          h('button',{onClick:()=>setPage("activitylog"),className:"mobile-user-chip",style:{
            display:"flex",alignItems:"center",gap:5,
            background:roleInfo.bg,border:`1px solid ${roleInfo.color}`,
            borderRadius:20,padding:"3px 10px 3px 7px",cursor:"pointer"
          }},
            h('span',{style:{fontSize:14}},currentUser.avatar||roleInfo.icon),
            h('span',{style:{fontSize:11,fontWeight:600,color:roleInfo.color}},
              currentUser.name.split(" ")[0])
          ),
          // Logout — mobile only
          h('button',{onClick:doLogout,className:"mobile-logout-btn",style:{
            background:"var(--surface2)",border:"1px solid var(--border2)",
            borderRadius:8,padding:"5px 9px",fontSize:11,color:"var(--text3)",cursor:"pointer"
          }},"🚪")
        )
      ),
      // Desktop sidebar
      h(Sidebar,{page,setPage,role,currentUser,onLogout:doLogout,data}),
      // Main content
      h('div',{className:"app-content",style:{padding:"16px 20px calc(90px + env(safe-area-inset-bottom, 0px))",flex:1,overflowY:"auto",overflowX:"hidden",WebkitOverflowScrolling:"touch"},key:page},pages[page]),
      // Mobile bottom nav
      h(BottomNav,{page,setPage,role}),
      toastMsg&&h(Toast,{msg:toastMsg.msg,type:toastMsg.type,onDone:()=>setToastMsg(null)})
    )
  );
}

// ─── CLOUD AUTH LAYER ────────────────────────────────────────────────────────
// Sits ABOVE the existing PIN flow. One cloud session per restaurant (owner
// email/password, or an anonymous device joined with a team code); the PIN
// screen still picks who's on the till. See supabase/03_devices.sql.

// Translate the most common Supabase auth errors to plain Spanish.
function traducirAuthError(msg){
  const m=(msg||"").toLowerCase();
  if(m.includes("invalid login")) return "Correo o contraseña incorrectos";
  if(m.includes("already registered")||m.includes("already been registered")) return "Ese correo ya tiene una cuenta. Inicia sesión.";
  if(m.includes("anonymous")&&m.includes("disabled")) return "El acceso por código no está habilitado todavía. Avísale al administrador.";
  if(m.includes("password")) return "La contraseña debe tener al menos 6 caracteres";
  if(m.includes("email")) return "Revisa el correo ingresado";
  if(m.includes("network")||m.includes("fetch")) return "Sin conexión. Revisa tu internet.";
  return msg||"Ocurrió un error";
}

// Shown after the user clicks a password-reset link (Supabase fires a
// PASSWORD_RECOVERY session). They set a new password, then continue logged in.
function ResetPasswordScreen({sb,onDone}){
  const [pw,setPw]=useState(""); const [pw2,setPw2]=useState("");
  const [error,setError]=useState(""); const [busy,setBusy]=useState(false);
  const save=async()=>{
    if(pw.length<6){setError("La contraseña debe tener al menos 6 caracteres");return;}
    if(pw!==pw2){setError("Las contraseñas no coinciden");return;}
    setBusy(true);setError("");
    const {error}=await sb.auth.updateUser({password:pw});
    if(error){setError(traducirAuthError(error.message));setBusy(false);return;}
    onDone(); // recovery session is now a normal session → continue into the app
  };
  return h('div',{style:{position:"fixed",inset:0,background:"var(--bg)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"24px 20px"}},
    h('div',{className:"pin-login-inner",style:{width:"100%",maxWidth:380}},
      h('div',{style:{textAlign:"center",marginBottom:20}},
        h('div',{style:{width:52,height:52,borderRadius:16,background:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,margin:"0 auto 12px"}},"🔑"),
        h('div',{style:{fontFamily:"var(--sora)",fontSize:19,fontWeight:700}},"Nueva contraseña"),
        h('div',{style:{fontSize:13,color:"var(--text2)",marginTop:6}},"Elige una contraseña nueva para tu cuenta.")),
      h(FormRow,{label:"Nueva contraseña (mín. 6)"},
        h('input',{type:"password",value:pw,autoComplete:"new-password",onChange:e=>{setPw(e.target.value);setError("");},placeholder:"••••••••"})),
      h(FormRow,{label:"Confirma la contraseña"},
        h('input',{type:"password",value:pw2,autoComplete:"new-password",onChange:e=>{setPw2(e.target.value);setError("");},placeholder:"••••••••"})),
      error&&h('div',{style:{fontSize:12,color:"var(--red)",margin:"4px 0 12px",fontWeight:500,textAlign:"center"}},error),
      h(Btn,{onClick:save,size:"lg",disabled:busy,style:{width:"100%",marginTop:6}},busy?"Guardando…":"Guardar contraseña")
    )
  );
}

    setBusy(false);

  const removeAdmin=async(uid)=>{ setBusy(true); setAdminMsg("");

  const saveBilling=async()=>{ if(!billModal)return; setBusy(true);
    try{ await sb.rpc("admin_set_billing",{p_id:billModal.id,p_plan:bf.plan.trim()||null,p_price:bf.price===""?null:Number(bf.price),p_status:bf.status,p_next_due:bf.next_due||null,p_notes:bf.notes.trim()||null}); setBillModal(null); await load(); }catch(e){}
    setBusy(false);

  const markPaid=async(r)=>{ setBusy(true);
    try{ await sb.rpc("admin_mark_paid",{p_id:r.id,p_period_days:30}); await load(); }catch(e){}

  };
  const STATUS={trial:{t:"Prueba",c:"var(--yellow)"},active:{t:"Activo",c:"var(--green)"},overdue:{t:"Vencido",c:"var(--red)"},canceled:{t:"Cancelado",c:"var(--text3)"}};
