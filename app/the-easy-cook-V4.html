          h('div',{className:"kpi-hero-val",style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:800,color:k.color,fontVariantNumeric:"tabular-nums"}},k.value),
          h('div',{style:{fontSize:9,color:"var(--text3)",marginTop:2,textTransform:"uppercase",letterSpacing:"0.05em"}},k.label),
          k.sub&&h('div',{style:{fontSize:9,color:"var(--text3)",opacity:0.7,marginTop:1}},k.sub)
        ))
      ),

      // Secondary info strip — netas + mermas + caja
      hasDataToday&&h('div',{style:{
        display:"flex",justifyContent:"space-between",
        padding:"8px 14px",borderTop:"1px solid var(--border)",
        fontSize:11,color:"var(--text3)"
      }},
        _dashSettings.igvMode!=="ninguno"
          ?h('span',null,"Neto: ",h('strong',{style:{color:"var(--text2)"}},fmtCost(todayNetRevenue)),
             " · IGV: ",h('strong',null,fmtCost(todayRevenue-todayNetRevenue)))
          :h('span',null,closedToday.length+" pedidos cerrados"),
        todayWastageCost>0
          ?h('span',null,"Mermas hoy: ",h('strong',{style:{color:"var(--red)"}},fmtCost(todayWastageCost)))
          :h('span',{style:{color:"var(--green)"}},"Sin mermas ✓")
      ),
      hasDataToday&&totalPaxToday>0&&h('div',{style:{
        display:"flex",justifyContent:"space-between",
        padding:"8px 14px",borderTop:"1px solid var(--border)",
        fontSize:11,color:"var(--text3)"
      }},
        h('span',null,"👥 Personas atendidas hoy: ",h('strong',{style:{color:"var(--text2)"}},String(totalPaxToday))),
        h('span',null,"Ticket/persona: ",h('strong',{style:{color:"var(--accent)"}},fmtCost(avgTicketPerPaxToday)))
      )
    ),

    // ── CIERRE DEL DÍA (cash recon status) ───────────────────────────────────
    showCierre&&h('div',{onClick:()=>setPage("payrecon"),style:{
      display:"flex",alignItems:"center",gap:10,
      background:cashMatchStatus==="ok"?"rgba(34,197,94,0.08)":cashMatchStatus==="gap"?"rgba(239,68,68,0.09)":"rgba(234,179,8,0.08)",
      border:`1px solid ${cashMatchStatus==="ok"?"rgba(34,197,94,0.25)":cashMatchStatus==="gap"?"rgba(239,68,68,0.35)":"rgba(234,179,8,0.3)"}`,
      borderRadius:"var(--radius)",padding:"11px 14px",marginBottom:16,cursor:"pointer"
    }},
      h('span',{style:{fontSize:18}},cashMatchStatus==="ok"?"✅":cashMatchStatus==="gap"?"❌":"⏳"),
      h('div',{style:{flex:1}},
        h('div',{style:{fontSize:12,fontWeight:700,
          color:cashMatchStatus==="ok"?"var(--green)":cashMatchStatus==="gap"?"var(--red)":"var(--yellow)"}},
          cashMatchStatus==="ok"?"Caja cuadrada ✓":cashMatchStatus==="gap"?"Diferencia en caja":"Caja pendiente de cuadre"
        ),
        h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:1}},
          cashMatchStatus==="ok"?"Sin diferencias · Cuadre realizado"
          :cashMatchStatus==="gap"?(cashGap>0?"+":"")+fmtCost(cashGap)+" vs Easy Cook"
          :"Toca para ir a Ventas & Caja"
        )
      ),
      h('span',{style:{color:"var(--text3)",fontSize:14}},"›")
    ),

    // ── TOP DISHES TODAY ──────────────────────────────────────────────────────
    topDishes.some(r=>r.sold>0)&&h('div',{style:{marginBottom:16}},
      h('div',{style:{
        display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8
      }},
        h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700}},"Más vendidos hoy"),
        h('button',{onClick:()=>setPage("salesrecon"),style:{
          background:"none",border:"none",color:"var(--accent)",
          fontSize:11,fontWeight:600,cursor:"pointer",padding:0
        }},"Ver todos →")
      ),
      h('div',{style:{display:"flex",flexDirection:"column",gap:6}},
        topDishes.filter(r=>r.sold>0).map((r,i)=>{
          const podiumColor=i===0?"var(--accent)":i===1?"var(--blue)":"var(--text3)";
          const podiumBg=i===0?"rgba(249,115,22,0.2)":i===1?"rgba(59,130,246,0.15)":"rgba(156,163,175,0.1)";
          return h('div',{key:r.id,
            onClick:()=>setPage("menueng"),
            style:{
              display:"flex",alignItems:"center",gap:10,
              background:"var(--surface)",border:"1px solid var(--border)",
              borderRadius:"var(--radius-sm)",padding:"10px 12px",cursor:"pointer"
            }},
            // Rank badge
            h('div',{style:{
              width:28,height:28,borderRadius:8,background:podiumBg,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontFamily:"var(--sora)",fontWeight:800,fontSize:13,
              color:podiumColor,flexShrink:0
            }},i+1),
            // Name + sold count
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{style:{fontSize:13,fontWeight:600,
                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},r.name),
              h('div',{style:{fontSize:11,color:"var(--text2)",marginTop:1}},
                r.sold+" porciones · margen "+fmtCost(r.margin))
            ),
            // Cost % badge
            h('div',{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2,flexShrink:0}},
              h(Badge,{color:r.costPct>getFCTWarn(data)?"red":r.costPct>fct?"yellow":"green"},fmtPct(r.costPct)),
              h('div',{style:{fontSize:9,color:"var(--text3)"}},fmtCost(r.netP)+" neto")
            )
          );
        })
      )
    ),

    // ── QUICK ACTIONS GRID ────────────────────────────────────────────────────
    h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700,marginBottom:8}},"Acciones rápidas"),
    h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}},
      [
        {
          icon:"🛒",label:"Nueva compra",sub:"Registrar ingrediente",
          color:"var(--blue)",bg:"rgba(59,130,246,0.1)",border:"rgba(59,130,246,0.3)",
          page:"abastecimiento"
        },
        {
          icon:"💰",label:"Cuadre de caja",sub:"Yape, efectivo, tarjeta",
          color:"var(--green)",bg:"rgba(34,197,94,0.09)",border:"rgba(34,197,94,0.3)",
          page:"salesrecon"
        },
        {
          icon:"📋",label:"Conteo de stock",sub:"Inventario físico",
          color:"var(--accent)",bg:"rgba(249,115,22,0.09)",border:"rgba(249,115,22,0.3)",
          page:"inventory"
        },
        {
          icon:"📊",label:"Ver reportes",sub:"P&L, costos, tendencias",
          color:"#c084fc",bg:"rgba(192,132,252,0.09)",border:"rgba(192,132,252,0.3)",
          page:"reports"
        }
      ].map(a=>h('div',{key:a.label,onClick:()=>setPage(a.page),style:{
        background:a.bg,border:`1px solid ${a.border}`,
        borderRadius:"var(--radius)",padding:"14px 14px 12px",cursor:"pointer",
        transition:"opacity .15s"
      }},
        h('div',{style:{fontSize:24,marginBottom:6}},a.icon),
        h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700,color:a.color,marginBottom:2}},a.label),
        h('div',{style:{fontSize:11,color:"var(--text3)"}},a.sub)
      ))
    ),

    // ── STOCK SNAPSHOT ────────────────────────────────────────────────────────
    h('div',{style:{marginBottom:16}},
      h('div',{style:{
        display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8
      }},
        h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700}},"Estado del inventario"),
        h('button',{onClick:()=>setPage("inventory"),style:{
          background:"none",border:"none",color:"var(--accent)",
          fontSize:11,fontWeight:600,cursor:"pointer",padding:0
        }},"Ver todo →")
      ),
      h('div',{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}},
        [
          {
            label:"Total",
            value:products.length,
            icon:"📦",
            color:"var(--text2)",
            bg:"var(--surface)"
          },
          {
            label:"Bajo stock",
            value:lowStock.length,
            icon:"⚠️",
            color:"var(--yellow)",
            bg:"rgba(234,179,8,0.08)",
            onClick:()=>setPage("inventory")
          },
          {
            label:"Críticos",
            value:critical.length,
            icon:"🚨",
            color:"var(--red)",
            bg:"rgba(239,68,68,0.08)",
            onClick:()=>setPage("inventory")
          }
        ].map(s=>h('div',{key:s.label,
          onClick:s.onClick,
          style:{
            background:s.bg,border:"1px solid var(--border)",
            borderRadius:"var(--radius-sm)",padding:"12px 10px",
            textAlign:"center",cursor:s.onClick?"pointer":"default"
          }},
          h('div',{style:{fontSize:18,marginBottom:2}},s.icon),
          h('div',{style:{fontFamily:"var(--sora)",fontSize:20,fontWeight:800,color:s.color}},s.value),
          h('div',{style:{fontSize:10,color:"var(--text3)",marginTop:2,textTransform:"uppercase",letterSpacing:"0.04em"}},s.label)
        ))
      ),
      // Critical items inline — show names if any
      critical.length>0&&h('div',{style:{
        marginTop:8,padding:"8px 12px",
        background:"rgba(239,68,68,0.07)",border:"1px solid rgba(239,68,68,0.2)",
        borderRadius:"var(--radius-sm)",fontSize:11,color:"var(--text2)",lineHeight:1.6
      }},
        h('span',{style:{fontWeight:600,color:"var(--red)"}},critical.length+" crítico"+(critical.length!==1?"s":"")+": "),
        critical.map(p=>p.name).join(", ")
      )
    ),

    // ── PRICING ALERTS (top 3 if >0) ─────────────────────────────────────────
    pricingAlerts.length>0&&h('div',{style:{marginBottom:16}},
      h('div',{style:{
        display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8
      }},
        h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700,color:"var(--yellow)"}},
          "💸 "+pricingAlerts.length+" plato"+(pricingAlerts.length!==1?"s":"")+" con costo alto"
        ),
        h('button',{onClick:()=>setPage("menueng"),style:{
          background:"none",border:"none",color:"var(--accent)",
          fontSize:11,fontWeight:600,cursor:"pointer",padding:0
        }},"Analizar →")
      ),
      h('div',{style:{display:"flex",flexDirection:"column",gap:5}},
        pricingAlerts.slice(0,3).map(r=>h('div',{key:r.id,
          onClick:()=>setPage("recipes"),
          style:{
            display:"flex",alignItems:"center",justifyContent:"space-between",
            padding:"9px 12px",
            background:"rgba(234,179,8,0.07)",border:"1px solid rgba(234,179,8,0.25)",
            borderRadius:"var(--radius-sm)",cursor:"pointer"
          }
        },
          h('div',null,
            h('div',{style:{fontSize:12,fontWeight:600}},r.name),
            h('div',{style:{fontSize:10,color:"var(--text3)"}},
              "Precio actual: "+fmtCost(r.price)+(r.suggestedGross?" · Sugerido: "+fmtCost(r.suggestedGross):""))
          ),
          h('div',{style:{
            fontFamily:"var(--sora)",fontSize:13,fontWeight:800,color:"var(--red)"
          }},fmtPct(r.costPct))
        ))
      )
    )
  );
}


// ─── WASTAGE PANEL ────────────────────────────────────────────────────────────
const REASON_META={
  "Vencimiento":       {icon:"📅",color:"var(--red)"},
  "Daño/golpe":        {icon:"💥",color:"var(--yellow)"},
  "Mal almacenamiento":{icon:"❄️", color:"var(--blue)"},
  "Exceso de prep":    {icon:"🔪",color:"var(--accent)"},
  "Error de cocina":   {icon:"🍳",color:"var(--yellow)"},
  "Otro":              {icon:"📝",color:"var(--text3)"},
};

function WastagePanel({wastageLog,setData,toast}){
  const [reasonFilter,setReasonFilter]=useState("all");
  const [showAll,setShowAll]=useState(false);
  const [confirmDelete,setConfirmDelete]=useState(null);
  const [showDateFilter,setShowDateFilter]=useState(false);
  const [dateFrom,setDateFrom]=useState("");
  const [dateTo,setDateTo]=useState("");

  if(!wastageLog.length)return h('div',{style:{marginTop:20}},
    h(EmptyState,{icon:"🗑",title:"Sin mermas registradas",sub:"Usa el botón 🗑 Merma en cada ingrediente para registrar pérdidas"})
  );

  const clearDates=()=>{setDateFrom("");setDateTo("");};
  const activeDateFilter=dateFrom||dateTo;

  const dateFiltered=wastageLog.filter(w=>{
    if(dateFrom&&w.date<dateFrom)return false;
    if(dateTo&&w.date>dateTo)return false;
    return true;
  });

  const totalAll=dateFiltered.reduce((s,w)=>s+(w.lostValue||0),0);

  const now=new Date();
  const thisMonthStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const lastMonthDate=new Date(now.getFullYear(),now.getMonth()-1,1);
  const lastMonthStr=`${lastMonthDate.getFullYear()}-${String(lastMonthDate.getMonth()+1).padStart(2,"0")}`;
  const thisMonthTotal=wastageLog.filter(w=>w.date.startsWith(thisMonthStr)).reduce((s,w)=>s+(w.lostValue||0),0);
  const lastMonthTotal=wastageLog.filter(w=>w.date.startsWith(lastMonthStr)).reduce((s,w)=>s+(w.lostValue||0),0);
  const trend=lastMonthTotal>0?((thisMonthTotal-lastMonthTotal)/lastMonthTotal*100):null;

  const byReason={};
  dateFiltered.forEach(w=>{byReason[w.reason]=(byReason[w.reason]||0)+(w.lostValue||0);});
  const reasonEntries=Object.entries(byReason).sort((a,b)=>b[1]-a[1]);

  const byIngredient={};
  dateFiltered.forEach(w=>{
    if(!byIngredient[w.productName])byIngredient[w.productName]={total:0,count:0};
    byIngredient[w.productName].total+=(w.lostValue||0);
    byIngredient[w.productName].count++;
  });
  const topIngredient=Object.entries(byIngredient).sort((a,b)=>b[1].total-a[1].total)[0];

  const sorted=[...dateFiltered].sort((a,b)=>b.date.localeCompare(a.date));
  const filtered=reasonFilter==="all"?sorted:sorted.filter(w=>w.reason===reasonFilter);
  const visible=showAll?filtered:filtered.slice(0,8);

  const doDelete=id=>{
    setData(d=>({...d,wastageLog:(d.wastageLog||[]).filter(w=>w.id!==id)}));
    toast("Merma eliminada","info");
    setConfirmDelete(null);
  };

  const shortcuts=[
    {label:"Hoy",from:today(),to:today()},
    {label:"Esta semana",from:(()=>{const d=new Date();d.setDate(d.getDate()-d.getDay()+1);return d.toISOString().slice(0,10);})(),to:today()},
    {label:"Últimos 7d",from:(()=>{const d=new Date();d.setDate(d.getDate()-6);return d.toISOString().slice(0,10);})(),to:today()},
    {label:"Este mes",from:today().slice(0,7)+"-01",to:today()},
    {label:"Últimos 30d",from:(()=>{const d=new Date();d.setDate(d.getDate()-29);return d.toISOString().slice(0,10);})(),to:today()},
    {label:"Últimos 90d",from:(()=>{const d=new Date();d.setDate(d.getDate()-89);return d.toISOString().slice(0,10);})(),to:today()},
  ];

  return h('div',{style:{marginTop:8}},

    // Date range toggle
    h('div',{style:{display:"flex",justifyContent:"flex-end",marginBottom:10}},
      h('button',{onClick:()=>setShowDateFilter(v=>!v),style:{
        display:"flex",alignItems:"center",gap:6,padding:"7px 14px",
        borderRadius:"var(--radius-sm)",
        border:"1px solid "+(activeDateFilter?"var(--accent)":"var(--border2)"),
        background:activeDateFilter?"rgba(249,115,22,0.1)":"var(--surface)",
        color:activeDateFilter?"var(--accent)":"var(--text2)",
        fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"var(--sans)"
      }},"📅 "+(activeDateFilter?"Fechas ✕":"Fechas"))
    ),

    // Date range panel
    showDateFilter&&h('div',{style:{
      background:"var(--surface)",border:"1px solid var(--border2)",
      borderRadius:"var(--radius)",padding:"14px",marginBottom:12}},
      h('div',{style:{fontFamily:"var(--sora)",fontSize:12,fontWeight:600,marginBottom:10,color:"var(--text2)"}},"Filtrar por rango de fechas"),
      h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}},
        h('div',null,
          h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:4}},"Desde"),
          h(DatePicker,{value:dateFrom,onChange:v=>{setDateFrom(v);if(dateTo&&v>dateTo)setDateTo(v);}})
        ),
        h('div',null,
          h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:4}},"Hasta"),
          h(DatePicker,{value:dateTo,onChange:v=>{setDateTo(v);if(dateFrom&&v<dateFrom)setDateFrom(v);}})
        )
      ),
      activeDateFilter&&h('div',{style:{
        background:"rgba(249,115,22,0.08)",border:"1px solid rgba(249,115,22,0.2)",
        borderRadius:"var(--radius-sm)",padding:"8px 12px",marginBottom:8,
        display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12}},
        h('span',{style:{color:"var(--text2)"}},
          (dateFrom||"…")+" → "+(dateTo||"…"),
          " · ",h('strong',{style:{color:"var(--accent)"}},dateFiltered.length+" registro"+(dateFiltered.length!==1?"s":""))
        ),
        h('button',{onClick:clearDates,style:{background:"none",border:"none",color:"var(--red)",cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"var(--sans)"}},"Limpiar")
      ),
      h('div',{style:{display:"flex",gap:6,flexWrap:"wrap"}},
        shortcuts.map(p=>h('button',{key:p.label,onClick:()=>{setDateFrom(p.from);setDateTo(p.to);},style:{
          padding:"4px 10px",borderRadius:16,border:"1px solid var(--border2)",
          background:dateFrom===p.from&&dateTo===p.to?"rgba(249,115,22,0.15)":"var(--surface2)",
          color:dateFrom===p.from&&dateTo===p.to?"var(--accent)":"var(--text2)",
          fontSize:11,fontWeight:500,cursor:"pointer",fontFamily:"var(--sans)"
        }},p.label))
      )
    ),

    // KPI row
    h('div',{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}},
      h('div',{style:{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:"var(--radius)",padding:"10px 12px"}},
        h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:2}},activeDateFilter?"PÉRDIDA (RANGO)":"PÉRDIDA TOTAL"),
        h('div',{style:{fontSize:15,fontWeight:700,fontFamily:"var(--sora)",color:"var(--red)"}},fmtCost(totalAll)),
        h('div',{style:{fontSize:10,color:"var(--text3)"}},dateFiltered.length+" eventos")
      ),
      h('div',{style:{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:"var(--radius)",padding:"10px 12px"}},
        h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:2}},"ESTE MES"),
        h('div',{style:{fontSize:15,fontWeight:700,fontFamily:"var(--sora)",color:"var(--red)"}},fmtCost(thisMonthTotal)),
        trend!==null&&h('div',{style:{fontSize:10,color:trend>0?"var(--red)":"var(--green)"}},
          (trend>0?"↑ ":"↓ ")+Math.abs(trend).toFixed(0)+"% vs mes ant.")
      ),
      h('div',{style:{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:"var(--radius)",padding:"10px 12px"}},
        h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:2}},"MAYOR PÉRDIDA"),
        topIngredient
          ?h(Fragment,null,
              h('div',{style:{fontSize:12,fontWeight:700,color:"var(--text)",lineHeight:1.3,marginBottom:2}},topIngredient[0]),
              h('div',{style:{fontSize:10,color:"var(--red)"}},fmtCost(topIngredient[1].total)+" · "+topIngredient[1].count+"×")
            )
          :h('div',{style:{fontSize:12,color:"var(--text3)"}},"—")
      )
    ),

    // Breakdown by reason
    reasonEntries.length>0&&h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"12px 14px",marginBottom:12}},
      h('div',{style:{fontSize:12,fontWeight:600,color:"var(--text2)",marginBottom:10}},"Pérdida por causa"),
      h('div',{style:{display:"flex",flexDirection:"column",gap:7}},
        reasonEntries.map(([reason,val])=>{
          const meta=REASON_META[reason]||REASON_META["Otro"];
          const pct=totalAll>0?val/totalAll*100:0;
          return h('div',{key:reason},
            h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}},
              h('span',{style:{fontSize:12,color:"var(--text2)"}},meta.icon+" "+reason),
              h('span',{style:{fontSize:12,fontWeight:600,color:meta.color}},fmtCost(val))
            ),
            h('div',{style:{height:5,borderRadius:3,background:"var(--surface2)",overflow:"hidden"}},
              h('div',{style:{height:"100%",width:pct.toFixed(1)+"%",background:meta.color,borderRadius:3,opacity:0.85}})
            )
          );
        })
      )
    ),

    // Empty state for date range
    dateFiltered.length===0&&h('div',{style:{
      background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",
      padding:"24px",textAlign:"center",color:"var(--text3)",fontSize:13}},
      "Sin mermas en el rango seleccionado"),

    // Reason filter pills
    dateFiltered.length>0&&h('div',{style:{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:10}},
      ["all",...Object.keys(byReason)].map(r=>
        h('button',{key:r,onClick:()=>{setReasonFilter(r);setShowAll(false);},style:{
          padding:"5px 12px",borderRadius:20,border:"1px solid",whiteSpace:"nowrap",
          fontSize:12,cursor:"pointer",flexShrink:0,
          borderColor:reasonFilter===r?"var(--accent)":"var(--border2)",
          background:reasonFilter===r?"rgba(249,115,22,0.15)":"transparent",
          color:reasonFilter===r?"var(--accent)":"var(--text2)",
          fontWeight:reasonFilter===r?600:400
        }},r==="all"?"Todas":(REASON_META[r]||REASON_META["Otro"]).icon+" "+r)
      )
    ),

    // List
    dateFiltered.length>0&&h('div',{style:{display:"flex",flexDirection:"column",gap:6}},
      visible.map(w=>{
        const meta=REASON_META[w.reason]||REASON_META["Otro"];
        const isConfirming=confirmDelete===w.id;
        return h('div',{key:w.id,style:{
          background:"var(--surface)",border:"1px solid var(--border)",
          borderRadius:"var(--radius-sm)",padding:"10px 12px",
          borderLeft:`3px solid ${meta.color}`}},
          h('div',{style:{display:"flex",alignItems:"flex-start",gap:10}},
            h('div',{style:{fontSize:18,flexShrink:0,marginTop:1}},meta.icon),
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:3}},
                h('div',{style:{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},w.productName),
                h('div',{style:{fontSize:14,fontWeight:700,color:"var(--red)",flexShrink:0}},`−${fmtCost(w.lostValue)}`)
              ),
              h('div',{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:w.note?4:0}},
                h('span',{style:{fontSize:11,color:"var(--text3)",background:"var(--surface2)",borderRadius:4,padding:"1px 6px"}},`${fmtNum(w.qty)} ${w.unit}`),
                h('span',{style:{fontSize:11,color:meta.color,background:"rgba(0,0,0,0.2)",borderRadius:4,padding:"1px 6px",fontWeight:500}},w.reason),
                h('span',{style:{fontSize:11,color:"var(--text3)"}},fmtDate(w.date))
              ),
              w.note&&h('div',{style:{fontSize:11,color:"var(--text2)",fontStyle:"italic"}},`"${w.note}"`)
            ),
            isConfirming
              ?h('div',{style:{display:"flex",flexDirection:"column",gap:4,alignItems:"flex-end",flexShrink:0}},
                  h('div',{style:{fontSize:10,color:"var(--red)",fontWeight:600}},"¿Eliminar?"),
                  h('div',{style:{display:"flex",gap:4}},
                    h('button',{onClick:()=>doDelete(w.id),style:{background:"var(--red)",border:"none",borderRadius:6,padding:"3px 8px",fontSize:11,color:"#fff",cursor:"pointer",fontWeight:600}},"Sí"),
                    h('button',{onClick:()=>setConfirmDelete(null),style:{background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:6,padding:"3px 8px",fontSize:11,color:"var(--text2)",cursor:"pointer"}},"No")
                  )
                )
              :h('button',{onClick:()=>setConfirmDelete(w.id),title:"Eliminar",style:{
                  background:"none",border:"none",color:"var(--text3)",cursor:"pointer",
                  fontSize:14,padding:"2px 4px",borderRadius:4,flexShrink:0
                }},"✕")
          )
        );
      }),
      filtered.length>8&&h('button',{onClick:()=>setShowAll(v=>!v),style:{
        marginTop:4,padding:"8px",background:"var(--surface)",width:"100%",
        border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",
        fontSize:12,color:"var(--text2)",cursor:"pointer"
      }},showAll?"Mostrar menos ↑":`Ver todos (${filtered.length}) ↓`)
    )
  );
}

// ─── INVENTORY ────────────────────────────────────────────────────────────────
function Inventory({data,setData,toast,logActivity}){
  const {products,purchases=[],orders=[],orderLines=[],bom=[],stockCounts=[]}=data;
  const ingredientCategories=data.ingredientCategories||["Carnes","Verduras","Lácteos","Secos","Despensa","Otros"];
  const [mode,setMode]=useState("list"); // "list" | "count"
  const [search,setSearch]=useState("");
  const [filter,setFilter]=useState("all");
  const [modal,setModal]=useState(false);
  const [editItem,setEditItem]=useState(null);
  const [form,setForm]=useState({});
  const [wastageModal,setWastageModal]=useState(false);
  const [wastageProduct,setWastageProduct]=useState(null);
  const [wastageForm,setWastageForm]=useState({});
  const [manageCatModal,setManageCatModal]=useState(false);
  const [invTab,setInvTab]=useState("stock"); // "stock" | "produccion" | "mermas"
  const [invLimit,setInvLimit]=useState(40);
  // Count mode state
  const [countDate,setCountDate]=useState(today());
  const [physicals,setPhysicals]=useState({});
  const [countSaved,setCountSaved]=useState(false);
  const [countTab,setCountTab]=useState("nuevo");
  const [countType,setCountType]=useState("ingredients");
  const [expandedCount,setExpandedCount]=useState(null);
  const [drillProduct,setDrillProduct]=useState(null);

  const invNq=ecNorm(search);
  const filtered=products.filter(p=>(filter==="all"||p.category===filter)&&(!invNq||ecNorm(p.name).includes(invNq)));
  const invShown=filtered.slice(0,invLimit);
  const stockStatus=p=>p.stock<p.minStock*0.4?{label:"Crítico",color:"red"}:p.stock<p.minStock?{label:"Bajo",color:"yellow"}:{label:"OK",color:"green"};

  const openAdd=()=>{setEditItem(null);setForm({name:"",category:ingredientCategories[0]||"",unit:"kg",minStock:"",stock:"",avgCost:"",yieldPct:100});setModal(true);};
  const openEdit=p=>{setEditItem(p);setForm({...p});setModal(true);};
  const save=()=>{
    if(!form.name||!form.stock||!form.avgCost)return;
    setData(d=>({...d,products:editItem?d.products.map(p=>p.id===editItem.id?{...p,...form,stock:+form.stock,avgCost:+form.avgCost,minStock:+form.minStock,yieldPct:+form.yieldPct}:p):[...d.products,{...form,id:"P"+uid(),stock:+form.stock,avgCost:+form.avgCost,minStock:+form.minStock,yieldPct:+form.yieldPct}]}));
    setModal(false);toast(editItem?"Ingrediente actualizado":"Ingrediente agregado","success");
  };
  const openWastage=(p,e)=>{e.stopPropagation();setWastageProduct(p);setWastageForm({qty:"",reason:"Vencimiento",date:today(),note:""});setWastageModal(true);};
  const saveWastage=()=>{
    const qty=+wastageForm.qty;if(!qty||qty<=0)return;
    const p=wastageProduct;
    setData(d=>({...d,products:d.products.map(pr=>pr.id===p.id?{...pr,stock:Math.max(0,pr.stock-qty)}:pr),
      wastageLog:[...(d.wastageLog||[]),{id:"W"+uid(),productId:p.id,productName:p.name,qty,unit:p.unit,reason:wastageForm.reason,note:wastageForm.note||"",date:wastageForm.date||today(),lostValue:qty*(p.avgCost||0)}]}));
    setWastageModal(false);toast(`Merma registrada · Stock reducido en ${qty} ${p.unit}`,"info");
  };

  // Count mode helpers
  const theoreticalStock=p=>p.stock; // live tracked stock IS the theoretical value
  const [tolerancePct,setTolerancePct]=useState(5); // acceptable variance %
  const [showTolEdit,setShowTolEdit]=useState(false);
  const [tolInput,setTolInput]=useState("5");

  // ── Items to count (switches with countType toggle) ──────────────────────
  const countItems=(data.subRecipes||[]).length>0
    ? (countType==="subrecipes" ? (data.subRecipes||[]) : products)
    : products;

  const variances=countItems.map(p=>{
    const theo=p.stock||0;
    const phys=physicals[p.id]!==undefined&&physicals[p.id]!==""?+physicals[p.id]:null;
    const varQty=phys!==null?theo-phys:null;
    const varPct=theo>0&&varQty!==null?Math.abs(varQty)/theo*100:varQty!==null?0:null;
    const withinTol=varPct!==null&&varPct<=tolerancePct;
    const costRef=p.avgCost||0;
    return{p,theo,phys,varQty,varVal:varQty!==null?varQty*costRef:null,varPct,withinTol};
  });
  const filledCount=variances.filter(v=>v.phys!==null).length;
  const outOfTolCount=variances.filter(v=>v.phys!==null&&!v.withinTol&&Math.abs(v.varQty||0)>0.001).length;

  const saveCount=()=>{
    const entries=variances.filter(v=>v.phys!==null).map(v=>({
      productId:v.p.id,
      openingStock:v.theo,
      physicalQty:v.phys,
      withinTolerance:v.withinTol,
      tolerancePct,
      itemType:countType,
    }));
    if(!entries.length){toast("Ingresa al menos un conteo físico","error");return;}
    setData(d=>{
      let updatedProducts=[...d.products];
      let updatedSubs=[...(d.subRecipes||[])];
      entries.forEach(entry=>{
        // Being physically counted resolves the "needs recount" flag either
        // way — whether the count matched or not, the theoretical stock has
        // now been checked against reality.
        if(entry.itemType==="subrecipes"){
          updatedSubs=updatedSubs.map(s=>s.id===entry.productId?
            {...s,...(entry.withinTolerance?{}:{stock:entry.physicalQty}),needsRecount:false}:s);
        } else {
          updatedProducts=updatedProducts.map(p=>p.id===entry.productId?
            {...p,...(entry.withinTolerance?{}:{stock:entry.physicalQty}),needsRecount:false}:p);
        }
      });
      return{...d,products:updatedProducts,subRecipes:updatedSubs,
        stockCounts:[...(d.stockCounts||[]),{id:"SC"+uid(),date:countDate,entries,tolerancePct,countType,note:""}]};
    });
    setCountSaved(true);
    const reconciled=entries.filter(e=>e.withinTolerance).length;
    const adjusted=entries.filter(e=>!e.withinTolerance&&Math.abs(e.openingStock-e.physicalQty)>0.001).length;
    toast(`Conteo guardado · ${reconciled} en margen · ${adjusted} ajustado${adjusted!==1?"s":""} ✓`);
  };
  const enterCountMode=()=>{setPhysicals({});setCountSaved(false);setMode("count");setCountTab("nuevo");setCountType("ingredients");};
  const exitCountMode=()=>{setMode("list");setDrillProduct(null);};

  // ── History analytics ──────────────────────────────────────────────────────
  const allCountableItems=[...products,...(data.subRecipes||[]).map(s=>({...s,_isSub:true}))];
  const productStats=allCountableItems.map(p=>{
    const appearances=(stockCounts||[]).flatMap(sc=>sc.entries.filter(e=>e.productId===p.id&&((!e.itemType&&!p._isSub)||(e.itemType==="subrecipes"&&p._isSub)||(e.itemType==="ingredients"&&!p._isSub))));
    const total=appearances.length;
    const outOfTol=appearances.filter(e=>!e.withinTolerance&&Math.abs(e.openingStock-e.physicalQty)>0.001).length;
    const varPcts=appearances.map(e=>e.openingStock>0?Math.abs(e.openingStock-e.physicalQty)/e.openingStock*100:0);
    const avgVarPct=varPcts.length?varPcts.reduce((s,v)=>s+v,0)/varPcts.length:0;
    const freqPct=total>0?outOfTol/total*100:0;
    const timeline=(stockCounts||[])
      .filter(sc=>sc.entries.find(e=>e.productId===p.id))
      .map(sc=>{
        const e=sc.entries.find(e=>e.productId===p.id);
        const vp=e.openingStock>0?Math.abs(e.openingStock-e.physicalQty)/e.openingStock*100:0;
        return{date:sc.date,varPct:vp,withinTol:e.withinTolerance,tol:sc.tolerancePct||5};
      })
      .sort((a,b)=>a.date.localeCompare(b.date));
    return{p,total,outOfTol,avgVarPct,freqPct,timeline};
  }).filter(s=>s.total>0).sort((a,b)=>b.freqPct-a.freqPct||b.avgVarPct-a.avgVarPct);

  // Ledger for a single product (shown in count mode per-row)
  function ledgerRows(p){
    const rows=[];
    const purchasedQty=purchases.filter(pu=>pu.productId===p.id&&pu.status==="Recibido").reduce((s,pu)=>s+(pu.qty||0),0);
    const consumedQty=orders.filter(o=>o.status==="closed").reduce((s,o)=>s+linesOf(orderLines,o.id).reduce((ss,l)=>{const bl=bom.find(b=>b.recipeId===l.recipeId&&b.productId===p.id);return ss+(bl?bl.qty*l.qty:0);},0),0);
    const seedStock=p.stock+consumedQty-purchasedQty;
    let running=seedStock;
    rows.push({label:"Stock inicial",qty:seedStock,running});
    purchases.filter(pu=>pu.productId===p.id&&pu.status==="Recibido").forEach(pu=>{running+=pu.qty||0;rows.push({label:`Compra`,qty:+(pu.qty||0),running,date:pu.date,type:"+"});});
    if(consumedQty>0)rows.push({label:"Consumo ventas",qty:-consumedQty,running:p.stock,type:"-"});
    return rows;
  }

  // ── COUNT MODE VIEW ──────────────────────────────────────────────────────────
  if(mode==="count"){
    const tS=(t)=>({padding:"7px 14px",borderRadius:"var(--radius-sm)",border:"none",fontFamily:"var(--sans)",fontSize:12,fontWeight:600,cursor:"pointer",background:countTab===t?"var(--accent)":"var(--surface2)",color:countTab===t?"#fff":"var(--text2)",transition:"all .15s"});
    return h('div',{className:"slide-up"},
      // Header bar
      h('div',{style:{display:"flex",alignItems:"center",gap:10,marginBottom:12}},
        h('div',{style:{flex:1,display:"flex",gap:6}},
          h('button',{style:tS("nuevo"),onClick:()=>setCountTab("nuevo")},"➕ Nuevo conteo"),
          h('button',{style:tS("historial"),onClick:()=>setCountTab("historial")},"📅 Historial"+(stockCounts&&stockCounts.length?" ("+stockCounts.length+")":"")),
          h('button',{style:tS("problemas"),onClick:()=>setCountTab("problemas")},"📊 Análisis")
        ),
        h('button',{onClick:exitCountMode,style:{background:"none",border:"1px solid var(--border2)",borderRadius:20,padding:"4px 12px",fontSize:12,color:"var(--text2)",cursor:"pointer",flexShrink:0}},"✕ Salir")
      ),

      countTab==="nuevo"&&h(React.Fragment,null,
      // Ingredient / Sub-recipe toggle
      (data.subRecipes||[]).length>0&&h('div',{style:{display:"flex",gap:6,marginBottom:10}},
        [{id:"ingredients",icon:"🧂",label:"Ingredientes",count:products.length},
         {id:"subrecipes",icon:"🍲",label:"Sub-recetas",count:(data.subRecipes||[]).length}]
        .map(t=>h('button',{key:t.id,onClick:()=>{setCountType(t.id);setPhysicals({});setCountSaved(false);},
          style:{flex:1,padding:"8px",borderRadius:"var(--radius-sm)",border:"1px solid",cursor:"pointer",
            fontFamily:"var(--sans)",fontSize:12,fontWeight:600,transition:"all .15s",
            borderColor:countType===t.id?"var(--accent)":"var(--border)",
            background:countType===t.id?"rgba(249,115,22,0.12)":"var(--surface2)",
            color:countType===t.id?"var(--accent)":"var(--text2)"}},
          t.icon+" "+t.label+" ("+t.count+")"
        ))
      ),
      // Tolerance setting row
      h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"10px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10}},
        h('span',{style:{fontSize:16}},"🎯"),
        h('div',{style:{flex:1}},
          h('div',{style:{fontSize:12,fontWeight:600,color:"var(--text2)"}},"Margen de tolerancia"),
          h('div',{style:{fontSize:11,color:"var(--text3)"}},
            "Diferencias ≤ "+tolerancePct+"% se reconcilian automáticamente con el stock teórico"
          )
        ),
        showTolEdit
          ? h('div',{style:{display:"flex",gap:6,alignItems:"center"}},
              h('input',{type:"number",min:"0",max:"50",step:"0.5",value:tolInput,
                onChange:e=>setTolInput(e.target.value),
                style:{width:60,textAlign:"center",padding:"5px 8px",fontSize:13}}),
              h(Btn,{size:"sm",onClick:()=>{const v=Math.max(0,Math.min(50,+tolInput||0));setTolerancePct(v);setTolInput(String(v));setShowTolEdit(false);}},"✓"),
              h(Btn,{size:"sm",variant:"ghost",onClick:()=>{setTolInput(String(tolerancePct));setShowTolEdit(false);}},"✕")
            )
          : h('button',{onClick:()=>{setTolInput(String(tolerancePct));setShowTolEdit(true);},
              style:{background:"rgba(249,115,22,0.12)",border:"1px solid rgba(249,115,22,0.3)",
                borderRadius:20,padding:"4px 14px",fontSize:13,fontWeight:700,
                color:"var(--accent)",cursor:"pointer",whiteSpace:"nowrap"}},
              tolerancePct+"%"
            )
      ),

      // Date + summary bar
      h('div',{style:{display:"flex",gap:8,alignItems:"center",marginBottom:12}},
        h('input',{type:"date",value:countDate,onChange:e=>{setCountDate(e.target.value);setCountSaved(false);},style:{flex:1}}),
        filledCount>0&&h('div',{style:{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"6px 12px",fontSize:12,color:"var(--text2)",whiteSpace:"nowrap",display:"flex",gap:8}},
          h('span',{style:{fontWeight:600,color:"var(--text)"}},filledCount+" contados"),
          outOfTolCount>0&&h('span',{style:{color:"var(--red)",fontWeight:600}},outOfTolCount+" fuera de margen")
        )
      ),

      // Category filter — only for ingredients
      countType==="ingredients"&&h(CategoryPills,{cats:["all",...ingredientCategories],active:filter,onChange:setFilter}),

      // Count rows — works for both types

      h('div',{style:{display:"flex",gap:8,marginTop:4}},

        h(Btn,{variant:"ghost",onClick:()=>setModal(false)},"Cancelar")
      )
    ),
    ), // end stock Fragment
    h(ManageCatsModal,{open:manageCatModal,onClose:()=>setManageCatModal(false),

      onDelete:cat=>{if(products.some(p=>p.category===cat)){toast(`No se puede eliminar — hay ingredientes en "${cat}"`,"error");return;}setData(d=>({...d,ingredientCategories:(d.ingredientCategories||[]).filter(c=>c!==cat)}));if(filter===cat)setFilter("all");toast(`"${cat}" eliminada`,"info");}

// ─── RECIPES ──────────────────────────────────────────────────────────────────
function Recipes({data,setData,toast,notify=()=>{}}){
  const {recipes,products,bom,subBom=[],subRecipes=[]}=data;
  const recipeCategories=data.recipeCategories||["Fondos","Entradas","Pastas","Postres","Bebidas"];
  const subRecipeCategories=data.subRecipeCategories||["Salsas","Fondos y Caldos","Preparaciones","Masas","Otros"];

  // ── shared UI state ──────────────────────────────────────────────────────────
  const [tab,setTab]=useState("recipes");        // "recipes" | "subrecipes"

  // ── recipe state ─────────────────────────────────────────────────────────────
  const [rView,setRView]=useState("list");
  const [rSelected,setRSelected]=useState(null);
  const [rModal,setRModal]=useState(false);
  const [rForm,setRForm]=useState({});
  const [bomEdit,setBomEdit]=useState([]);
  const [addIngModal,setAddIngModal]=useState(false);
  const [newIng,setNewIng]=useState({});
  const [rFilterCat,setRFilterCat]=useState("all");
  const [rSearch,setRSearch]=useState("");
  const [rLimit,setRLimit]=useState(30);
  const [rManageModal,setRManageModal]=useState(false);
  const [editingRecipe,setEditingRecipe]=useState(null);
  const [rDeleteConfirm,setRDeleteConfirm]=useState(null);
  // ── dish availability (kitchen 86 + daily limit) ─────────────────────────────
  const [availModal,setAvailModal]=useState(null);   // recipe id
  const [limitInput,setLimitInput]=useState("");
  const setRecipeAvail=(id,patch)=>setData(d=>({...d,recipes:d.recipes.map(x=>x.id===id?{...x,...patch}:x)}));
  const openAvail=(r,e)=>{e.stopPropagation();setAvailModal(r.id);setLimitInput(r.limitDate===today()&&typeof r.dailyLimit==="number"?String(r.dailyLimit):"");};
  const toggleSoldOut=(r)=>{setRecipeAvail(r.id,{soldOut:!r.soldOut});toast(!r.soldOut?"Plato marcado como agotado":"Plato disponible de nuevo",!r.soldOut?"info":"success");if(!r.soldOut)notify("out_of_stock",`marcó "${r.name}" como agotado (86)`);};
  const saveLimit=(r)=>{const n=+limitInput;if(limitInput&&n>0){setRecipeAvail(r.id,{dailyLimit:n,limitDate:today()});toast("Límite de hoy: "+n+" porciones","success");}};
  const clearLimit=(r)=>{setRecipeAvail(r.id,{dailyLimit:null,limitDate:null});setLimitInput("");toast("Límite quitado","info");};

  // ── sub-recipe state ─────────────────────────────────────────────────────────
  const [srView,setSrView]=useState("list");
  const [srSelected,setSrSelected]=useState(null);
  const [srModal,setSrModal]=useState(false);
  const [srForm,setSrForm]=useState({});
  const [sbomEdit,setSbomEdit]=useState([]);
  const [srAddIngModal,setSrAddIngModal]=useState(false);
  const [srNewIng,setSrNewIng]=useState({});
  const [srFilterCat,setSrFilterCat]=useState("all");
  const [srSearch,setSrSearch]=useState("");
  const [srLimit,setSrLimit]=useState(30);
  const [srManageModal,setSrManageModal]=useState(false);
  const [editingSR,setEditingSR]=useState(null);
  const [srDeleteConfirm,setSrDeleteConfirm]=useState(null);

  // ── tab style helper ─────────────────────────────────────────────────────────
  const tS=(t)=>({padding:"8px 18px",borderRadius:"var(--radius-sm)",border:"none",
    fontFamily:"var(--sans)",fontSize:13,fontWeight:600,cursor:"pointer",transition:"all .15s",
    background:tab===t?"var(--accent)":"var(--surface2)",
    color:tab===t?"#fff":"var(--text2)"});

  // ── RECIPE ACTIONS ───────────────────────────────────────────────────────────
  const rNq=ecNorm(rSearch);
  const rFiltered=recipes.filter(r=>(rFilterCat==="all"||r.category===rFilterCat)&&(!rNq||ecNorm(r.name).includes(rNq)));
  const rShown=rFiltered.slice(0,rLimit);

  const openAddRecipe=()=>{
    setEditingRecipe(null);
    setRForm({name:"",category:recipeCategories[0]||"",price:"",portions:10});
    setBomEdit([]);setRModal(true);
  };
  const openEditRecipe=(r,e)=>{
    e.stopPropagation();
    setRView("list");setRSelected(null);setEditingRecipe(r.id);
    setRForm({name:r.name,category:r.category,price:r.price,portions:r.portions||10});
    setBomEdit(bom.filter(b=>b.recipeId===r.id).map(b=>({...b})));
    setRModal(true);
  };
  const saveRecipe=()=>{
    if(!rForm.name||!rForm.price)return;
    if(editingRecipe){
      const old=data.recipes.find(r=>r.id===editingRecipe);
      setData(d=>({...d,
        recipes:d.recipes.map(r=>r.id===editingRecipe?{...r,...rForm,price:+rForm.price,portions:+rForm.portions}:r),
        bom:[...d.bom.filter(b=>b.recipeId!==editingRecipe),...bomEdit.map(b=>({...b,id:b.id||"B"+uid(),recipeId:editingRecipe}))]
      }));
      setRModal(false);toast("Receta actualizada ✓","success");
      if(old&&+old.price!==+rForm.price) notify("price_change",`cambió el precio de "${rForm.name}" a ${fmtCost(+rForm.price)}`);
      else notify("recipe_change",`editó la receta "${rForm.name}"`);
    } else {
      const id="R"+uid();
      setData(d=>({...d,
        recipes:[...d.recipes,{...rForm,id,price:+rForm.price,portions:+rForm.portions}],
        bom:[...d.bom,...bomEdit.map(b=>({...b,id:"B"+uid(),recipeId:id}))]
      }));
      setRModal(false);toast("Receta creada","success");
      notify("recipe_change",`creó la receta "${rForm.name}"`);
    }
  };
  const deleteRecipe=(id)=>{
    const r=data.recipes.find(x=>x.id===id);

  // ── SUB-RECIPE ACTIONS ───────────────────────────────────────────────────────

  // ── RECIPE DETAIL ────────────────────────────────────────────────────────────

  // ── LIST VIEW (both tabs) ────────────────────────────────────────────────────

      tab==="subrecipes"&&h(Btn,{onClick:openAddSR,style:{whiteSpace:"nowrap",flexShrink:0,fontSize:12}},"+ Nueva")
    ),

    // ── Recipes list ──────────────────────────────────────────────────────────
    tab==="recipes"&&h(Fragment,null,
      h(CategoryPills,{cats:["all",...recipeCategories],active:rFilterCat,onChange:setRFilterCat,onManage:()=>setRManageModal(true)}),
      recipes.length>8&&h(SearchBox,{value:rSearch,onChange:v=>{setRSearch(v);setRLimit(30);},
        placeholder:"Buscar receta por nombre...",count:rFiltered.length,total:recipes.length}),
      rFilterCat!=="all"&&recipes.length>0&&h("div",{style:{fontSize:12,color:"var(--text2)",marginBottom:10}},
        `${rFiltered.length} de ${recipes.length} recetas `,
        h("button",{onClick:()=>setRFilterCat("all"),style:{background:"none",border:"none",color:"var(--accent)",fontSize:12,cursor:"pointer",padding:0}},"Limpiar \u00d7")
      ),

        ?h(EmptyState,{icon:"\ud83c\udf7d",title:"Sin recetas",sub:"Crea tu primera receta para calcular costos",action:openAddRecipe,actionLabel:"Crear receta"})
        :rFiltered.length===0
          ?h("div",{style:{textAlign:"center",padding:"2.5rem 1rem",color:"var(--text3)",fontSize:13}},
            rNq?"Ninguna receta se llama as\u00ed. ":"Sin recetas en esta categor\u00eda. ",

          :h("div",{style:{display:"flex",flexDirection:"column",gap:10}},
            rShown.map(r=>{

                    )

                  h("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}},
                    h(Badge,{color:cp>getFCTWarn(data)?"red":cp>getFCT(data)?"yellow":"green"},fmtPct(cp)),
                    h("div",{style:{fontSize:10,color:"var(--text3)"}},"costo real"),
                    _listSettings.igvMode!=="ninguno"&&h("div",{style:{fontSize:10,color:"var(--text3)",opacity:0.7}},fmtPct(cpGross)+" carta"),
                    h("button",{onClick:e=>openEditRecipe(r,e),className:"ec-tap",style:{fontSize:11,padding:"2px 8px",borderRadius:6,background:"var(--surface2)",border:"1px solid var(--border)",color:"var(--text2)",cursor:"pointer"}},"\u270f\ufe0f Editar"),
                    (()=>{const av=dishAvailability(r,data.orders||[],data.orderLines||[]);let lbl,col,bg,bd;if(av.soldOut){lbl="\ud83d\udeab Agotado";col="var(--red)";bg="rgba(239,68,68,0.18)";bd="var(--red)";}else if(av.limited&&av.remaining<=0){lbl="\ud83d\udeab Sin m\u00e1s";col="var(--red)";bg="rgba(239,68,68,0.18)";bd="var(--red)";}else if(av.limited){lbl="\ud83d\udd22 Quedan "+av.remaining;col="var(--yellow)";bg="rgba(234,179,8,0.15)";bd="var(--yellow)";}else{lbl="\ud83c\udf7d Disponible";col="var(--text2)";bg="var(--surface2)";bd="var(--border)";}return h("button",{onClick:e=>openAvail(r,e),className:"ec-tap",style:{fontSize:11,fontWeight:600,padding:"2px 8px",borderRadius:6,cursor:"pointer",border:"1px solid "+bd,background:bg,color:col}},lbl);})()
                  )

            }),
            h(ShowMore,{shown:rShown.length,total:rFiltered.length,
              onMore:()=>setRLimit(n=>n+30),onAll:()=>setRLimit(rFiltered.length)})
          ),
      h(ManageCatsModal,{open:rManageModal,onClose:()=>setRManageModal(false),

        onDelete:cat=>{if(recipes.some(r=>r.category===cat)){toast(`Elimina las recetas de "${cat}" primero`,"error");return;}setData(d=>({...d,recipeCategories:(d.recipeCategories||[]).filter(c=>c!==cat)}));if(rFilterCat===cat)setRFilterCat("all");toast(`"${cat}" eliminada`,"info");}

        availModal&&(()=>{const r=recipes.find(x=>x.id===availModal);if(!r)return null;const av=dishAvailability(r,data.orders||[],data.orderLines||[]);const soldToday=dishSoldToday(r.id,data.orders||[],data.orderLines||[]);

    h('div',{style:{display:"flex",gap:6,marginBottom:18}},

        "🛒 Compras"+(pendingCount>0?" ("+pendingCount+")":"")),
      h('button',{style:tabStyle("reposicion"),onClick:()=>setTab("reposicion")},
        "🔄 Repos."+(lowCount>0?" ("+lowCount+")":"")),
      h('button',{style:tabStyle("proveedores"),onClick:()=>setTab("proveedores")},"🏪 Proveed.")
    ),
    tab==="compras"&&h(PurchasesTab,{data,setData,toast,logActivity}),
    tab==="reposicion"&&h(ReorderTab,{data,setData,toast}),
    tab==="proveedores"&&h(SuppliersTab,{data,setData,toast})
  );
}

function SuppliersTab({data,setData,toast}){
  const {suppliers=[],products=[]}=data;
  const [modal,setModal]=useState(false);
  const [editItem,setEditItem]=useState(null);
  const [form,setForm]=useState({});

  const openAdd=()=>{setEditItem(null);setForm({name:"",contact:"",phone:"",email:"",category:"",leadTime:"",minOrder:"",notes:""});setModal(true);};
  const openEdit=s=>{setEditItem(s);setForm({...s});setModal(true);};
  const save=()=>{
    if(!form.name)return;
    setData(d=>({...d,suppliers:editItem
      ?d.suppliers.map(s=>s.id===editItem.id?{...s,...form,leadTime:+form.leadTime||0,minOrder:+form.minOrder||0}:s)
      :[...d.suppliers,{...form,id:"SUP"+uid(),leadTime:+form.leadTime||0,minOrder:+form.minOrder||0}]
    }));

    if(products.some(p=>p.supplier===id)){toast("Hay ingredientes vinculados a este proveedor","error");return;}
    setData(d=>({...d,suppliers:d.suppliers.filter(s=>s.id!==id)}));

  return h('div',{className:"slide-up"},
    h(SectionHeader,{title:"Proveedores",action:openAdd,actionLabel:"+ Nuevo"}),

      :h('div',{style:{display:"flex",flexDirection:"column",gap:10}},
        suppliers.map(s=>{
          const linkedCount=products.filter(p=>p.supplier===s.id).length;

              h('div',{style:{flex:1,minWidth:0}},
                h('div',{style:{display:"flex",alignItems:"center",gap:8,marginBottom:2}},
                  h('span',{style:{fontSize:14,fontWeight:600}},s.name),
                  lowCount>0&&h(Badge,{color:"red"},`${lowCount} bajo stock`)
                ),
                h('div',{style:{fontSize:12,color:"var(--text2)",marginBottom:2}},s.contact||(s.phone||"")),
                h('div',{style:{display:"flex",gap:8,flexWrap:"wrap"}},
                  s.leadTime&&h('span',{style:{fontSize:11,color:"var(--text3)"}},`⏱ ${s.leadTime}d`),
                  s.minOrder&&h('span',{style:{fontSize:11,color:"var(--text3)"}},`📦 Mín S/ ${s.minOrder}`),
                  h('span',{style:{fontSize:11,color:"var(--text3)"}},`${linkedCount} ingrediente${linkedCount!==1?"s":""}`)
                )
              ),
              h('button',{onClick:e=>{e.stopPropagation();deleteSup(s.id);},style:{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:6,padding:"4px 10px",fontSize:11,color:"var(--red)",cursor:"pointer",flexShrink:0}},"✕")
            )

    h(Modal,{open:modal,onClose:()=>setModal(false),title:editItem?"Editar proveedor":"Nuevo proveedor"},
      h(FormRow,{label:"Nombre del proveedor"},h('input',{value:form.name||"",onChange:e=>setForm({...form,name:e.target.value}),placeholder:"ej. Cárnicos del Norte SAC"})),
      h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
        h(FormRow,{label:"Contacto"},h('input',{value:form.contact||"",onChange:e=>setForm({...form,contact:e.target.value}),placeholder:"Nombre"})),
        h(FormRow,{label:"Teléfono"},h('input',{value:form.phone||"",onChange:e=>setForm({...form,phone:e.target.value}),placeholder:"999-999-999"}))
      ),
      h(FormRow,{label:"Email"},h('input',{type:"email",value:form.email||"",onChange:e=>setForm({...form,email:e.target.value}),placeholder:"proveedor@email.com"})),
      h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
        h(FormRow,{label:"Tiempo de entrega (días)"},h('input',{type:"number",min:"0",value:form.leadTime||"",onChange:e=>setForm({...form,leadTime:e.target.value}),placeholder:"ej. 2"})),
        h(FormRow,{label:"Pedido mínimo (S/)"},h('input',{type:"number",min:"0",value:form.minOrder||"",onChange:e=>setForm({...form,minOrder:e.target.value}),placeholder:"ej. 150"}))
      ),

// ─── REORDER ──────────────────────────────────────────────────────────────────
function ReorderTab({data,setData,toast}){
  const {products=[],suppliers=[],purchases=[]}=data;
  const [selected,setSelected]=useState({});  // { productId: qty }
  const [orderModal,setOrderModal]=useState(false);
  const [activeSupplier,setActiveSupplier]=useState(null);

  // Products below min stock, enriched with supplier info
  const lowProducts=products.filter(p=>p.stock<p.minStock).map(p=>({
    ...p,
    supplier:suppliers.find(s=>s.id===p.supplier)||null,
    suggestedQty:Math.max(p.minStock*2 - p.stock, p.minStock),
    deficit:p.minStock-p.stock,
  }));

  // Group by supplier
  const grouped={};
  lowProducts.forEach(p=>{
    const key=p.supplier?.id||"NONE";
    if(!grouped[key])grouped[key]={supplier:p.supplier,products:[]};
    grouped[key].products.push(p);
  });
  const noSup=grouped["NONE"];
  const groups=Object.entries(grouped).filter(([k])=>k!=="NONE");

  const toggleSelect=(pid,sugQty)=>{
    setSelected(prev=>prev[pid]?Object.fromEntries(Object.entries(prev).filter(([k])=>k!==pid)):{...prev,[pid]:sugQty});
  };
  const setQty=(pid,qty)=>setSelected(prev=>({...prev,[pid]:+qty||0}));

  const openOrderModal=sup=>{setActiveSupplier(sup);setOrderModal(true);};

  const confirmOrder=(sup)=>{
    const supProducts=lowProducts.filter(p=>p.supplier?.id===sup.id);
    let count=0;
    supProducts.forEach(p=>{
      const qty=selected[p.id]||p.suggestedQty;
      if(qty<=0)return;
      // Add a pending purchase
      setData(d=>({...d,purchases:[...d.purchases,{
        id:"PU"+uid(),date:today(),productId:p.id,qty,
        totalCost:qty*(p.avgCost||0),status:"Pendiente",supplierId:sup.id
      }]}));
      count++;
    });
    setSelected({});setOrderModal(false);
    toast(`${count} pedido${count!==1?"s":""} generado${count!==1?"s":""} como pendientes · Ve a la pestaña Compras para confirmar recepción`,"success");
  };

  const SupGroup=({sup,prods})=>h('div',{style:{marginBottom:20}},
    h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 14px",background:"var(--surface2)",borderRadius:"var(--radius-sm) var(--radius-sm) 0 0",border:"1px solid var(--border2)",borderBottom:"none"}},
      h('div',null,
        h('div',{style:{fontSize:13,fontWeight:600}},sup?sup.name:"Sin proveedor asignado"),
        sup&&h('div',{style:{fontSize:11,color:"var(--text2)"}},
          [sup.leadTime&&`⏱ ${sup.leadTime}d entrega`,sup.minOrder&&`📦 Mín S/ ${sup.minOrder}`,sup.phone].filter(Boolean).join(" · "))
      ),
      sup&&h(Btn,{size:"sm",onClick:()=>openOrderModal(sup)},"Pedir todo")
    ),
    h('div',{style:{border:"1px solid var(--border2)",borderRadius:"0 0 var(--radius-sm) var(--radius-sm)",overflow:"hidden"}},
      prods.map((p,i)=>{
        const isSel=!!selected[p.id];
        return h('div',{key:p.id,style:{
          display:"flex",alignItems:"center",gap:10,padding:"10px 14px",
          background:isSel?"rgba(249,115,22,0.06)":"var(--surface)",
          borderBottom:i<prods.length-1?"1px solid var(--border)":"none",
        }},
          h('button',{onClick:()=>toggleSelect(p.id,p.suggestedQty),style:{
            width:20,height:20,borderRadius:5,flexShrink:0,cursor:"pointer",
            background:isSel?"var(--accent)":"transparent",
            border:`1.5px solid ${isSel?"var(--accent)":"var(--border2)"}`,
            display:"flex",alignItems:"center",justifyContent:"center",
            color:"#fff",fontSize:12
          }},isSel?"✓":""),
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{style:{fontSize:13,fontWeight:500}},p.name),
            h('div',{style:{fontSize:12,color:"var(--text2)"}},
              `Tiene: ${fmtNum(p.stock)} ${p.unit} · Mín: ${fmtNum(p.minStock)} ${p.unit}`)
          ),
          h('div',{style:{textAlign:"right",flexShrink:0}},
            h(Badge,{color:p.stock<=0?"red":"yellow"},p.stock<=0?"Agotado":"Bajo"),
            isSel&&h('div',{style:{display:"flex",alignItems:"center",gap:4,marginTop:4,justifyContent:"flex-end"}},
              h('span',{style:{fontSize:11,color:"var(--text3)"}},"Qty:"),
              h('input',{type:"number",min:"0.1",step:"0.1",value:selected[p.id]||p.suggestedQty,
                onChange:e=>setQty(p.id,e.target.value),
                style:{width:70,padding:"3px 6px",fontSize:12,textAlign:"right"}})
            )
          )
        );
      })
    )
  );

  return h('div',{className:"slide-up"},
    h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
      h('h2',{style:{fontFamily:"var(--sora)",fontSize:16,fontWeight:600}},"Reposición"),
      lowProducts.length>0&&h('div',{style:{fontSize:12,color:"var(--text2)"}},
        `${lowProducts.length} producto${lowProducts.length!==1?"s":""} bajo mínimo`)
    ),
    lowProducts.length===0
      ?h('div',{style:{textAlign:"center",padding:"3rem 1rem"}},
        h('div',{style:{fontSize:40,marginBottom:12}},"✅"),
        h('div',{style:{fontFamily:"var(--sora)",fontSize:15,fontWeight:600,marginBottom:6}},"Todo el inventario está en orden"),
        h('div',{style:{fontSize:13,color:"var(--text2)"}},"No hay productos bajo el stock mínimo"))
      :h('div',null,
        groups.map(([key,group])=>h(SupGroup,{key,sup:group.supplier,prods:group.products})),
        noSup&&h(SupGroup,{key:"NONE",sup:null,prods:noSup.products})
      ),
    h(Modal,{open:orderModal,onClose:()=>setOrderModal(false),title:"Confirmar pedido"},
      activeSupplier&&h('div',null,
        h('div',{style:{background:"var(--surface2)",borderRadius:"var(--radius-sm)",padding:"10px 12px",marginBottom:14}},
          h('div',{style:{fontSize:13,fontWeight:500,marginBottom:2}},activeSupplier.name),
          h('div',{style:{fontSize:12,color:"var(--text2)"}},
            [activeSupplier.phone,activeSupplier.email,activeSupplier.leadTime&&`Entrega en ${activeSupplier.leadTime} día${activeSupplier.leadTime!==1?"s":""}`].filter(Boolean).join(" · "))
        ),
        h('div',{style:{fontSize:12,color:"var(--text2)",marginBottom:10}},"Productos a pedir:"),
        lowProducts.filter(p=>p.supplier?.id===activeSupplier.id).map(p=>
          h('div',{key:p.id,style:{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid var(--border)",fontSize:13}},
            h('span',null,p.name),
            h('div',{style:{display:"flex",alignItems:"center",gap:6}},
              h('input',{type:"number",min:"0",value:selected[p.id]||p.suggestedQty,onChange:e=>setQty(p.id,e.target.value),style:{width:70,padding:"3px 6px",fontSize:12,textAlign:"right"}}),
              h('span',{style:{fontSize:12,color:"var(--text3)"}},p.unit)
            )
          )
        ),
        h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:10,marginBottom:14}},
          "Se crearán compras pendientes. Confirma la recepción en la sección Compras."),
        h('div',{style:{display:"flex",gap:8}},
          h(Btn,{onClick:()=>confirmOrder(activeSupplier),style:{flex:1},size:"lg"},"Confirmar pedido"),
          h(Btn,{variant:"ghost",onClick:()=>setOrderModal(false)},"Cancelar")
        )
      )
    )
  );
}


// ─── DATE PICKER ──────────────────────────────────────────────────────────────
function DatePicker({value, onChange}){
  const [open, setOpen] = useState(false);
  const [viewYear, setViewYear] = useState(null);
  const [viewMonth, setViewMonth] = useState(null);

  // Parse selected date or fall back to today
  const parseDate = (s) => {
    if(s){ const [y,m,d]=s.split("-").map(Number); if(y&&m&&d) return {y,m,d}; }
    const n=new Date(); return {y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate()};
  };
  const sel = parseDate(value);

  // Init view to selected month when opening
  const handleOpen = () => {
    setViewYear(sel.y); setViewMonth(sel.m); setOpen(true);
  };

  const pad = n => String(n).padStart(2,"0");
  const fmt = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;

  const todayStr = today();
  const todayP = parseDate(todayStr);

  // Quick shortcuts
  const shortcuts = [
    {label:"Hoy", val:todayStr},
    {label:"Ayer", val:(()=>{const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);})()},
    {label:"Hace 2d", val:(()=>{const d=new Date();d.setDate(d.getDate()-2);return d.toISOString().slice(0,10);})()},
    {label:"Hace 7d", val:(()=>{const d=new Date();d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);})()},
  ];

  const MONTHS_ES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const DOW=["Lu","Ma","Mi","Ju","Vi","Sa","Do"];

  // Build calendar grid for viewYear/viewMonth
  const buildGrid = (y, m) => {
    const first = new Date(y, m-1, 1);
    // Monday-based: 0=Mon…6=Sun
    let startDow = (first.getDay()+6)%7; // getDay: 0=Sun → Mon offset
    const daysInMonth = new Date(y, m, 0).getDate();
    const cells = [];
    for(let i=0;i<startDow;i++) cells.push(null);
    for(let d=1;d<=daysInMonth;d++) cells.push(d);
    return cells;
  };

  const prevMonth = () => {
    if(viewMonth===1){setViewMonth(12);setViewYear(viewYear-1);}
    else setViewMonth(viewMonth-1);
  };
  const nextMonth = () => {
    if(viewMonth===12){setViewMonth(1);setViewYear(viewYear+1);}
    else setViewMonth(viewMonth+1);
  };

  const selectDay = (d) => {
    onChange(fmt(viewYear, viewMonth, d));
    setOpen(false);
  };

  // Format display string
  const displayVal = () => {
    if(!value) return "Seleccionar fecha";
    if(value===todayStr) return "Hoy, "+sel.d+" "+MONTHS_ES[sel.m-1];
    const yday = shortcuts[1].val;
    if(value===yday) return "Ayer, "+sel.d+" "+MONTHS_ES[sel.m-1];
    return sel.d+" "+MONTHS_ES[sel.m-1]+" "+sel.y;
  };

  const grid = open ? buildGrid(viewYear, viewMonth) : [];
  const isToday = (d) => d===todayP.d && viewMonth===todayP.m && viewYear===todayP.y;
  const isSel = (d) => d===sel.d && viewMonth===sel.m && viewYear===sel.y;
  // Disable future dates
  const isFuture = (d) => {
    const ds = fmt(viewYear, viewMonth, d);
    return ds > todayStr;
  };

  return h('div',{style:{position:"relative"}},
    // Trigger button
    h('button',{
      onClick:handleOpen,
      style:{
        width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",
        background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:"var(--radius-sm)",
        padding:"11px 14px",fontSize:14,color:value?"var(--text)":"var(--text3)",
        cursor:"pointer",fontFamily:"var(--sans)",transition:"border-color .2s",
        ...(open?{borderColor:"var(--accent)"}:{})
      }
    },
      h('div',{style:{display:"flex",alignItems:"center",gap:8}},
        h('span',{style:{fontSize:16}},"📅"),
        h('span',null, displayVal())
      ),
      h('span',{style:{fontSize:11,color:"var(--text3)"}},open?"▲":"▼")
    ),

    // Dropdown panel
    open&&h('div',{style:{
      position:"absolute",top:"calc(100% + 6px)",left:0,right:0,zIndex:200,
      background:"var(--surface)",border:"1px solid var(--border2)",
      borderRadius:"var(--radius)",padding:"12px",
      boxShadow:"0 8px 32px rgba(0,0,0,0.5)"
    }},

      // Quick shortcut pills
      h('div',{style:{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}},
        shortcuts.map(s=>h('button',{key:s.val,onClick:()=>{onChange(s.val);setOpen(false);},style:{
          padding:"5px 11px",borderRadius:20,border:"1px solid",cursor:"pointer",
          fontFamily:"var(--sans)",fontSize:11,fontWeight:600,
          borderColor:value===s.val?"var(--accent)":"var(--border2)",
          background:value===s.val?"rgba(249,115,22,0.15)":"var(--surface2)",
          color:value===s.val?"var(--accent)":"var(--text2)"
        }},s.label))
      ),

      // Month nav
      h('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
        h('button',{onClick:prevMonth,style:{background:"var(--surface2)",border:"1px solid var(--border)",
          borderRadius:8,width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:14,color:"var(--text2)",cursor:"pointer"}},"‹"),
        h('span',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:600}},
          MONTHS_ES[viewMonth-1]+" "+viewYear),
        h('button',{onClick:nextMonth,disabled:fmt(viewYear,viewMonth,1)>=todayStr,style:{
          background:"var(--surface2)",border:"1px solid var(--border)",
          borderRadius:8,width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:14,cursor:"pointer",
          color:fmt(viewYear,viewMonth,1)>=todayStr?"var(--text3)":"var(--text2)",
          opacity:fmt(viewYear,viewMonth,1)>=todayStr?0.35:1}},"›")
      ),

      // Day-of-week headers
      h('div',{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}},
        DOW.map(d=>h('div',{key:d,style:{textAlign:"center",fontSize:9,color:"var(--text3)",fontWeight:600,padding:"2px 0"}},d))
      ),

      // Calendar grid
      h('div',{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}},
        grid.map((d,i)=>{
          if(!d) return h('div',{key:"e"+i});
          const future = isFuture(d);
          const sel_ = isSel(d);
          const tod = isToday(d);
          return h('button',{key:d,disabled:future,onClick:()=>selectDay(d),style:{
            padding:"6px 0",borderRadius:8,border:"none",cursor:future?"not-allowed":"pointer",
            fontSize:12,fontWeight:sel_?700:tod?600:400,
            background:sel_?"var(--accent)":tod?"rgba(249,115,22,0.15)":"transparent",
            color:future?"var(--text3)":sel_?"#fff":tod?"var(--accent)":"var(--text)",
            opacity:future?0.35:1,
            outline:tod&&!sel_?"1px solid rgba(249,115,22,0.4)":"none",
          }},d);
        })
      ),

      // Close
      h('button',{onClick:()=>setOpen(false),style:{
        marginTop:10,width:"100%",padding:"7px",borderRadius:"var(--radius-sm)",
        border:"1px solid var(--border)",background:"transparent",
        fontSize:12,color:"var(--text3)",cursor:"pointer",fontFamily:"var(--sans)"
      }},"Cerrar")
    )
  );
}


// ─── PURCHASE DAY GROUPS ──────────────────────────────────────────────────────
function PurchaseDayGroups({sorted,products,data,statusColor,changeStatus}){
  // Group by date
  const groups={};
  sorted.forEach(pu=>{
    if(!groups[pu.date])groups[pu.date]=[];
    groups[pu.date].push(pu);
  });
  const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));

  // All days open by default
  const [collapsed,setCollapsed]=useState({});
  const toggleDay=d=>setCollapsed(s=>({...s,[d]:!s[d]}));

  const MONTHS_ES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const fmtDay=dateStr=>{
    const t=today();
    const [y,m,d]=dateStr.split("-");
    if(dateStr===t) return "Hoy";
    const yday=new Date();yday.setDate(yday.getDate()-1);
    if(dateStr===yday.toISOString().slice(0,10)) return "Ayer";
    return `${+d} ${MONTHS_ES[+m-1]} ${y}`;
  };

  return h('div',{style:{display:"flex",flexDirection:"column",gap:10}},
    dates.map(date=>{
      const items=groups[date];
      const dayTotal=items.reduce((s,p)=>s+p.totalCost,0);
      const isOpen=!collapsed[date];
      const hasPending=items.some(p=>p.status==="Pendiente");

      return h('div',{key:date,style:{
        background:"var(--surface)",
        border:`1px solid ${hasPending?"rgba(234,179,8,0.3)":"var(--border)"}`,
        borderRadius:"var(--radius)",overflow:"hidden"
      }},

        // Day header row — tappable
        h('button',{onClick:()=>toggleDay(date),style:{
          width:"100%",display:"flex",alignItems:"center",gap:10,
          padding:"11px 14px",background:"none",border:"none",cursor:"pointer",
          borderBottom:isOpen?"1px solid var(--border)":"none"
        }},
          // Date badge
          h('div',{style:{
            background:hasPending?"rgba(234,179,8,0.12)":"rgba(249,115,22,0.1)",
            borderRadius:8,padding:"5px 10px",flexShrink:0,textAlign:"center",minWidth:52
          }},
            h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700,
              color:hasPending?"var(--yellow)":"var(--accent)"}},

// ─── SMART PURCHASE ENTRY — paste a list, parse it (rule-based, no AI) ────────
const EC_UNITS={kg:"kg",kilo:"kg",kilos:"kg",kilogramo:"kg",kilogramos:"kg",k:"kg",g:"g",gr:"g",grs:"g",gramo:"g",gramos:"g",l:"L",lt:"L",lts:"L",litro:"L",litros:"L",ml:"ml",und:"und",un:"und",u:"und",unid:"und",unidad:"und",unidades:"und",doc:"docena",docena:"docena",docenas:"docena",pqt:"paquete",paquete:"paquete",paquetes:"paquete",bolsa:"bolsa",bolsas:"bolsa",caja:"caja",cajas:"caja",lata:"lata",latas:"lata",saco:"saco",sacos:"saco",atado:"atado",atados:"atado"};
function ecNorm(s){return (s==null?"":String(s)).toLowerCase().normalize("NFD").replace(new RegExp("[\u0300-\u036f]","g"),"").trim();}
function ecMatchProduct(name,products){
  const n=ecNorm(name); if(!n)return null;
  let m=(products||[]).find(p=>ecNorm(p.name)===n); if(m)return m;
  m=(products||[]).find(p=>{const pn=ecNorm(p.name);return pn&&(pn.startsWith(n)||n.startsWith(pn));}); if(m)return m;
  m=(products||[]).find(p=>{const pn=ecNorm(p.name);return pn&&(pn.includes(n)||n.includes(pn));}); return m||null;
}
function parsePurchaseLine(raw,products){
  let line=(raw||"").trim(); if(!line)return null;
  // Ignore header/date/count/footer/divider lines from a shared "Lista de compra" message
  const SKIP_PREFIX=["🛒","🏪","📅","📦","🧾","📍","🗒","📝","✅"];
  if(SKIP_PREFIX.some(e=>line.startsWith(e))) return null;
  if(/^_.*_$/.test(line)) return null;                                        // _italic footer_
  if(new RegExp("^[-\\u2013\\u2014_=\\u00b7\\u2022.\\s]+$").test(line)) return null; // divider line
  line=line.replace(new RegExp("^[\\u2022\\-*\\u00b7\\u25aa\\u25e6]+\\s*"),"").trim(); // strip bullet
  if(!line||!/[a-zA-ZÀ-ÿ]/.test(line)) return null;                 // no letters → not an item
  const tokens=line.replace(/,/g," ").replace(/\s+/g," ").split(" ").filter(Boolean);
  let qty=null,unit="",price=null; const nameParts=[],nums=[];
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i], low=t.toLowerCase();
    const sMatch=low.match(/^s\/?\.?(\d+(?:[.,]\d+)?)?$/);
    if(sMatch){
      if(sMatch[1]!=null)price=parseFloat(sMatch[1].replace(",","."));
      else{const nxt=tokens[i+1],nv=nxt&&nxt.match(/^(\d+(?:[.,]\d+)?)$/);if(nv){price=parseFloat(nv[1].replace(",","."));i++;}}
      continue;
    }
    const nu=low.match(/^(\d+(?:[.,]\d+)?)([a-z]+)?$/);
    if(nu){
      const val=parseFloat(nu[1].replace(",",".")),ur=nu[2];
      if(ur&&EC_UNITS[ur]){qty=val;unit=EC_UNITS[ur];}
      else nums.push(val);
      continue;
    }
    if(EC_UNITS[low]){unit=EC_UNITS[low];if(qty==null&&nums.length)qty=nums.pop();continue;}
    nameParts.push(t);
  }
  if(qty==null&&nums.length)qty=nums.shift();
  if(price==null&&nums.length)price=nums.shift();
  const typedName=nameParts.join(" ").trim();
  const matched=ecMatchProduct(typedName,products);
  return {raw:line,typedName,name:matched?matched.name:typedName,matchedId:matched?matched.id:null,
    qty:qty!=null?qty:1,unit:unit||(matched?matched.unit:"und"),unitPrice:price!=null?price:(matched?(matched.avgCost||0):0)};
}
function parsePurchaseText(text,products){
  return (text||"").split(/\n/).map(l=>parsePurchaseLine(l,products)).filter(Boolean);
}

function PurchasesTab({data,setData,toast}){
  const {purchases,products}=data;
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({});
  const [filter,setFilter]=useState("all");
  const [dateFrom,setDateFrom]=useState("");
  const [dateTo,setDateTo]=useState("");
  const [showDateFilter,setShowDateFilter]=useState(false);
  const [pasteModal,setPasteModal]=useState(false);
  const [pasteText,setPasteText]=useState("");
  const [pasteRows,setPasteRows]=useState(null);
  const openPaste=()=>{setPasteText("");setPasteRows(null);setPasteModal(true);};
  const doParsePaste=()=>setPasteRows(parsePurchaseText(pasteText,products));
  const updatePasteRow=(i,patch)=>setPasteRows(rows=>rows.map((r,j)=>j===i?{...r,...patch}:r));
  const removePasteRow=(i)=>setPasteRows(rows=>rows.filter((_,j)=>j!==i));
  // ── build & share a buying list (from low stock, editable) ────────────────
  const [buildModal,setBuildModal]=useState(false);
  const [buildText,setBuildText]=useState("");
  const openBuild=()=>{
    const low=(products||[]).filter(p=>p.stock<p.minStock)
      .sort((a,b)=>(a.stock-a.minStock)-(b.stock-b.minStock))
      .map(p=>{const buy=Math.max(p.minStock*2-p.stock,p.minStock);return `${p.name} ${fmtNum(buy)}${p.unit}`;});
    setBuildText(low.join("\n"));
    setBuildModal(true);
  };
  const _prettyDate=()=>{const d=new Date().toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});return d.charAt(0).toUpperCase()+d.slice(1);};
  const buildFullText=()=>{
    const rn=getSettings(data).restaurantName;
    const items=buildText.split("\n").map(l=>l.trim()).filter(Boolean);
    return "🛒 *LISTA DE COMPRA*"
      +(rn?"\n🏪 "+rn:"")
      +"\n📅 "+_prettyDate()
      +"\n————————————\n"
      +items.map(l=>"• "+l).join("\n")
      +"\n————————————\n📦 "+items.length+" producto"+(items.length!==1?"s":"")
      +"\n_Enviado desde The Easy Cook_";
  };
  const copyBuild=()=>{
    const txt=buildFullText();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>toast("Lista copiada — pégala donde quieras","success"),()=>toast("No se pudo copiar automáticamente","error"));
    } else { toast("Selecciona el texto para copiarlo","info"); }
  };
  const shareWhatsApp=()=>{ window.open("https://wa.me/?text="+encodeURIComponent(buildFullText()),"_blank"); };
  const sendToReader=()=>{ setPasteText(buildText); setBuildModal(false); setPasteRows(null); setPasteModal(true); };

  // ── helpers ────────────────────────────────────────────────────────────────
  // Apply stock + avg cost update when a purchase is confirmed as Recibido
  const applyToInventory=(pu,currentProducts,currentPurchases)=>{
    const uc=pu.totalCost/pu.qty;
    return currentProducts.map(p=>{
      if(p.id!==pu.productId)return p;
      // Weighted avg: include all already-Recibido purchases + this one
      const prevReceived=currentPurchases.filter(x=>x.id!==pu.id&&x.productId===p.id&&x.status==="Recibido");
      const tq=prevReceived.reduce((s,x)=>s+x.qty,0)+pu.qty;
      const tc=prevReceived.reduce((s,x)=>s+x.totalCost,0)+pu.totalCost;
      // If stock had gone negative (real vs. theoretical stock drifted apart —
      // see needsRecount), a new purchase starts fresh from zero instead of
      // "paying off" the deficit. The negative was a signal to go recount,
      // not a debt the next delivery has to settle.
      const baseStock=Math.max(0,p.stock);
      return{...p,avgCost:tq>0?tc/tq:uc,stock:+(baseStock+pu.qty).toFixed(2),lastCost:uc};
    });
  };

  // Reverse stock + recalc avg when a Recibido purchase is un-done (not used here
  // but available if we add an undo flow later)

  // ── new manual purchase — always Recibido immediately ─────────────────────
  const save=()=>{
    if(!form.productId||!form.qty||!form.totalCost)return;
    const np={...form,id:"PU"+uid(),date:form.date||today(),qty:+form.qty,totalCost:+form.totalCost,status:"Recibido"};
    setData(d=>{
      const updatedPurchases=[...d.purchases,np];
      const updatedProducts=applyToInventory(np,d.products,updatedPurchases);
      const phEntry={id:"PH"+uid(),productId:np.productId,date:np.date,unitCost:np.totalCost/np.qty};
      return{...d,purchases:updatedPurchases,products:updatedProducts,priceHistory:[...(d.priceHistory||[]),phEntry]};
    });
    setModal(false);toast("Compra registrada · Stock e inventario actualizados","success");
  };

  // ── commit a pasted purchase list — creates new ingredients as needed ──────
  const commitPaste=()=>{
    const rows=(pasteRows||[]).filter(r=>(+r.qty)>0&&((r.matchedId)||(r.name||r.typedName||"").trim()));
    if(!rows.length){toast("No hay líneas válidas para agregar","error");return;}
    setData(d=>{
      let products=[...d.products],purchases=[...d.purchases],priceHistory=[...(d.priceHistory||[])];
      const defCat=(d.ingredientCategories||[]).includes("Otros")?"Otros":((d.ingredientCategories||[])[0]||"Otros");
      rows.forEach(r=>{
        const qty=+r.qty||0;if(qty<=0)return;
        const unitPrice=+r.unitPrice||0;const total=+(qty*unitPrice).toFixed(2);
        let pid=r.matchedId;
        if(!pid){
          pid="P"+uid();
          products.push({id:pid,name:(r.name||r.typedName||"Insumo").trim(),category:defCat,unit:r.unit||"und",minStock:0,stock:0,avgCost:unitPrice,yieldPct:100});
        }
        const pu={id:"PU"+uid(),productId:pid,qty,totalCost:total,date:today(),status:"Recibido"};
        purchases.push(pu);
        products=applyToInventory(pu,products,purchases);
        priceHistory.push({id:"PH"+uid(),productId:pid,date:pu.date,unitCost:total/qty});
      });
      return{...d,products,purchases,priceHistory};
    });
    const n=rows.length;
    setPasteModal(false);
    toast(n+" ítem"+(n!==1?"s":"")+" agregado"+(n!==1?"s":"")+" al stock ✅","success");
  };

  // ── change status of an existing purchase ─────────────────────────────────
  const changeStatus=(pu,newStatus)=>{
    if(pu.status===newStatus)return;
    if(pu.status==="Recibido"){toast("Las compras recibidas no se pueden revertir","error");return;}
    setData(d=>{
      // If confirming as Recibido: apply to inventory
      if(newStatus==="Recibido"){
        const updatedPurchases=d.purchases.map(x=>x.id===pu.id?{...x,status:"Recibido"}:x);
        const updatedProducts=applyToInventory({...pu,status:"Recibido"},d.products,updatedPurchases);
        const phEntry={id:"PH"+uid(),productId:pu.productId,date:pu.date||today(),unitCost:pu.totalCost/pu.qty};
        return{...d,purchases:updatedPurchases,products:updatedProducts,priceHistory:[...(d.priceHistory||[]),phEntry]};
      }
      // Cancelado: just update status, no stock change
      return{...d,purchases:d.purchases.map(x=>x.id===pu.id?{...x,status:newStatus}:x)};
    });
    const messages={
      Recibido:"Compra confirmada · Stock e inventario actualizados ✅",
      Cancelado:"Compra cancelada",
    };
    toast(messages[newStatus]||"Estado actualizado", newStatus==="Recibido"?"success":"info");
  };

  const statusColor={Recibido:"green",Pendiente:"yellow",Cancelado:"gray"};
  const statusCounts={
    all:purchases.length,
    Pendiente:purchases.filter(p=>p.status==="Pendiente").length,
    Recibido:purchases.filter(p=>p.status==="Recibido").length,
    Cancelado:purchases.filter(p=>p.status==="Cancelado").length,
  };

  const sorted=[...purchases]
    .filter(pu=>{
      if(filter!=="all"&&pu.status!==filter)return false;
      if(dateFrom&&pu.date<dateFrom)return false;
      if(dateTo&&pu.date>dateTo)return false;
      return true;

    .sort((a,b)=>b.date.localeCompare(a.date));

  const clearDates=()=>{setDateFrom("");setDateTo("");};

  return h('div',{className:"slide-up"},
    h(SectionHeader,{title:"Compras",action:()=>{setForm({date:today()});setModal(true);},actionLabel:"+ Nueva compra"}),

    h('button',{onClick:openBuild,style:{
