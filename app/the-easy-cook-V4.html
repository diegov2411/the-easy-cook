// Login (owner) / Crear cuenta (owner) / Unir dispositivo (empleado, código).
function AuthScreen({reload}){
  const [mode,setMode]=useState("login");
  const [form,setForm]=useState({email:"",password:"",bizName:"",ruc:"",code:"",label:"",actCode:""});
  const [error,setError]=useState("");
  const [note,setNote]=useState("");
  const [busy,setBusy]=useState(false);
  const set=(k,v)=>{setForm(f=>({...f,[k]:v}));setError("");setNote("");};
  const switchMode=(m)=>{setMode(m);setError("");setNote("");};

  const doLogin=async()=>{
    if(!form.email.trim()||!form.password){setError("Ingresa correo y contraseña");return;}
    setBusy(true);setError("");
    const {error}=await sb.auth.signInWithPassword({email:form.email.trim(),password:form.password});
    if(error){setError(traducirAuthError(error.message));setBusy(false);return;}
    // Session change → Root re-resolves membership → App. Keep the spinner up.
  };

  const doForgot=async()=>{
    if(!form.email.trim()){setError("Ingresa tu correo");return;}
    setBusy(true);setError("");setNote("");
    const {error}=await sb.auth.resetPasswordForEmail(form.email.trim(),{redirectTo:window.location.href.split("#")[0]});
    setBusy(false);
    if(error){setError(traducirAuthError(error.message));return;}
    setNote("Si ese correo tiene una cuenta, te enviamos un enlace para restablecer la contraseña. Revisa tu bandeja (y spam).");
  };

  const doSignup=async()=>{
    if(!form.actCode.trim()){setError("Ingresa el código de activación que te dimos");return;}
    if(!form.email.trim()||!form.password){setError("Ingresa correo y contraseña");return;}
    if(form.password.length<6){setError("La contraseña debe tener al menos 6 caracteres");return;}
    if(!form.bizName.trim()){setError("Ingresa el nombre del restaurante");return;}
    setBusy(true);setError("");
    const {data,error}=await sb.auth.signUp({email:form.email.trim(),password:form.password});
    if(error){setError(traducirAuthError(error.message));setBusy(false);return;}
    if(!data.session){
      setNote("Te enviamos un correo para confirmar la cuenta. Confírmalo y luego inicia sesión.");
      setBusy(false);setMode("login");return;
    }
    const {error:rpcErr}=await sb.rpc("create_my_restaurant",
      {p_name:form.bizName.trim(),p_ruc:form.ruc.trim()||null,p_code:form.actCode.trim()});
    if(rpcErr){
      const m=(rpcErr.message||"").toLowerCase();
      setError(m.includes("activaci")||m.includes("usado")
        ? "Código de activación inválido o ya usado. Contáctanos."
        : "Cuenta creada, pero no se pudo registrar el restaurante: "+rpcErr.message);
      setBusy(false);return;
    }
    reload(); // membership now exists → advance to the app
  };

  const doJoin=async()=>{
    if(!form.code.trim()){setError("Ingresa el código del equipo");return;}
    setBusy(true);setError("");
    const {error:anonErr}=await sb.auth.signInAnonymously();
    if(anonErr){setError(traducirAuthError(anonErr.message));setBusy(false);return;}
    const {error:joinErr}=await sb.rpc("join_restaurant_with_code",
      {p_code:form.code.trim(),p_label:form.label.trim()||null});
    if(joinErr){
      await sb.auth.signOut(); // undo the anon session so we return cleanly
      const m=(joinErr.message||"").toLowerCase();
      setError(m.includes("inv")||m.includes("cód")?"Código inválido. Pídeselo al dueño.":("No se pudo unir: "+joinErr.message));
      setBusy(false);return;
    }
    reload(); // membership now exists → advance to the app
  };

  const submit=()=>{ if(mode==="login")doLogin(); else if(mode==="signup")doSignup(); else if(mode==="forgot")doForgot(); else doJoin(); };

  return h('div',{style:{
    position:"fixed",inset:0,background:"var(--bg)",zIndex:200,
    display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"24px 20px"
  }},
    h('div',{className:"pin-login-inner",style:{width:"100%",maxWidth:400}},
      h('div',{style:{textAlign:"center",marginBottom:22}},
        h('div',{style:{width:52,height:52,borderRadius:16,background:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,margin:"0 auto 12px"}},"👨‍🍳"),
        h('div',{style:{fontFamily:"var(--sora)",fontSize:20,fontWeight:700}},"The Easy Cook"),
        h('div',{style:{fontSize:13,color:"var(--text2)",marginTop:6,lineHeight:1.5}},
          mode==="join"
            ?"Ingresa el código que te dio el dueño para usar la app en este equipo."
            :mode==="forgot"
              ?"Te enviaremos un enlace a tu correo para restablecer tu contraseña."
              :"Entra a la cuenta de tu restaurante o crea una nueva.")
      ),

      mode!=="forgot"&&h(Tabs,{active:mode,onChange:switchMode,fill:true,style:{marginBottom:18},tabs:[
        ["login","Iniciar sesión"],
        ["signup","Crear cuenta"],
        ["join","Unir equipo"]
      ]}),

      mode==="login"&&h(Fragment,null,
        h(FormRow,{label:"Correo"},
          h('input',{type:"email",value:form.email,autoComplete:"email",
            onChange:e=>set("email",e.target.value),placeholder:"tucorreo@ejemplo.com"})),
        h(FormRow,{label:"Contraseña"},
          h('input',{type:"password",value:form.password,autoComplete:"current-password",
            onChange:e=>set("password",e.target.value),placeholder:"••••••••"})),
        h('div',{style:{textAlign:"right",marginTop:-4,marginBottom:2}},
          h('button',{onClick:()=>switchMode("forgot"),style:{background:"none",border:"none",color:"var(--accent)",fontSize:12,fontWeight:600,cursor:"pointer",padding:0}},"¿Olvidaste tu contraseña?"))
      ),

      mode==="forgot"&&h(Fragment,null,
        h(FormRow,{label:"Correo"},
          h('input',{type:"email",value:form.email,autoComplete:"email",
            onChange:e=>set("email",e.target.value),placeholder:"tucorreo@ejemplo.com"})),
        h('button',{onClick:()=>switchMode("login"),style:{background:"none",border:"none",color:"var(--text3)",fontSize:12,fontWeight:600,cursor:"pointer",padding:"2px 0"}},"← Volver a iniciar sesión")
      ),

      mode==="signup"&&h(Fragment,null,
        h(FormRow,{label:"Código de activación"},
          h('input',{value:form.actCode,autoCapitalize:"characters",
            onChange:e=>set("actCode",e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)),
            placeholder:"el código que te dimos",style:{letterSpacing:"0.15em",fontWeight:700,textAlign:"center"}})),
        h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:-6,marginBottom:12,lineHeight:1.4}},
          "Solo con un código válido puedes crear una cuenta. Si no tienes uno, contáctanos."),
        h(FormRow,{label:"Correo"},
          h('input',{type:"email",value:form.email,autoComplete:"email",
            onChange:e=>set("email",e.target.value),placeholder:"tucorreo@ejemplo.com"})),
        h(FormRow,{label:"Contraseña (mín. 6)"},
          h('input',{type:"password",value:form.password,autoComplete:"new-password",
            onChange:e=>set("password",e.target.value),placeholder:"••••••••"})),
        h('div',{style:{borderTop:"1px solid var(--border)",paddingTop:12,marginTop:12,marginBottom:2}},
          h('div',{style:{fontSize:12,fontWeight:600,color:"var(--text2)",marginBottom:10}},"Tu restaurante")),
        h(FormRow,{label:"Nombre del restaurante"},
          h('input',{value:form.bizName,onChange:e=>set("bizName",e.target.value),placeholder:"ej. Andiamo Café Trattoria"})),
        h(FormRow,{label:"RUC (opcional)"},
          h('input',{value:form.ruc,inputMode:"numeric",
            onChange:e=>set("ruc",e.target.value.replace(/\D/g,"").slice(0,11)),placeholder:"ej. 20123456789"}))
      ),

      mode==="join"&&h(Fragment,null,
        h(FormRow,{label:"Código del equipo"},
          h('input',{value:form.code,autoCapitalize:"characters",
            onChange:e=>set("code",e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)),
            placeholder:"ej. K7P2QM",style:{letterSpacing:"0.15em",fontWeight:700,textAlign:"center"}})),
        h(FormRow,{label:"Nombre de este equipo (opcional)"},
          h('input',{value:form.label,onChange:e=>set("label",e.target.value),placeholder:"ej. Caja 1, Celular de Juan"}))
      ),

      error&&h('div',{style:{fontSize:12,color:"var(--red)",margin:"4px 0 12px",fontWeight:500,textAlign:"center"}},error),
      note&&h('div',{style:{fontSize:12,color:"var(--green)",margin:"4px 0 12px",fontWeight:500,textAlign:"center",lineHeight:1.5}},note),

      h(Btn,{onClick:submit,size:"lg",disabled:busy,style:{width:"100%",marginTop:6}},
        busy?"Un momento…":(mode==="login"?"Iniciar sesión":mode==="signup"?"Crear cuenta y restaurante":mode==="forgot"?"Enviar enlace":"Unir este equipo"))
    )
  );
}

// Resolves the cloud session → restaurant membership → hydrated data, then hands
// off to App. Falls back to the local cache when the network is unreachable.
function CloudRoot(){
  const [booting,setBooting]=useState(true);
  const [session,setSession]=useState(null);
  const [ctx,setCtx]=useState(null);      // resolved CloudCtx value, or null
  const [recovery,setRecovery]=useState(false); // clicked a password-reset link
  const [reloadN,setReloadN]=useState(0);
  const reload=useCallback(()=>setReloadN(n=>n+1),[]);

  // Track the Supabase auth session (persisted across reloads by supabase-js).
  useEffect(()=>{
    let sub=null;
    sb.auth.getSession().then(({data})=>setSession(data.session||null)).catch(()=>setSession(null));
    try{
      const r=sb.auth.onAuthStateChange((evt,s)=>{ if(evt==="PASSWORD_RECOVERY")setRecovery(true); setSession(s||null); });
      sub=r.data.subscription;
    }catch(e){}
    return ()=>{ try{sub&&sub.unsubscribe();}catch(e){} };
  },[]);

  // Resolve membership + hydrate collections whenever the session (or reload) changes.
  useEffect(()=>{
    let cancel=false;
    (async()=>{
      if(!session){ if(!cancel){setCtx(null);setBooting(false);} return; }
      const MKEY="theeasycook_membership";
      let membership=null, online=true;
      try{
        const {data,error}=await sb.rpc("my_membership");   // restaurant_id, role, restaurant_active, name
        if(error)throw error;
        membership=(data&&data[0])||null;
        try{ membership?localStorage.setItem(MKEY,JSON.stringify(membership)):localStorage.removeItem(MKEY); }catch(e){}
      }catch(e){
        online=false;                                       // offline → fall back to the last known membership
        try{ const c=localStorage.getItem(MKEY); if(c) membership=JSON.parse(c); }catch(e2){}
      }
      if(cancel)return;
      if(!membership){
        // No restaurant → maybe a vendor admin login (owns no data → sees the admin panel).
        let admin=false;
        try{ const {data}=await sb.rpc("is_superadmin"); admin=!!data; }catch(e){}
        if(cancel)return;
        setCtx(admin?{admin:true}:null); setBooting(false); return;
      }
      // Deactivated (e.g. non-paying) client → show a message instead of the app.
      if(membership.restaurant_active===false){ setCtx({deactivated:true}); setBooting(false); return; }

      const rid=membership.restaurant_id, isOwner=membership.role==="owner";
      let initialData=null, initialVersions={}, teamCode=null;
      try{ const fetched=await cloudFetchAll(rid); initialData=fetched.data; initialVersions=fetched.versions; }catch(e){ online=false; }
      if(isOwner){ try{ const {data:tc}=await sb.rpc("my_team_code"); teamCode=tc||null; }catch(e){} }
      try{ sb.rpc("touch_membership"); }catch(e){}
      if(cancel)return;

      // Write ONE collection with optimistic concurrency. Returns
      // {status:'ok'|'conflict', version, data?} — the client merges on conflict.
      const saveCollection=async(name,payload,base)=>{
        const {data,error}=await sb.rpc("save_collection",{p_name:name,p_data:(payload===undefined?null:payload),p_base:base||null});
        if(error)throw error;
        return data;
      };

      setCtx({
        sb, restaurantId:rid, role:membership.role, isOwner,
        email:(session.user&&session.user.email)||null,
        userId:(session.user&&session.user.id)||null,
        accessToken:(session&&session.access_token)||null, online,
        initialData, initialVersions, teamCode, saveCollection,
        fetchAll:cloudFetchAll,                 // re-pull all collections on reconnect
        // Record a notable change (owner gets a live toast). Fire-and-forget.
        logEvent:(kind,message,actorName)=>sb.rpc("log_event",{p_kind:kind,p_message:message,p_actor_name:actorName||null}),
        // One-time "upload my local data" — push every collection, merging on conflict.
        uploadAll:async(appData)=>{
          for(const name of COLLECTION_KEYS){
            let val=appData[name]!==undefined?appData[name]:INIT[name];
            let base=initialVersions[name];
            for(let i=0;i<6;i++){
              const res=await saveCollection(name,val,base);
              if(res&&res.status==="conflict"){ val=mergeCollection(val,res.data); base=res.version; continue; }
              break;
            }
          }
        },
        logout:()=>sb.auth.signOut(),
        rotateCode:async()=>{ const {data,error}=await sb.rpc("rotate_join_code"); if(error)throw error; return data; },
        listDevices:async()=>{ const {data,error}=await sb.rpc("list_devices"); if(error)throw error; return data||[]; },
        revokeDevice:async(uid)=>{ const {error}=await sb.rpc("revoke_membership",{p_user:uid}); if(error)throw error; },
        revokeAllDevices:async()=>{ const {data,error}=await sb.rpc("revoke_all_devices"); if(error)throw error; return data; },
      });
      setBooting(false);
    })();
    return ()=>{cancel=true;};
  },[session,reloadN]);

  if(recovery) return h(ResetPasswordScreen,{sb,onDone:()=>{setRecovery(false);reload();}});
  if(booting) return h(CloudSplash,{msg:"Conectando…"});
  if(ctx&&ctx.admin) return h(AdminPanel,{sb,onLogout:()=>sb.auth.signOut()});
  if(ctx&&ctx.deactivated) return h(DeactivatedScreen,{onLogout:()=>sb.auth.signOut()});
  // key App by restaurant so it fully re-seeds if the account/restaurant changes
  if(ctx) return h(CloudCtx.Provider,{value:ctx}, h(App,{key:ctx.restaurantId}));
  return h(AuthScreen,{reload});
}

// Entry point: cloud mode when supabase-js loaded, else pure-local (offline).
function Root(){
  return sb ? h(CloudRoot,null) : h(App,null);
}

if(typeof React === 'undefined' || typeof ReactDOM === 'undefined'){
  // React bundle didn't load — show Safari instructions
  var inst2=document.getElementById('safari-instructions');
  var msg2=document.getElementById('fallback-msg');
  if(msg2)msg2.style.display='none';
  if(inst2)inst2.style.display='block';
} else {
  try {
    ReactDOM.createRoot(document.getElementById('root')).render(h(Root,null));
    // Signal success to fallback handler (called after first paint via rAF)
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      if(window.__appReady) window.__appReady();
    });});
  } catch(e) {
    var det=document.getElementById('error-detail');
    var msg3=document.getElementById('fallback-msg');
    var inst3=document.getElementById('safari-instructions');
    if(msg3)msg3.style.display='none';
    if(inst3)inst3.style.display='block';
    if(det){ det.style.display='block'; det.textContent='Error: '+e.message; }
  }
}

</script>
</body>
