// ─────────────────────────────────────────────────────────────────────────────
// WEEKLY REPORT
// ─────────────────────────────────────────────────────────────────────────────
function WeeklyReport({data}){
  const {products,recipes,bom,orders=[],orderLines=[],subBom=[],subRecipes=[],purchases=[]}=data;
  const [weekOffset,setWeekOffset]=useState(0);
  const {start,end}=weekBounds(weekOffset);

  // Dynamically compute how far back we need to go to cover oldest order,
  // with a minimum of 26 weeks so the picker always feels useful
  const oldestOrderDate=orders.reduce((min,o)=>o.date<min?o.date:min,"9999-99-99");
  // How many weeks back to cover oldest order (min 26, max 104)
  let minWeeks=26;
  if(orders.length){
    let w=0;
    while(w<104){const {start:ws}=weekBounds(-w);if(ws<=oldestOrderDate)break;w++;}
    minWeeks=Math.max(26,w+1);
  }

  // Build dropdown covering all weeks with data
  const weekOptions=[];
  for(let i=0;i>=-minWeeks+1;i--){
    const {start:ws,end:we}=weekBounds(i);
    const label=i===0?"Esta semana":ws.slice(5).replace("-","/")+" — "+we.slice(5).replace("-","/");
    weekOptions.push({offset:i,label,ws,we});
  }
  const isCurrentWeek=weekOffset===0;
  const isOldestWeek=weekOffset===-(minWeeks-1);

  const weekOrders=orders.filter(o=>o.status==="closed"&&inRange(o.date,start,end));
  const weekLines=linesOfOrders(orderLines,weekOrders);

  // Revenue
  const revenue=weekLines.reduce((s,l)=>{const r=recipeById(recipes,l.recipeId);return s+(r?r.price*l.qty:0);},0);
  // Food cost (BOM-based)
  const foodCost=weekLines.reduce((s,l)=>s+recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty,0);
  const grossMargin=revenue-foodCost;
  const grossMarginPct=revenue>0?grossMargin/revenue*100:0;
  const foodCostPct=revenue>0?foodCost/revenue*100:0;
  const portions=weekLines.reduce((s,l)=>s+l.qty,0);
  const avgTicket=weekOrders.length>0?revenue/weekOrders.length:0;
  const totalPax=weekOrders.reduce((s,o)=>s+(o.pax||0),0);
  const avgTicketPerPax=totalPax>0?revenue/totalPax:0;

  // Daily revenue bars
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);
    const dateStr=d.toISOString().slice(0,10);
    const dayLines=linesOfOrders(orderLines,orders.filter(o=>o.date===dateStr&&o.status==="closed"));
    const dayRev=dayLines.reduce((s,l)=>{const r=recipeById(recipes,l.recipeId);return s+(r?r.price*l.qty:0);},0);
    days.push({label:["L","M","X","J","V","S","D"][i],v:dayRev});
  }

  // Dish performance
  const dishMap={};
  weekLines.forEach(l=>{
    if(!dishMap[l.recipeId])dishMap[l.recipeId]={qty:0,revenue:0,foodCost:0};
    const r=recipeById(recipes,l.recipeId);
    dishMap[l.recipeId].qty+=l.qty;
    dishMap[l.recipeId].revenue+=(r?r.price*l.qty:0);
    dishMap[l.recipeId].foodCost+=recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty;
  });
  const dishPerf=recipes.map(r=>{
    const d=dishMap[r.id]||{qty:0,revenue:0,foodCost:0};
    return{...r,qty:d.qty,revenue:d.revenue,foodCost:d.foodCost,margin:d.revenue-d.foodCost,
      marginPct:d.revenue>0?(d.revenue-d.foodCost)/d.revenue*100:0};
  }).filter(r=>r.qty>0);
  const byMarginAmt=[...dishPerf].sort((a,b)=>b.margin-a.margin);
  const byVolume=[...dishPerf].sort((a,b)=>b.qty-a.qty);

  return h('div',{className:"slide-up"},
    // Week picker
    h('div',{className:"no-print",style:{display:"flex",alignItems:"center",gap:8,marginBottom:16,
      background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"10px 12px"}},
      h('button',{onClick:()=>setWeekOffset(w=>Math.max(-(minWeeks-1),w-1)),
        disabled:isOldestWeek,
        style:{background:"none",border:"none",
          color:isOldestWeek?"var(--border2)":"var(--text2)",
          fontSize:18,cursor:isOldestWeek?"default":"pointer",padding:"0 2px",flexShrink:0}},"‹"),
      h('select',{value:weekOffset,onChange:e=>setWeekOffset(+e.target.value),style:{flex:1,fontSize:13,fontWeight:600,fontFamily:"var(--sora)"}},
        weekOptions.map(o=>h('option',{key:o.offset,value:o.offset},o.label))
      ),
      h('button',{onClick:()=>setWeekOffset(w=>Math.min(0,w+1)),
        disabled:isCurrentWeek,
        style:{background:"none",border:"none",
          color:isCurrentWeek?"var(--border2)":"var(--text2)",
          fontSize:18,cursor:isCurrentWeek?"default":"pointer",padding:"0 2px",flexShrink:0}},"›")
    ),
    // KPI grid — 2 cols mobile, 4 cols desktop
    h('div',{className:"print-section kpi-grid-desktop",style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}},
      h(MetricCard,{label:"Ventas semana",value:fmtCost(revenue),sub:`${portions} porciones · ${weekOrders.length} pedidos`,color:"var(--accent)"}),
      h(MetricCard,{label:"Costo de alimentos",value:foodCostPct.toFixed(1)+"%",sub:`${fmtCost(foodCost)} total`,color:foodCostPct>33?"var(--red)":foodCostPct>28?"var(--yellow)":"var(--green)",tip:"De cada S/ que vendes, cuánto se te fue en ingredientes. Ej: 30% significa que de S/100 vendidos, S/30 fueron el costo de la comida. Un rango sano suele estar entre 28% y 35% — más alto y tu margen se achica."}),
      h(MetricCard,{label:"Margen bruto",value:fmtCost(grossMargin),sub:grossMarginPct.toFixed(1)+"% del total",color:"var(--green)",tip:"Lo que te queda de las ventas después de pagar solo los ingredientes (no incluye sueldos, alquiler ni otros gastos). Es la plata disponible para cubrir el resto del negocio."}),
      h(MetricCard,{label:"Ticket promedio",value:fmtCost(avgTicket),sub:"por pedido",color:"var(--blue)",tip:"El total vendido dividido entre el número de pedidos — cuánto gasta, en promedio, cada mesa que atiendes."}),
      h('div',{style:{gridColumn:"1 / -1"}},
        h(MetricCard,{label:"Personas atendidas",value:String(totalPax),sub:totalPax>0?`${fmtCost(avgTicketPerPax)} por persona`:"sin datos de aforo",color:"var(--text)",tip:"El total de comensales que registraste en Ventas esta semana (el campo de 'N° de personas' al abrir cada mesa). Te sirve para saber cuánto gasta cada persona, no solo cada mesa."})
      )
    ),
    // Two-column body on desktop
    h('div',{className:"reports-two-col",style:{display:"block"}},
      // Left: Daily bars + volume table
      h('div',null,
        h('div',{className:"print-section",style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px 16px",marginBottom:12}},
          h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:600,marginBottom:10}},"Ventas por día — semana"),
          revenue===0
            ?h('div',{style:{fontSize:12,color:"var(--text3)",textAlign:"center",padding:"16px 0"}},"Sin ventas esta semana")
            :h(MiniBarChart,{bars:days,height:72,color:"var(--accent)"})
        ),
        // Top by volume
        h('div',{className:"print-section"},
          h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:600,marginBottom:10}},"📦 Platos por volumen"),
          dishPerf.length===0
            ?h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px",fontSize:12,color:"var(--text3)",textAlign:"center"}},"Sin ventas esta semana")
            :h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",overflow:"hidden"}},
              // Header — mobile: name + ingresos + margen%; desktop: adds qty + margin soles
              h('div',{style:{display:"grid",gridTemplateColumns:"1fr auto auto",padding:"8px 12px",
                background:"var(--surface2)",borderBottom:"1px solid var(--border)",
                fontSize:10,fontWeight:600,color:"var(--text3)",gap:12}},
                h('span',null,"PLATO"),
                h('span',{style:{textAlign:"right",minWidth:64}},"INGRESOS"),
                h('span',{style:{textAlign:"right",minWidth:48}},"MARGEN")
              ),
              byVolume.map((d,i)=>h('div',{key:d.id,style:{
                display:"grid",gridTemplateColumns:"1fr auto auto",padding:"10px 12px",
                borderBottom:i<byVolume.length-1?"1px solid var(--border)":"none",
                gap:12,alignItems:"center"}},
                // Name + qty sub-label
                h('div',{style:{minWidth:0}},
                  h('div',{style:{fontWeight:500,fontSize:12,
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},d.name),
                  h('div',{style:{fontSize:10,color:"var(--text3)",marginTop:2}},
                    d.qty+" und · "+d.category)
                ),
                // Ingresos
                h('div',{style:{textAlign:"right",color:"var(--accent)",fontWeight:700,
                  fontSize:12,whiteSpace:"nowrap",minWidth:64}},fmtCost(d.revenue)),
                // Margin % badge
                h('div',{style:{textAlign:"right",minWidth:48}},
                  h('span',{style:{
                    display:"inline-block",
                    padding:"2px 7px",borderRadius:20,fontSize:11,fontWeight:700,
                    background:d.marginPct>70?"rgba(34,197,94,0.15)":d.marginPct>50?"rgba(234,179,8,0.15)":"rgba(239,68,68,0.12)",
                    color:d.marginPct>70?"var(--green)":d.marginPct>50?"var(--yellow)":"var(--red)",
                  }},d.marginPct.toFixed(0)+"%")
                )
              ))
            )
        )
      ),
      // Right: Top by margin
      h('div',null,
        h('div',{className:"print-section",style:{marginBottom:12}},
          h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:600,marginBottom:10}},"🏆 Platos por margen bruto"),
          dishPerf.length===0
            ?h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px",fontSize:12,color:"var(--text3)",textAlign:"center"}},"Sin ventas esta semana")
            :h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
              byMarginAmt.map((d,i)=>{
                const barW=byMarginAmt[0].margin>0?(d.margin/byMarginAmt[0].margin*100).toFixed(1)+"%":"0%";
                const barColor=i===0?"var(--accent)":i===1?"var(--blue)":"var(--text3)";

// ─────────────────────────────────────────────────────────────────────────────
// MONTHLY P&L
// ─────────────────────────────────────────────────────────────────────────────
function MonthlyPL({data}){
  const {products,recipes,bom,orders=[],orderLines=[],subBom=[],subRecipes=[],purchases=[],wastageLog=[]}=data;
  const now=new Date();
  const [selYear,setSelYear]=useState(now.getFullYear());
  const [selMonth,setSelMonth]=useState(now.getMonth()+1); // 1-12

  // Derive bounds directly from selected year/month
  const pad=n=>String(n).padStart(2,"0");
  const start=`${selYear}-${pad(selMonth)}-01`;
  const lastDay=new Date(selYear,selMonth,0).getDate();
  const end=`${selYear}-${pad(selMonth)}-${pad(lastDay)}`;
  const mLabel=new Date(selYear,selMonth-1,1).toLocaleDateString("es-PE",{month:"long",year:"numeric"});

  // Year options: 2 years back up to current
  const YEARS=[];for(let y=now.getFullYear()-2;y<=now.getFullYear();y++)YEARS.push(y);
  const MONTHS_ES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  const isCurrentMonth=selYear===now.getFullYear()&&selMonth===now.getMonth()+1;
  const prevMonth=()=>{if(selMonth===1){setSelMonth(12);setSelYear(y=>y-1);}else setSelMonth(m=>m-1);};
  const nextMonth=()=>{if(isCurrentMonth)return;if(selMonth===12){setSelMonth(1);setSelYear(y=>y+1);}else setSelMonth(m=>m+1);};

  // Sales
  const mOrders=orders.filter(o=>o.status==="closed"&&inRange(o.date,start,end));
  const mLines=linesOfOrders(orderLines,mOrders);
  const revenue=mLines.reduce((s,l)=>{const r=recipeById(recipes,l.recipeId);return s+(r?r.price*l.qty:0);},0);
  const foodCostBOM=mLines.reduce((s,l)=>s+recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty,0);
  const portions=mLines.reduce((s,l)=>s+l.qty,0);
  const totalPax=mOrders.reduce((s,o)=>s+(o.pax||0),0);
  const avgTicketPerPax=totalPax>0?revenue/totalPax:0;

  // Purchases
  const mPurchases=purchases.filter(p=>p.status==="Recibido"&&inRange(p.date,start,end));
  const purchaseCost=mPurchases.reduce((s,p)=>s+(p.totalCost||0),0);

  // Wastage
  const mWastage=(wastageLog||[]).filter(w=>inRange(w.date,start,end));
  const wastageCost=mWastage.reduce((s,w)=>s+(w.lostValue||0),0);
  const wastageByReason={};
  mWastage.forEach(w=>{wastageByReason[w.reason]=(wastageByReason[w.reason]||0)+(w.lostValue||0);});

  // IGV split — use settings from data
  const _plSettings=getSettings(data);
  const _igvRate=_plSettings.igvMode==="ninguno"?0:IGV_RATE;
  // For "incluido" (default): revenue already has IGV inside. Extract it.
  // For "excluido": revenue is net, IGV would be on top — but orders closed with
  //   excluido mode have total snapshotted. Here we use gross recipe prices as proxy.
  const igvAmountMonth=_plSettings.igvMode==="incluido"
    ? revenue - revenue/1.18
    : _plSettings.igvMode==="excluido" ? revenue*_igvRate : 0;
  const netRevenue=revenue-igvAmountMonth;

  // P&L lines — all % now against netRevenue (correct denominator)
  const grossMargin=netRevenue-foodCostBOM;
  const grossMarginPct=netRevenue>0?grossMargin/netRevenue*100:0;
  const foodCostPctNet=netRevenue>0?foodCostBOM/netRevenue*100:0;
  const netContribution=grossMargin-wastageCost;
  const netPct=netRevenue>0?netContribution/netRevenue*100:0;

  // Weekly breakdown within month
  const weeksInMonth=[];
  let cur=new Date(start);
  while(cur.toISOString().slice(0,10)<=end){
    const wStart=cur.toISOString().slice(0,10);
    const wEnd=new Date(Math.min(cur.getTime()+6*86400000,new Date(end).getTime())).toISOString().slice(0,10);
    const wLines=linesOfOrders(orderLines,orders.filter(o=>o.status==="closed"&&inRange(o.date,wStart,wEnd)));
    const wRev=wLines.reduce((s,l)=>{const r=recipeById(recipes,l.recipeId);return s+(r?r.price*l.qty:0);},0);
    const wFC=wLines.reduce((s,l)=>s+recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty,0);
    const wPurch=purchases.filter(p=>p.status==="Recibido"&&inRange(p.date,wStart,wEnd)).reduce((s,p)=>s+(p.totalCost||0),0);
    const wWaste=(wastageLog||[]).filter(w=>inRange(w.date,wStart,wEnd)).reduce((s,w)=>s+(w.lostValue||0),0);
    weeksInMonth.push({label:"S"+(weeksInMonth.length+1),rev:wRev,fc:wFC,purch:wPurch,waste:wWaste});
    cur.setDate(cur.getDate()+7);
  }

  // Purchases detail by product
  const purchByProduct={};
  mPurchases.forEach(p=>{
    const prod=products.find(pr=>pr.id===p.productId);
    const name=prod?prod.name:p.productId;
    purchByProduct[name]=(purchByProduct[name]||0)+(p.totalCost||0);
  });
  const purchRows=Object.entries(purchByProduct).sort((a,b)=>b[1]-a[1]);

  const PLRow=({label,value,indent=0,bold=false,color,sub,tip})=>
    h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",
      padding:"8px 14px",paddingLeft:(14+indent*16)+"px",
      borderBottom:"1px solid var(--border)",
      background:bold?"var(--surface2)":"transparent"}},
      h('div',null,
        h('div',{style:{fontSize:13,fontWeight:bold?700:400,color:bold?"var(--text)":"var(--text2)",display:"flex",alignItems:"center"}},label,tip&&h(InfoTip,{text:tip})),
        sub&&h('div',{style:{fontSize:10,color:"var(--text3)"}},sub)
      ),
      h('div',{style:{fontFamily:bold?"var(--sora)":"var(--sans)",fontSize:bold?16:13,
        fontWeight:bold?700:500,color:color||"var(--text)"}},value)
    );

  return h('div',{className:"slide-up"},
    // Month/Year picker
    h('div',{className:"no-print",style:{display:"flex",alignItems:"center",gap:8,marginBottom:16,
      background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"10px 12px"}},
      h('button',{onClick:prevMonth,style:{background:"none",border:"none",color:"var(--text2)",fontSize:18,cursor:"pointer",padding:"0 2px",flexShrink:0}},"‹"),
      h('div',{style:{flex:1,display:"flex",gap:6}},
        h('select',{value:selMonth,onChange:e=>setSelMonth(+e.target.value),style:{flex:1,fontSize:13,fontWeight:600,fontFamily:"var(--sora)"}},
          MONTHS_ES.map((m,i)=>h('option',{key:i+1,value:i+1},m))
        ),
        h('select',{value:selYear,onChange:e=>setSelYear(+e.target.value),style:{width:80,fontSize:13,fontWeight:600,fontFamily:"var(--sora)"}},
          YEARS.map(y=>h('option',{key:y,value:y},y))
        )
      ),
      h('button',{onClick:nextMonth,style:{background:"none",border:"none",
        color:isCurrentMonth?"var(--border2)":"var(--text2)",fontSize:18,cursor:isCurrentMonth?"default":"pointer",padding:"0 2px",flexShrink:0}},"›")
    ),
    // Two-column on desktop
    h('div',{className:"reports-two-col",style:{display:"block"}},
      // Left: P&L table + weekly chart
      h('div',null,
        h('div',{className:"print-section",style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",marginBottom:12,overflow:"hidden"}},
          h('div',{style:{background:"var(--surface2)",padding:"10px 14px",borderBottom:"1px solid var(--border)",
            fontFamily:"var(--sora)",fontSize:13,fontWeight:700}},
            "Estado de Resultados — "+mLabel),
          h(PLRow,{label:"(+) Ventas brutas (precio carta)",value:fmtCost(revenue),bold:false,color:"var(--text2)",sub:portions+" porciones · "+mOrders.length+" pedidos"+(totalPax>0?" · "+totalPax+" personas":""),tip:"Lo que cobraste a tus clientes, tal cual aparece en la carta (incluye el IGV si tu modo de precios lo incluye)."}),
          _plSettings.igvMode!=="ninguno"&&h(PLRow,{label:"(−) IGV "+(_plSettings.igvMode==="incluido"?"incluido":"calculado")+" (18%)",value:"− "+fmtCost(igvAmountMonth),indent:1,color:"var(--text3)",sub:"Obligación fiscal — no es ingreso del negocio",tip:"El IGV (18%) es el impuesto que cobras por cuenta de SUNAT — no es plata tuya, aunque haya pasado por tu caja. Por eso se resta antes de calcular tus ganancias reales."}),
          h(PLRow,{label:"= Ventas netas (sin IGV)",value:fmtCost(netRevenue),bold:true,color:"var(--accent)",sub:"Base real de ingresos operativos"}),
          h('div',{style:{height:"0.5px",background:"var(--border2)"}}),
          h(PLRow,{label:"(−) Costo de alimentos (BOM)",value:"− "+fmtCost(foodCostBOM),indent:1,color:"var(--red)",sub:netRevenue>0?foodCostPctNet.toFixed(1)+"% de ventas netas":"—",tip:"Lo que costaron los ingredientes de todo lo que vendiste, calculado plato por plato según sus recetas. No incluye sueldos, alquiler ni otros gastos — solo comida."}),
          h(PLRow,{label:"= Margen Bruto",value:fmtCost(grossMargin),bold:true,color:grossMarginPct>50?"var(--green)":grossMarginPct>35?"var(--yellow)":"var(--red)",sub:grossMarginPct.toFixed(1)+"% sobre ventas netas",tip:"Lo que te queda después de pagar solo los ingredientes. De aquí todavía falta cubrir personal, alquiler, servicios y otros gastos fijos del negocio."}),
          h('div',{style:{height:"0.5px",background:"var(--border2)"}}),
          h(PLRow,{label:"(−) Mermas y desperdicios",value:"− "+fmtCost(wastageCost),indent:1,color:"var(--red)",sub:mWastage.length+" registros este mes",tip:"Ingredientes que se perdieron sin poder venderse — vencidos, dañados, quemados, etc. Registrarlos aquí te muestra cuánta plata se pierde antes de llegar al cliente."}),
          h(PLRow,{label:"= Contribución Neta",value:fmtCost(netContribution),bold:true,color:netPct>45?"var(--green)":netPct>30?"var(--yellow)":"var(--red)",sub:netPct.toFixed(1)+"% sobre ventas netas",tip:"Tu margen bruto menos las mermas — lo más cercano a 'ganancia real de cocina' que este reporte puede mostrar. Todavía no incluye sueldos, alquiler ni otros gastos fijos."}),
          h('div',{style:{height:"0.5px",background:"var(--border2)"}}),
          h(PLRow,{label:"Compras del mes (referencia)",value:fmtCost(purchaseCost),color:"var(--text2)",sub:"Total compras recibidas"}),
          h(PLRow,{label:"Personas atendidas",value:String(totalPax),color:"var(--text2)",sub:totalPax>0?`Ticket promedio: ${fmtCost(avgTicketPerPax)} por persona`:"Sin datos de aforo este mes"})
        ),
        weeksInMonth.some(w=>w.rev>0)&&h('div',{className:"print-section",style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px 16px",marginBottom:12}},
          h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:600,marginBottom:10}},"Ventas por semana"),
          h(MiniBarChart,{bars:weeksInMonth.map(w=>({label:w.label,v:w.rev})),height:64,color:"var(--accent)"})
        )
      ),
      // Right: Purchases + Wastage
      h('div',null,
        purchRows.length>0&&h('div',{className:"print-section",style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",overflow:"hidden",marginBottom:12}},
          h('div',{style:{background:"var(--surface2)",padding:"10px 14px",borderBottom:"1px solid var(--border)",fontFamily:"var(--sora)",fontSize:13,fontWeight:700}},
            "Compras del mes por ingrediente"),
          purchRows.map(([name,cost],i)=>{
            const pct=purchaseCost>0?cost/purchaseCost*100:0;
            return h('div',{key:name,style:{padding:"10px 14px",borderBottom:i<purchRows.length-1?"1px solid var(--border)":"none"}},
              h('div',{style:{display:"flex",justifyContent:"space-between",marginBottom:4}},
                h('span',{style:{fontSize:12,fontWeight:500}},name),
                h('div',{style:{textAlign:"right"}},
                  h('span',{style:{fontSize:13,fontWeight:700,fontFamily:"var(--sora)",color:"var(--accent)"}},fmtCost(cost)),
                  h('span',{style:{fontSize:10,color:"var(--text3)",marginLeft:6}},pct.toFixed(0)+"%")
                )
              ),
              h('div',{style:{height:4,borderRadius:2,background:"var(--surface2)",overflow:"hidden"}},
                h('div',{style:{height:"100%",width:pct.toFixed(1)+"%",background:"var(--accent)",opacity:0.7,borderRadius:2}})
              )
            );
          })
        ),
        mWastage.length>0&&h('div',{className:"print-section",style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",overflow:"hidden"}},
          h('div',{style:{background:"rgba(239,68,68,0.08)",padding:"10px 14px",borderBottom:"1px solid rgba(239,68,68,0.2)",
            fontFamily:"var(--sora)",fontSize:13,fontWeight:700,color:"var(--red)"}},
            "🗑 Mermas del mes — "+fmtCost(wastageCost)),
          mWastage.map((w,i)=>h('div',{key:w.id,style:{
            display:"flex",justifyContent:"space-between",alignItems:"center",
            padding:"9px 14px",borderBottom:i<mWastage.length-1?"1px solid var(--border)":"none",fontSize:12}},
            h('div',null,
              h('div',{style:{fontWeight:500}},w.productName),
              h('div',{style:{fontSize:10,color:"var(--text3)"}},w.reason+" · "+fmtDate(w.date))
            ),
            h('div',{style:{textAlign:"right",color:"var(--red)",fontWeight:700}},
              "− "+fmtCost(w.lostValue))
          ))
        )
      )
    )
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// INGREDIENT COST TREND
// ─────────────────────────────────────────────────────────────────────────────
function IngredientTrend({data}){
  const {products,purchases=[],priceHistory=[]}=data;
  const [selectedIds,setSelectedIds]=useState(["P001","P002","P007"]);
  const [trendSearch,setTrendSearch]=useState("");
  const [trendOpen,setTrendOpen]=useState(false);

  // Month/year FROM–TO range state
  const now=new Date();
  const [fromYear,setFromYear]=useState(now.getFullYear());
  const [fromMonth,setFromMonth]=useState(Math.max(1,now.getMonth()-2));  // default: 3 months back
  const [toYear,setToYear]=useState(now.getFullYear());
  const [toMonth,setToMonth]=useState(now.getMonth()+1);

  const YEARS=[];for(let y=now.getFullYear()-2;y<=now.getFullYear();y++)YEARS.push(y);
  const MONTHS_ES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const MONTHS_FULL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const pad=n=>String(n).padStart(2,"0");

  const rangeStart=`${fromYear}-${pad(fromMonth)}-01`;
  const rangeEnd=`${toYear}-${pad(toMonth)}-${pad(new Date(toYear,toMonth,0).getDate())}`;

  // Clamp: fromYear/Month can't exceed to
  const fromKey=fromYear*100+fromMonth;
  const toKey=toYear*100+toMonth;

  const setFrom=(y,m)=>{
    const k=y*100+m;
    setFromYear(y);setFromMonth(m);
    if(k>toKey){setToYear(y);setToMonth(m);}
  };
  const setTo=(y,m)=>{
    const k=y*100+m;
    setToYear(y);setToMonth(m);
    if(k<fromKey){setFromYear(y);setFromMonth(m);}
  };

  // Shortcuts
  const SHORTCUTS=[
    {label:"Último mes",fn:()=>{const d=new Date();d.setMonth(d.getMonth()-1);setFrom(d.getFullYear(),d.getMonth()+1);setToYear(now.getFullYear());setToMonth(now.getMonth()+1);}},
    {label:"3 meses",fn:()=>{const d=new Date();d.setMonth(d.getMonth()-2);setFrom(d.getFullYear(),d.getMonth()+1);setToYear(now.getFullYear());setToMonth(now.getMonth()+1);}},
    {label:"6 meses",fn:()=>{const d=new Date();d.setMonth(d.getMonth()-5);setFrom(d.getFullYear(),d.getMonth()+1);setToYear(now.getFullYear());setToMonth(now.getMonth()+1);}},
    {label:"Este año",fn:()=>{setFrom(now.getFullYear(),1);setToYear(now.getFullYear());setToMonth(now.getMonth()+1);}},
  ];

  // Build price history per product filtered to selected range
  function getHistory(pid){
    const hist=priceHistory.filter(h=>h.productId===pid&&h.date>=rangeStart&&h.date<=rangeEnd).sort((a,b)=>a.date.localeCompare(b.date));
    const prod=products.find(p=>p.id===pid);
    if(!hist.length&&prod) return [{date:rangeEnd,unitCost:prod.avgCost}];
    return hist;
  }

  const COLORS=["var(--accent)","var(--blue)","var(--green)","#c084fc","var(--yellow)","var(--red)"];

  const toggleProduct=pid=>{
    setSelectedIds(prev=>prev.includes(pid)?prev.filter(x=>x!==pid):[...prev,pid].slice(0,4));
  };

  // Compute change % for each selected product
  function priceChange(pid){
    const hist=getHistory(pid);
    if(hist.length<2)return 0;
    return (hist[hist.length-1].unitCost-hist[0].unitCost)/hist[0].unitCost*100;
  }

  // Build series for the line chart — align all to common date labels
  const allDates=[...new Set(
    selectedIds.flatMap(pid=>getHistory(pid).map(h=>h.date))
  )].sort();

  const series=selectedIds.map((pid,i)=>{
    const hist=getHistory(pid);
    const prod=products.find(p=>p.id===pid);
    // Forward-fill price per date
    const priceAtDate=(date)=>{
      const before=hist.filter(h=>h.date<=date);
      return before.length?before[before.length-1].unitCost:hist[0]?.unitCost||0;
    };
    return{
      label:prod?.name||pid,
      color:COLORS[i%COLORS.length],
      points:allDates.map(d=>({x:d.slice(5),v:priceAtDate(d)}))
    };
  });

  // All products with price history
  const trackedProducts=products.filter(p=>priceHistory.some(h=>h.productId===p.id)||true);

  return h('div',{className:"slide-up"},
    // From / To month+year range picker
    h('div',{className:"no-print",style:{background:"var(--surface)",border:"1px solid var(--border2)",
      borderRadius:"var(--radius)",padding:"14px",marginBottom:14}},
      h('div',{style:{fontFamily:"var(--sora)",fontSize:12,fontWeight:600,marginBottom:10,color:"var(--text2)"}},"Rango de fechas"),
      h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}},
        h('div',null,
          h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:6}},"Desde"),
          h('div',{style:{display:"flex",gap:5}},
            h('select',{value:fromMonth,onChange:e=>setFrom(fromYear,+e.target.value),style:{flex:1,fontSize:12,fontWeight:600,fontFamily:"var(--sora)"}},
              MONTHS_ES.map((m,i)=>h('option',{key:i+1,value:i+1},m))
            ),
            h('select',{value:fromYear,onChange:e=>setFrom(+e.target.value,fromMonth),style:{width:68,fontSize:12,fontWeight:600,fontFamily:"var(--sora)"}},
              YEARS.map(y=>h('option',{key:y,value:y},y))
            )
          )
        ),
        h('div',null,
          h('div',{style:{fontSize:11,color:"var(--text3)",marginBottom:6}},"Hasta"),
          h('div',{style:{display:"flex",gap:5}},
            h('select',{value:toMonth,onChange:e=>setTo(toYear,+e.target.value),style:{flex:1,fontSize:12,fontWeight:600,fontFamily:"var(--sora)"}},
              MONTHS_ES.map((m,i)=>h('option',{key:i+1,value:i+1},m))
            ),
            h('select',{value:toYear,onChange:e=>setTo(+e.target.value,toMonth),style:{width:68,fontSize:12,fontWeight:600,fontFamily:"var(--sora)"}},
              YEARS.map(y=>h('option',{key:y,value:y},y))
            )
          )
        )
      ),
      // Active range label
      h('div',{style:{background:"rgba(249,115,22,0.08)",border:"1px solid rgba(249,115,22,0.2)",
        borderRadius:"var(--radius-sm)",padding:"7px 12px",marginBottom:8,fontSize:12,color:"var(--text2)"}},
        MONTHS_FULL[fromMonth-1]+" "+fromYear+" → "+MONTHS_FULL[toMonth-1]+" "+toYear
      ),
      // Shortcuts
      h('div',{style:{display:"flex",gap:6,flexWrap:"wrap"}},
        SHORTCUTS.map(s=>h('button',{key:s.label,onClick:s.fn,style:{
          background:"var(--surface2)",border:"1px solid var(--border2)",borderRadius:20,
          padding:"4px 12px",fontSize:11,fontWeight:600,color:"var(--text2)",cursor:"pointer"
        }},s.label))
      )
    ),
    h('div',{style:{background:"rgba(59,130,246,0.07)",border:"1px solid rgba(59,130,246,0.2)",
      borderRadius:"var(--radius-sm)",padding:"10px 12px",marginBottom:16,fontSize:12,color:"var(--text2)"}},
      "📈 Selecciona hasta 4 ingredientes para comparar su evolución de precio."),

    // Product selector — searchable combobox
    h('div',{className:"no-print",style:{marginBottom:16}},
      // Selected chips
      selectedIds.length>0&&h('div',{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}},
        selectedIds.map((pid,i)=>{
          const p=products.find(x=>x.id===pid);
          if(!p)return null;
          const color=COLORS[i%COLORS.length];
          const change=priceChange(pid);
          return h('div',{key:pid,style:{
            display:"flex",alignItems:"center",gap:5,
            padding:"4px 8px 4px 10px",borderRadius:20,
            border:`1px solid ${color}`,
            background:`${color}22`,
            fontSize:11,fontWeight:600,color:color}},
            h('span',null,p.name+(change!==null?" ("+(change>=0?"+":"")+change.toFixed(1)+"%)":"")),
            h('button',{onClick:()=>toggleProduct(pid),style:{
              display:"flex",alignItems:"center",justifyContent:"center",
              background:"none",border:"none",cursor:"pointer",
              color:color,padding:"0 0 0 2px",fontSize:13,lineHeight:1,fontWeight:700}},
              "\u00D7"
            )
          );
        })
      ),
      // Search input + dropdown
      h('div',{style:{position:"relative"}},
        h('div',{style:{
          display:"flex",alignItems:"center",gap:6,
          border:"1px solid var(--border2)",borderRadius:"var(--radius-sm)",
          background:"var(--surface)",padding:"6px 10px",
          transition:"box-shadow .15s"}},
          h('span',{style:{fontSize:14,color:"var(--text3)"}},"\uD83D\uDD0D"),
          h('input',{
            type:"text",
            placeholder:selectedIds.length>=4?"Máximo 4 ingredientes seleccionados":"Buscar ingrediente...",
            disabled:selectedIds.length>=4,
            value:trendSearch,
            onInput:e=>{setTrendSearch(e.target.value);setTrendOpen(true);},
            onFocus:()=>setTrendOpen(true),
            onBlur:()=>setTimeout(()=>setTrendOpen(false),180),
            style:{
              flex:1,border:"none",outline:"none",background:"transparent",
              fontFamily:"var(--sans)",fontSize:12,color:"var(--text1)",
              cursor:selectedIds.length>=4?"not-allowed":"text"}}),
          selectedIds.length>0&&h('span',{style:{
            fontSize:10,color:"var(--text3)",whiteSpace:"nowrap",
            background:"var(--surface2)",padding:"2px 6px",borderRadius:10,flexShrink:0}},
            selectedIds.length+"/4"
          )
        ),
        // Dropdown list
        trendOpen&&(()=>{
          const q=trendSearch.trim().toLowerCase();
          const idsWithHistory=new Set(priceHistory.map(h=>h.productId));
          const allFiltered=products.filter(p=>
            !selectedIds.includes(p.id)&&
            (p.name.toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q))
          );
          // Sort: items with price history first
          const withHist=allFiltered.filter(p=>idsWithHistory.has(p.id));
          const noHist=allFiltered.filter(p=>!idsWithHistory.has(p.id));
          const filtered=[...withHist,...noHist].slice(0,40);
          if(!filtered.length)return h('div',{style:{
            position:"absolute",top:"calc(100% + 4px)",left:0,right:0,zIndex:200,
            background:"var(--surface)",border:"1px solid var(--border2)",
            borderRadius:"var(--radius-sm)",boxShadow:"0 4px 16px rgba(0,0,0,0.12)",
            padding:"10px 14px",fontSize:12,color:"var(--text3)"}},
            "Sin resultados"
          );
          return h('div',{style:{
            position:"absolute",top:"calc(100% + 4px)",left:0,right:0,zIndex:200,
            background:"var(--surface)",border:"1px solid var(--border2)",
            borderRadius:"var(--radius-sm)",boxShadow:"0 4px 16px rgba(0,0,0,0.12)",
            maxHeight:220,overflowY:"auto"}},
            // Section header if there's a mix
            withHist.length>0&&noHist.length>0&&!q&&h('div',{style:{
              padding:"4px 12px",fontSize:10,fontWeight:700,color:"var(--text3)",
              background:"var(--surface2)",borderBottom:"1px solid var(--border)",
              letterSpacing:"0.06em",textTransform:"uppercase"}},
              "Con historial de precio"
            ),
            filtered.map((p,i)=>{
              const hasH=idsWithHistory.has(p.id);
              // Insert divider label between sections
              const showNoHistHeader=withHist.length>0&&!q&&i===withHist.length;
              return [
                showNoHistHeader&&h('div',{key:"nohdr",style:{
                  padding:"4px 12px",fontSize:10,fontWeight:700,color:"var(--text3)",
                  background:"var(--surface2)",borderBottom:"1px solid var(--border)",
                  letterSpacing:"0.06em",textTransform:"uppercase"}},
                  "Sin historial aún"
                ),
                h('div',{key:p.id,
                  onMouseDown:e=>{e.preventDefault();toggleProduct(p.id);setTrendSearch("");setTrendOpen(false);},
                  onMouseEnter:e=>e.currentTarget.style.background="var(--surface2)",
                  onMouseLeave:e=>e.currentTarget.style.background="transparent",
                  style:{
                    display:"flex",justifyContent:"space-between",alignItems:"center",
                    padding:"8px 12px",cursor:"pointer",borderBottom:"1px solid var(--border)",
                    background:"transparent",transition:"background 0.1s",
                    opacity:hasH?1:0.6}},
                  h('div',null,
                    h('div',{style:{fontSize:12,fontWeight:600,color:"var(--text1)",display:"flex",alignItems:"center",gap:5}},
                      p.name,
                      hasH&&h('span',{style:{fontSize:9,color:"var(--green)",background:"rgba(34,197,94,0.12)",
                        borderRadius:4,padding:"1px 4px",fontWeight:700}},"● datos")
                    ),
                    h('div',{style:{fontSize:10,color:"var(--text3)"}},p.category+" · "+p.unit)
                  ),
                  h('div',{style:{
                    fontSize:10,color:"var(--text3)",background:"var(--surface2)",
                    padding:"2px 7px",borderRadius:10,flexShrink:0}},
                    "S/ "+p.avgCost.toFixed(2)
                  )
                )
              ];
            })
          );
        })()
      )
    ),

    // Line chart
    selectedIds.length>0&&h('div',{className:"print-section",style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px 16px",marginBottom:12}},
      h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:600,marginBottom:10}},"Evolución de precio (S/ por unidad)"),
      allDates.length<2
        ?h('div',{style:{fontSize:12,color:"var(--text3)",textAlign:"center",padding:"16px 0"}},"Datos insuficientes para graficar")
        :h(LineChart,{series,height:120}),
      // Legend
      h('div',{style:{display:"flex",flexWrap:"wrap",gap:10,marginTop:8}},
        series.map(s=>h('div',{key:s.label,style:{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"var(--text2)"}},
          h('div',{style:{width:12,height:3,borderRadius:2,background:s.color,flexShrink:0}}),
          s.label
        ))
      )
    ),

    // Price change cards
    h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:600,marginBottom:10}},"Resumen de variación"),
    h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
      products.map(p=>{
        const hist=getHistory(p.id);
        if(hist.length<2)return null;
        const first=hist[0].unitCost,last=hist[hist.length-1].unitCost;
        const chg=last-first;const chgPct=(chg/first*100);
        const color=Math.abs(chgPct)<2?"var(--text2)":chg>0?"var(--red)":"var(--green)";
        const arrow=Math.abs(chgPct)<2?"→":chg>0?"↑":"↓";
        return h('div',{key:p.id,style:{background:"var(--surface)",border:"1px solid var(--border)",
          borderRadius:"var(--radius)",padding:"12px 14px",
          borderLeft:`3px solid ${color}`}},
          h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}},
            h('div',null,
              h('div',{style:{fontSize:13,fontWeight:500}},p.name),
              h('div',{style:{fontSize:10,color:"var(--text3)"}},p.category+" · "+p.unit)
            ),
            h('div',{style:{textAlign:"right"}},
              h('div',{style:{fontFamily:"var(--sora)",fontSize:16,fontWeight:700,color}},
                arrow+" "+(chgPct>=0?"+":"")+chgPct.toFixed(1)+"%"),
              h('div',{style:{fontSize:10,color:"var(--text3)"}},
                fmtCost(first)+" → "+fmtCost(last))
            )
          ),
          h('div',{style:{height:4,borderRadius:2,background:"var(--surface2)",overflow:"hidden"}},
            h('div',{style:{
              height:"100%",
              width:Math.min(100,Math.abs(chgPct)/20*100).toFixed(1)+"%",
              background:color,opacity:0.6,borderRadius:2,transition:"width .5s ease"}})
          ),
          h('div',{style:{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--text3)",marginTop:3}},
            h('span',null,fmtDate(hist[0].date)+" — "+fmtDate(hist[hist.length-1].date)),
            h('span',null,hist.length+" puntos de precio")
          )
        );
      }).filter(Boolean)
    ),

    // ── Total spend per ingredient in range ──────────────────────────────────
    (()=>{
      const rangePurchases=purchases.filter(p=>p.date>=rangeStart&&p.date<=rangeEnd&&p.status==="Recibido");
      if(!rangePurchases.length) return null;

      // Group by product
      const byProduct={};
      rangePurchases.forEach(p=>{
        const prod=products.find(pr=>pr.id===p.productId);
        const name=prod?prod.name:(p.productId||"Desconocido");
        const cat=prod?prod.category:"—";
        const unit=prod?prod.unit:"";
        if(!byProduct[name]) byProduct[name]={name,cat,unit,total:0,qty:0,orders:0};
        byProduct[name].total+=(p.totalCost||0);
        byProduct[name].qty+=(p.qty||0);
        byProduct[name].orders+=1;
      });
      const rows=Object.values(byProduct).sort((a,b)=>b.total-a.total);
      const grandTotal=rows.reduce((s,r)=>s+r.total,0);
      const maxTotal=rows[0]?.total||1;

      return h('div',{className:"print-section",style:{marginTop:20}},
        h('div',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700,marginBottom:10}},
          "💸 Gasto total por ingrediente"),
        h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",overflow:"hidden",marginBottom:12}},
          // Header
          h('div',{style:{display:"grid",gridTemplateColumns:"1fr auto auto",gap:8,
            padding:"8px 14px",background:"var(--surface2)",borderBottom:"1px solid var(--border)",
            fontSize:11,fontWeight:600,color:"var(--text3)"}},
            h('span',null,"INGREDIENTE"),
            h('span',{style:{textAlign:"right"}},"CANT."),
            h('span',{style:{textAlign:"right"}},"TOTAL")
          ),
          rows.map((r,i)=>{
            const pct=(r.total/grandTotal*100);
            const barPct=(r.total/maxTotal*100).toFixed(1);
            return h('div',{key:r.name,style:{
              borderBottom:i<rows.length-1?"1px solid var(--border)":"none",padding:"10px 14px"}},
              h('div',{style:{display:"grid",gridTemplateColumns:"1fr auto auto",gap:8,alignItems:"center",marginBottom:5}},
                h('div',null,
                  h('div',{style:{fontSize:13,fontWeight:500}},r.name),
                  h('div',{style:{fontSize:10,color:"var(--text3)"}},r.cat+" · "+r.orders+" compra"+(r.orders!==1?"s":""))
                ),
                h('span',{style:{fontSize:12,color:"var(--text2)",textAlign:"right",whiteSpace:"nowrap"}},
                  fmtNum(r.qty)+" "+r.unit),
                h('span',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700,textAlign:"right",whiteSpace:"nowrap",color:"var(--accent)"}},
                  fmtCost(r.total))
              ),
              h('div',{style:{display:"flex",alignItems:"center",gap:8}},
                h('div',{style:{flex:1,height:4,borderRadius:2,background:"var(--surface2)",overflow:"hidden"}},
                  h('div',{style:{height:"100%",width:barPct+"%",background:"var(--accent)",opacity:0.7,borderRadius:2,transition:"width .5s ease"}})
                ),
                h('span',{style:{fontSize:10,color:"var(--text3)",flexShrink:0}},pct.toFixed(1)+"%")
              )
            );
          }),
          // Grand total footer
          h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",
            padding:"10px 14px",background:"var(--surface2)",borderTop:"1px solid var(--border)"}},
            h('span',{style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700}},"Total compras"),
            h('span',{style:{fontFamily:"var(--sora)",fontSize:16,fontWeight:700,color:"var(--accent)"}},fmtCost(grandTotal))
          )
        )
      );
    })()
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// MONTHLY SUMMARY (MoM comparison + AI recommendations)
// ─────────────────────────────────────────────────────────────────────────────
function MonthlySummary({data}){
  const {products,recipes,bom,orders=[],orderLines=[],subBom=[],subRecipes=[],purchases=[],wastageLog=[]}=data;
  const now=new Date();
  const [selYear,setSelYear]=useState(now.getFullYear());
  const [selMonth,setSelMonth]=useState(now.getMonth()+1);
  const [aiState,setAiState]=useState("idle"); // idle | loading | done | error
  const [aiText,setAiText]=useState("");
  const [aiError,setAiError]=useState("");

  const pad=n=>String(n).padStart(2,"0");
  const MONTHS_ES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const YEARS=[];for(let y=now.getFullYear()-2;y<=now.getFullYear();y++)YEARS.push(y);

  const isCurrentMonth=selYear===now.getFullYear()&&selMonth===now.getMonth()+1;
  const prevMonth=()=>{if(selMonth===1){setSelMonth(12);setSelYear(y=>y-1);}else setSelMonth(m=>m-1);};
  const nextMonth=()=>{if(isCurrentMonth)return;if(selMonth===12){setSelMonth(1);setSelYear(y=>y+1);}else setSelMonth(m=>m+1);};

  // Reset AI when month changes
  const handleMonthChange=(newYear,newMonth)=>{
    setSelYear(newYear);setSelMonth(newMonth);
    setAiState("idle");setAiText("");setAiError("");
  };

  // ── KPI calculator for any year/month ──────────────────────────────────────
  function calcMonth(year,month){
    const start=`${year}-${pad(month)}-01`;
    const lastDay=new Date(year,month,0).getDate();
    const end=`${year}-${pad(month)}-${pad(lastDay)}`;
    const mOrders=orders.filter(o=>o.status==="closed"&&inRange(o.date,start,end));
    const mLines=linesOfOrders(orderLines,mOrders);
    const revenue=mLines.reduce((s,l)=>{const r=recipeById(recipes,l.recipeId);return s+(r?r.price*l.qty:0);},0);
    const foodCost=mLines.reduce((s,l)=>s+recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty,0);
    const portions=mLines.reduce((s,l)=>s+l.qty,0);
    const orderCount=mOrders.length;
    const avgTicket=orderCount>0?revenue/orderCount:0;
    // IGV split
    const _sSettings=getSettings(data);
    const igvAmount=_sSettings.igvMode==="ninguno"?0
      :_sSettings.igvMode==="incluido"?revenue-revenue/1.18
      :revenue*IGV_RATE;
    const netRevenue=revenue-igvAmount;
    // All margin % against net revenue (correct denominator)
    const grossMargin=netRevenue-foodCost;
    const grossMarginPct=netRevenue>0?grossMargin/netRevenue*100:0;
    const foodCostPct=netRevenue>0?foodCost/netRevenue*100:0;
    const mPurchases=purchases.filter(p=>p.status==="Recibido"&&inRange(p.date,start,end));
    const purchaseCost=mPurchases.reduce((s,p)=>s+(p.totalCost||0),0);
    const mWastage=(wastageLog||[]).filter(w=>inRange(w.date,start,end));
    const wastageCost=mWastage.reduce((s,w)=>s+(w.lostValue||0),0);
    const netContribution=grossMargin-wastageCost;
    const netPct=netRevenue>0?netContribution/netRevenue*100:0;
    // Dish breakdown
    const dishMap={};
    mLines.forEach(l=>{
      if(!dishMap[l.recipeId])dishMap[l.recipeId]={qty:0,revenue:0,foodCost:0};
      const r=recipeById(recipes,l.recipeId);
      dishMap[l.recipeId].qty+=l.qty;
      dishMap[l.recipeId].revenue+=(r?r.price*l.qty:0);
      dishMap[l.recipeId].foodCost+=recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty;
    });
    const dishes=recipes.map(r=>{
      const d=dishMap[r.id]||{qty:0,revenue:0,foodCost:0};
      return{id:r.id,name:r.name,category:r.category,price:r.price,
        qty:d.qty,revenue:d.revenue,foodCost:d.foodCost,
        margin:d.revenue-d.foodCost,
        marginPct:d.revenue>0?(d.revenue-d.foodCost)/d.revenue*100:0};
    }).filter(r=>r.qty>0).sort((a,b)=>b.revenue-a.revenue);
    return{revenue,igvAmount,netRevenue,foodCost,foodCostPct,portions,orderCount,avgTicket,
      grossMargin,grossMarginPct,purchaseCost,wastageCost,
      netContribution,netPct,dishes,start,end};
  }

  // ── Compute current & previous ─────────────────────────────────────────────
  const cur=calcMonth(selYear,selMonth);
  const prevY=selMonth===1?selYear-1:selYear;
  const prevM=selMonth===1?12:selMonth-1;
  const prev=calcMonth(prevY,prevM);
  const curLabel=MONTHS_ES[selMonth-1]+" "+selYear;
  const prevLabel=MONTHS_ES[prevM-1]+" "+prevY;

  // ── Delta helpers ──────────────────────────────────────────────────────────
  const delta=(cur,prev)=>{
    if(prev===0)return{pct:null,abs:cur-prev};
    return{pct:((cur-prev)/Math.abs(prev))*100,abs:cur-prev};
  };
  const deltaColor=(pct,invert=false)=>{
    if(pct===null||pct===0)return"var(--text3)";
    const good=invert?(pct<0):(pct>0);
    return good?"var(--green)":"var(--red)";
  };
  const deltaArrow=(pct)=>{
    if(pct===null)return"—";
    if(Math.abs(pct)<0.1)return"→";
    return pct>0?"↑":"↓";
  };
  const fmtDelta=(d,isCurrency=false,invertColor=false)=>{
    if(d.pct===null)return h('span',{style:{fontSize:11,color:"var(--text3)"}},"Sin datos previos");
    const color=deltaColor(d.pct,invertColor);
    const sign=d.pct>=0?"+":"";
    const absStr=isCurrency?fmtCost(Math.abs(d.abs)):Math.abs(d.abs).toFixed(1)+"%";
    return h('div',{style:{display:"flex",alignItems:"center",gap:4}},
      h('span',{style:{fontSize:18,fontWeight:700,color}},deltaArrow(d.pct)),
      h('div',null,
        h('div',{style:{fontSize:13,fontWeight:700,color}},sign+d.pct.toFixed(1)+"%"),
        h('div',{style:{fontSize:10,color:"var(--text3)"}},(d.abs>=0?"+":"")+
          (isCurrency?fmtCost(d.abs):d.abs.toFixed(1)+"%")+" vs "+prevLabel)
      )
    );
  };

  // ── KPI delta cards ────────────────────────────────────────────────────────
  const _showIgv=getSettings(data).igvMode!=="ninguno";
  const kpis=[
    _showIgv
      ?{label:"Ventas netas (sin IGV)",cur:cur.netRevenue,prev:prev.netRevenue,fmt:fmtCost,currency:true,invert:false,
        sub:"Brutas: "+fmtCost(cur.revenue)+" · IGV: "+fmtCost(cur.igvAmount),
        tip:"Lo que vendiste este mes sin contar el IGV (que no es tuyo, es del Estado). Comparado contra el mismo cálculo del mes anterior."}
      :{label:"Ventas brutas",cur:cur.revenue,prev:prev.revenue,fmt:fmtCost,currency:true,invert:false,
        tip:"El total que cobraste a tus clientes este mes, comparado con el mes anterior."},
    {label:"Costo de alimentos %",cur:cur.foodCostPct,prev:prev.foodCostPct,fmt:v=>v.toFixed(1)+"%",currency:false,invert:true,
      sub:_showIgv?"Sobre ventas netas":"Sobre ventas brutas",
      tip:"Cuánto de cada venta se fue en ingredientes. Aquí una flecha hacia abajo (↓) es buena señal — significa que tus platos te están costando menos en proporción a lo que vendes."},
    {label:"Margen bruto",cur:cur.grossMargin,prev:prev.grossMargin,fmt:fmtCost,currency:true,invert:false,
      sub:cur.grossMarginPct.toFixed(1)+"% "+(_showIgv?"ventas netas":"ventas"),
      tip:"Lo que te queda de las ventas después de pagar solo los ingredientes — sin contar sueldos, alquiler u otros gastos."},
    {label:"Ticket promedio",cur:cur.avgTicket,prev:prev.avgTicket,fmt:fmtCost,currency:true,invert:false,
      tip:"En promedio, cuánto gastó cada mesa este mes, comparado con el mes anterior."},
    {label:"Porciones vendidas",cur:cur.portions,prev:prev.portions,fmt:v=>String(Math.round(v)),currency:false,invert:false,
      tip:"El total de platos que saliste de cocina este mes, sin importar el precio — solo volumen."},
    {label:"Mermas",cur:cur.wastageCost,prev:prev.wastageCost,fmt:fmtCost,currency:true,invert:true,
      tip:"Ingredientes que se perdieron sin venderse (vencidos, dañados, quemados). Aquí menos es mejor — por eso una baja (↓) se muestra en verde."},
    {label:"Compras",cur:cur.purchaseCost,prev:prev.purchaseCost,fmt:fmtCost,currency:true,invert:true,
      tip:"Cuánto gastaste comprando insumos este mes. Ojo: que baje no siempre es bueno — puede ser porque compraste más barato, o simplemente porque vendiste menos."},
    {label:"Contribución neta",cur:cur.netPct,prev:prev.netPct,fmt:v=>v.toFixed(1)+"%",currency:false,invert:false,
      sub:_showIgv?"% sobre ventas netas":"% sobre ventas",
      tip:"Tu margen bruto menos las mermas, en porcentaje. Lo más cercano a 'qué tan rentable fue el mes' que este resumen puede mostrarte — pero todavía sin restar sueldos, alquiler ni otros gastos fijos."},
  ];

  // ── Dish comparison table ──────────────────────────────────────────────────
  const allDishIds=[...new Set([...cur.dishes.map(d=>d.id),...prev.dishes.map(d=>d.id)])];
  const dishComparison=allDishIds.map(id=>{
    const c=cur.dishes.find(d=>d.id===id)||{qty:0,revenue:0,margin:0,marginPct:0};
    const p=prev.dishes.find(d=>d.id===id)||{qty:0,revenue:0,margin:0,marginPct:0};
    const r=recipes.find(r=>r.id===id);
    const dRev=delta(c.revenue,p.revenue);
    const dQty=delta(c.qty,p.qty);
    return{id,name:r?.name||id,category:r?.category||"",
      curRevenue:c.revenue,prevRevenue:p.revenue,dRev,
      curQty:c.qty,prevQty:p.qty,dQty,
      curMarginPct:c.marginPct,prevMarginPct:p.marginPct};
  }).sort((a,b)=>b.curRevenue-a.curRevenue);

  // ── AI recommendations ─────────────────────────────────────────────────────
  const buildPrompt=()=>{
    const safe=(v,fmt)=>v!==undefined&&v!==null?fmt(v):"N/D";
    const pct=v=>v.toFixed(1)+"%";
    const topDishes=cur.dishes.slice(0,5).map(d=>`${d.name}: ${d.qty} porciones, S/${d.revenue.toFixed(0)}, margen ${d.marginPct.toFixed(0)}%`).join("; ");
    const droppedDishes=prev.dishes.filter(d=>!cur.dishes.find(c=>c.id===d.id)).map(d=>d.name).join(", ")||"ninguno";
    const newDishes=cur.dishes.filter(c=>!prev.dishes.find(d=>d.id===c.id)).map(d=>d.name).join(", ")||"ninguno";
    const dRev=delta(cur.revenue,prev.revenue);
    const dFC=delta(cur.foodCostPct,prev.foodCostPct);
    const dWaste=delta(cur.wastageCost,prev.wastageCost);

    return `Eres un consultor de restaurantes experto en gestión financiera y operaciones. Analiza el siguiente resumen mensual de un restaurante peruano y genera un informe ejecutivo en español con dos secciones claramente diferenciadas:

**SECCIÓN 1 — ANÁLISIS Y COMENTARIOS (${curLabel} vs ${prevLabel})**
Analiza cada variación significativa con contexto y posibles causas. Sé específico con los números. Usa un tono profesional pero directo. Estructura con sub-puntos por área: Ventas, Costos, Margen, Mermas, Compras.

**SECCIÓN 2 — RECOMENDACIONES PARA ${MONTHS_ES[selMonth%12]}** 
Da 4-6 recomendaciones concretas y accionables basadas en los datos. Cada recomendación debe tener: qué hacer, por qué (basado en el dato), y cómo medirlo. Priorízalas por impacto.

DATOS DEL MES ACTUAL (${curLabel}):
- Ventas brutas: S/${cur.revenue.toFixed(2)} | IGV: S/${(cur.igvAmount||0).toFixed(2)} | Ventas netas: S/${(cur.netRevenue||cur.revenue).toFixed(2)}
- Porciones: ${cur.portions} | Pedidos: ${cur.orderCount} | Ticket promedio: S/${cur.avgTicket.toFixed(2)}
- Costo de alimentos: ${cur.foodCostPct.toFixed(1)}% de ventas netas (S/${cur.foodCost.toFixed(2)})
- Margen bruto: S/${cur.grossMargin.toFixed(2)} (${cur.grossMarginPct.toFixed(1)}% sobre ventas netas)
- Mermas: S/${cur.wastageCost.toFixed(2)} | Compras: S/${cur.purchaseCost.toFixed(2)}
- Contribución neta: ${cur.netPct.toFixed(1)}% sobre ventas netas
- Top platos: ${topDishes||"Sin datos de ventas"}

DATOS MES ANTERIOR (${prevLabel}):
- Ventas brutas: S/${prev.revenue.toFixed(2)} | IGV: S/${(prev.igvAmount||0).toFixed(2)} | Ventas netas: S/${(prev.netRevenue||prev.revenue).toFixed(2)}
- Porciones: ${prev.portions} | Pedidos: ${prev.orderCount} | Ticket promedio: S/${prev.avgTicket.toFixed(2)}
- Costo de alimentos: ${prev.foodCostPct.toFixed(1)}% de ventas netas (S/${prev.foodCost.toFixed(2)})
- Margen bruto: S/${prev.grossMargin.toFixed(2)} (${prev.grossMarginPct.toFixed(1)}% sobre ventas netas)
- Mermas: S/${prev.wastageCost.toFixed(2)} | Compras: S/${prev.purchaseCost.toFixed(2)}
- Contribución neta: ${prev.netPct.toFixed(1)}% sobre ventas netas

VARIACIONES CLAVE:
- Ventas: ${dRev.pct!==null?((dRev.pct>=0?"+":"")+dRev.pct.toFixed(1)+"%"):"Sin datos previos"}
- Costo alimentos: ${dFC.pct!==null?((dFC.pct>=0?"+":"")+dFC.pct.toFixed(1)+" pp"):"Sin datos previos"}
- Mermas: ${dWaste.pct!==null?((dWaste.pct>=0?"+":"")+dWaste.pct.toFixed(1)+"%"):"Sin datos previos"}
- Platos nuevos en menú activo: ${newDishes}
- Platos sin ventas este mes: ${droppedDishes}

Responde en español. Sé conciso pero completo. No repitas los datos, interprètalos.`;
  };

  const generateAI=async()=>{
    setAiState("loading");setAiText("");setAiError("");
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          messages:[{role:"user",content:buildPrompt()}]
        })
      });
      const json=await resp.json();
      if(json.error)throw new Error(json.error.message||"Error de API");
      const text=json.content?.find(b=>b.type==="text")?.text||"";
      setAiText(text);setAiState("done");
    }catch(e){
      setAiError(e.message||"Error desconocido");setAiState("error");
    }
  };

  // ── Render markdown-lite (bold, headers, bullets) ─────────────────────────
  function renderAIText(text){
    if(!text)return null;
    const lines=text.split("\n");
    return lines.map((line,i)=>{
      if(!line.trim())return h('div',{key:i,style:{height:8}});
      // H2: **TEXT** at start of line or ## TEXT
      if(/^\*\*[^*]+\*\*$/.test(line.trim())||/^#+\s/.test(line.trim())){
        const clean=line.replace(/^\*\*|\*\*$/g,"").replace(/^#+\s/,"");
        return h('div',{key:i,style:{fontFamily:"var(--sora)",fontSize:13,fontWeight:700,
          color:"var(--accent)",marginTop:16,marginBottom:6,paddingBottom:4,
          borderBottom:"1px solid rgba(249,115,22,0.2)"}},clean);
      }
      // Bullet
      if(/^[-•*]\s/.test(line.trim())||/^\d+\.\s/.test(line.trim())){
        const clean=line.replace(/^[-•*]\s/,"").replace(/^\d+\.\s/,"");
        // Inline bold
        const parts=clean.split(/\*\*([^*]+)\*\*/g);
        return h('div',{key:i,style:{display:"flex",gap:8,marginBottom:6,paddingLeft:4}},
          h('span',{style:{color:"var(--accent)",flexShrink:0,marginTop:1}},"›"),
          h('div',{style:{fontSize:12,lineHeight:1.6,color:"var(--text2)"}},
            parts.map((p,j)=>j%2===1?h('strong',{key:j,style:{color:"var(--text)",fontWeight:600}},p):p)
          )
        );
      }
      // Regular line with possible inline bold
      const parts=line.split(/\*\*([^*]+)\*\*/g);
      return h('div',{key:i,style:{fontSize:12,lineHeight:1.6,color:"var(--text2)",marginBottom:2}},
        parts.map((p,j)=>j%2===1?h('strong',{key:j,style:{color:"var(--text)",fontWeight:600}},p):p)
      );
    });
  }

  return h('div',{className:"slide-up"},
    // ── Month picker ──────────────────────────────────────────────────────────
    h('div',{className:"no-print",style:{display:"flex",alignItems:"center",gap:8,marginBottom:16,
      background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"10px 12px"}},
      h('button',{onClick:()=>{
        if(selMonth===1)handleMonthChange(selYear-1,12);
        else handleMonthChange(selYear,selMonth-1);
      },style:{background:"none",border:"none",color:"var(--text2)",fontSize:18,cursor:"pointer",padding:"0 2px",flexShrink:0}},"‹"),
      h('div',{style:{flex:1,display:"flex",gap:6}},
        h('select',{value:selMonth,onChange:e=>handleMonthChange(selYear,+e.target.value),style:{flex:1,fontSize:13,fontWeight:600,fontFamily:"var(--sora)"}},
          MONTHS_ES.map((m,i)=>h('option',{key:i+1,value:i+1},m))
        ),
        h('select',{value:selYear,onChange:e=>handleMonthChange(+e.target.value,selMonth),style:{width:80,fontSize:13,fontWeight:600,fontFamily:"var(--sora)"}},
          YEARS.map(y=>h('option',{key:y,value:y},y))
        )
      ),
      h('button',{onClick:()=>{
        if(isCurrentMonth)return;
        if(selMonth===12)handleMonthChange(selYear+1,1);
        else handleMonthChange(selYear,selMonth+1);
      },style:{background:"none",border:"none",
        color:isCurrentMonth?"var(--border2)":"var(--text2)",fontSize:18,
        cursor:isCurrentMonth?"default":"pointer",padding:"0 2px",flexShrink:0}},"›")
    ),

    // ── Period header ─────────────────────────────────────────────────────────
    h('div',{style:{background:"linear-gradient(135deg,rgba(249,115,22,0.12),rgba(249,115,22,0.04))",
      border:"1px solid rgba(249,115,22,0.25)",borderRadius:"var(--radius)",
      padding:"14px 16px",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"space-between"}},
      h('div',null,
        h('div',{style:{fontFamily:"var(--sora)",fontSize:16,fontWeight:700}},curLabel),
        h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:2}},"Comparado con "+prevLabel)
      ),
      h('div',{style:{textAlign:"right"}},
        h('div',{style:{fontFamily:"var(--sora)",fontSize:20,fontWeight:800,
          color:cur.revenue>0?"var(--accent)":"var(--text3)"}},
          fmtCost(_showIgv?cur.netRevenue:cur.revenue)),
        _showIgv&&h('div',{style:{fontSize:10,color:"var(--text3)",marginBottom:1}},
          "sin IGV · Brutas: "+fmtCost(cur.revenue)),
        h('div',{style:{fontSize:10,color:"var(--text3)"}},cur.portions+" porciones · "+cur.orderCount+" pedidos")
      )
    ),

    // ── KPI delta grid ────────────────────────────────────────────────────────
    h('div',{style:{fontFamily:"var(--sora)",fontSize:12,fontWeight:600,color:"var(--text3)",
      letterSpacing:"0.05em",marginBottom:8,display:"flex",alignItems:"center",textTransform:"none"}},
      h('span',{style:{textTransform:"uppercase",letterSpacing:"0.05em"}},"VARIACIONES VS MES ANTERIOR"),
      h(InfoTip,{text:"Compara cada número de este mes contra el mes anterior. La flecha verde no siempre significa 'subió' — en cosas como Costo de alimentos, Mermas y Compras, una flecha hacia abajo (↓) es la buena señal, por eso se muestra en verde."})
    ),
    h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}},
      kpis.map(k=>{
        const d=delta(k.cur,k.prev);
        const arrowColor=deltaColor(d.pct,k.invert);
        const sign=d.pct!==null&&d.pct>=0?"+":"";
        return h('div',{key:k.label,style:{
          background:"var(--surface)",border:"1px solid var(--border)",
          borderRadius:"var(--radius)",padding:"12px 14px",
          borderLeft:`3px solid ${d.pct===null?"var(--border)":arrowColor}`
        }},
          h('div',{style:{fontSize:10,color:"var(--text3)",fontWeight:600,marginBottom:6,
            textTransform:"uppercase",letterSpacing:"0.04em",display:"flex",alignItems:"center"}},k.label,k.tip&&h(InfoTip,{text:k.tip})),
          h('div',{style:{fontFamily:"var(--sora)",fontSize:15,fontWeight:700,
            color:"var(--text)",marginBottom:4}},k.fmt(k.cur)),
          d.pct!==null
            ?h('div',{style:{display:"flex",alignItems:"center",gap:4}},
                h('span',{style:{fontSize:14,fontWeight:700,color:arrowColor}},deltaArrow(d.pct)),
                h('span',{style:{fontSize:11,fontWeight:600,color:arrowColor}},sign+d.pct.toFixed(1)+"%"),
                h('span',{style:{fontSize:10,color:"var(--text3)",marginLeft:2}},"vs ant.")
              )
            :h('span',{style:{fontSize:10,color:"var(--text3)"}},"Sin datos previos"),
          k.sub&&h('div',{style:{fontSize:10,color:"var(--text3)",marginTop:1,fontStyle:"italic"}},k.sub),
          h('div',{style:{fontSize:10,color:"var(--text3)",marginTop:2}},
            "Ant.: "+k.fmt(k.prev))
        );
      })
    ),

    // ── Dish comparison ───────────────────────────────────────────────────────
    dishComparison.length>0&&h('div',{style:{marginBottom:20}},
      h('div',{style:{fontFamily:"var(--sora)",fontSize:12,fontWeight:600,color:"var(--text3)",
        letterSpacing:"0.05em",marginBottom:8}},"RENDIMIENTO DE PLATOS"),
      h('div',{style:{background:"var(--surface)",border:"1px solid var(--border)",
        borderRadius:"var(--radius)",overflow:"hidden"}},
        h('div',{style:{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",
          padding:"8px 12px",background:"var(--surface2)",borderBottom:"1px solid var(--border)",
          fontSize:10,fontWeight:600,color:"var(--text3)"}},
          h('span',null,"PLATO"),
          h('span',{style:{textAlign:"right"}},"INGRESOS"),
          h('span',{style:{textAlign:"right"}},"Δ INGRESOS"),
          h('span',{style:{textAlign:"right"}},"Δ VENTAS")
        ),
        dishComparison.map((d,i)=>{
          const revColor=deltaColor(d.dRev.pct,false);
          const qtyColor=deltaColor(d.dQty.pct,false);
          return h('div',{key:d.id,style:{
            display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",
            padding:"10px 12px",fontSize:12,alignItems:"center",
            borderBottom:i<dishComparison.length-1?"1px solid var(--border)":"none"
          }},
            h('div',null,
              h('div',{style:{fontWeight:500,fontSize:12}},d.name),
              h('div',{style:{fontSize:10,color:"var(--text3)"}},d.category)
            ),
            h('div',{style:{textAlign:"right",fontWeight:600,color:"var(--accent)"}},fmtCost(d.curRevenue)),
            h('div',{style:{textAlign:"right",fontWeight:600,color:revColor}},
              d.dRev.pct!==null?(d.dRev.pct>=0?"+":"")+d.dRev.pct.toFixed(1)+"%":"—"),
            h('div',{style:{textAlign:"right",fontWeight:600,color:qtyColor}},
              d.dQty.pct!==null?(d.dQty.pct>=0?"+":"")+d.dQty.pct.toFixed(1)+"%":"—")
          );
        })
      )
    ),

    // ── Top 3 most costly ingredient variations ──────────────────────────────
    (()=>{
      const {priceHistory=[],suppliers=[]}=data;
      const pad=n=>String(n).padStart(2,"0");

      function monthRange(year,month){
        const s=`${year}-${pad(month)}-01`;
        const e=`${year}-${pad(month)}-${pad(new Date(year,month,0).getDate())}`;
        return{s,e};
      }
      function lastPriceInMonth(pid,year,month){
        const{s,e}=monthRange(year,month);
        const hist=priceHistory.filter(h=>h.productId===pid&&h.date>=s&&h.date<=e).sort((a,b)=>b.date.localeCompare(a.date));
        if(hist.length)return hist[0].unitCost;
        const before=priceHistory.filter(h=>h.productId===pid&&h.date<s).sort((a,b)=>b.date.localeCompare(a.date));
        return before.length?before[0].unitCost:null;
      }
      function purchInMonth(pid,year,month){
        const{s,e}=monthRange(year,month);
        const rows=purchases.filter(p=>p.productId===pid&&p.status==="Recibido"&&inRange(p.date,s,e));
        return{spend:rows.reduce((t,p)=>t+(p.totalCost||0),0),qty:rows.reduce((t,p)=>t+(p.qty||0),0)};
      }
      function wastageInMonth(pid,year,month){
        const{s,e}=monthRange(year,month);
        const rows=(wastageLog||[]).filter(w=>w.productId===pid&&inRange(w.date,s,e));
        const byReason={};
        rows.forEach(w=>{byReason[w.reason]=(byReason[w.reason]||0)+(w.lostValue||0);});
        return{total:rows.reduce((t,w)=>t+(w.lostValue||0),0),byReason};
      }

      // Rank by absolute extra soles vs previous month (purchases + wastage)
      const ranked=products.map(p=>{
        const curP=purchInMonth(p.id,selYear,selMonth);
        const prevP=purchInMonth(p.id,prevY,prevM);
        const curW=wastageInMonth(p.id,selYear,selMonth);
        const prevW=wastageInMonth(p.id,prevY,prevM);
        const curPrice=lastPriceInMonth(p.id,selYear,selMonth)||p.avgCost||0;
        const prevPrice=lastPriceInMonth(p.id,prevY,prevM)||p.avgCost||0;
        // Extra cost = how many more soles this ingredient cost vs last month
        const extraSpend=curP.spend-prevP.spend;
        const extraWaste=curW.total-prevW.total;
        const extraTotal=extraSpend+extraWaste;
        const pricePct=prevPrice>0?((curPrice-prevPrice)/prevPrice)*100:0;
        const spendPct=prevP.spend>0?((curP.spend-prevP.spend)/prevP.spend)*100:curP.spend>0?100:0;
        const wastePct=prevW.total>0?((curW.total-prevW.total)/prevW.total)*100:curW.total>0?100:0;
        return{p,curP,prevP,curW,prevW,curPrice,prevPrice,pricePct,spendPct,wastePct,
          extraSpend,extraWaste,extraTotal};
      })
      // Only ingredients that actually cost more this month vs last
      .filter(x=>x.extraTotal>0&&(x.curP.spend>0||x.curW.total>0))
      .sort((a,b)=>b.extraTotal-a.extraTotal)
      .slice(0,3);

      if(!ranked.length)return null;

      const MEDAL=["🥇","🥈","🥉"];

      return h('div',{style:{marginBottom:20}},
        // Section header
        h('div',{style:{display:"flex",alignItems:"center",gap:8,marginBottom:12}},
          h('div',{style:{flex:1,height:1,background:"var(--border)"}}),
          h('span',{style:{fontSize:11,fontWeight:700,color:"var(--text3)",
            letterSpacing:"0.07em",whiteSpace:"nowrap",padding:"0 10px"}},"🔺 INGREDIENTES QUE MÁS COSTARON ESTE MES"),
          h('div',{style:{flex:1,height:1,background:"var(--border)"}})
        ),

        h('div',{style:{display:"flex",flexDirection:"column",gap:12}},
          ranked.map((x,rank)=>{
            const{p,curP,prevP,curW,prevW,curPrice,prevPrice,pricePct,spendPct,wastePct,extraSpend,extraWaste,extraTotal}=x;
            const sup=suppliers.find(s=>s.id===p.supplier);

            // Build plain-language reasons
            const reasons=[];

            // Price increase reason
            if(pricePct>=2){
              const extraFromPrice=curP.qty>0?(curPrice-prevPrice)*curP.qty:0;
              reasons.push({
                icon:"📈",
                color:"rgba(239,68,68,0.9)",
                bg:"rgba(239,68,68,0.07)",
                border:"rgba(239,68,68,0.2)",
                headline:`El proveedor subió el precio ${pricePct.toFixed(1)}%`,
                body:`De S/${prevPrice.toFixed(2)} a S/${curPrice.toFixed(2)} por ${p.unit}`+(sup?" · "+sup.name:"")+
                     (extraFromPrice>0?` · +${fmtCost(extraFromPrice)} de costo extra por esta alza`:"")
              });
            } else if(pricePct<=-2){
              reasons.push({
                icon:"📉",
                color:"rgba(34,197,94,0.9)",
                bg:"rgba(34,197,94,0.06)",
                border:"rgba(34,197,94,0.2)",
                headline:`El precio bajó ${Math.abs(pricePct).toFixed(1)}% — sin embargo el gasto subió`,
                body:`De S/${prevPrice.toFixed(2)} a S/${curPrice.toFixed(2)} por ${p.unit}. El mayor costo se explica por volumen.`
              });
            }

            // Purchase volume reason
            if(extraSpend>0&&spendPct>=5){
              const qtyLine=curP.qty>0&&prevP.qty>0?` (${fmtNum(prevP.qty)} → ${fmtNum(curP.qty)} ${p.unit})`:"";
              reasons.push({
                icon:"🛒",
                color:"rgba(59,130,246,0.9)",
                bg:"rgba(59,130,246,0.07)",
                border:"rgba(59,130,246,0.2)",
                headline:`Se compró más cantidad este mes (+${spendPct.toFixed(0)}%)`,
                body:`Gasto en compras: ${fmtCost(prevP.spend)} → ${fmtCost(curP.spend)}${qtyLine} · Extra: +${fmtCost(extraSpend)}`
              });
            }

            // Wastage reason
            if(curW.total>0){
              const topReason=Object.entries(curW.byReason).sort((a,b)=>b[1]-a[1])[0];
              const wasteLine=topReason?` · Causa principal: "${topReason[0]}"` :"";
              reasons.push({
                icon:"🗑",
                color:"rgba(239,68,68,0.85)",
                bg:"rgba(239,68,68,0.06)",
                border:"rgba(239,68,68,0.18)",
                headline:prevW.total>0
                  ?`Mermas ${wastePct>=0?"subieron "+wastePct.toFixed(0)+"%":"bajaron"} · S/${curW.total.toFixed(2)} perdido`
                  :`Hubo mermas este mes · S/${curW.total.toFixed(2)} perdido`,
                body:`${fmtCost(prevW.total)} → ${fmtCost(curW.total)} en pérdidas${wasteLine}`
              });
            }

            return h('div',{key:p.id,style:{
              background:"var(--surface)",
              border:"1px solid var(--border2)",
              borderRadius:"var(--radius)",
              overflow:"hidden"
            }},
              // ── Top strip: name + total cost impact ───────────────────────
              h('div',{style:{
                padding:"14px 16px",
                display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,
                background:"var(--surface2)",
                borderBottom:"1px solid var(--border)"
              }},
                h('div',{style:{display:"flex",alignItems:"center",gap:10,minWidth:0}},
                  h('span',{style:{fontSize:22,flexShrink:0}},MEDAL[rank]),
                  h('div',{style:{minWidth:0}},
                    h('div',{style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:700,
                      overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},p.name),
                    h('div',{style:{fontSize:11,color:"var(--text3)",marginTop:1}},p.category+" · "+p.unit)
                  )
                ),
                h('div',{style:{textAlign:"right",flexShrink:0}},
                  h('div',{style:{fontFamily:"var(--sora)",fontSize:18,fontWeight:800,color:"var(--red)"}},
                    "+"+fmtCost(extraTotal)),
                  h('div',{style:{fontSize:10,color:"var(--text3)",marginTop:1}},"más que el mes pasado")
                )
              ),

              // ── Reasons ───────────────────────────────────────────────────
              h('div',{style:{padding:"12px 14px",display:"flex",flexDirection:"column",gap:8}},
                reasons.length===0&&h('div',{style:{fontSize:12,color:"var(--text3)",padding:"4px 0"}},
                  "Mayor consumo general sin una causa única identificada."),
                reasons.map((r,ri)=>h('div',{key:ri,style:{
                  display:"flex",gap:10,
                  padding:"10px 12px",
                  borderRadius:8,
                  background:r.bg,
                  border:`1px solid ${r.border}`
                }},
                  h('span',{style:{fontSize:18,flexShrink:0,lineHeight:1.2}},r.icon),
                  h('div',{style:{flex:1}},
                    h('div',{style:{fontSize:12,fontWeight:700,color:r.color,lineHeight:1.3,marginBottom:3}},r.headline),
                    h('div',{style:{fontSize:11,color:"var(--text3)",lineHeight:1.5}},r.body)
                  )
                ))
              )
            );
          })
        )
      );
    })(),

        // ── AI Recommendations section ────────────────────────────────────────────
    h('div',{style:{borderRadius:"var(--radius)",overflow:"hidden",border:"1px solid rgba(249,115,22,0.3)"}},
      h('div',{style:{background:"linear-gradient(90deg,rgba(249,115,22,0.18),rgba(249,115,22,0.08))",
        padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
        h('div',null,
          h('div',{style:{fontFamily:"var(--sora)",fontSize:14,fontWeight:700}},"🤖 Análisis IA & Recomendaciones"),
          h('div',{style:{fontSize:11,color:"var(--text2)",marginTop:2}},
            "Análisis comparativo y plan de acción para el próximo mes")
        ),
        (aiState==="idle"||aiState==="error")&&h('button',{
          onClick:generateAI,
          style:{background:"var(--accent)",border:"none",borderRadius:"var(--radius-sm)",
            padding:"8px 16px",fontSize:12,fontWeight:700,color:"#fff",cursor:"pointer",
            fontFamily:"var(--sans)",flexShrink:0}
        },aiState==="error"?"↻ Reintentar":"✨ Generar análisis")
      ),
      // Content area
      aiState==="idle"&&h('div',{style:{padding:"20px 16px",textAlign:"center"}},
        h('div',{style:{fontSize:28,marginBottom:8}},"📋"),
        h('div',{style:{fontSize:13,color:"var(--text2)",marginBottom:4,fontWeight:500}},
          "Análisis inteligente con IA"),
        h('div',{style:{fontSize:12,color:"var(--text3)"}},
          "Genera un análisis automático con comentarios sobre las variaciones y recomendaciones concretas para el siguiente mes.")
      ),
      aiState==="loading"&&h('div',{style:{padding:"24px 16px",textAlign:"center"}},
        h('div',{style:{display:"inline-flex",flexDirection:"column",alignItems:"center",gap:12}},
          h('div',{style:{
            width:32,height:32,border:"3px solid rgba(249,115,22,0.2)",
            borderTopColor:"var(--accent)",borderRadius:"50%",
            animation:"spin 0.8s linear infinite"
          }}),
          h('div',{style:{fontSize:12,color:"var(--text3)"}},
            "Analizando datos y generando recomendaciones...")
        )
      ),
      aiState==="error"&&h('div',{style:{padding:"16px",background:"rgba(239,68,68,0.06)",
        borderTop:"1px solid rgba(239,68,68,0.2)"}},
        h('div',{style:{fontSize:12,color:"var(--red)",fontWeight:600,marginBottom:4}},"❌ Error al generar análisis"),
        h('div',{style:{fontSize:11,color:"var(--text3)"}},aiError)
      ),
      aiState==="done"&&h('div',{style:{padding:"16px 16px 20px"}},
        renderAIText(aiText),
        h('div',{style:{marginTop:16,paddingTop:12,borderTop:"1px solid var(--border)",
          display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h('div',{style:{fontSize:10,color:"var(--text3)"}},
            "Generado por IA · Basado en datos de "+curLabel+" vs "+prevLabel),
          h('button',{onClick:generateAI,style:{
            background:"var(--surface2)",border:"1px solid var(--border2)",
            borderRadius:"var(--radius-sm)",padding:"5px 12px",
            fontSize:11,fontWeight:600,color:"var(--text2)",cursor:"pointer",fontFamily:"var(--sans)"
          }},"↻ Regenerar")
        )
      )
    )
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// REPORTS PAGE (container)
// ─────────────────────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────────────────
// FULL REPORT — a complete, print-ready monthly document (not a screen copy)
// ─────────────────────────────────────────────────────────────────────────────
function FullReport({data}){
  const {products,recipes,bom,orders=[],orderLines=[],subBom=[],subRecipes=[],purchases=[],wastageLog=[],paymentRecons=[]}=data;
  const now=new Date();
  const [selYear,setSelYear]=useState(now.getFullYear());
  const [selMonth,setSelMonth]=useState(now.getMonth()+1);
  const pad=n=>String(n).padStart(2,"0");
  const start=`${selYear}-${pad(selMonth)}-01`;
  const lastDay=new Date(selYear,selMonth,0).getDate();
  const end=`${selYear}-${pad(selMonth)}-${pad(lastDay)}`;
  const MONTHS_ES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const mLabel=MONTHS_ES[selMonth-1]+" "+selYear;
  const isCurrentMonth=selYear===now.getFullYear()&&selMonth===now.getMonth()+1;
  const prevMonth=()=>{if(selMonth===1){setSelMonth(12);setSelYear(y=>y-1);}else setSelMonth(m=>m-1);};
  const nextMonth=()=>{if(isCurrentMonth)return;if(selMonth===12){setSelMonth(1);setSelYear(y=>y+1);}else setSelMonth(m=>m+1);};
  const S=getSettings(data);

  // ── Sales ──
  const mOrders=orders.filter(o=>o.status==="closed"&&inRange(o.date,start,end));
  const mLines=linesOfOrders(orderLines,mOrders);
  const revenue=mLines.reduce((s,l)=>{const r=recipeById(recipes,l.recipeId);return s+(r?r.price*l.qty:0);},0);
  const foodCost=mLines.reduce((s,l)=>s+recipeFoodCost(l.recipeId,products,bom,subBom,subRecipes)*l.qty,0);
  const portions=mLines.reduce((s,l)=>s+l.qty,0);
  const totalPax=mOrders.reduce((s,o)=>s+(o.pax||0),0);
  const ticketPax=totalPax>0?revenue/totalPax:0;
  const ticketOrder=mOrders.length>0?revenue/mOrders.length:0;
  const igv=S.igvMode==="incluido"?revenue-revenue/1.18:S.igvMode==="excluido"?revenue*IGV_RATE:0;
  const netRevenue=revenue-igv;
  const foodCostPct=netRevenue>0?foodCost/netRevenue*100:0;
  const grossMargin=netRevenue-foodCost;
  const grossMarginPct=netRevenue>0?grossMargin/netRevenue*100:0;
  // ── Purchases ──
  const mPurch=purchases.filter(p=>p.status==="Recibido"&&inRange(p.date,start,end));
  const purchaseCost=mPurch.reduce((s,p)=>s+(p.totalCost||0),0);
  const purchByCat={};
  mPurch.forEach(p=>{const prod=products.find(x=>x.id===p.productId);const cat=prod?prod.category:"Otros";purchByCat[cat]=(purchByCat[cat]||0)+(p.totalCost||0);});
